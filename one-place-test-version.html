  let h = '<h1 class="page-title">'+esc(t("vehiclesTitle"))+'</h1><p class="muted small" style="margin:.35rem 0 0">'+t("vehiclesSub")+'</p>';
  h += '<div class="rows" style="margin-top:1rem">';
  if(!p.vehicles.length) h += '<div class="empty"><b>'+esc(t("noVehiclesT"))+'</b>'+esc(t("noVehiclesB"))+'</div>';
  p.vehicles.forEach(v=>{ const rule=vehRule(v);
    h += '<button class="row-card" data-act="openVehicle" data-id="'+v.id+'">'+photoOrIcon(v.photo,"car")+
      '<div class="row-main"><div class="row-name">'+esc(v.name)+'</div><div class="row-sub">'+esc(t("registeredIn"))+' '+esc(rule.name)+(rule.country==="US"?' ('+esc(v.state)+')':'')+'</div>'+
      '<div class="row-sub">'+esc(t("regShort"))+': '+(v.regNext?fmtDate(v.regNext):"—")+(rule.unknown?' · '+esc(rule.inspShort):(rule.smogMonths?' · '+esc(rule.inspShort||t("smogShort"))+': '+(v.smogNext?fmtDate(v.smogNext):"—"):" · "+esc(t("noSmogCheck"))))+'</div></div>'+ic("chevR","chev")+'</button>'; });
  h += '</div><button class="btn" data-act="addVehicle" style="margin-top:1rem">'+ic("plus")+' '+esc(t("addVehicle"))+'</button>';
  return h;
}
function viewVehicleDetail(p){
  const v=p.vehicles.find(x=>x.id===S.sel.vehicle); if(!v) return backBtn("vehicles")+'<div class="empty"><b>'+esc(t("vehicleNotFound"))+'</b></div>';
  const rule=vehRule(v);
  let h = backBtn("vehicles");
  if(v.photo) h += '<img class="detail-photo" src="'+v.photo+'" alt="'+esc(v.name)+'" />';
  h += '<div style="margin-top:1rem"><div class="label">'+esc(t("vehicleWord"))+'</div><h1 class="page-title">'+esc(v.name)+'</h1><p class="muted" style="margin:.3rem 0 0">'+esc([v.year,v.make,v.model].filter(Boolean).join(" "))+(v.miles?" · "+Number(v.miles).toLocaleString()+" "+esc(t("milesWord")):"")+'</p></div>';
  h += '<div class="sec"><h2 class="sec-title">'+tf(rule.country==="US"?"regSmogTitle":"regInspTitle",{name:esc(rule.name)})+'</h2><div class="card" style="margin-top:.8rem">'+
    '<div class="kv"><span>'+esc(t("regRenewal"))+'</span><b>'+(v.regNext?fmtDate(v.regNext):"—")+'</b></div>'+
    '<div style="margin:.2rem 0 .6rem">'+(v.regNext?duePill(v.regNext,60):"")+'</div>'+
    '<p class="small muted" style="margin:.2rem 0 .8rem">'+esc(rule.reg)+'</p>'+
    (rule.smogMonths? '<div class="kv"><span>'+esc(rule.inspLabel||t("smogCheck"))+'</span><b>'+(v.smogNext?fmtDate(v.smogNext):"—")+'</b></div><div style="margin:.2rem 0 .6rem">'+(v.smogNext?duePill(v.smogNext,60):"")+'</div>' : "")+
    '<p class="small muted" style="margin:.2rem 0 0">'+esc(rule.smog)+'</p>'+
    '<p class="small" style="margin:.7rem 0 0">'+tf("regApplies",{st:esc(vehRegionLabel(v)),name:esc(rule.name)})+'</p>'+
    '<div class="btn-row" style="margin-top:.8rem"><button class="btn soft sm" data-act="renewReg">'+esc(t("renewedBtn"))+'</button>'+(rule.smogMonths?'<button class="btn soft sm" data-act="doneSmog">'+esc(rule.country==="US"?t("smogPassedBtn"):t("inspPassedBtn"))+'</button>':"")+'</div></div></div>';
  h += '<div class="sec"><h2 class="sec-title">'+esc(t("upkeepSchedule"))+'</h2><div class="card" style="margin-top:.8rem;padding-top:.3rem;padding-bottom:.3rem">';
  (v.tasks||[]).forEach((tk,idx)=>{ const nd=nextDueOf(tk);
    h += '<div class="task"><div style="flex:1;min-width:0"><div class="strong">'+esc(tk.name)+'</div><div class="small muted">'+tf("everyMo",{n:tk.every})+' · '+esc(t("lastDone"))+': '+(tk.lastDone?fmtDate(tk.lastDone):t("notLogged"))+(nd?" · "+t("nextWord")+": "+fmtDate(nd):"")+'</div><div class="small muted">'+esc(tk.note||"")+'</div></div><div style="display:flex;flex-direction:column;gap:.4rem;align-items:flex-end">'+(nd?duePill(nd,45):"")+'<button class="btn soft sm" data-act="markVehicleTask" data-idx="'+idx+'">'+esc(t("markDone"))+'</button></div></div>'; });
  h += '</div></div>';
  h += suggestedSectionHtml(v, "acceptVehSuggestion", "acceptAllVehSuggestions");
  h += '<div class="sec"><h2 class="sec-title">'+esc(t("historyTitle"))+'</h2><div class="card" style="margin-top:.8rem">';
  if(!asLogs(v.logs).length) h += '<p class="muted" style="margin:0">'+esc(t("nothingLogged"))+'</p>';
  asLogs(v.logs).slice().reverse().forEach(l=>{ h += '<div class="kv"><span>'+esc(l.what)+'<br /><span class="small muted">'+esc(t("byWord"))+' '+esc(l.by)+'</span></span><b>'+fmtDate(l.date)+'</b></div>'; });
  h += '</div></div>';
  h += '<div class="btn-row" style="margin-top:1.4rem"><button class="btn ghost sm" data-act="moveVehicle" data-id="'+v.id+'">'+ic("move")+' '+esc(t("moveToPlace"))+'</button><button class="btn ghost sm" data-act="bigJob" data-name="'+esc(v.name)+'">'+ic("call")+' '+esc(t("bigJobQuotes"))+'</button><button class="btn danger sm" data-act="deleteVehicle" data-id="'+v.id+'">'+ic("trash")+' '+esc(t("removeVehicle"))+'</button></div>';
  return h;
}

/* ---------- Phone plan ---------- */
function viewPhone(p){
  const plan=p.phonePlan;
  let h = '<h1 class="page-title">'+esc(t("phoneTitle"))+'</h1><p class="muted small" style="margin:.35rem 0 0">'+esc(t("phoneSub"))+'</p>';
  if(!plan){ h += '<div class="empty" style="margin-top:1rem"><b>'+esc(t("noPlanT"))+'</b>'+esc(t("noPlanB"))+'</div><button class="btn" data-act="editPlan" style="margin-top:1rem">'+ic("plus")+' '+esc(t("addPlan"))+'</button>'; return h; }
  const total = plan.lines.reduce((s,l)=>s+(Number(l.cost)||0),0);
  const eligible = plan.lines.filter(l=>l.upgrade && daysUntil(l.upgrade)<=0).length;
  h += '<div class="card" style="margin-top:1rem"><div style="display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap"><div><div class="label">'+esc(t("carrier"))+'</div><div class="card-title" style="font-size:1.25rem">'+esc(plan.carrier||"—")+'</div><div class="muted small">'+esc(plan.planName||"")+(plan.holder?" · "+esc(t("accountWord"))+": "+esc(plan.holder):"")+'</div></div>'+
    '<div style="text-align:right"><div class="label">'+esc(t("monthlyTotal"))+'</div><div class="card-title" style="font-size:1.25rem">'+money(total)+'</div><div class="muted small">'+plan.lines.length+' '+esc(t("linesWord"))+(eligible?" · "+eligible+" "+esc(t("upgradeReady")).toLowerCase():"")+'</div></div></div></div>';
  h += '<div class="rows" style="margin-top:.9rem">';
  plan.lines.forEach((l,idx)=>{ const up=l.upgrade?(daysUntil(l.upgrade)<=0?'<span class="pill ok">'+esc(t("upgradeReady"))+'</span>':duePill(l.upgrade,45)):'<span class="pill neutral">'+esc(t("noUpgradeDate"))+'</span>';
    const bal=Number(l.balance)||0;
    h += '<div class="card"><div style="display:flex;justify-content:space-between;gap:.8rem;align-items:flex-start"><div><div class="card-title">'+esc(l.person||t("lineWord")+" "+(idx+1))+'</div><div class="small muted">'+esc(l.device||"")+(l.number?" · "+esc(l.number):"")+'</div></div><div style="text-align:right"><div class="strong">'+money(l.cost)+'<span class="muted small">'+esc(t("perMonth"))+'</span></div>'+up+'</div></div>'+
      '<div class="kv" style="margin-top:.4rem"><span>'+esc(t("deviceBalance"))+'</span><b>'+(bal>0?money(bal):t("paidOff"))+'</b></div>'+
      '<div class="kv"><span>'+esc(t("payoffDate"))+'</span><b>'+(l.payoff?fmtDate(l.payoff):"—")+'</b></div>'+
      '<div class="kv"><span>'+esc(t("upgradeEligible"))+'</span><b>'+(l.upgrade?fmtDate(l.upgrade):"—")+'</b></div>'+
      '<div class="btn-row" style="margin-top:.6rem"><button class="btn ghost sm" data-act="editLine" data-idx="'+idx+'">'+ic("edit")+' '+esc(t("editLine"))+'</button><button class="btn danger sm" data-act="deleteLine" data-idx="'+idx+'">'+ic("trash")+' '+esc(t("remove"))+'</button></div></div>'; });
  h += '</div><div class="btn-row" style="margin-top:1rem"><button class="btn" data-act="editLine" data-idx="-1">'+ic("plus")+' '+esc(t("addLine"))+'</button><button class="btn ghost" data-act="editPlan">'+ic("edit")+' '+esc(t("editPlanDetails"))+'</button></div>';
  return h;
}

/* ---------- Pets ---------- */

  h += '<div class="label">'+esc(t("diagBackItem"))+'</div><h1 class="page-title">'+esc(t("diagTitle"))+'</h1><p class="muted" style="margin:.4rem 0 0;max-width:36rem">'+esc(t("diagIntro"))+'</p>';
  const target = S.diagFor ? p.items.find(i=>i.id===S.diagFor) : null;
  h += '<div class="card" style="margin-top:1.1rem">'+
    (target?'<p style="margin:0 0 .8rem">'+esc(t("diagnosing"))+' <b>'+esc(target.name)+'</b> <button class="chip" data-act="diagClearTarget" style="margin-left:.4rem">'+esc(t("change"))+'</button></p>':
      '<div class="field"><label for="diagItem">'+esc(t("whichItem"))+'</label><select id="diagItem"><option value="">'+esc(t("somethingElse"))+'</option>'+p.items.map(i=>'<option value="'+i.id+'">'+esc(i.name)+'</option>').join("")+p.vehicles.map(v=>'<option value="veh:'+v.id+'">'+esc(v.name)+' '+esc(t("vehicleSuffix"))+'</option>').join("")+'</select></div>')+
    '<div id="diagPhotoSlot">'+photoSlotHtml("diag")+'</div>'+

    '<div class="field"><label for="diagText">'+esc(t("whatsHappening"))+'</label><textarea id="diagText" placeholder="'+esc(t("diagPh"))+'">'+esc(S.diagText||"")+'</textarea></div>'+
    '<button class="btn block" data-act="runDiagnose"'+(S.diagBusy?" disabled":"")+'>'+ic("spark")+' '+esc(t("diagnoseBtn"))+'</button></div>';

function diagResultHtml(r){
  let h = '<div class="card" style="margin-top:1rem"><div class="label">'+esc(t("likelyDiagnosis"))+'</div><div class="card-title" style="font-size:1.3rem;margin:.2rem 0">'+esc(r.title)+'</div>'+
    '<span class="pill warn">'+esc(r.severity)+'</span>'+(r.summary?'<p style="margin:.6rem 0 0">'+esc(r.summary)+'</p>':'')+(r.photo?'<p class="small muted" style="margin:.6rem 0 0">'+esc(t("basedOnPre"))+(r.hadPhoto?esc(t("andPhoto")):"")+esc(t("basedOnPost"))+(r.conf||"medium")+esc(t("basedOnPost2"))+'</p>':'')+'</div>';
  if(r.safety.length) h += '<div class="card" style="margin-top:.8rem;border-color:var(--bad)"><div class="card-title" style="color:var(--bad)">'+ic("alert")+' '+esc(t("safetyFirst"))+'</div><ul class="steps" style="list-style:disc">'+r.safety.map(s=>'<li>'+esc(s)+'</li>').join("")+'</ul></div>';
  h += '<div class="card" style="margin-top:.8rem"><div class="card-title">'+esc(t("causesTitle"))+'</div><ol class="steps">'+r.causes.map(s=>'<li>'+esc(s)+'</li>').join("")+'</ol></div>';
  h += '<div class="card" style="margin-top:.8rem"><div class="card-title">'+esc(t("checksTitle"))+'</div><ol class="steps">'+r.checks.map(s=>'<li>'+esc(s)+'</li>').join("")+'</ol></div>';
  h += '<div class="card" style="margin-top:.8rem"><div class="card-title">'+esc(t("diyFixTitle"))+'</div><p class="small muted" style="margin:.2rem 0 .4rem">'+esc(t("difficultyW"))+': <b>'+esc(r.diff)+'</b> · '+esc(t("timeW"))+': <b>'+esc(r.time)+'</b> · '+esc(t("costW"))+': <b>'+esc(r.cost)+'</b></p><ol class="steps">'+r.steps.map(s=>'<li>'+esc(s)+'</li>').join("")+'</ol>'+
    '<p class="small" style="margin:.6rem 0 0">'+esc(t("partNeeded"))+' <b>'+esc(r.part)+'</b></p></div>';
  h += '<div class="card" style="margin-top:.8rem"><div class="card-title">'+ic("call")+' '+esc(t("whenPro"))+'</div><p style="margin:.4rem 0 .8rem">'+esc(r.pro)+'</p><button class="btn soft" data-act="bigJob" data-name="Diagnosis: '+esc(r.title)+'">'+esc(t("bigJobLocal"))+'</button></div>';
  return h;
}
/* A saved DIY project plan (built from photos with AI, reviewed before
   saving) — rendered on the project's item page. */
function projectPlanHtml(pr){
  let h = '<div class="sec"><h2 class="sec-title">'+esc(t("projectPlanTitle"))+'</h2><div class="card" style="margin-top:.8rem">';
  if(pr.what) h += '<p style="margin:0">'+esc(pr.what)+'</p>';
  h += '<div style="display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.7rem">'+
    '<span class="pill accent">'+esc(t("difficultyPill"))+' '+esc(pr.difficulty||"Moderate")+'</span>'+
    (pr.time?'<span class="pill neutral">'+esc(pr.time)+'</span>':"")+
    (pr.cost?'<span class="pill neutral">'+esc(pr.cost)+'</span>':"")+
    (pr.confidence && pr.confidence!=="high"?'<span class="pill warn">'+esc(t("aiEstimateWarn"))+'</span>':"")+'</div></div>';
  if((pr.steps||[]).length){ h += '<div class="card" style="margin-top:.8rem"><div class="card-title">'+esc(t("stepByStep"))+'</div><ol class="steps">'+pr.steps.map(s=>'<li>'+(s.title?'<b>'+esc(s.title)+'.</b> ':"")+esc(s.detail||"")+'</li>').join("")+'</ol></div>'; }
  if((pr.materials||[]).length){ h += '<div class="card" style="margin-top:.8rem"><div class="card-title">'+esc(t("toolsMaterials"))+'</div><div style="margin-top:.3rem">'+pr.materials.map(m=>'<div class="kv"><span>'+esc(m.name)+(m.note?'<br /><span class="small muted">'+esc(m.note)+'</span>':"")+'</span><b>× '+esc(m.quantity||"1")+'</b></div>').join("")+'</div></div>'; }
  if(pr.removal || pr.masking || pr.safety){ h += '<div class="card" style="margin-top:.8rem">'+
    (pr.removal?'<div class="card-title">'+esc(t("removalTitle"))+'</div><p style="margin:.35rem 0 .9rem">'+esc(pr.removal)+'</p>':"")+
    (pr.masking?'<div class="card-title">'+esc(t("maskingTitle"))+'</div><p style="margin:.35rem 0 .9rem">'+esc(pr.masking)+'</p>':"")+
    (pr.safety?'<div class="card-title" style="color:var(--bad)">'+ic("alert")+' '+esc(t("safetyTitle"))+'</div><p style="margin:.35rem 0 0">'+esc(pr.safety)+'</p>':"")+'</div>'; }
  h += '</div>';
  return h;
}

      "If photo reading can't be reached (connection or quota), the app says so in plain language and drops back to typing things in by hand. It never makes up details."]},

      "Everywhere a photo is used, you can now pick an existing screenshot or photo from your library instead of taking a new picture — it reads exactly the same way."]},
    {date:"Nov 3, 2026",tag:"First version",title:"One Place test version launches",points:[
      "Welcome onboarding, rooms & items with photo identification and upkeep plans, vehicles with registration & smog reminders by state of registration, the phone plan section, household members, and six color themes."]}
  ];
  /* Group by month, newest month first, entries newest-first inside each
     month. Dates look like "Nov 5, 2026" — parse them by hand so the
     grouping never depends on locale date parsing. */
  const WN_MON={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  const WN_FULL=["January","February","March","April","May","June","July","August","September","October","November","December"];
  function wnParts(dstr){
    const parts=String(dstr||"").replace(",","").split(/\s+/).filter(Boolean);
    const mi=WN_MON[(parts[0]||"").slice(0,3)];
    if(mi==null||!parts[2]) return null;
    return {mi:mi, day:Number(parts[1])||0, year:Number(parts[2])||0};
  }
  const sorted=entries.slice().sort((a,b)=>{
    const pa=wnParts(a.date), pb=wnParts(b.date);
    const ka=pa?pa.year*10000+pa.mi*100+pa.day:0, kb=pb?pb.year*10000+pb.mi*100+pb.day:0;
    return kb-ka;
  });
  const groups=[]; const byMonth={};
  sorted.forEach(e=>{
    const pr=wnParts(e.date);
    const key=pr?pr.year*100+pr.mi:-1;
    const label=pr?WN_FULL[pr.mi]+" "+pr.year:(e.date||"");
    if(!byMonth[key]){ byMonth[key]={key:key,label:label,items:[]}; groups.push(byMonth[key]); }
    byMonth[key].items.push(e);
  });
  let h = backBtn("more");
  h += '<div class="label">'+esc(t("forTesters"))+'</div><h1 class="page-title">'+esc(t("whatsNewTitle"))+'</h1>'+
    '<p class="muted" style="margin:.4rem 0 0;max-width:36rem">'+esc(t("whatsNewIntro"))+'</p>';
  /* Feedback stays right under the intro, before the changelog, so it is
     always easy to find — it is also repeated in the card at the bottom. */
  h += '<div class="btn-row wn-feedback-top"><button class="btn" data-act="feedback">'+ic("mail")+' '+esc(t("sendFeedback"))+'</button></div>';
  groups.forEach((g,gi)=>{
    h += '<details class="wn-month"'+(gi===0?" open":"")+'><summary class="wn-month-head"><span class="wn-month-title">'+esc(g.label)+'</span><span class="wn-month-count">'+g.items.length+'</span>'+ic("chevR","wn-chev")+'</summary><div class="wn-entries">';
    g.items.forEach(e=>{
      const tagHtml = e.tag==="New"
        ? '<span class="wn-tag-new">New!</span>'
        : '<span class="pill accent">'+esc(e.tag)+'</span>';
      h += '<details class="card wn-entry"><summary class="wn-entry-head"><span class="wn-entry-main"><span class="wn-entry-meta">'+tagHtml+'<span class="wn-date">'+esc(e.date)+'</span></span><span class="wn-entry-title">'+esc(e.title)+'</span></span>'+ic("chevR","wn-chev")+'</summary>'+
        '<div class="wn-entry-body"><ul class="steps" style="list-style:disc">'+e.points.map(pt=>'<li>'+esc(pt)+'</li>').join("")+'</ul></div></details>';
    });
    h += '</div></details>';
  });
  h += '<div class="card" style="margin-top:1.1rem"><div class="card-title">'+esc(t("whatsNewCtaT"))+'</div><p class="small muted" style="margin:.35rem 0 .8rem">'+esc(t("whatsNewCtaB"))+'</p><button class="btn" data-act="feedback">'+ic("mail")+' '+esc(t("sendFeedback"))+'</button></div>';
  return h;
}

/* ---------- Saving & hosting guide ---------- */
function viewHosting(p){
  let h = backBtn("more");
  h += '<div class="label">'+esc(t("forTesters"))+'</div><h1 class="page-title">'+esc(t("hostingTitle"))+'</h1>'+
    '<p class="muted" style="margin:.4rem 0 0;max-width:36rem">'+esc(t("hostingIntro"))+'</p>';
  h += '<div class="sec"><h2 class="sec-title">Your stuff saves</h2><div class="card" style="margin-top:.8rem">'+
    '<p style="margin:0">Everything you enter — places, rooms, items, vehicles, history, quote requests, parts, people, phone plans, pets and their records, and your settings — saves to the One Place <b>Supabase</b> database as you go. Close the page, come back tomorrow, switch from phone to computer browser: it’s still there.</p>'+
    '<p style="margin:.6rem 0 0">There’s no sign-in. Each browser or phone gets its own private <b>owner ID</b>, and the database only lets that browser see its own rows — so testers never see each other’s homes. If the database can’t be reached, the app says so plainly at the top of the screen instead of pretending a save worked. The one-time setup steps live under <b>My places → Saved data — Supabase</b> in More.</p></div></div>';
  h += '<div class="sec"><h2 class="sec-title">Seeing edits live</h2><div class="card" style="margin-top:.8rem">'+

  return h;
}

      const logs=asLogs(it.logs).slice(-4).reverse();
      if(logs.length) r += '<p style="margin:.35em 0 0" class="rmeta">'+esc(t("recentWork"))+': '+logs.map(l=>esc(l.what)+" — "+fmtDate(l.date)+" ("+esc(l.by)+")").join("; ")+'</p>';
    });
  });
  const unroomed = p.items.filter(i=>!p.rooms.find(rm=>rm.id===i.roomId));
  if(unroomed.length){ r += '<h2>'+esc(t("notFiled"))+'</h2>'+unroomed.map(it=>'<p style="margin:.2em 0">'+esc(it.name)+'</p>').join(""); }
  if(p.vehicles.length){ r += '<h2>'+esc(t("vehiclesTitle"))+'</h2><table><tr><th>'+esc(t("colVehicle"))+'</th><th>'+esc(t("colRegisteredIn"))+'</th><th>'+esc(t("colRegDue"))+'</th><th>'+esc(t("colSmogDue"))+'</th></tr>'+p.vehicles.map(v=>'<tr><td>'+esc(v.name)+'</td><td>'+esc(vehRegionLabel(v))+'</td><td>'+(v.regNext?fmtDate(v.regNext):"—")+'</td><td>'+(v.smogNext?fmtDate(v.smogNext):"—")+'</td></tr>').join("")+'</table>'; }
  if(p.pets.length){ r += '<h2>'+esc(t("petsTitle"))+'</h2>'+p.pets.map(pt=>'<h3>'+esc(pt.name)+' <span class="rmeta">('+esc([tSpecies(pt.species),pt.breed].filter(Boolean).join(" ")) +')</span></h3>'+((pt.records||[]).length?'<table><tr><th>'+esc(t("colRecord"))+'</th><th>'+esc(t("colDone"))+'</th><th>'+esc(t("colNextDue"))+'</th><th>'+esc(t("colWhere"))+'</th></tr>'+pt.records.map(rec=>'<tr><td>'+esc(rec.name)+'</td><td>'+fmtDate(rec.date)+'</td><td>'+(rec.nextDue?fmtDate(rec.nextDue):"—")+'</td><td>'+esc(rec.clinic||"")+(rec.location?" — "+esc(rec.location):"")+'</td></tr>').join("")+'</table>':"")).join(""); }
  if(p.phonePlan){ r += '<h2>'+esc(t("phoneTitle"))+'</h2><p style="margin:.2em 0">'+esc(p.phonePlan.carrier||"")+" · "+esc(p.phonePlan.planName||"")+" · "+p.phonePlan.lines.length+' '+esc(t("linesWord"))+' · '+money(p.phonePlan.lines.reduce((s,l)=>s+(Number(l.cost)||0),0))+esc(t("perMonth"))+' '+esc(t("monthlyTotal")).toLowerCase()+'</p>'; }
  if(!p.items.length && !p.vehicles.length && !p.pets.length) r += '<p style="margin-top:1em">'+esc(t("nothingFiled"))+'</p>';
  r += '<p class="rmeta" style="margin-top:1.6em">'+esc(t("generatedBy"))+'</p></div>';
  return h + r;
}

<script>
/* =====================================================================
   Modals, photo flow, actions
   ===================================================================== */
function openModal(html){ $("#modalRoot").innerHTML = '<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+html+'</div></div>'; const f=$(".sheet input, .sheet select, .sheet textarea"); }
function closeModal(){ $("#modalRoot").innerHTML=""; }
function modalHead(title,sub){ return '<h3>'+title+'</h3>'+(sub?'<p class="muted small" style="margin:0 0 1rem">'+sub+'</p>':'<div style="height:.6rem"></div>'); }

/* pending photo state per flow */
const PH = {item:null,vehicle:null,pet:null,diag:null,plan:null,diy:null,fb:null};
/* Flows that accept up to 6 photos at once (the AI reads all of them;
   the first doubles as the saved cover photo). PHA holds every photo
   for those flows, PH[key] mirrors PHA[key][0]. */
const MULTI_KEYS = {item:1, plan:1, diag:1, diy:1};
const PHA = {item:[], plan:[], diag:[], diy:[]};
let photoTarget = null;
function photoSlotHtml(key){
  if(MULTI_KEYS[key]){
    const arr = PHA[key];
    if(!arr.length) return '';
    return '<div class="photo-strip">'+arr.map((src,i)=>'<span class="pstrip"><img src="'+src+'" alt="Photo '+(i+1)+'" /><button type="button" class="pstrip-x" data-act="photoRemove" data-key="'+key+'" data-idx="'+i+'" aria-label="Remove photo '+(i+1)+'">&times;</button></span>').join("")+'</div>'+
      '<p class="tiny muted" style="margin:.35rem 0 0">'+tf("photosAttached",{n:arr.length})+'</p>';
  }
  const src = PH[key];
  return src ? '<img class="photo-preview" src="'+src+'" alt="Selected photo" /><p class="tiny muted" style="margin:.35rem 0 0">'+esc(t("photoAttached"))+'</p>' : '';
}
function wirePhoto(input, key){
  input.onchange = ()=>{ const f=input.files && input.files[0]; if(!f) return;
    if(PH[key]) URL.revokeObjectURL(PH[key]);
    PH[key]=URL.createObjectURL(f); input.value="";
    if(key==="diag"){ const slot=$("#diagPhotoSlot"); if(slot) slot.innerHTML=photoSlotHtml("diag"); }
    else { const slot=$("#photoSlot"); if(slot) slot.innerHTML=photoSlotHtml(key); const idn=$("#identifyNote"); if(idn){ idn.style.display="flex"; setTimeout(()=>{ idn.style.display="none"; const hint=$("#idHint"); if(hint) hint.style.display="block"; },1400); } }
  };
}
wirePhoto($("#fileCam"), null); wirePhoto($("#fileLib"), null);
/* re-wire with dynamic key via dataset */
/* Photos are read, downscaled to at most 1024px, and kept as JPEG data
   URLs — small enough to save with the record in the database, so a
   photo is still there when the tester comes back. */
function photoFileToDataUrl(f, cb){
  const url=URL.createObjectURL(f);
  const img=new Image();
  img.onload=()=>{ try{
      const scale=Math.min(1, 1024/Math.max(img.width,img.height));
      const w=Math.max(1,Math.round(img.width*scale)), hgt=Math.max(1,Math.round(img.height*scale));
      const c=document.createElement("canvas"); c.width=w; c.height=hgt;
      c.getContext("2d").drawImage(img,0,0,w,hgt);
      URL.revokeObjectURL(url);
      cb(c.toDataURL("image/jpeg",0.82));
    }catch(e){ URL.revokeObjectURL(url); cb(url); } };
  img.onerror=()=>{ cb(url); };
  img.src=url;
}
function photoFileToDataUrlP(f){ return new Promise(res=>photoFileToDataUrl(f, res)); }
function pickPhoto(key, mode){ photoTarget=key; const inp = mode==="cam" ? $("#fileCam") : $("#fileLib");
  inp.multiple = !!MULTI_KEYS[key];
  inp.onchange = ()=>{ const files=Array.from(inp.files||[]); if(!files.length) return;
    inp.value="";
    if(MULTI_KEYS[key]){
      const roomLeft = 6 - PHA[key].length;
      if(roomLeft<=0){ toast("That's the 6-photo limit — remove one to add another"); return; }
      const take = files.slice(0, roomLeft);
      (async()=>{ for(const f of take){ PHA[key].push(await photoFileToDataUrlP(f)); } PH[key]=PHA[key][0]||null; photosChanged(key); })();
      return;
    }
    photoFileToDataUrl(files[0], dataUrl=>{ PH[key]=dataUrl;
      const slot=$("#photoSlot"); if(slot) slot.innerHTML=photoSlotHtml(key);
    });
  };
  inp.click();
}
/* After a multi-photo set changes: refresh its preview strip, and for the
   item and phone-plan flows kick off the AI read right away (the result
   is a draft the user reviews in the form — never auto-saved). */
function photosChanged(key){
  if(key==="diag"){ const slot=$("#diagPhotoSlot"); if(slot) slot.innerHTML=photoSlotHtml("diag"); return; }
  const slot=$("#photoSlot"); if(slot) slot.innerHTML=photoSlotHtml(key);
  if(key==="item") aiIdentifyItem();
  else if(key==="plan") aiExtractPlan();
}

/* =====================================================================
   Photo AI — Google Gemini, reached through this site's own proxy
   ---------------------------------------------------------------------
   Every photo flow sends its photos (up to 6) plus a task-specific
   prompt and gets JSON back. The result ALWAYS lands as a draft the
   user reviews and edits in the form before saving — nothing is
   auto-saved as fact. Any failure (proxy, network, or quota)
   throws, and the caller shows a plain-language message and leaves
   the manual flow exactly as it was; details are never invented.

   Model note: the briefed model, gemini-2.0-flash, has been retired
   by Google — the API answers 404 "no longer available" and names
   gemini-3.8-flash as its replacement (both facts verified against
   the live API when this was wired in, as was every name in the
   chain below). So the client walks a short chain — the named
   replacement first, then other current flash models, then the
   briefed name — advancing only when a model is gone (404) or
   stays overloaded (503), and sticks with whichever model answered
   for the rest of the session.

   PROXY NOTE: no API key lives in this page, and the page never
   talks to Google directly. Every call below is a POST to
   /api/gemini on this same origin with a JSON body of
   { model, contents, generationConfig }. The server function
   there (api/gemini.js, deployed alongside this page) holds
   GEMINI_API_KEY as a server-side environment variable, forwards
   the call to Google's generateContent endpoint, and returns
   Gemini's response JSON unchanged — or { error } on failure.
   A proxy failure (non-OK status, timeout, or an { error } body)
   is treated exactly like a Gemini failure: the retry and
   model-chain rules below apply, and when the chain runs out the
   caller falls back to manual entry with a plain-language note —
   nothing fakes a read.
   ===================================================================== */
const GEMINI_MODELS = ["gemini-3.8-flash", "gemini-3.5-flash", "gemini-flash-latest", "gemini-2.0-flash"];
let geminiModelIdx = 0;
/* One POST to the same-origin proxy. Resolves to { status, ok, json }
   (json is null when the reply wasn't JSON); rejects only on a
   network error or the client timeout, as Error("network"). */
async function geminiProxyFetch(model, call){
  const ctrl = (typeof AbortController!=="undefined") ? new AbortController() : null;
  const timer = ctrl ? setTimeout(()=>ctrl.abort(), 45000) : null;
  try{
    const res = await fetch("/api/gemini",
      { method:"POST", signal: ctrl ? ctrl.signal : undefined, headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ model:model, contents:call.contents, generationConfig:call.generationConfig }) });
    let json = null;
    try{ json = await res.json(); }catch(e){ json = null; }
    return { status: res.status, ok: res.ok, json: json };
  }catch(e){ throw new Error("network"); }
  finally{ if(timer) clearTimeout(timer); }
}
async function geminiCall(call){
  let netRetried = false;
  while(geminiModelIdx < GEMINI_MODELS.length){
    const model = GEMINI_MODELS[geminiModelIdx];
    let r;
    try{
      r = await geminiProxyFetch(model, call);
      if(r.status===503){ await new Promise(s=>setTimeout(s, 3000)); r = await geminiProxyFetch(model, call); }
    }catch(e){
      /* Timeout or dropped connection to the proxy: one retry on the
         next model in the chain, then give up to the manual fallback. */
      if(!netRetried && geminiModelIdx < GEMINI_MODELS.length-1){ netRetried = true; geminiModelIdx++; continue; }
      throw e;
    }
    if(r.ok && r.json && !r.json.error) return r.json;
    /* Failure: a model that's gone (404) or overloaded (503), or any
       { error } reply from the proxy, advances to the next model.
       Anything else is a hard failure — the caller falls back. */
    if(r.status===404 || r.status===503 || (r.json && r.json.error) || !r.json){ geminiModelIdx++; continue; }
    throw new Error("http "+r.status);
  }
  throw new Error("no model available");
}
async function geminiJSON(prompt, dataUrls){
  const parts = [{text: prompt}];
  (dataUrls||[]).slice(0,6).forEach(u=>{ const m = /^data:([^;,]+);base64,(.+)$/.exec(u||""); if(m) parts.push({inline_data:{mime_type:m[1], data:m[2]}}); });
  const j = await geminiCall({ contents:[{parts:parts}], generationConfig:{ responseMimeType:"application/json", temperature:0.35, maxOutputTokens:8192 } });
  const cand = (j.candidates||[])[0];
  const raw = (((cand && cand.content && cand.content.parts) || []).map(p=>p.text||"").join("")).trim()
    .replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "");
  return JSON.parse(raw);
}
/* Sanitizers — AI output is untrusted text until it has been clamped. */
function aiStr(v, max){ const s = (v==null ? "" : String(v)).trim(); return max ? s.slice(0, max) : s; }
function aiStrArr(v, maxN, maxLen){ if(!Array.isArray(v)) return []; return v.slice(0, maxN||8).map(x=>aiStr(x, maxLen||300)).filter(Boolean); }
function aiMoney(v){ const n = Number(v); if(isNaN(n) || n<0) return 0; return Math.round(n*100)/100; }
function aiDate(v){ const s = aiStr(v, 10); return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : ""; }
function aiMsg(html){ const m = $("#aiMsg"); if(m) m.innerHTML = html || ""; }
function aiErr(msg){ aiMsg('<div class="ai-note" style="margin:.6rem 0">'+esc(tx(msg))+'</div>'); }

/* ---------- Flow 1: add an item from photos ---------- */
let AI_ITEM = null, aiItemToken = 0;
/* Set by "Add another in a different room": the source item's schedule,
   reused (with fresh, un-logged dates) when the copy keeps the same
   type, so the new room's instance starts from the same plan. */
let DUPE = null;
/* Which add-item fields the USER has set themselves (as opposed to the
   AI filling them in). The AI never overwrites a field the user set —
   what the user names is the item, full stop. */
const IT_USER = {type:false, name:false, other:false};
function matchItemType(cat){
  const c = aiStr(cat, 60).toLowerCase(); if(!c) return "Other";
  const exact = ITEM_TYPES.find(t=>t.toLowerCase()===c); if(exact) return exact;
  const partial = ITEM_TYPES.find(t=>{ const tl = t.toLowerCase(); return tl.indexOf(c)>=0 || c.indexOf(tl.split(/[\s/&]+/)[0])>=0; });
  return partial || "Other";
}
/* The type that will actually be saved for the item being added: the
   picked type, or — for "Other" — the text the user typed (falling back
   to the name they gave it). */
function resolvedItemType(){
  const sel = $("#itType"); if(!sel) return "";
  if(sel.value==="Other"){
    const o = $("#itOther") ? $("#itOther").value.trim() : "";
    const n = $("#itName") ? $("#itName").value.trim() : "";
    return o || n || "Other";
  }
  return sel.value;
}
/* Put a type string into the picker: a listed type selects it directly;
   anything else lands on Other with the text filled in, so a custom
   item the user (or the AI) named is never silently re-bucketed. */
function applyItemType(typeStr){
  const sel = $("#itType"); if(!sel) return;
  const wrap = $("#itOtherWrap"), inp = $("#itOther");
  if(ITEM_TYPES.indexOf(typeStr)>=0){ sel.value = typeStr; if(wrap) wrap.style.display = "none"; return; }
  sel.value = "Other";
  if(wrap) wrap.style.display = "block";
  if(inp && typeStr && typeStr!=="Other" && !IT_USER.other) inp.value = typeStr;
}
function aiTasks(v){
  if(!Array.isArray(v)) return [];
  const diffs = ["Easy","Moderate","Advanced"];
  return v.slice(0,6).map(t=>{
    if(!t || typeof t!=="object") return null;
    const name = aiStr(t.name, 80); if(!name) return null;
    let every = parseInt(t.every_months, 10); if(isNaN(every)) every = 12; every = Math.min(60, Math.max(1, every));
    let mins = parseInt(t.minutes, 10); if(isNaN(mins)) mins = 20; mins = Math.min(600, Math.max(1, mins));
    const steps = aiStrArr(t.steps, 8, 300); if(!steps.length) return null;
    return { name, every, mins, diff: diffs.indexOf(t.difficulty)>=0 ? t.difficulty : "Moderate", steps };
  }).filter(Boolean);
}
async function aiIdentifyItem(){
  const token = ++aiItemToken;
  const note = $("#identifyNote"), hint = $("#idHint"), planBox = $("#aiPlan");
  if(!PHA.item.length){ AI_ITEM = null; if(planBox) planBox.innerHTML = ""; if(note) note.style.display = "none"; return; }
  if(note){ note.style.display = "flex"; note.innerHTML = '<span class="spinner"></span> '+tf("readingItem",{s:PHA.item.length>1?"s":""}); }
  if(hint) hint.style.display = "none";
  aiMsg("");
  /* What the user has already told us is authoritative. Snapshot it
     before the call: a type they picked, a name they typed, and whatever
     they wrote in the problem/goal box. The AI builds around that — the
     photo is supporting context only and never re-guesses the item. */
  const userType = IT_USER.type ? resolvedItemType() : "";
  const userName = (IT_USER.name && $("#itName")) ? $("#itName").value.trim() : "";
  const userGoal = $("#itProblem") ? $("#itProblem").value.trim() : "";
  const userNamed = userType || userName;
  let prompt = "You are the photo-identification engine for One Place, a home-maintenance app. Look at the attached photos — "+PHA.item.length+" photo(s) of the SAME household item (an appliance, fixture, or system). Combine details across all of them: a wide shot shows what it is, a close-up may show the brand/model label.\n\n"+
    'Return ONLY a JSON object with this shape:\n{"name":"short item name, e.g. Kitchen dishwasher","category":"one of: '+ITEM_TYPES.join(", ")+' — or Other","brand":"brand/manufacturer if visible or clearly recognizable, else empty string","model":"model name/number if readable, else empty string","year":"year or year range only if visible or inferable from a label, else empty string","suggested_room":"the room this item most likely belongs in, e.g. Kitchen","description":"one sentence describing what is visible","confidence":"high, medium, or low","tasks":[{"name":"maintenance task","every_months":6,"minutes":20,"difficulty":"Easy","steps":["step 1","step 2"]}]}\n\n'+
    "Rules:\n- Never invent a brand, model, or year that isn't visible or clearly recognizable — leave the field empty instead.\n- tasks: 2–4 recurring upkeep tasks for THIS specific item, each with a realistic interval in months, rough minutes, difficulty Easy, Moderate, or Advanced, and 3–6 concrete DIY steps a homeowner can follow.\n- If the photos are unclear, give your best guess and set confidence to low.";
  prompt += aiLangInstr();
  prompt += aiLocInstr();
  if(userNamed || userGoal){
    prompt += "\n\nMOST IMPORTANT — the user has already said what this is. Treat that as settled fact, not a hint to second-guess:\n"+
      (userNamed ? '- The item is: "'+userNamed+'"'+(userName && userType && userName!==userType ? ' (their full name for it: "'+userName+'")' : "")+"\n" : "")+
      (userGoal ? '- In their words, the situation / what they want done: "'+userGoal+'"\n' : "")+
      "- Build EVERYTHING — name, category, description and tasks — around that item"+(userGoal ? " and what they want done with it" : "")+". The photos are supporting context only: use them for THAT item's material, condition, size and how it is fixed in place. Other objects in the frame are scenery, even if they are bigger or more central.\n"+
      "- Do NOT re-identify it as a different object. Example: if the user named a stair railing in a front-entry photo, the answer is about the railing — never the door — no matter how prominent the door is.\n"+
      '- Set "category" to "'+(userType || userNamed)+'" exactly, and "name" to a short name for that same item.\n'+
      (userGoal ? "- Include at least one task that directly addresses what they want done (for example, if they say it is faded and they want to repaint it, include a prep-and-repaint task with concrete steps for that item's material).\n" : "");
  }
  try{
    const r = await geminiJSON(prompt, PHA.item);
    if(token!==aiItemToken || !$("#itType")) return; /* stale run, or the modal closed */
    /* The user's own pick/name wins over whatever came back; only fill
       fields the user hasn't set themselves. */
    const effType = userType || matchItemType(r.category);
    if(!IT_USER.type) applyItemType(effType);
    if($("#itName") && !IT_USER.name) $("#itName").value = aiStr(r.name, 70);
    if($("#itBrand")) $("#itBrand").value = aiStr(r.brand, 50);
    if($("#itModel")) $("#itModel").value = aiStr(r.model, 50);
    if($("#itYear")) $("#itYear").value = aiStr(r.year, 12);
    const p = place();
    if(p && r.suggested_room && $("#itRoom")){ const want = aiStr(r.suggested_room, 60).toLowerCase(); const rm = p.rooms.find(x=> x.name.toLowerCase()===want || tr_room(x.name).toLowerCase()===want); if(rm) $("#itRoom").value = rm.id; }
    const tasks = aiTasks(r.tasks);
    AI_ITEM = tasks.length ? { type: resolvedItemType(), tasks } : null;
    if(note) note.style.display = "none";
    if(hint) hint.style.display = "block";
    if(planBox) planBox.innerHTML = aiPlanPreview(r, tasks);
    renderPlanSuggestions();
  }catch(e){
    if(token!==aiItemToken) return;
    AI_ITEM = null;
    if(note) note.style.display = "none";
    if(hint) hint.style.display = "block";
    aiErr("Photo reading isn’t available right now — no problem, just fill in the details below by hand.");
    renderPlanSuggestions();
  }
}

async function aiExtractPlan(){
  const token = ++aiPlanToken;
  const note = $("#identifyNote"), hint = $("#idHint"), draftBox = $("#planDraft");
  if(!PHA.plan.length){ PLAN_DRAFT = null; if(draftBox) draftBox.innerHTML = ""; if(note) note.style.display = "none"; return; }
  if(note){ note.style.display = "flex"; note.innerHTML = '<span class="spinner"></span> '+tf("readingPlan",{s:PHA.plan.length>1?"s":""}); }
  if(hint) hint.style.display = "none";
  aiMsg("");
  const prompt = "Today is "+todayStr()+". You are reading "+PHA.plan.length+" screenshot(s) of a mobile carrier plan page (from a carrier app or website such as T-Mobile, Verizon, or AT&T). The screenshots together show ONE phone plan and its lines — different screenshots may show the plan summary, the list of lines, or one line's detail page (device balance, payoff, upgrade eligibility).\n\n"+
    'Return ONLY a JSON object with this shape:\n{"carrier":"carrier name as shown, else empty string","plan_name":"plan name as shown, else empty string","account_holder":"account holder name if shown, else empty string","notes":"plan-level details worth keeping, short plain text, else empty string","confidence":"high, medium, or low","lines":[{"person_name":"the name or label shown for this line","phone_number":"exactly as shown","device_name":"device on this line","monthly_cost":45.00,"device_balance":0,"payoff_date":"YYYY-MM-DD or empty string","upgrade_date":"YYYY-MM-DD or empty string","notes":""}]}\n\n'+
    "Rules:\n- Extract EVERY line across ALL screenshots combined. Merge duplicates: if the same line appears in more than one screenshot, combine its details into a single entry.\n- Only use what is actually visible. Never invent a name, number, price, balance, or date — leave the field empty or 0 when it isn't shown.\n- Money is a plain dollar number (e.g. $45.00 → 45). If only a plan total is shown, use 0 for each line's monthly_cost.\n- Dates must be YYYY-MM-DD — convert any displayed date. If a line is shown as upgrade-eligible / ready to upgrade now, use today's date ("+todayStr()+") for its upgrade_date." + aiLangInstr();
  try{
    const r = await geminiJSON(prompt, PHA.plan);
    if(token!==aiPlanToken || !$("#plCarrier")) return;
    if(r.carrier) $("#plCarrier").value = aiStr(r.carrier, 60);
    if(r.plan_name) $("#plName").value = aiStr(r.plan_name, 80);
    if(r.account_holder) $("#plHolder").value = aiStr(r.account_holder, 60);
    const lines = (Array.isArray(r.lines) ? r.lines : []).slice(0,20).map(l=>({
      person: aiStr(l && l.person_name, 60), number: aiStr(l && l.phone_number, 30), device: aiStr(l && l.device_name, 80),
      cost: aiMoney(l && l.monthly_cost), balance: aiMoney(l && l.device_balance),
      payoff: aiDate(l && l.payoff_date), upgrade: aiDate(l && l.upgrade_date)
    })).filter(l=>l.person || l.number || l.device || l.cost || l.balance);
    PLAN_DRAFT = lines.length ? { lines } : null;
    if(note) note.style.display = "none";
    if(hint) hint.style.display = "block";
    if(draftBox) draftBox.innerHTML = lines.length
      ? '<div class="ai-plan"><div class="label" style="margin-bottom:.4rem">'+esc(t("aiDraft"))+'</div><p class="small" style="margin:0 0 .3rem">'+tf("linesRead",{n:lines.length,s:lines.length===1?"":"s",s2:PHA.plan.length>1?"s":""})+'</p>'+lines.map(l=>'<div class="kv"><span>'+esc(l.person||t("lineWord"))+(l.device?'<br /><span class="small muted">'+esc(l.device)+(l.number?" · "+esc(l.number):"")+'</span>':"")+'</span><b>'+money(l.cost)+esc(t("perMonth"))+'</b></div>').join("")+'<p class="tiny muted" style="margin:.5rem 0 0">'+esc(t("planDraftNote"))+'</p></div>'
      : '<div class="ai-note" style="margin:.6rem 0">'+esc(t("couldntFindLines"))+'</div>';
  }catch(e){
    if(token!==aiPlanToken) return;
    PLAN_DRAFT = null;
    if(note) note.style.display = "none";
    if(hint) hint.style.display = "block";
    aiErr("Couldn’t read the screenshot just now — you can type the plan in below instead. Nothing was filled in automatically.");
  }
}

/* ---------- Flow 3: “Something wrong?” diagnosis ---------- */
function keywordDiagnose(raw){
  const txt = raw.toLowerCase(); let best = null, score = 0;
  DIAGNOSE_RULES.forEach(r=>{ const s = r.keys.filter(k=>txt.includes(k)).length; if(s>score){ score = s; best = r; } });
  const r = best || DIAGNOSE_DEFAULT;
  return { ...r, conf: best ? (score>=2 ? "high" : "medium") : "low" };
}
async function aiDiagnose(raw, target){
  const ctx = target ? " with their "+target.name+([target.brand, target.model].filter(Boolean).length ? " ("+[target.brand, target.model].filter(Boolean).join(" ")+")" : "") : "";
  const prompt = "A homeowner has a problem"+ctx+". In their own words: \""+raw+"\". "+PHA.diag.length+" photo(s) of the problem are attached — look carefully at exactly where the problem shows (leak source, damage, wear, error lights or codes, corrosion) and factor it into the diagnosis."+(target ? " The problem is with the named item above — keep the whole diagnosis on that item and do not switch to a different object that happens to appear in the photos." : "")+"\n\n"+
    'Return ONLY a JSON object with this shape:\n{"title":"short diagnosis title","summary":"1–2 sentences: what is most likely going on","severity":"how urgent, in a few words","safety":["safety warning"],"causes":["most likely cause first"],"checks":["safe check to run, in order"],"steps":["DIY fix step"],"difficulty":"Easy, Moderate, Advanced, or Pro recommended","time":"e.g. 30–90 min","cost":"e.g. $5–$40 in parts","part":"the part most likely needed, or None until the checks are done","pro":"when to call a pro instead","confidence":"high, medium, or low"}\n\n'+
    "Think safety first: a gas smell, sparking, or active water damage means make it safe and call a pro. If the photos don't show the problem clearly, say so in the summary and set confidence to low." + aiLangInstr() + aiLocInstr();
  const d = await geminiJSON(prompt, PHA.diag);
  const causes = aiStrArr(d.causes, 8, 300), checks = aiStrArr(d.checks, 8, 300), steps = aiStrArr(d.steps, 10, 300);
  if(!causes.length || !steps.length) throw new Error("empty diagnosis");
  return { title: aiStr(d.title, 90) || "Diagnosis", summary: aiStr(d.summary, 500), severity: aiStr(d.severity, 80) || "Worth checking soon",
    safety: aiStrArr(d.safety, 5, 300), causes, checks, steps,
    diff: aiStr(d.difficulty, 30) || "Moderate", time: aiStr(d.time, 40) || "30–60 min", cost: aiStr(d.cost, 60) || "Varies",
    part: aiStr(d.part, 160) || "Identify the failed part before buying",
    pro: aiStr(d.pro, 400) || "If the checks don’t reveal it, a pro diagnosis is usually cheaper than guessing with parts.",
    conf: ["high","medium","low"].indexOf(d.confidence)>=0 ? d.confidence : "medium" };
}
async function runDiagnose(p){
  const ta = $("#diagText"); const raw = ta ? ta.value : (S.diagText || "");
  if(!raw.trim()){ toast("Describe what’s happening first"); return; }
  S.diagText = raw;
  const target = S.diagFor ? p.items.find(i=>i.id===S.diagFor) : null;
  const finish = (r, noteText)=>{ S.diagResult = r; S.diagAiNote = noteText || null; S.diagBusy = false; if(target) target.problem = raw; render(); if(S.view==="diagnose") window.scrollTo(0, document.body.scrollHeight); persist(); };
  if(PHA.diag.length){
    S.diagBusy = true; S.diagResult = null; S.diagAiNote = null; render();
    try{ const d = await aiDiagnose(raw, target); finish({ ...d, photo:true, hadPhoto:true }); }
    catch(e){ const r = keywordDiagnose(raw); finish({ ...r, photo:true, hadPhoto:true }, "Photo reading isn’t available right now, so this diagnosis is based on your description alone — the photo wasn’t read."); }
    return;
  }
  const r = keywordDiagnose(raw);
  finish({ ...r, photo:true, hadPhoto:false });
}

function sanitizeProject(r, goal){
  if(!r || typeof r!=="object") return null;
  const steps = (Array.isArray(r.steps) ? r.steps : []).slice(0,12).map(s=>{
    if(!s || typeof s!=="object") return null;
    const title = aiStr(s.title, 90), detail = aiStr(s.detail, 600);
    if(!title && !detail) return null;
    return { title, detail: detail || title };
  }).filter(Boolean);
  const materials = (Array.isArray(r.materials) ? r.materials : []).slice(0,24).map(m=>{
    if(!m || typeof m!=="object") return null;
    const name = aiStr(m.name, 90); if(!name) return null;
    return { name, quantity: aiStr(m.quantity, 40) || "1", note: aiStr(m.note, 240) };
  }).filter(Boolean);
  if(!steps.length || !materials.length) return null;
  return { title: aiStr(r.project_title, 90) || (goal ? goal.slice(0,70) : "DIY project"), what: aiStr(r.what_it_is, 700),
    difficulty: aiStr(r.difficulty, 30) || "Moderate", time: aiStr(r.estimated_time, 60), cost: aiStr(r.estimated_cost, 80),
    steps, materials, removal: aiStr(r.removal_guidance, 900), masking: aiStr(r.masking_and_prep, 900), safety: aiStr(r.safety_notes, 700),
    confidence: ["high","medium","low"].indexOf(r.confidence)>=0 ? r.confidence : "low" };
}

/* ---------- Plan suggestions: pick what gets scheduled ----------
   Adding an item (or vehicle) still works out its upkeep plan, but
   nothing is enrolled automatically: the plan shows as suggestions,
   and only the tasks the user taps Add on become scheduled tasks
   with reminders. The rest are saved on the item as `suggested`
   and stay visible on its page, ready to add later. Picks are task
   names in PLAN_SEL / VPLAN_SEL, reset whenever the plan on show
   changes (a different item type, a fresh photo read). */
let PLAN_SEL = new Set(), PLAN_SIG = "";
let VPLAN_SEL = new Set();
function planSource(){
  const sel=$("#itType"); if(!sel) return null;
  let type=sel.value; if(type==="Other") type=resolvedItemType();
  if(DUPE && DUPE.type===type && ((DUPE.tasks||[]).length || (DUPE.suggested||[]).length))
    return {type, tasks:[].concat(DUPE.tasks||[], DUPE.suggested||[])};
  if(AI_ITEM && AI_ITEM.type===type && AI_ITEM.tasks.length) return {type, tasks:AI_ITEM.tasks};
  const kb=ITEM_KB[type]; return {type, tasks: kb? kb.tasks : []};
}

  const typeSel = $("#itType"), otherWrap = $("#itOtherWrap"), otherInp = $("#itOther"), nameInp = $("#itName"), probInp = $("#itProblem");

     it"). If they write one after a photo read, re-read around it. */
  if(probInp) probInp.addEventListener("change", ()=>{ if(PHA.item.length && probInp.value.trim()) aiIdentifyItem(); });

function addAnotherItem(p, src){
  addItemModal(p);

  const typeSel=$("#itType"), otherWrap=$("#itOtherWrap"), otherInp=$("#itOther");
  if(typeSel){
    if(ITEM_TYPES.includes(src.type)){ typeSel.value=src.type; }
    else { typeSel.value="Other"; if(otherWrap) otherWrap.style.display="block"; if(otherInp) otherInp.value = src.type==="Other / not listed"? "" : src.type; IT_USER.other=true; }

  let idx=Math.floor(Math.random()*PLUSHIES.length);

   different one each time) + "Done!". Shows for ~2.3s, fades out,
   and a tap anywhere dismisses it early. Under
   prefers-reduced-motion it appears still (no confetti, no
   jumping) and fades the same way. */
let partyTimer = null;
function celebrate(){
  const root=$("#partyRoot"); if(!root) return;
  if(partyTimer){ clearTimeout(partyTimer); partyTimer=null; }
  const reduced = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  const colors=["#FF6B6B","#FFD93D","#6BCB77","#4D96FF","#FF9F45","#B983FF"];
  let conf="";
  if(!reduced){
    for(let i=0;i<26;i++){
      const size=(6+Math.random()*6).toFixed(0);
      conf+='<span class="confetto" style="left:'+(Math.random()*100).toFixed(1)+'%;background:'+colors[i%colors.length]+
        ';width:'+size+'px;height:'+(size*0.55).toFixed(0)+'px;animation-delay:'+(Math.random()*0.35).toFixed(2)+'s;animation-duration:'+(1.5+Math.random()*1.1).toFixed(2)+
        's;--drift:'+((Math.random()*120)-60).toFixed(0)+'px;--spin:'+(360+Math.random()*360).toFixed(0)+'deg"></span>';
    }
  }
  root.innerHTML='<div class="party" id="partyOverlay" role="status" aria-label="'+esc(t("partyDone"))+'"><div class="party-confetti">'+conf+'</div>'+
    '<div class="party-center">'+nextPlushieSvg()+'<div class="party-done">'+esc(t("partyDone"))+'</div></div></div>';
  const ov=$("#partyOverlay");
  const dismiss=()=>{ if(partyTimer){ clearTimeout(partyTimer); partyTimer=null; } if(ov){ ov.classList.add("out"); setTimeout(()=>{ root.innerHTML=""; },320); } };
  if(ov) ov.addEventListener("click", dismiss);
  partyTimer=setTimeout(dismiss, 2300);
}
/* ---------- Household invite (shown right after a member is added) ----------
   Adding a member still just adds them, exactly as before — this is
   the message shown in addition, so the person can be welcomed with a
   link they can tap. The wording is Angeli's, verbatim, with the
   inviter's name filled in from the app (ownerName() — the name saved
   in Your details) and the One Place link after it. Copy copies the
   whole message including the link; Share hands the same text to the
   device share sheet (text/message, email, …) and falls back to Copy
   where the share sheet isn't available. */
const INVITE_LINK = "https://one-place-three.vercel.app";
function inviteWelcome(){
  return "Hi! " + ownerName() + " is inviting you to join One Place. :) click the link below to get started on your organization journey:";
}
function inviteText(){
  return inviteWelcome() + "\n\n" + INVITE_LINK;
}
function fallbackCopyText(text){
  try{
    const ta=document.createElement("textarea");
    ta.value=text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }catch(e){}
}
function copyInviteText(){
  const msg=inviteText();
  const done=()=>toast("Invite copied — paste it into a text or email");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(msg).then(done).catch(()=>{ fallbackCopyText(msg); done(); });
  } else { fallbackCopyText(msg); done(); }
}
function shareInviteText(){
  const msg=inviteText();
  if(navigator.share){
    navigator.share({title:"One Place", text:msg}).catch(err=>{
      if(err && err.name!=="AbortError") copyInviteText();
    });
  } else {
    copyInviteText();
    toast("Sharing isn't available here — invite copied instead");
  }
}

/* Send feedback: the email still opens exactly as before (mailto:,
   addressed to Angeli and pre-filled). When a photo is attached it is
   saved to the feedback inbox first (see storeFeedback) and the email
   says the photo was saved with the feedback — a mailto: link cannot
   carry an attachment, so the photo never rides inside the email
   itself. If the save fails, the email still opens, its body says the
   photo couldn't be saved, and the toast tells the tester they can
   attach the photo in their email app instead. */
async function sendFeedbackFlow(type, msg){
  const photo = PH.fb;
  let photoNote = "", photoSaved = false;
  if(photo){
    const btn = $("#fbSendBtn");
    if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> '+esc(t("fbSending")); }
    try{
      await storeFeedback({type:type, message:msg, photo:photo, lang:curLang(), sent:new Date().toISOString()});
      photoSaved = true;
      photoNote = "\n\nPhoto: the tester attached a photo/screenshot, saved with this feedback in the One Place feedback inbox (Supabase → Table Editor → settings → owner_id \"feedback-inbox\").";
    }catch(e){
      photoNote = "\n\nPhoto: the tester attached a photo/screenshot, but it couldn't be saved — they were asked to attach it to this email instead.";
    }
  }
  const fbody=encodeURIComponent("Type: "+type+"\n\n"+msg+photoNote+"\n\n— Sent from the One Place test version");
  openMail("mailto:angelisiopao@gmail.com?subject="+encodeURIComponent("One Place test feedback")+"&body="+fbody);
  PH.fb = null;
  closeModal();
  toast(!photo ? "Opening your email app…" : (photoSaved ? "Photo saved with your feedback — opening your email app…" : "The photo couldn’t be saved — your email is opening anyway, so you can attach the photo there."));
}

document.addEventListener("click", e=>{

  const act = el.dataset.act, p = place();
  if(act==="scrim"){ if(e.target===el) closeModal(); return; }
  switch(act){
    case "closeModal": closeModal(); break;
    /* onboarding */
    case "obRole": OB.role=el.dataset.role; OB.kind=el.dataset.kind; render(); break;
    case "obStart": {

    /* nav */
    case "go": S.view=el.dataset.view; calPrintMode=false; if(S.view!=="diagnose"){S.diagResult=null; S.diagFor=null; S.diagAiNote=null; S.diagBusy=false;} closeModal(); render(); window.scrollTo(0,0); break;
    case "switchPlace": S.activePlaceId=el.dataset.id; S.view="home"; S.sel={item:null,vehicle:null,pet:null}; render(); window.scrollTo(0,0); break;

document.addEventListener("change", e=>{
  const id = e.target && e.target.id;
  if(id==="obLang" || id==="setLang"){
    const v = e.target.value;
    if(LANGS.some(l=>l.id===v) && v!==curLang()){
      S.settings.lang = v;
      applySettings();
      render();
      persist();
    }
  }
  /* Location (welcome screen + More → Make it yours): independent of
     the language; saved with the rest of the settings, so it sticks. */
  if(id==="obCountry" || id==="setCountry"){
    const v = e.target.value;
    if(COUNTRIES.some(c=>c.id===v) && v!==curCountry()){
      S.settings.country = v;
      if(id==="setCountry") render();
      persist();
    }
  }
  if(id==="setCity"){ S.owner.city = e.target.value.trim(); persist(); }
  if(id==="setZip"){ S.owner.zip = e.target.value.trim(); persist(); }
});

/* ---------- init ---------- */
bootPromise = boot();
</script>
<script>
/* =====================================================================
   PWA — install to Home Screen + service worker.
   The manifest and icon PNGs are separate files in the assets/
   folder; the service worker (sw.js) is uploaded at the site root
   alongside this page so its scope covers the whole app. Everything
   here degrades quietly where a piece is unavailable (an in-app
   webview, a browser without service workers, or the files not yet
   uploaded): the app itself works exactly as before.
   ===================================================================== */
(function(){
  "use strict";
  /* Android / Chrome install prompt, captured when the browser offers
     it and fired from the "Add to Home Screen" button in More. */
  var deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferredPrompt = e;
  });
  window.addEventListener("appinstalled", function(){
    deferredPrompt = null;
    try{ toast(t("installToast")); }catch(err){}
  });
  /* The button's action (case "installApp" in the click handler): use
     the browser prompt when we have one; otherwise (iPhone Safari has
     no prompt) show the step-by-step for every phone type. */
  window.installApp = function(){
    if(deferredPrompt){
      var p = deferredPrompt; deferredPrompt = null;
      /* Fire the browser's own install offer (the beforeinstallprompt
         event's show method — a browser affordance, not a page dialog;
         inside a sandboxed frame the event never fires, so this is
         simply never reached and the instructions modal below is used). */
      var showInstall = p.prompt;
      if(showInstall) showInstall.call(p);
      if(p.userChoice && p.userChoice.then) p.userChoice.then(function(){}, function(){});
      return;
    }
    openModal(modalHead(esc(t("installModalTitle")), esc(t("installModalSub")))+
      '<div class="rows">'+
      '<div class="card"><div class="card-title">iPhone / iPad</div><p class="small muted" style="margin:.35rem 0 0">'+esc(t("installIos"))+'</p></div>'+
      '<div class="card"><div class="card-title">Android</div><p class="small muted" style="margin:.35rem 0 0">'+esc(t("installAndroid"))+'</p></div>'+
      '<div class="card"><div class="card-title">Other phones</div><p class="small muted" style="margin:.35rem 0 0">'+esc(t("installOther"))+'</p></div>'+
      '</div>'+
      '<button class="btn ghost block" data-act="closeModal" style="margin-top:.9rem">'+esc(t("doneBtn"))+'</button>');
  };
  /* Service worker registration (sw.js at the site root, so its scope
     covers the whole app). A failure — file not uploaded yet, or an
     embedded webview that forbids it — is silent by design. */
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      try{
        var reg = navigator.serviceWorker.register("sw.js");
        if(reg && reg.catch) reg.catch(function(){});
      }catch(err){ /* not installable in this context; app still works */ }
    });
  }
})();
</script>

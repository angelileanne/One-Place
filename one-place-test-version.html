    <style>
      /* ---------- Theme palettes (10 themes × light/dark, same as the main app) ----------
         Each theme sets only its base tokens; the softer tokens below them
         (--bg2, --ink3, --accent2, --accent-soft, --hero) are derived with
         color-mix so every palette stays in step automatically. */
      @font-face{font-family:"Organic Source Serif";src:local("Source Serif 4");}
      @font-face{font-family:"Organic Instrument Sans";src:local("Instrument Sans");}
      @font-face{font-family:"Botanical Garamond";src:local("EB Garamond");}
      @font-face{font-family:"Botanical Instrument";src:local("Instrument Sans");}
      @font-face{font-family:"Luxury Garamond";src:local("EB Garamond");}
      @font-face{font-family:"Luxury Sans";src:local("Instrument Sans");}
      @font-face{font-family:"Claymorphism Instrument";src:local("Instrument Sans");}
      :root{
        --radius-card:20px; --radius-btn:13px; --radius-chip:999px;
        --shadow-card:0 1px 2px rgb(23 32 27/.04),0 18px 40px -26px rgb(23 32 27/.28);
        --shadow-nav:0 -14px 34px -22px rgb(23 32 27/.28);
        --font-heading:"Manrope","Public Sans",system-ui,sans-serif;
        --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
        --bg2:color-mix(in srgb,var(--bg) 90%,var(--ink));
        --ink3:color-mix(in srgb,var(--ink) 52%,var(--bg));
        --accent2:color-mix(in srgb,var(--accent) 82%,var(--ink));
        --accent-soft:color-mix(in srgb,var(--accent) 13%,var(--surface));
        --hero:var(--accent); --hero-ink:var(--accent-ink);
      }

      :root[data-theme="luxury"][data-mode="dark"]{--bg:#1B1917;--surface:#262321;--surface2:#302C29;--ink:#F3EEE4;--ink2:#C6BDB0;--line:#46403A;--accent:#D2B071;--accent-ink:#262321;--ok:#A9C98D;--ok-soft:#2C3324;--warn:#D2B071;--warn-soft:#38301C;--bad:#E0956A;--bad-soft:#40271A;--gold:#B69355;--gold-text:#D2B071;--gold-light:#D2B071;--gold-focus:#D2B071;--panel-line:#57493A;--field:#262321;--field-deep:#302C29;--field-line:#46403A;--shadow-card:none;--shadow-nav:0 -1px 0 0 var(--line);}
      :root[data-theme="claymorphism"]{--bg:#F1F2FA;--surface:#FFFDF7;--surface2:#DED0F9;--ink:#383139;--ink2:#48404B;--line:#E3D9EC;--accent:#D96CA6;--accent-ink:#FFFFFF;--ok:#1F6B4A;--ok-soft:#C0EFDC;--warn:#7A5B00;--warn-soft:#F9E7A8;--bad:#B23A6B;--bad-soft:#FBDCEA;--support:#C0EFDC;--compare:#DED0F9;--warm:#F9E7A8;--cool:#C5E5FB;--pink:#F6A3CA;--shadow-card:inset 2px 2px 6px rgb(255 255 255/.75),inset -5px -5px 12px rgb(56 49 57/.08),0 20px 34px -20px rgb(56 49 57/.35);--shadow-nav:inset 0 2px 6px rgb(255 255 255/.6),inset -5px -5px 12px rgb(56 49 57/.06),0 -16px 30px -20px rgb(56 49 57/.3);--font-heading:"Claymorphism Instrument","Instrument Sans",system-ui,sans-serif;--font-body:"Claymorphism Instrument","Instrument Sans",system-ui,sans-serif;}
      :root[data-theme="claymorphism"][data-mode="dark"]{--bg:#241E26;--surface:#322A34;--surface2:#3E3442;--ink:#F5EFF4;--ink2:#C9BCC6;--line:#524657;--accent:#F6A3CA;--accent-ink:#383139;--ok:#8FE3BC;--ok-soft:#1E3830;--warn:#F2D67C;--warn-soft:#453A1E;--bad:#F095B5;--bad-soft:#42222F;--support:#24503E;--compare:#4A3D6B;--warm:#5A4A1F;--cool:#2A4A66;--pink:#F6A3CA;--shadow-card:inset 2px 2px 6px rgb(255 255 255/.08),inset -5px -5px 12px rgb(0 0 0/.35),0 20px 34px -20px rgb(0 0 0/.7);--shadow-nav:inset 0 2px 6px rgb(255 255 255/.06),inset -5px -5px 12px rgb(0 0 0/.3),0 -16px 30px -20px rgb(0 0 0/.7);}

      *{box-sizing:border-box;}
      html{font-size:16.5px;}
      html,body{margin:0;padding:0;}
      body{
        font-family:var(--font-body);
        background:var(--bg2); color:var(--ink);
        -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; line-height:1.45;
      }
      h1.page-title,h2.sec-title,.card-title,.sheet h3,.place-name,.hero h2,.stat b,.report-sheet h1,.report-sheet h2,.report-sheet h3{font-family:var(--font-heading);}
      ::selection{background:color-mix(in srgb,var(--accent) 28%,transparent);}

      /* ---------- Sleek interaction layer (all themes) ---------- */
      button,a,input,select,textarea{transition:background-color .16s ease,border-color .16s ease,color .16s ease,box-shadow .2s ease,transform .12s ease;}
      input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent);}
      :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
      @media(hover:hover) and (pointer:fine){.card:hover,.row-card:hover,.tile:hover{box-shadow:0 2px 4px rgb(23 32 27/.05),0 24px 48px -26px rgb(23 32 27/.38);}}
      @media(prefers-reduced-motion:reduce){button,a,input,select,textarea{transition:none;}button:active,.btn:active,.tile:active,.row-card:active,.addbtn:active{transform:none;}}
      button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
      input,select,textarea{font:inherit;color:var(--ink);}
      img{display:block;max-width:100%;}
      .ic{width:1.25rem;height:1.25rem;flex:none;display:inline-block;vertical-align:-.28em;}
      .ic svg{width:100%;height:100%;display:block;}

      /* ---------- App frame ---------- */
      .frame{max-width:1060px;margin:0 auto;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;}
      @media(min-width:1100px){.frame{box-shadow:0 0 60px rgba(10,15,12,.18);}}
      .content{flex:1;padding:1.1rem 1.1rem 7.5rem;width:100%;max-width:1060px;margin:0 auto;}
      @media(min-width:760px){.content{padding:1.6rem 2rem 8rem;}}

      /* ---------- Type ---------- */
      h1.page-title{font-size:1.72rem;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.12;}
      h2.sec-title{font-size:1.13rem;font-weight:800;letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:.6rem;}
      h2.sec-title::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px;}
      .sec{margin-top:1.7rem;}
      .label{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);}
      body.bold-off .label{font-weight:600;}
      body.bold-off h2.sec-title,body.bold-off .card-title,body.bold-off .nav-label{font-weight:700;}
      .muted{color:var(--ink2);} .small{font-size:.86rem;} .tiny{font-size:.76rem;}
      .strong{font-weight:700;}

      /* ---------- Header / place switcher ---------- */
      .placebar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:.7rem 1.1rem;}
      @media(min-width:760px){.placebar{padding:.7rem 2rem;}}
      .placebar-in{max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:.8rem;}
      .place-id{display:flex;align-items:center;gap:.65rem;min-width:0;}
      .place-emoji{width:2.5rem;height:2.5rem;border-radius:.8rem;background:var(--accent-soft);display:grid;place-items:center;font-size:1.3rem;flex:none;}
      .place-name{font-weight:800;font-size:1.06rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
      .place-tag{font-size:.78rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
      .switcher{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .1rem;scrollbar-width:none;}
      .switcher::-webkit-scrollbar{display:none;}
      .chip{flex:none;display:inline-flex;align-items:center;gap:.4rem;padding:.42rem .8rem;border-radius:var(--radius-chip);border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.88rem;transition:border-color .15s,background .15s;}
      .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
      .chip.add{border-style:dashed;color:var(--ink2);}

      /* ---------- Cards & buttons ---------- */
      .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:1.05rem 1.1rem;}
      .card-title{font-weight:800;font-size:1.02rem;letter-spacing:-.01em;}
      .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:.72rem 1.15rem;border-radius:var(--radius-btn);font-size:.98rem;transition:transform .08s,background .15s,opacity .15s;text-align:center;}
      .btn:active{transform:scale(.97);}
      .btn.block{width:100%;}
      .btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);}
      .btn.soft{background:var(--accent-soft);color:var(--accent2);}
      [data-mode="dark"] .btn.soft{color:var(--accent2);}
      .btn.danger{background:var(--bad-soft);color:var(--bad);}
      .btn.sm{padding:.5rem .85rem;font-size:.9rem;border-radius:11px;}
      .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;}
      .iconbtn{width:2.5rem;height:2.5rem;border-radius:.8rem;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);flex:none;}
      .langbtn{width:auto;display:inline-flex;align-items:center;gap:.38rem;padding:0 .62rem;font-weight:700;font-size:.86rem;white-space:nowrap;}
      .langbtn .ic{width:1.15rem;height:1.15rem;}
      .langbtn-name{max-width:6.2rem;overflow:hidden;text-overflow:ellipsis;}
      .pill{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .6rem;border-radius:var(--radius-chip);font-size:.76rem;font-weight:700;}
      .pill.ok{background:var(--ok-soft);color:var(--ok);}
      .pill.warn{background:var(--warn-soft);color:var(--warn);}
      .pill.bad{background:var(--bad-soft);color:var(--bad);}
      .pill.neutral{background:var(--surface2);color:var(--ink2);}
      .pill.accent{background:var(--accent-soft);color:var(--accent2);}
      [data-mode="dark"] .pill.accent{color:var(--accent2);}

      .hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:1.3rem 1.25rem;box-shadow:var(--shadow-card);position:relative;overflow:hidden;}
      .hero h2{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:-.015em;line-height:1.15;}
      .hero p{margin:.45rem 0 0;opacity:.88;font-size:.95rem;max-width:34rem;}
      .hero .btn{background:var(--surface);color:var(--ink);margin-top:1rem;}
      /* One small circle tucked into the top-right corner, clear of the
         heading, body text and the diagnose button. The old second
         circle sat behind the button and read as a smudge — removed. */
      .hero .deco{position:absolute;right:-2rem;top:-2rem;width:4.5rem;height:4.5rem;border-radius:50%;background:rgba(255,255,255,.10);}
      .hero .deco2{display:none;}

      /* ---------- Lists & rows ---------- */
      .rows{display:flex;flex-direction:column;gap:.7rem;}
      .row-card{display:flex;gap:.85rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:.8rem .9rem;text-align:left;width:100%;transition:transform .08s;}
      button.row-card:active{transform:scale(.985);}
      .thumb{width:4.1rem;height:4.1rem;border-radius:.9rem;object-fit:cover;flex:none;background:var(--surface2);}
      .thumb-ph{width:4.1rem;height:4.1rem;border-radius:.9rem;flex:none;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;}
      .thumb-ph .ic{width:1.7rem;height:1.7rem;}
      .row-main{flex:1;min-width:0;}
      .row-name{font-weight:800;font-size:1rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
      .row-sub{font-size:.86rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
      .chev{color:var(--ink3);flex:none;}

      .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
      @media(min-width:760px){.grid2{grid-template-columns:repeat(4,1fr);}}
      .tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:1rem;display:flex;flex-direction:column;gap:.35rem;text-align:left;transition:transform .08s;}
      button.tile:active{transform:scale(.97);}
      .tile .ic{width:1.55rem;height:1.55rem;color:var(--accent);}
      .tile b{font-size:.98rem;font-weight:800;letter-spacing:-.01em;}
      .tile span{font-size:.82rem;color:var(--ink2);line-height:1.35;}

      .attn{display:flex;gap:.8rem;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:14px;padding:.85rem .95rem;box-shadow:var(--shadow-card);text-align:left;width:100%;}
      .attn.overdue{border-left-color:var(--bad);}
      .attn .ic{color:var(--warn);margin-top:.1rem;}
      .attn.overdue .ic{color:var(--bad);}

      /* ---------- Forms ---------- */
      .field{margin-bottom:.95rem;}
      .field label{display:block;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:.38rem;}
      body.bold-off .field label{font-weight:600;}
      .field input,.field select,.field textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:.68rem .8rem;font-size:1rem;outline:none;transition:border-color .15s;}
      .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
      .field textarea{resize:vertical;min-height:4.2rem;}
      .f2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
      .seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:.28rem;gap:.28rem;flex-wrap:wrap;}
      .seg button{flex:1;padding:.55rem .4rem;border-radius:10px;font-weight:700;font-size:.92rem;color:var(--ink2);white-space:nowrap;transition:background .15s,color .15s;}
      .seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(10,15,12,.14);}
      .pickrow{display:flex;flex-wrap:wrap;gap:.45rem;}
      .pick{padding:.5rem .85rem;border-radius:var(--radius-chip);border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;}
      .pick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
      .photo-pick{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
      .photo-btn{border:1.5px dashed var(--line);background:var(--surface2);border-radius:14px;padding:1rem .6rem;display:flex;flex-direction:column;align-items:center;gap:.4rem;font-weight:700;font-size:.9rem;color:var(--ink2);text-align:center;}
      .photo-btn .ic{width:1.5rem;height:1.5rem;color:var(--accent);}
      .photo-preview{width:100%;max-height:13rem;object-fit:cover;border-radius:14px;border:1px solid var(--line);}
      .identifying{display:flex;align-items:center;gap:.7rem;background:var(--accent-soft);border-radius:12px;padding:.8rem .95rem;font-weight:600;}
      .photo-strip{display:flex;flex-wrap:wrap;gap:.55rem;margin-bottom:.25rem;}
      .pstrip{position:relative;width:4.4rem;height:4.4rem;flex:none;}
      .pstrip img{width:100%;height:100%;object-fit:cover;border-radius:12px;border:1px solid var(--line);}
      .pstrip-x{position:absolute;top:-.45rem;right:-.45rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--ink);color:var(--bg);font-size:1rem;line-height:1;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3);padding:0;}
      .ai-note{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:.75rem .9rem;font-weight:600;font-size:.92rem;}
      .ai-plan{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.85rem .95rem;margin:.6rem 0;}
      .btn:disabled{opacity:.55;pointer-events:none;}
      .spinner{width:1.15rem;height:1.15rem;border-radius:50%;border:3px solid var(--accent);border-top-color:transparent;animation:spin .8s linear infinite;flex:none;}
      @keyframes spin{to{transform:rotate(360deg);}}
      @media(prefers-reduced-motion:reduce){.spinner{animation:none;}.btn,.tile,.row-card{transition:none;}}

      /* ---------- Bottom nav ---------- */
      .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;pointer-events:none;}
      .bottomnav-in{pointer-events:auto;max-width:1060px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--shadow-nav);display:grid;grid-template-columns:1fr 1fr 4.4rem 1fr 1fr;padding:.45rem .6rem calc(.45rem + env(safe-area-inset-bottom));position:relative;}
      @media(min-width:1100px){.bottomnav-in{border-left:1px solid var(--line);border-right:1px solid var(--line);}}
      .navbtn{display:flex;flex-direction:column;align-items:center;gap:.14rem;padding:.42rem .1rem;border-radius:12px;color:var(--ink3);}
      .navbtn .ic{width:1.4rem;height:1.4rem;}
      .nav-label{font-size:.72rem;font-weight:700;letter-spacing:.02em;}
      html[data-ts="2"] .nav-label,html[data-ts="3"] .nav-label{font-size:.64rem;}
      .navbtn.on{color:var(--accent);}
      .navbtn.on .nav-pill{background:var(--accent-soft);border-radius:var(--radius-chip);padding:.14rem .85rem;display:grid;place-items:center;}
      .nav-pill{display:grid;place-items:center;padding:.14rem .85rem;}
      .addbtn{position:absolute;left:50%;top:-1.35rem;transform:translateX(-50%);width:3.6rem;height:3.6rem;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(10,15,12,.5);border:4px solid var(--bg);}
      .addbtn .ic{width:1.7rem;height:1.7rem;}
      .addbtn:active{transform:translateX(-50%) scale(.94);}

      /* ---------- Modal / sheet ---------- */
      .scrim{position:fixed;inset:0;background:rgba(8,12,10,.52);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
      @media(min-width:760px){.scrim{align-items:center;padding:1.5rem;}}
      .sheet{background:var(--bg);width:100%;max-width:620px;max-height:92dvh;overflow-y:auto;border-radius:24px 24px 0 0;padding:1.3rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom));}
      @media(min-width:760px){.sheet{border-radius:24px;}}
      .sheet h3{margin:0 0 .2rem;font-size:1.3rem;font-weight:800;letter-spacing:-.015em;}
      .grab{width:2.6rem;height:.3rem;border-radius:99px;background:var(--line);margin:0 auto .9rem;}
      @media(min-width:760px){.grab{display:none;}}

      /* ---------- Detail bits ---------- */
      .detail-photo{width:100%;height:15rem;object-fit:cover;border-radius:20px;border:1px solid var(--line);}
      .kv{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line);}
      .kv:last-child{border-bottom:none;}
      .kv b{text-align:right;font-weight:700;}
      .task{display:flex;gap:.8rem;align-items:flex-start;padding:.85rem 0;border-bottom:1px solid var(--line);}
      .task:last-child{border-bottom:none;}
      .task-check{width:1.5rem;height:1.5rem;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent;margin-top:.1rem;background:var(--surface);}
      .task-check.done{background:var(--ok);border-color:var(--ok);color:#fff;}
      .steps{margin:.4rem 0 0;padding-left:1.25rem;}
      .steps li{margin-bottom:.35rem;}
      .swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;}
      .swatch{border:2px solid var(--line);border-radius:16px;padding:.8rem .7rem;display:flex;flex-direction:column;gap:.5rem;align-items:flex-start;font-weight:700;font-size:.92rem;background:var(--surface);text-align:left;}
      .swatch.on{border-color:var(--accent);}
      .swatch .dot{width:1.7rem;height:1.7rem;border-radius:50%;}
      .empty{border:1.5px dashed var(--line);border-radius:var(--radius-card);padding:1.6rem 1.2rem;text-align:center;color:var(--ink2);background:var(--surface2);}
      /* ---------- What's new: changelog grouped by month, collapsible ----------
         Every entry starts collapsed showing only its main title (plus the
         "New!" label and date), so the page stays short and the feedback
         button stays easy to find no matter how many entries pile up.
         Month groups work the same way — the newest month starts open,
         older months start collapsed. Native <details>/<summary>, so no
         extra state to keep. Entry titles and the "New!" label use
         --accent2, the theme's own darker accent, so they recolor with
         whichever theme is active. */
      .wn-month{margin-top:1.25rem;}
      .wn-month>summary,.wn-entry>summary{list-style:none;cursor:pointer;}
      .wn-month>summary::-webkit-details-marker,.wn-entry>summary::-webkit-details-marker{display:none;}
      .wn-month>summary::marker,.wn-entry>summary::marker{content:"";}
      .wn-month-head{display:flex;align-items:center;gap:.6rem;padding:.15rem 0;}
      .wn-month-title{font-family:var(--font-heading);font-size:1.13rem;font-weight:800;letter-spacing:-.01em;color:var(--ink);}
      .wn-month-head::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px;order:1;}
      .wn-month-title{order:0;}
      .wn-month-count{order:2;flex:none;display:inline-flex;align-items:center;padding:.14rem .55rem;border-radius:var(--radius-chip);background:var(--surface2);color:var(--ink2);font-size:.74rem;font-weight:700;}
      .wn-month-head .wn-chev{order:3;}
      .wn-chev{color:var(--ink3);flex:none;width:1.15rem;height:1.15rem;transition:transform .18s ease;}
      .wn-month[open ]>summary .wn-chev,.wn-entry[open ]>summary .wn-chev{transform:rotate(90deg);}
      .wn-entries{display:flex;flex-direction:column;gap:.6rem;margin-top:.7rem;}
      .wn-entry{padding:0;}
      .wn-entry-head{display:flex;align-items:center;gap:.7rem;padding:.75rem .95rem;}
      .wn-entry-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:.18rem;}
      .wn-entry-meta{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap;}
      .wn-tag-new{font-style:italic;text-decoration:underline;text-underline-offset:3px;color:var(--accent2);font-weight:800;font-size:.84rem;white-space:nowrap;}
      .wn-date{font-size:.8rem;font-weight:700;color:var(--ink2);white-space:nowrap;}
      .wn-entry-title{font-family:var(--font-heading);font-weight:800;font-size:1rem;letter-spacing:-.01em;line-height:1.25;color:var(--accent2);}
      .wn-entry-body{padding:0 .95rem .9rem;border-top:1px solid var(--line);}
      .wn-entry-body .steps{margin-top:.6rem;}
      .wn-feedback-top{margin-top:.95rem;}
      @media(prefers-reduced-motion:reduce){.wn-chev{transition:none;}}

      /* ---------- Needs-attention rows, calendar & snooze ---------- */
      .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:.8rem;}
      .sec-head .sec-title{margin:0;}
      .attn-main{display:flex;gap:.8rem;align-items:flex-start;flex:1;min-width:0;text-align:left;color:inherit;}
      .attn-side{display:flex;flex-direction:column;align-items:flex-end;gap:.45rem;flex:none;}
      .cal-nav{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-top:.9rem;}
      .cal-print-title{display:none;}
      .cal-week{display:flex;flex-direction:column;gap:.6rem;}
      .cal-day{border:1px solid var(--line);border-radius:12px;padding:.6rem .7rem .7rem;background:var(--surface);}
      .cal-day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);}
      .cal-day-head{font-weight:800;font-size:.92rem;}
      .cal-ev{display:flex;gap:.55rem;align-items:flex-start;width:100%;text-align:left;padding:.55rem .65rem;border-radius:10px;border:1px solid var(--line);border-left:5px solid var(--ok);background:var(--surface);margin-top:.45rem;color:inherit;}
      .cal-ev.warn{border-left-color:var(--warn);}
      .cal-ev.bad{border-left-color:var(--bad);}
      .cal-ev .ic{margin-top:.1rem;color:var(--accent2);}
      .cal-ev.snoozed{border-style:dashed;}
      .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem;}
      .cal-dow{text-align:center;font-size:.72rem;font-weight:700;color:var(--ink2);padding:.2rem 0;}
      .cal-cell{min-height:4.4rem;border:1px solid var(--line);border-radius:10px;padding:.28rem;background:var(--surface);min-width:0;}
      .cal-cell.out{opacity:.42;}
      .cal-cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent);}
      .cal-cell .dnum{font-size:.78rem;font-weight:700;}
      .cal-chip{display:block;width:100%;text-align:left;font-size:.63rem;line-height:1.3;padding:.15rem .3rem;border-radius:6px;margin-top:.22rem;background:var(--surface2);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--ok);}
      .cal-chip.warn{border-left-color:var(--warn);}
      .cal-chip.bad{border-left-color:var(--bad);background:var(--bad-soft);}
      .cal-chip.snoozed{border-left-style:dashed;opacity:.8;}
      .cal-more{font-size:.62rem;color:var(--ink2);margin-top:.2rem;font-weight:700;}
      .cal-year-grid{display:grid;grid-template-columns:1fr;gap:.8rem;}
      @media(min-width:720px){.cal-year-grid{grid-template-columns:1fr 1fr;}}
      .cal-month-block{border:1px solid var(--line);border-radius:12px;padding:.7rem .8rem;background:var(--surface);}
      .cal-month-block h3{margin:0 0 .35rem;font-size:1rem;}
      .cal-yr-ev{display:flex;gap:.55rem;align-items:center;width:100%;text-align:left;padding:.3rem 0;color:inherit;font-size:.92rem;}
      .cal-datechip{flex:none;min-width:1.75rem;text-align:center;font-weight:800;font-size:.8rem;padding:.18rem .3rem;border-radius:8px;background:var(--surface2);border:1px solid var(--line);}
      .cal-datechip.warn{background:var(--warn-soft);}
      .cal-datechip.bad{background:var(--bad-soft);}
      @media print{
        .cal-print-title{display:block;font-size:1.25rem;margin:0 0 .8rem;}
        .cal-cell,.cal-day,.cal-month-block{break-inside:avoid;box-shadow:none;}
        .cal-chip,.cal-datechip,.cal-ev{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
      }
      .empty b{color:var(--ink);display:block;font-size:1.02rem;margin-bottom:.25rem;}
      .toast{position:fixed;left:50%;bottom:6.4rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:12px;font-weight:600;font-size:.92rem;z-index:80;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);max-width:92vw;text-align:center;}
      /* Mark-done snackbar with an Undo button (misclick protection).
         Sits above the celebration overlay so Undo stays tappable. */
      .toast.undo-toast{display:flex;align-items:center;gap:.9rem;text-align:left;z-index:130;}
      .toast-undo{flex:none;background:transparent;border:0;color:inherit;font:inherit;font-weight:800;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:.15rem .1rem;}
      /* Household invite message — shown right after a member is added
         (and re-openable from the Invite button in People). The message
         box keeps the welcome wording and the link together so Copy /
         Share send exactly what is shown. */
      .invite-box{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:.95rem 1rem;}
      .invite-msg{margin:0;white-space:pre-wrap;word-break:break-word;line-height:1.5;}
      .invite-link{color:var(--accent2);font-weight:700;word-break:break-all;}
      /* Task-complete celebration: a plushie from the collection
         jumps, blows a party blower, confetti falls, "Done!" pops
         in a bubbly font. Brief and tap-to-dismiss; ~2.3s. */
      .party{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;transition:opacity .3s ease;}
      .party.out{opacity:0;}
      .party-confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
      .confetto{position:absolute;top:-4vh;border-radius:2px;opacity:.95;animation-name:confettiFall;animation-timing-function:linear;animation-fill-mode:forwards;}
      @keyframes confettiFall{to{transform:translate(var(--drift,0px),108vh) rotate(var(--spin,540deg));}}
      .party-center{display:flex;flex-direction:column;align-items:center;gap:.15rem;animation:partyPop .3s ease-out;}
      @keyframes partyPop{from{transform:scale(.55);opacity:0;}to{transform:scale(1);opacity:1;}}
      .party-chick,.party-plushie{animation:partyJump .42s ease-in-out infinite alternate;transform-origin:50% 100%;}
      @keyframes partyJump{from{transform:translateY(0) scale(1.05,.93);}to{transform:translateY(-15px) scale(.97,1.05);}}
      .party-blower{transform-box:fill-box;transform-origin:0% 50%;animation:partyBlow .55s ease-out both;}
      @keyframes partyBlow{0%{transform:scaleX(.1) rotate(-5deg);}55%{transform:scaleX(1.07) rotate(2deg);}78%{transform:scaleX(.95) rotate(0deg);}100%{transform:scaleX(1);}}
      .party-done{font-family:"Fredoka","Manrope",sans-serif;font-size:2.7rem;font-weight:700;line-height:1.05;color:var(--accent);transform:rotate(-3deg);text-shadow:0 2px 0 var(--surface),0 5px 16px rgba(0,0,0,.22);}
      @media (prefers-reduced-motion: reduce){.party-chick,.party-plushie,.party-blower,.party-center{animation:none;}}
      .divider{height:1px;background:var(--line);margin:1.1rem 0;}
      .searchbar{display:flex;align-items:center;gap:.55rem;background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:.55rem .8rem;}
      .searchbar input{flex:1;border:none;background:none;outline:none;font-size:1rem;min-width:0;}
      .searchbar .ic{color:var(--ink3);}
      .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;}
      .stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.85rem .8rem;box-shadow:var(--shadow-card);}
      .stat b{display:block;font-size:1.25rem;font-weight:800;letter-spacing:-.02em;}
      .stat span{font-size:.78rem;color:var(--ink2);font-weight:600;}

      /* ---------- Onboarding ---------- */
      .onboard{max-width:640px;margin:0 auto;padding:2.2rem 1.2rem 3rem;width:100%;}
      .brandmark{width:4rem;height:4rem;border-radius:1.2rem;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900;font-size:1.5rem;letter-spacing:-.03em;}
      .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
      .role{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:1rem .9rem;text-align:left;font-weight:700;display:flex;flex-direction:column;gap:.25rem;}
      .role span{font-weight:500;font-size:.84rem;color:var(--ink2);}
      .role.on{border-color:var(--accent);background:var(--accent-soft);}

      /* ---------- Report / print ---------- */
      .report-sheet{background:#fff;color:#1a1a1a;border-radius:10px;padding:1.6rem;box-shadow:var(--shadow-card);}
      .report-sheet h1{font-size:1.5em;margin:0 0 .1em;letter-spacing:-.01em;}
      .report-sheet h2{font-size:1.12em;margin:1.3em 0 .45em;padding-bottom:.25em;border-bottom:2px solid #1a1a1a;}
      .report-sheet h3{font-size:1em;margin:.9em 0 .3em;}
      .report-sheet table{width:100%;border-collapse:collapse;font-size:.92em;}
      .report-sheet th{text-align:left;border-bottom:1.5px solid #999;padding:.3em .4em;font-weight:700;}
      .report-sheet td{border-bottom:1px solid #ddd;padding:.3em .4em;vertical-align:top;}
      .report-sheet .rmeta{color:#555;font-size:.9em;}
      @media print{
        body{background:#fff;}
        .no-print{display:none !important;}
        .frame{box-shadow:none;max-width:none;background:#fff;}
        .content{padding:0;}
        .report-sheet{box-shadow:none;border-radius:0;padding:0;}
      }

      /* ---------- Saved-data banner ---------- */
      .dbbanner{border:1.5px solid var(--warn);background:var(--warn-soft);border-radius:16px;padding:1rem 1.1rem;margin-bottom:1rem;}
      .dbbanner .card-title{margin-bottom:.25rem;}
      .dbbanner p{margin:0;}
      .dbbanner .btn{margin-top:.7rem;}
      .sqlbox{max-height:24rem;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:.8rem;font-size:.72rem;line-height:1.5;white-space:pre-wrap;word-break:break-word;margin-top:.8rem;}

      /* ---------- Organic theme: the paper worktable ----------
         Only while the Organic theme is selected — every other theme keeps
         the shared treatment above. Faint paper grain over the sand ground,
         serif headings at medium weight with compact leading, looser
         reading leading, and irregular hand-cut corners on cards, controls
         and photos (pills, chips and round controls stay round). Photos
         take a mild sepia cast, interaction timing is the design system's
         240ms, and focus shows as a moss outline outside the control edge. */
      :root[data-theme="organic"] .frame{
        background-image:radial-gradient(rgb(var(--grain-rgb,41 37 29)/.05) 1px,transparent 1.4px),radial-gradient(color-mix(in srgb,var(--field,#694737) 16%,transparent) 1px,transparent 1.4px);
        background-size:22px 22px,34px 34px;background-position:0 0,11px 17px;
      }
      :root[data-theme="organic"] h1.page-title,:root[data-theme="organic"] h2.sec-title,:root[data-theme="organic"] .card-title,:root[data-theme="organic"] .sheet h3,:root[data-theme="organic"] .hero h2{font-weight:600;letter-spacing:-.02em;line-height:1.15;}
      :root[data-theme="organic"] p{line-height:1.7;}
      :root[data-theme="organic"] .card,:root[data-theme="organic"] .row-card,:root[data-theme="organic"] .tile,:root[data-theme="organic"] .stat,:root[data-theme="organic"] .hero,:root[data-theme="organic"] .empty,:root[data-theme="organic"] .swatch,:root[data-theme="organic"] .role{border-radius:27px 19px 29px 16px/22px 26px 19px 29px;}
      :root[data-theme="organic"] .attn{border-radius:23px 17px 25px 15px/19px 23px 17px 25px;}
      :root[data-theme="organic"] .sheet{border-radius:27px 19px 0 0/22px 26px 0 0;}
      @media(min-width:760px){:root[data-theme="organic"] .sheet{border-radius:27px 19px 29px 16px/22px 26px 19px 29px;}}
      :root[data-theme="organic"] .btn,:root[data-theme="organic"] .iconbtn,:root[data-theme="organic"] .photo-btn,:root[data-theme="organic"] .seg button{border-radius:24px 17px 26px 15px/20px 24px 17px 26px;}
      :root[data-theme="organic"] .field input,:root[data-theme="organic"] .field select,:root[data-theme="organic"] .field textarea,:root[data-theme="organic"] .searchbar{border-radius:18px 13px 20px 12px/15px 18px 13px 20px;}
      :root[data-theme="organic"] .thumb,:root[data-theme="organic"] .detail-photo,:root[data-theme="organic"] .photo-preview{border-radius:21px 15px 23px 13px/17px 21px 15px 23px;}
      :root[data-theme="organic"] img{filter:sepia(.18) saturate(.85);}
      :root[data-theme="organic"] .thumb-ph,:root[data-theme="organic"] .place-emoji{border-radius:19px 14px 21px 13px/16px 19px 14px 21px;}
      :root[data-theme="organic"] .hero .deco{background:color-mix(in srgb,var(--art-accent) 38%,transparent);}
      :root[data-theme="organic"] .hero .deco2{background:color-mix(in srgb,var(--highlight) 30%,transparent);}
      :root[data-theme="organic"] .hero .label{color:var(--highlight);opacity:1;}
      :root[data-theme="organic"] button,:root[data-theme="organic"] a,:root[data-theme="organic"] input,:root[data-theme="organic"] select,:root[data-theme="organic"] textarea{transition-duration:240ms;}
      :root[data-theme="organic"] :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
      @media(prefers-reduced-motion:reduce){
        :root[data-theme="organic"] button,:root[data-theme="organic"] a,:root[data-theme="organic"] input,:root[data-theme="organic"] select,:root[data-theme="organic"] textarea{transition:none;}
        :root[data-theme="organic"] button:active{transform:none;}
      }
      @media print{ :root[data-theme="organic"] img{filter:none;} }

      /* ---------- Botanical theme: the garden room ----------
         Only while the Botanical theme is selected. Faint two-layer paper
         grain over the cream ground, soft shallow shadows, Garamond
         headings at regular weight with tight tracking, relaxed reading
         leading, italic text in the terracotta clay accent, broad rounded
         corners (34px panels, 27px buttons, 20px inputs), arched photo
         crops in natural color, 0.35s ease timing with a slight hover lift
         on buttons and a slight hover enlarge on images, and a visible
         forest focus outline. */
      :root[data-theme="botanical"] .frame{
        background-image:radial-gradient(rgb(var(--grain-rgb,30 56 44)/.045) 1px,transparent 1.4px),radial-gradient(color-mix(in srgb,var(--ornament-line,#B5BAA4) 22%,transparent) 1px,transparent 1.4px);
        background-size:24px 24px,38px 38px;background-position:0 0,13px 19px;
      }
      :root[data-theme="botanical"] h1.page-title,:root[data-theme="botanical"] h2.sec-title,:root[data-theme="botanical"] .card-title,:root[data-theme="botanical"] .sheet h3,:root[data-theme="botanical"] .place-name,:root[data-theme="botanical"] .hero h2{font-weight:400;letter-spacing:-.02em;line-height:1.12;}
      :root[data-theme="botanical"] p{line-height:1.65;}
      :root[data-theme="botanical"] em{color:var(--clay);}
      :root[data-theme="botanical"] .card,:root[data-theme="botanical"] .row-card,:root[data-theme="botanical"] .tile,:root[data-theme="botanical"] .hero,:root[data-theme="botanical"] .empty,:root[data-theme="botanical"] .swatch,:root[data-theme="botanical"] .role,:root[data-theme="botanical"] .dbbanner{border-radius:34px;}
      :root[data-theme="botanical"] .stat{border-radius:27px;}
      :root[data-theme="botanical"] .attn{border-radius:27px;}
      :root[data-theme="botanical"] .sheet{border-radius:34px 34px 0 0;}
      @media(min-width:760px){:root[data-theme="botanical"] .sheet{border-radius:34px;}}
      :root[data-theme="botanical"] .btn,:root[data-theme="botanical"] .iconbtn,:root[data-theme="botanical"] .photo-btn{border-radius:27px;}
      :root[data-theme="botanical"] .seg{border-radius:27px;}
      :root[data-theme="botanical"] .seg button{border-radius:22px;}
      :root[data-theme="botanical"] .field input,:root[data-theme="botanical"] .field select,:root[data-theme="botanical"] .field textarea,:root[data-theme="botanical"] .searchbar{border-radius:20px;}
      :root[data-theme="botanical"] .thumb{border-radius:2.05rem 2.05rem .8rem .8rem;}
      :root[data-theme="botanical"] .detail-photo{border-radius:10rem 10rem 20px 20px;}
      :root[data-theme="botanical"] .photo-preview{border-radius:6rem 6rem 20px 20px;}
      :root[data-theme="botanical"] .thumb-ph,:root[data-theme="botanical"] .place-emoji{border-radius:50% 50% 14px 14px;}
      :root[data-theme="botanical"] img{transition:transform .35s ease;}
      :root[data-theme="botanical"] button,:root[data-theme="botanical"] a,:root[data-theme="botanical"] input,:root[data-theme="botanical"] select,:root[data-theme="botanical"] textarea{transition-duration:.35s;transition-timing-function:ease;}
      :root[data-theme="botanical"] :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
      @media(hover:hover) and (pointer:fine){
        :root[data-theme="botanical"] .btn:hover{transform:translateY(-1px);}
        :root[data-theme="botanical"] .card:hover,:root[data-theme="botanical"] .row-card:hover,:root[data-theme="botanical"] .tile:hover{box-shadow:0 1px 0 rgb(30 56 44/.05),0 16px 28px -18px rgb(30 56 44/.34);}
        :root[data-theme="botanical"] img:hover{transform:scale(1.02);}
      }
      @media(prefers-reduced-motion:reduce){
        :root[data-theme="botanical"] button,:root[data-theme="botanical"] a,:root[data-theme="botanical"] input,:root[data-theme="botanical"] select,:root[data-theme="botanical"] textarea,:root[data-theme="botanical"] img{transition:none;}
        :root[data-theme="botanical"] button:active,:root[data-theme="botanical"] .btn:hover,:root[data-theme="botanical"] img:hover{transform:none;}
      }

      /* ---------- Luxury theme: the architectural page ----------
         Only while the Luxury theme is selected. Garamond headings at
         regular weight with tight tracking and oldstyle figures, reading
         text at 1.55 leading, square corners on cards, buttons, inputs
         and photos (pills stay round), a fine gold rule down the left
         edge of the reading column as the page spine, italic text and
         the focus outline in the gold tones, buttons with tracked
         uppercase labels that press straight down 1px, and 150ms
         interaction timing. No shadows, no gradients. */
      :root[data-theme="luxury"] .content{position:relative;line-height:1.55;}
      :root[data-theme="luxury"] .content::before{content:"";position:absolute;left:.5rem;top:0;bottom:0;width:1px;background:var(--gold);opacity:.75;pointer-events:none;}
      @media(min-width:760px){:root[data-theme="luxury"] .content::before{left:1.1rem;}}
      :root[data-theme="luxury"] h1.page-title,:root[data-theme="luxury"] h2.sec-title,:root[data-theme="luxury"] .card-title,:root[data-theme="luxury"] .sheet h3,:root[data-theme="luxury"] .place-name,:root[data-theme="luxury"] .hero h2,:root[data-theme="luxury"] .stat b{font-weight:400;letter-spacing:-.015em;line-height:1.1;font-variant-numeric:oldstyle-nums proportional-nums;}
      :root[data-theme="luxury"] p{line-height:1.55;}
      :root[data-theme="luxury"] em{color:var(--gold-text);}
      :root[data-theme="luxury"] .card,:root[data-theme="luxury"] .row-card,:root[data-theme="luxury"] .tile,:root[data-theme="luxury"] .stat,:root[data-theme="luxury"] .hero,:root[data-theme="luxury"] .empty,:root[data-theme="luxury"] .swatch,:root[data-theme="luxury"] .role,:root[data-theme="luxury"] .attn,:root[data-theme="luxury"] .dbbanner,:root[data-theme="luxury"] .btn,:root[data-theme="luxury"] .iconbtn,:root[data-theme="luxury"] .photo-btn,:root[data-theme="luxury"] .seg,:root[data-theme="luxury"] .seg button,:root[data-theme="luxury"] .field input,:root[data-theme="luxury"] .field select,:root[data-theme="luxury"] .field textarea,:root[data-theme="luxury"] .searchbar,:root[data-theme="luxury"] .thumb,:root[data-theme="luxury"] .thumb-ph,:root[data-theme="luxury"] .detail-photo,:root[data-theme="luxury"] .photo-preview,:root[data-theme="luxury"] .place-emoji,:root[data-theme="luxury"] .navbtn{border-radius:0;}
      :root[data-theme="luxury"] .sheet{border-radius:0;}
      @media(min-width:760px){:root[data-theme="luxury"] .sheet{border-radius:0;}}
      :root[data-theme="luxury"] .pill,:root[data-theme="luxury"] .chip,:root[data-theme="luxury"] .pick,:root[data-theme="luxury"] .task-check,:root[data-theme="luxury"] .addbtn{border-radius:999px;}
      :root[data-theme="luxury"] .btn{text-transform:uppercase;letter-spacing:.16em;font-size:.8rem;min-height:3rem;padding:.72rem 1.3rem;}
      :root[data-theme="luxury"] .btn.sm{text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;min-height:2.4rem;border-radius:0;}
      :root[data-theme="luxury"] .btn:active,:root[data-theme="luxury"] .iconbtn:active{transform:translateY(1px);}
      :root[data-theme="luxury"] button,:root[data-theme="luxury"] a,:root[data-theme="luxury"] input,:root[data-theme="luxury"] select,:root[data-theme="luxury"] textarea{transition-duration:150ms;}
      :root[data-theme="luxury"] :focus-visible{outline:2px solid var(--gold-focus);outline-offset:2px;}
      :root[data-theme="luxury"] input:focus,:root[data-theme="luxury"] select:focus,:root[data-theme="luxury"] textarea:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent);}
      @media(hover:hover) and (pointer:fine){
        :root[data-theme="luxury"] .card:hover,:root[data-theme="luxury"] .row-card:hover,:root[data-theme="luxury"] .tile:hover{box-shadow:none;border-color:var(--panel-line);}
      }
      @media(prefers-reduced-motion:reduce){
        :root[data-theme="luxury"] button,:root[data-theme="luxury"] a,:root[data-theme="luxury"] input,:root[data-theme="luxury"] select,:root[data-theme="luxury"] textarea{transition:none;}

function itemTypeOptionsHtml(){
  /* Display names are translated; the option VALUE stays the English
     type key, so whatever language the picker is showing, the saved
     type still matches ITEM_KB. */
  return ITEM_GROUPS.map(g=>'<optgroup label="'+esc(tg(g.label))+'">'+g.items.map(ty=>'<option value="'+esc(ty)+'">'+esc(tt(ty))+'</option>').join("")+'</optgroup>').join("")+
    '<option value="Other">'+esc(t("otherNotListed"))+'</option>';
}

/* One rule shape for every vehicle: US vehicles use their state rule,
   others their country rule. inspLabel/inspShort are null for the US,
   where the views use the translated smog strings instead. */
function vehRule(v){

}
function vehRegionLabel(v){ const r=vehRule(v); return r.country==="US" ? (v.state||"") : r.name; }
/* Vehicles persist their registration region in the items table's
   registration_state column: a US state code as before, or "INT:<cc>"
   for a vehicle registered in another country. */
function parseRegState(s){ s=String(s||""); if(s.indexOf("INT:")===0){ const c=s.slice(4); if(COUNTRIES.some(x=>x.id===c)) return {state:"",country:c}; } if(!s) return {state:"NV",country:"US"}; return {state:s,country:"US"}; }

function addMonths(ds,m){ const d=new Date(ds+"T12:00:00"); d.setMonth(d.getMonth()+m); return d.toISOString().slice(0,10); }
function addDays(ds,n){ const d=new Date(ds+"T12:00:00"); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function snoozeOf(key, due){ const snz=(typeof S!=="undefined" && S.settings && S.settings.snoozes) || {}; const s=snz[key]; if(!s || s.due!==due) return null; return daysUntil(s.until)>0 ? s : null; }

/* Mark-done snackbar with Undo (misclick protection): after a task is

let undoToastTimer=null;
function undoToast(msg, undoFn){
  const root=$("#toastRoot"); if(!root) return;

<script>
/* =====================================================================
   Data layer — Supabase (Data / PostgREST API, talked to directly)
   ---------------------------------------------------------------------
   Every record saves to the One Place Supabase project with the
   publishable key (public by design). Each browser/device generates one
   owner id, keeps it in localStorage, and sends it as the x-owner-id
   header; the database's row-level security only lets a browser touch
   rows with its own owner id, so testers never see each other's homes.
   Saves replace this browser's rows table by table in dependency order,
   remapping ids as rows are inserted so links (rooms → items, items →
   history/parts, plans → lines, pets → records) stay intact — the same
   carry-over the main app runs. Any failure raises, and the caller
   shows the friendly "can't reach your saved data" banner plus a
   plain-language message — a save never pretends to succeed.
   ===================================================================== */
const SUPABASE_URL = "https://ykqnjpgbdwrenilwxkio.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_1TrviuurElOjjrQRY56oUg_yzgNwHiR";
const FRIENDLY_DB_ERROR = "Your saved data can't be reached right now — the database isn't answering, or the one-time setup hasn't been run yet. Look under My places → Saved data — Supabase for the setup steps, then try again.";
const OWNER_STORAGE_KEY = "one-place-owner-id";
const SNAP_KEY = "one-place-local-data";
function getOwnerId(){
  try{
    const existing = window.localStorage.getItem(OWNER_STORAGE_KEY);
    if(existing) return existing;
    const fresh = (window.crypto && typeof crypto.randomUUID==="function") ? crypto.randomUUID() : "owner-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,12);
    window.localStorage.setItem(OWNER_STORAGE_KEY, fresh);
    return fresh;
  }catch(e){ return "owner-unavailable"; }
}
const OWNER = getOwnerId();
const DB = { status:"checking", migrated:false };
/* The one-time setup SQL (same file the main app serves under My places →
   Saved data — Supabase): creates all 12 tables, owner-scoped RLS, grants. */
const SUPABASE_SQL = "-- =====================================================================\n-- One Place \u2014 Supabase database setup\n-- =====================================================================\n-- HOW TO USE: In your Supabase project, open  SQL Editor \u2192 New query,\n-- paste this whole file, and click Run. It is safe to run more than\n-- once \u2014 every statement is \"if not exists\" / \"drop if exists\" style.\n--\n-- WHAT IT DOES\n-- \u2022 Creates all 12 One Place tables (places, rooms, items, history,\n--   quotes, parts, people, phone plans & lines, pets & their records,\n--   and settings).\n-- \u2022 Every row carries an `owner_id`. The app generates one owner id\n--   per browser/device and keeps it in that browser's local storage,\n--   so different testers never see each other's homes.\n-- \u2022 Row Level Security is switched ON for every table, with one policy\n--   per table: the anon (publishable-key) role may only read or write\n--   rows whose owner_id matches the `x-owner-id` header the app sends\n--   with every request. A request with no owner id sees nothing.\n-- \u2022 One exception, in the settings table: feedback sent from the\n--   app (with an optional photo) is saved under the shared owner id\n--   'feedback-inbox'. A second policy makes that inbox insert-only\n--   for the anon role \u2014 testers can add feedback, but nobody can\n--   read it back with the publishable key; only the project owner\n--   can view it, in the dashboard's Table Editor.\n-- \u2022 Because \"Automatically expose new tables\" is OFF on this project,\n--   the GRANT statements at the bottom give the anon role access to\n--   these tables (the RLS policies above still apply on top).\n--\n-- Photos are not stored here \u2014 the app keeps photo files in its own\n-- storage and only saves the photo's key on the item/pet row.\n-- =====================================================================\n\n-- ---------- Places (homes & businesses) ----------\ncreate table if not exists public.profiles (\n  id bigint generated by default as identity primary key,\n  owner_id text not null,\n  key text not null,\n  kind text not null default 'home',\n  name text not null default '',\n  account_type text not null default '',\n  city text not null default '',\n  zip text not null default '',\n  emoji text not null default '\ud83c\udfe0',\n  created_at timestamptz not null default now(),\n  unique (owner_id, key)\n);\n\n-- ---------- Rooms / areas ----------\ncreate table if not exists public.rooms (\n  id bigint generated by default as identity primary key,\n  owner_id text not null,\n  name text not null,\n  icon text not null default '\ud83c\udfe0',\n  profile_key text not null default 'home',\n  created_at timestamptz not null default now()\n);\n\n-- ---------- Items & vehicles (a vehicle is an item with item_kind = 'vehicle') ----------\ncreate table if not exists public.items (\n  id bigint generated by default as identity primary key,\n  owner_id text not null,\n  name text not null,\n  category text not null default 'General',\n  make text not null default '',\n  model text not null default '',\n  year_text text not null default '',\n  serial_text text not null default '',\n  description text not null default '',\n  profile_key text not null default 'home',\n  item_kind text not null default 'item',\n  vehicle_id bigint,\n  room_id bigint,\n  photo_blob_key text,\n  photo_mime text,\n  interval_days integer not null default 365,\n  last_serviced_date text,\n  next_due_date text,\n  difficulty text not null default 'Moderate',\n  diy_steps text not null default '[]',\n  tools_needed text not null default '[]',\n  safety_notes text not null default '',\n  estimated_cost text not null default '',\n  pro_recommended integer not null default 0,\n  project_plan text not null default '',\n  registration_state text not null default '',\n  registration_due_date text,\n  smog_due_date text,\n  smog_not_required integer not null default 0,\n  notes text not null default '',\n  created_at timestamptz not null default now(),\n  updated_at timestamptz not null default now()\n);\n\n-- ---------- Maintenance history ----------\ncreate table if not exists public.maintenance_logs (\n  id bigint generated by default as identity primary key,\n  owner_id text not null,\n  item_id bigint not null,\n  serviced_date text not null,\n  notes text not null default '',\n  serviced_by text not null default 'Me',\n  created_at timestamptz not null default now()\n);\n\n-- ---------- Pro quote requests ----------\ncreate table if not exists public.quote_requests (\n  id bigint generated by default as identity primary key,\n  owner_id text not null,\n  profile_key text not null default 'home',\n  item_id bigint,\n  company_name text not null,\n  company_url text not null default '',\n  task_description text not null default '',\n  status text not null default 'Draft',\n  notes text not null default '',\n  created_at timestamptz not null default now(),\n  updated_at timestamptz not null default now()\n);\n\n-- ---------- Replacement parts ----------\ncreate table if not exists public.parts (\n  id bigint generated by default as identity primary key,\n  owner_id text not null,\n  item_id bigint not null,\n  name text not null,\n  part_number text not null default '',\n  source_name text not null default '',\n  source_url text not null default '',\n  source_type text not null default 'Saved',\n  notes text not null default '',\n  lifespan_days integer not null default 365,\n  last_replaced_date text,\n  next_replace_date text,\n  created_at timestamptz not null default now(),\n  updated_at timestamptz not null default now()\n);\n\n-- ---------- People who can log work ----------\ncreate table if not exists public.members (\n  id bigint generated by default as identity primary key,\n  owner_id text not null,\n  name text not null,\n  role text not null default 'Member',\n  emoji text not null default '\ud83d\ude42',\n  color text not null default '#1A3C34',\n  created_at timestamptz not null default now()\n);\n\n-- ---------- Phone plans ----------\ncreate table if not exists public.phone_plans (\n  id bigint generated by default as identity primary key,\n  owner_id text not null,\n  profile_key text not null default 'home',\n  carrier text not null default '',\n  plan_name text not null default '',\n  account_holder text not null default '',\n  notes text not null default '',\n  created_at timestamptz not null default now(),\n  updated_at timestamptz not null default now()\n);\n\n-- ---------- Phone lines (money is stored as integer cents) ----------\ncreate table if not exists public.phone_lines (\n  id bigint generated by default as identity primary key,\n  owner_id text not null,\n  plan_id bigint not null,\n  person_name text not null default '',\n  phone_number text not null default '',\n  device_name text not null default '',\n  monthly_cost_cents integer not null default 0,\n  device_balance_cents integer not null default 0,\n  payoff_date text,\n  upgrade_date text,\n  notes text not null default '',\n  created_at timestamptz not null default now(),\n  updated_at timestamptz not null default now()\n);\n\n-- ---------- Pets ----------\ncreate table if not exists public.pets (\n  id bigint generated by default as identity primary key,\n  owner_id text not null,\n  profile_key text not null default 'home',\n  name text not null,\n  species text not null default '',\n  breed text not null default '',\n  birth_date text,\n  age_text text not null default '',\n  weight_text text not null default '',\n  color_text text not null default '',\n  notes text not null default '',\n  photo_blob_key text,\n  photo_mime text,\n  emoji text not null default '\ud83d\udc3e',\n  created_at timestamptz not null default now(),\n  updated_at timestamptz not null default now()\n);\n\n-- ---------- Pet health records ----------\ncreate table if not exists public.pet_records (\n async function sbFetch(path, init){
  const ctrl = (typeof AbortController!=="undefined") ? new AbortController() : null;
  const timer = ctrl ? setTimeout(()=>ctrl.abort(), 12000) : null;
  let res;
  try{
    res = await fetch(SUPABASE_URL+"/rest/v1/"+path, Object.assign({}, init||{}, {
      signal: ctrl ? ctrl.signal : undefined,
      headers: Object.assign({ apikey: SUPABASE_PUBLISHABLE_KEY, Authorization: "Bearer "+SUPABASE_PUBLISHABLE_KEY, "x-owner-id": OWNER, "Content-Type":"application/json" }, (init&&init.headers)||{})
    }));
  }catch(e){ if(timer) clearTimeout(timer); throw new Error(FRIENDLY_DB_ERROR); }
  if(timer) clearTimeout(timer);
  if(!res.ok) throw new Error(FRIENDLY_DB_ERROR);
  const text = await res.text();
  if(!text) return null;
  try{ return JSON.parse(text); }catch(e){ return null; }
}
async function sbGet(table, orderCol){
  const path = table+"?select=*&order="+(orderCol||"id")+".asc";
  try{ const d = await sbFetch(path, {method:"GET"}); return Array.isArray(d)? d : []; }
  catch(e){ /* one retry — a dropped connection shouldn't fail the load */
    const d = await sbFetch(path, {method:"GET"}); return Array.isArray(d)? d : []; }
}
/* PostgREST refuses a DELETE with no WHERE clause, so every delete is
   filtered to this browser's owner id (RLS scopes it the same way). */
function sbDel(table){ return sbFetch(table+"?owner_id=eq."+encodeURIComponent(OWNER), {method:"DELETE", headers:{Prefer:"return=minimal"}}); }
function sbPost(table, rows){ return sbFetch(table, {method:"POST", headers:{Prefer:"return=representation"}, body:JSON.stringify(rows)}).then(d=>Array.isArray(d)?d:[]); }

/* ---------- Feedback inbox ----------
   A mailto: link cannot carry an attachment, so when a tester attaches
   a photo to feedback, the photo doesn't ride inside the email. Instead
   the whole feedback — type, message, and the photo as a data URL — is
   saved as one row in the existing settings table under a shared
   "feedback inbox" owner id, and the email that still opens tells
   Angeli the photo was saved with it. The save sends that shared id as
   its x-owner-id header, so the tester's own rows are never involved,
   and no new table is needed.
   Read-back is deliberately impossible from the app: the setup SQL
   (SUPABASE_SQL below) gives the settings table a second policy that
   makes the feedback inbox INSERT-only for the publishable key — the
   general owner policy excludes the 'feedback-inbox' owner, and the
   feedback policy grants insert and nothing else — so nobody can read
   testers' feedback or photos back out of the database with the app's
   public key; only Angeli can see the inbox, in the Supabase dashboard
   (Table Editor → settings, filtered to owner_id "feedback-inbox"),
   where each row's value holds the feedback and its photo. Until the
   updated setup SQL is re-run (it is idempotent — the same one-time
   paste as the original setup), the older single policy still applies.
   The stored entry carries no name — the feedback email itself shows
   Angeli who sent it. The save is best-effort — any failure raises,
   and the caller still opens the email and tells the tester to attach
   the photo there instead. */
const FEEDBACK_OWNER = "feedback-inbox";
async function storeFeedback(entry){
  const key = "fb_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
  const ctrl = (typeof AbortController!=="undefined") ? new AbortController() : null;
  const timer = ctrl ? setTimeout(()=>ctrl.abort(), 20000) : null;
  try{
    const res = await fetch(SUPABASE_URL+"/rest/v1/settings", {
      method:"POST", signal: ctrl ? ctrl.signal : undefined,
      headers:{ apikey: SUPABASE_PUBLISHABLE_KEY, Authorization: "Bearer "+SUPABASE_PUBLISHABLE_KEY, "x-owner-id": FEEDBACK_OWNER, "Content-Type":"application/json", Prefer:"return=minimal" },
      body: JSON.stringify([{owner_id: FEEDBACK_OWNER, key:key, value: JSON.stringify(entry)}])
    });
    if(!res.ok) throw new Error("feedback save failed");
    return key;
  } finally { if(timer) clearTimeout(timer); }
}

  petOrder.forEach(pt=>{ (pt.records||[]).forEach(r=>{ if(petDb[pt.id]) recRows.push({owner_id:OWNER, pet_id:petDb[pt.id], record_type:/vaccin/i.test(r.name||"")?"Vaccination":"Vet visit", title:r.name||"Health record", record_date:r.date||todayStr(), next_due_date:r.nextDue||null, provider_name:r.clinic||"", provider_location:r.location||"", notes:r.notes||""}); }); });
  if(recRows.length) await sbPost("pet_records", recRows);
}

/* ---------- rows → state ---------- */
function parseTasks(json, isVehicle){
  try{ const t=JSON.parse(json||"[]"); if(Array.isArray(t) && t.length) return t; }catch(e){}
  return isVehicle ? VEHICLE_TASKS.map(t=>({...t,lastDone:null})) : [];
}
/* The stored task array exactly as saved (possibly empty), or null
   when the row predates stored tasks — used for vehicles, whose
   legacy fallback would otherwise re-enroll every task for a vehicle
   whose owner deliberately picked none. */
function parseTaskArray(json){
  try{ const t=JSON.parse(json||""); return Array.isArray(t)? t : null; }catch(e){ return null; }
}
/* Suggested (not-yet-accepted) plan tasks ride the item row's notes
   column as JSON — the schedule itself stays in diy_steps. */
function parseSuggested(s){
  try{ const v=JSON.parse(s||""); if(Array.isArray(v)) return v.filter(x=>x && x.name).map(x=>{ const c=Object.assign({},x); c.lastDone=null; return c; }); }catch(e){}
  return [];
}
function parseProjectPlan(s){
  try{ const v=JSON.parse(s||""); if(v && typeof v==="object" && (v.title || (v.steps && v.steps.length))) return v; }catch(e){}
  return null;
}
async function dbLoadAll(){
  /* Sequential on purpose: eleven small reads, one at a time, is kinder
     to flaky connections than firing them all at once. */
  const profiles=await sbGet("profiles"), rooms=await sbGet("rooms"), items=await sbGet("items"),
    logs=await sbGet("maintenance_logs"), plans=await sbGet("phone_plans"), lines=await sbGet("phone_lines"),
    pets=await sbGet("pets"), records=await sbGet("pet_records"), members=await sbGet("members"),
    settingsRows=await sbGet("settings","key"), quotes=await sbGet("quote_requests");

}
function applyLoadedData(d){

  S.places = d.profiles.map(pf=>{
    const p=newPlace(pf.kind||"home", pf.account_type||"", pf.name||"");

    p.rooms = d.rooms.filter(r=>r.profile_key===pf.key).map(r=>({id:"rm"+r.id, name:r.name}));
    p.items = d.items.filter(r=>r.profile_key===pf.key && r.item_kind!=="vehicle").map(r=>({id:"it"+r.id, type:r.category||"General", name:r.name, brand:r.make||"", model:r.model||"", year:r.year_text||"", roomId:r.room_id? (roomClient[r.room_id]||null):null, photo:r.photo_blob_key||null, problem:r.description||"", tasks:parseTasks(r.diy_steps,false), suggested:parseSuggested(r.notes), project:parseProjectPlan(r.project_plan), logs:logsByItem[r.id]||[]}));
    p.vehicles = d.items.filter(r=>r.profile_key===pf.key && r.item_kind==="vehicle").map(r=>{ const rs=parseRegState(r.registration_state); return {id:"veh"+r.id, name:r.name, year:r.year_text||"", make:r.make||"", model:r.model||"", miles:r.description||"", state:rs.state, country:rs.country, photo:r.photo_blob_key||null, regNext:r.registration_due_date||null, smogNext:r.smog_due_date||null, tasks:(parseTaskArray(r.diy_steps) || parseTasks(r.diy_steps,true)), suggested:parseSuggested(r.notes), logs:logsByItem[r.id]||[]}; });
    const planRow=d.plans.find(x=>x.profile_key===pf.key);
    p.phonePlan = planRow ? {carrier:planRow.carrier||"", planName:planRow.plan_name||"", holder:planRow.account_holder||"", lines:d.lines.filter(l=>l.plan_id===planRow.id).map(l=>({person:l.person_name||"", number:l.phone_number||"", device:l.device_name||"", cost:(l.monthly_cost_cents||0)/100, balance:(l.device_balance_cents||0)/100, payoff:l.payoff_date||"", upgrade:l.upgrade_date||""}))} : null;
    p.pets = d.pets.filter(x=>x.profile_key===pf.key).map(pt=>({id:"pet"+pt.id, name:pt.name, species:pt.species||"", breed:pt.breed||"", birth:pt.birth_date||null, weight:pt.weight_text||"", photo:pt.photo_blob_key||null, records:d.records.filter(r=>r.pet_id===pt.id).map(r=>({name:r.title, date:r.record_date, nextDue:r.next_due_date||"", clinic:r.provider_name||"", location:r.provider_location||"", notes:r.notes||""}))}));
    return p;
  });
  S.quotes = d.quotes.map(q=>({placeKey:q.profile_key, company:q.company_name, job:q.task_description, status:q.status, notes:q.notes||""}));
  S.activePlaceId = (setMap.active_profile_key && S.places.some(p=>p.id===setMap.active_profile_key)) ? setMap.active_profile_key : (S.places[0]? S.places[0].id : null);
  S.onboarded = setMap.profile_completed==="1" || S.places.length>0;
}

/* ---------- save scheduling: debounced, serialized, honest on failure ---------- */
let saveTimer=null, saveChain=Promise.resolve();
function persist(){
  saveLocalSnapshot();
  if(saveTimer) return;
  saveTimer=setTimeout(()=>{ saveTimer=null; queueSave(); }, 450);
}
function queueSave(){
  saveChain = saveChain.then(async ()=>{
    if(bootPromise){ try{ await bootPromise; }catch(e){} }
    if(DB.status==="down"){
      try{ await sbProbe(); DB.status="ok"; }catch(e){ return; }
    }
    try{
      await dbSaveAll();
      if(DB.status!=="ok"){ DB.status="ok"; render(); }
    }catch(e){
      const wasOk = DB.status==="ok";
      DB.status="down"; render();
      if(wasOk) toast(FRIENDLY_DB_ERROR);
    }
  });
}

/* ---------- boot: local snapshot first (instant), then Supabase ----------
   If this browser's Supabase partition already has places, it is the
   source of truth. If it's empty and this browser holds local data, that
   data is copied up once — ids remapped as rows insert, so every link
   survives — and a marker setting records that it happened. */
const BOOT = { done:false };
let bootPromise = null;
async function boot(){
  loadLocalSnapshot();
  render();
  try{
    await sbProbe();
    const data = await dbLoadAll();
    if(data.profiles.length){
      applyLoadedData(data);
      DB.status="ok";
      saveLocalSnapshot();
    }else{
      if(S.places.length || S.onboarded) await dbSaveAll();
      DB.migrated=true;
      try{ await sbSetSetting("local_data_migrated","1"); }catch(e){}
      DB.status="ok";
    }
  }catch(e){
    DB.status="down";
  }
  BOOT.done=true;
  render();
}

function nextDueOf(task){ if(!task.lastDone) return null; return addMonths(task.lastDone, task.every); }

   same-type items in different rooms are easy to tell apart. */
function itemLabel(p, it){ const r=(p.rooms||[]).find(r=>r.id===it.roomId); return it.name + (r? " — "+tr_room(r.name) : ""); }
function attentionEvents(p){
  const ev=[];
  const L_due=t("dueWord"), L_notyet=t("notLoggedYet"), L_regin=t("registeredIn");
  p.items.forEach(it=>{ (it.tasks||[]).forEach(t=>{ const nd=nextDueOf(t); const d= nd? daysUntil(nd) : null;
    if(d!==null && d<=45) ev.push({days:d,kind:"item",icon:ITEM_KB[it.type]?ITEM_KB[it.type].icon:"box",title:itemLabel(p,it)+" — "+t.name,sub:nd?(L_due+" "+fmtDate(nd)):L_notyet,view:"itemDetail",id:it.id,key:"task|"+it.id+"|"+t.name,date:nd}); }); });
  p.vehicles.forEach(v=>{ const vr=vehRule(v); [["Registration renewal",v.regNext,"reg"],[vr.inspLabel||"Smog / emissions check",v.smogNext,"insp"]].forEach(([label,ds,kk])=>{ if(!ds) return; const d=daysUntil(ds);
    if(d<=60) ev.push({days:d,kind:"vehicle",icon:"car",title:v.name+" — "+label,sub:L_due+" "+fmtDate(ds)+" · "+L_regin+" "+vehRegionLabel(v),view:"vehicleDetail",id:v.id,key:"veh|"+v.id+"|"+kk,date:ds}); }); });
  p.pets.forEach(pt=>{ (pt.records||[]).forEach(r=>{ if(!r.nextDue) return; const d=daysUntil(r.nextDue);
    if(d<=60) ev.push({days:d,kind:"pet",icon:"paw",title:pt.name+" — "+r.name,sub:L_due+" "+fmtDate(r.nextDue)+(r.clinic?" · "+r.clinic:""),view:"petDetail",id:pt.id,key:"pet|"+pt.id+"|"+r.name+"|"+(r.date||""),date:r.nextDue}); }); });
  if(p.phonePlan){ p.phonePlan.lines.forEach(l=>{ [["Device payoff",l.payoff,"payoff"],["Upgrade eligibility",l.upgrade,"upgrade"]].forEach(([label,ds,kk])=>{ if(!ds) return; const d=daysUntil(ds);
    if(d<=45 && d>=-30) ev.push({days:d,kind:"phone",icon:"phone",title:(l.person||"Line")+" — "+label.toLowerCase(),sub:fmtDate(ds)+" · "+p.phonePlan.carrier,view:"phone",id:null,key:"phone|"+(l.person||"Line")+"|"+kk,date:ds}); }); }); }
  /* Snoozed occurrences stay out of the list until their remind date. */
  const vis = ev.filter(e=> !snoozeOf(e.key, e.date));
  vis.sort((a,b)=>a.days-b.days); return vis;
}
/* Every dated occurrence for the calendar: recurring item tasks and
   vehicle renewals project forward about a year; pet records and phone
   dates are single occurrences. A snoozed occurrence moves to its
   remind date (flagged snoozedFrom) instead of its due date. */
function calendarEvents(p){
  const out=[]; const horizon=addDays(todayStr(),370);
  const L_due=t("dueWord"), L_regin=t("registeredIn");
  function occ(key, base, stepMonths, mk){
    if(!base) return;
    const snz = snoozeOf(key, base);
    let d=base, guard=0;
    while(d && d<=horizon && guard<48){
      if(!(snz && d===base)) out.push(Object.assign(mk(d), {date:d, key:key, due:base}));
      if(!stepMonths) break;
      d=addMonths(d, stepMonths); guard++;
    }
    if(snz) out.push(Object.assign(mk(snz.until), {date:snz.until, key:key, due:base, snoozedFrom:base}));
  }
  p.items.forEach(it=>{ (it.tasks||[]).forEach(tk=>{ const nd=nextDueOf(tk); if(!nd) return;
    occ("task|"+it.id+"|"+tk.name, nd, tk.every||null, d=>({kind:"item",icon:ITEM_KB[it.type]?ITEM_KB[it.type].icon:"box",title:itemLabel(p,it)+" — "+tk.name,sub:L_due+" "+fmtDate(d),view:"itemDetail",id:it.id})); }); });
  p.vehicles.forEach(v=>{ const vr=vehRule(v);
    occ("veh|"+v.id+"|reg", v.regNext, 12, d=>({kind:"vehicle",icon:"car",title:v.name+" — Registration renewal",sub:L_due+" "+fmtDate(d)+" · "+L_regin+" "+vehRegionLabel(v),view:"vehicleDetail",id:v.id}));
    if(v.smogNext) occ("veh|"+v.id+"|insp", v.smogNext, vr.smogMonths||12, d=>({kind:"vehicle",icon:"car",title:v.name+" — "+(vr.inspLabel||"Smog / emissions check"),sub:L_due+" "+fmtDate(d)+" · "+L_regin+" "+vehRegionLabel(v),view:"vehicleDetail",id:v.id})); });
  p.pets.forEach(pt=>{ (pt.records||[]).forEach(r=>{ if(!r.nextDue) return;
    occ("pet|"+pt.id+"|"+r.name+"|"+(r.date||""), r.nextDue, null, d=>({kind:"pet",icon:"paw",title:pt.name+" — "+r.name,sub:L_due+" "+fmtDate(d)+(r.clinic?" · "+r.clinic:""),view:"petDetail",id:pt.id})); }); });
  if(p.phonePlan){ p.phonePlan.lines.forEach(l=>{ [["Device payoff",l.payoff,"payoff"],["Upgrade eligibility",l.upgrade,"upgrade"]].forEach(([label,ds,kk])=>{ if(!ds) return;
    occ("phone|"+(l.person||"Line")+"|"+kk, ds, null, d=>({kind:"phone",icon:"phone",title:(l.person||"Line")+" — "+label.toLowerCase(),sub:fmtDate(d)+" · "+p.phonePlan.carrier,view:"phone",id:null})); }); }); }
  out.sort((a,b)=> a.date<b.date? -1 : (a.date>b.date? 1 : 0));
  return out;
}

/* ---------- Calendar (week / month / year, printable) ---------- */
let calMode = "month", calAnchor = null, calPrintMode = false;
function calStatusCls(ds){ const d=daysUntil(ds); if(d===null) return "ok"; if(d<0) return "bad"; if(d<=7) return "warn"; return "ok"; }
function calDow(){ return (typeof DOW_BY_LANG!=="undefined" && DOW_BY_LANG[curLang()]) || DOW_BY_LANG.en; }
function calMonthName(m, y){ const full=(typeof MONTHS_FULL_BY_LANG!=="undefined" && MONTHS_FULL_BY_LANG[curLang()]) || MONTHS_FULL_BY_LANG.en; return full[m]+" "+y; }
function calEvBtn(e, label){
  return '<button class="cal-ev '+calStatusCls(e.date)+(e.snoozedFrom?" snoozed":"")+'" data-act="openEvent" data-view="'+e.view+'" data-id="'+(e.id||"")+'">'+ic(e.icon)+'<span style="flex:1;min-width:0"><span class="strong" style="display:block">'+esc(e.title)+'</span><span class="small muted">'+esc(e.snoozedFrom? tf("calSnoozedFrom",{date:fmtDate(e.snoozedFrom)}) : e.sub)+'</span></span>'+(daysUntil(e.date)<0?'<span class="pill bad">'+esc(t("pillOverdue"))+'</span>':'')+'</button>';
}
function skipModal(key, due, title){
  const presets=[["7","",t("skip1w")],["14","",t("skip2w")],["","1",t("skip1m")],["","3",t("skip3m")]];
  openModal(modalHead(esc(t("skipTitle")), esc(t("skipSub")))+
    '<p class="strong" style="margin:0 0 .9rem">'+esc(title)+'</p>'+
    '<div class="rows">'+presets.map(pr=>'<button class="row-card" data-act="doSkip" data-key="'+esc(key)+'" data-due="'+due+'" data-days="'+pr[0]+'" data-months="'+pr[1]+'"><div class="thumb-ph">'+ic("clock")+'</div><div class="row-main"><div class="row-name">'+esc(pr[2])+'</div></div>'+ic("chevR","chev")+'</button>').join("")+'</div>'+
    '<div class="field" style="margin-top:1rem"><label for="skipDate">'+esc(t("skipCustom"))+'</label><input id="skipDate" type="date" min="'+addDays(todayStr(),1)+'" /></div>'+
    '<button class="btn block" data-act="doSkipCustom" data-key="'+esc(key)+'" data-due="'+due+'">'+esc(t("skipSave"))+'</button>'+
    '<button class="btn ghost block" data-act="closeModal" style="margin-top:.6rem">'+esc(t("cancel"))+'</button>');
}
function applySnooze(key, due, until){
  if(!S.settings.snoozes) S.settings.snoozes={};
  S.settings.snoozes[key]={due:due, until:until};
  closeModal(); render(); toast(tf("snoozedTo",{date:fmtDate(until)}));
}
function viewCalendar(p){
  const evs = calendarEvents(p);
  const anchor = calAnchor || todayStr();
  const byDate={}; evs.forEach(e=>{ (byDate[e.date]=byDate[e.date]||[]).push(e); });
  const overdue = evs.filter(e=> daysUntil(e.date)<0);
  const ad = new Date(anchor+"T12:00:00");
  let periodLabel="", body="";
  if(calMode==="week"){
    const start = addDays(anchor, -ad.getDay());
    const end = addDays(start, 6);
    periodLabel = fmtDate(start)+" – "+fmtDate(end);
    let days="";
    for(let i=0;i<7;i++){ const ds=addDays(start,i); const dd=new Date(ds+"T12:00:00"); const list=byDate[ds]||[];
      days += '<div class="cal-day'+(ds===todayStr()?" today":"")+'"><div class="cal-day-head">'+esc(calDow()[dd.getDay()])+' · '+esc(fmtDate(ds))+'</div>'+
        (list.length? list.map(e=>calEvBtn(e)).join("") : '<p class="small muted" style="margin:.35rem 0 0">'+esc(t("calEmpty"))+'</p>')+'</div>'; }
    body = '<div class="cal-week">'+days+'</div>';
  } else if(calMode==="year"){
    const y = ad.getFullYear();
    periodLabel = String(y);
    let blocks="";
    for(let m=0;m<12;m++){ const mk = y+"-"+String(m+1).padStart(2,"0"); const list = evs.filter(e=>e.date.indexOf(mk)===0);
      blocks += '<div class="cal-month-block"><h3>'+esc(calMonthName(m,y))+'</h3>'+
        (list.length? list.map(e=>{ const dd=new Date(e.date+"T12:00:00");
          return '<button class="cal-yr-ev" data-act="openEvent" data-view="'+e.view+'" data-id="'+(e.id||"")+'"><span class="cal-datechip '+calStatusCls(e.date)+'">'+dd.getDate()+'</span><span style="flex:1;min-width:0">'+esc(e.title)+(e.snoozedFrom?' <span class="small muted">('+esc(t("calSnoozedWord"))+')</span>':"")+'</span></button>'; }).join("")
          : '<p class="small muted" style="margin:.2rem 0 0">'+esc(t("calEmpty"))+'</p>')+'</div>'; }
    body = '<div class="cal-year-grid">'+blocks+'</div>';
  } else {
    const y = ad.getFullYear(), m = ad.getMonth();
    periodLabel = calMonthName(m, y);
    const first = y+"-"+String(m+1).padStart(2,"0")+"-01";
    const start = addDays(first, -new Date(first+"T12:00:00").getDay());
    let cells = calDow().map(d=>'<div class="cal-dow">'+esc(d)+'</div>').join("");
    for(let i=0;i<42;i++){ const ds=addDays(start,i); const dd=new Date(ds+"T12:00:00"); const list=byDate[ds]||[];
      cells += '<div class="cal-cell'+(dd.getMonth()!==m?" out":"")+(ds===todayStr()?" today":"")+'"><div class="dnum">'+dd.getDate()+'</div>'+
        list.slice(0,3).map(e=>'<button class="cal-chip '+calStatusCls(e.date)+(e.snoozedFrom?" snoozed":"")+'" data-act="openEvent" data-view="'+e.view+'" data-id="'+(e.id||"")+'" title="'+esc(e.title)+'">'+esc(e.title)+'</button>').join("")+
        (list.length>3? '<div class="cal-more">+'+(list.length-3)+' '+esc(t("calMore"))+'</div>' : "")+'</div>'; }
    body = '<div class="cal-grid">'+cells+'</div>';
  }
  if(calPrintMode){
    /* Print preview: just the sheet itself, exactly as it prints — the
       reader prints it from their browser or device Print menu (the same
       pattern as the Paper copy report). */
    let ph = '<div class="btn-row no-print" style="margin-bottom:1rem"><button class="btn" data-act="printDone">'+ic("check")+' '+esc(t("doneBtn"))+'</button><span class="small muted" style="align-self:center">'+esc(t("calPrintHint"))+'</span></div>'+
      '<h1 class="page-title" style="font-size:1.35rem">'+esc(t("calTitle"))+' — '+esc(periodLabel)+'</h1>';
    if(overdue.length) ph += '<div class="sec"><h2 class="sec-title">'+esc(t("pillOverdue"))+'</h2><div style="margin-top:.6rem">'+overdue.map(e=>calEvBtn(e)).join("")+'</div></div>';
    ph += '<div class="cal-body" style="margin-top:1rem">'+body+'</div>';
    return ph;
  }
  let h = backBtn("home")+
    '<div class="sec-head no-print"><h1 class="page-title" style="margin:0">'+esc(t("calTitle"))+'</h1><button class="btn soft sm" data-act="printCal">'+ic("printer")+' '+esc(t("calPrint"))+'</button></div>'+
    '<div class="seg no-print" style="margin-top:1rem">'+[["week",t("calWeek")],["month",t("calMonth")],["year",t("calYear")]].map(x=>'<button class="'+(calMode===x[0]?"on":"")+'" data-act="calMode" data-mode="'+x[0]+'">'+esc(x[1])+'</button>').join("")+'</div>'+
    '<div class="cal-nav no-print"><button class="btn ghost sm" data-act="calNav" data-dir="-1" aria-label="Previous">'+ic("chevL")+'</button><b>'+esc(periodLabel)+'</b><span style="display:flex;gap:.4rem"><button class="btn ghost sm" data-act="calToday">'+esc(t("calToday"))+'</button><button class="btn ghost sm" data-act="calNav" data-dir="1" aria-label="Next">'+ic("chevR")+'</button></span></div>'+
    '<h2 class="cal-print-title">'+esc(t("calTitle"))+' — '+esc(periodLabel)+'</h2>';
  if(overdue.length) h += '<div class="sec"><h2 class="sec-title">'+esc(t("pillOverdue"))+'</h2><div style="margin-top:.6rem">'+overdue.map(e=>calEvBtn(e)).join("")+'</div></div>';
  h += '<div class="cal-body">'+body+'</div>';
  return h;
}

<title>One Place</title>
<style>
  :root {
    --bg: #efe4d5; --surface: #f8f1e6; --line: #dccbb4; --ink: #3a2a22; --soft: #7a6354;
    --accent: #4e2e22; --accent-ink: #fbf3e8; --ok: #1f7a4d; --bad: #b3261e; --wait: #8a6a12;
    --tint: #e9d8c3;
    --shadow: 0 1px 2px rgba(70,40,25,.08), 0 8px 22px rgba(70,40,25,.08);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 1rem/1.5 "Plus Jakarta Sans", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
  }
  .wrap { max-width: 36rem; margin: 0 auto; display: grid; gap: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 2px; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .build { font-size: .8rem; color: var(--soft); text-align: center; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); }
  h2 { margin: 0 0 4px; font-size: 1.1rem; }
  .hint { margin: 0 0 12px; color: var(--soft); font-size: .92rem; }
  .row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; margin-top: 7px; background: var(--wait); }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  .label { font-weight: 700; }
  .detail { color: var(--soft); font-size: .92rem; overflow-wrap: anywhere; }
  button, .filebtn {
    font: inherit; font-weight: 700; cursor: pointer; background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 12px; padding: 10px 16px; min-height: 44px;
    transition: transform .12s ease, opacity .12s ease; display: inline-flex; align-items: center; justify-content: center;
  }
  button:active, .filebtn:active { transform: scale(.97); }
  button:disabled { opacity: .5; cursor: default; }
  button.quiet, .filebtn.quiet { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button.small { min-height: 36px; padding: 6px 12px; font-size: .9rem; }
  .closet-stage { text-align: center; margin: 4px 0 10px; } .closet-stage img { width: min(74vw, 300px); height: auto; display: block; margin: 0 auto; }
  .closet-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 8px; }
  .closet-tile { display: block; padding: 6px 6px 10px; border-radius: 14px; background: var(--card); border: 2px solid var(--line); text-align: center; font-weight: 600; font-size: .88rem; color: var(--ink); }
  .closet-tile[aria-pressed="true"] { border-color: var(--accent); background: var(--tint); }
  .closet-tile img { width: 100%; height: auto; display: block; margin-bottom: 4px; }
  details.later { margin-top: 8px; } details.later > summary { cursor: pointer; font-weight: 700; color: var(--soft); padding: 6px 0; min-height: 36px; }
  .backtop { margin: 2px 0 10px; } .backtop button.link { text-decoration: none; font-weight: 700; font-size: 1rem; padding: 8px 18px 8px 14px; min-height: 40px; border-radius: 999px; background: var(--tint); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow); }
  button.link { background: none; color: var(--accent); padding: 4px 0; min-height: 32px; text-decoration: underline; }
  input[type="text"], input[type="email"], input[type="password"], input[type="tel"], input[type="number"], select, textarea {
    font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; min-height: 44px; width: 100%;
  }
  textarea { min-height: 80px; resize: vertical; }
  input[type="file"] { display: none; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .field { display: grid; gap: 4px; margin-bottom: 12px; }
  .field > span { font-weight: 700; font-size: .92rem; }
  .field small { color: var(--soft); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg label { flex: 1 1 8rem; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: flex; align-items: center; justify-content: center; min-height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-weight: 700; cursor: pointer; background: var(--bg); text-align: center; }
  .seg input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .seg input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .chip { min-height: 36px; padding: 4px 14px; border-radius: 999px; background: var(--tint); color: var(--ink); border: 1px solid var(--line); font-weight: 600; font-size: .92rem; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .banner { border-radius: 12px; padding: 10px 12px; background: var(--tint); margin-bottom: 12px; font-size: .95rem; }
  .banner.bad { color: var(--bad); border: 1px solid var(--bad); background: transparent; }
  .result { margin-top: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .result.bad { color: var(--bad); }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .thumb { position: relative; width: 84px; height: 84px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; display: block; }
  .thumb button { position: absolute; top: -6px; right: -6px; min-height: 28px; width: 28px; padding: 0; border-radius: 50%; font-size: 1rem; }
  details.item { border-top: 1px solid var(--line); padding: 8px 0; }
  details.item:first-of-type { border-top: 0; }
  details.item summary { cursor: pointer; font-weight: 700; min-height: 36px; display: flex; align-items: center; gap: 8px; }
  details.item .body { padding: 4px 0 8px; display: grid; gap: 8px; }
  .tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .tasks li { flex-wrap: wrap; background: var(--bg); border-radius: 10px; padding: 8px 12px; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
  .tasks .t { font-weight: 600; } .tasks .m { color: var(--soft); font-size: .88rem; }
  .tasks label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; width: 100%; }
  .tasks input[type="checkbox"] { width: 22px; height: 22px; margin-top: 2px; flex: none; accent-color: var(--accent); }
  .badge { font-size: .75rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--tint); color: var(--soft); margin-left: 6px; }
  details.entry { border-top: 1px solid var(--line); padding: 8px 0; }
  details.entry:first-of-type { border-top: 0; }
  details.entry summary { cursor: pointer; font-weight: 700; min-height: 32px; }
  details.entry p { margin: 6px 0 0; color: var(--soft); }
  input[data-testid=whats-new-search] { width: 100%; margin: 6px 0 8px; min-height: 44px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  details.wn-month { border-top: 1px solid var(--line); padding: 8px 0; }
  details.wn-month > summary { cursor: pointer; font-weight: 800; min-height: 32px; }
  details.wn-date { margin: 6px 0 0 10px; padding: 6px 0 6px 10px; border-left: 2px solid var(--line); }
  details.wn-date > summary { cursor: pointer; font-weight: 700; font-size: .92rem; min-height: 30px; }
  .wn-count { font-weight: 400; font-size: .78rem; color: var(--soft); margin-left: 8px; }
  .wn-item { margin: 8px 0 0; }
  .wn-title { font-weight: 700; font-size: .85rem; }
  .wn-item p { margin: 2px 0 0; font-size: .8rem; line-height: 1.4; color: var(--soft); }
  .new { font-style: italic; text-decoration: underline; color: var(--accent); margin-left: 6px; font-weight: 700; font-size: .85em; }
  .month { margin: 8px 0 0; font-size: .85rem; color: var(--soft); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .toast-wrap { position: fixed; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; justify-content: center; padding: 0 16px; pointer-events: none; z-index: 20; }
  .toast { pointer-events: auto; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 14px; display: flex; gap: 8px; align-items: center; box-shadow: var(--shadow); font-weight: 600; max-width: 32rem; }
  .toast button { background: none; color: inherit; text-decoration: underline; padding: 4px 6px; min-height: 36px; border-radius: 8px; }
  .attn { display: grid; gap: 8px; }
  .attn-item { background: var(--bg); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
  .attn-item .where { font-size: .82rem; color: var(--soft); font-weight: 700; }
  .due { font-size: .88rem; font-weight: 700; }
  .due.over { color: var(--bad); }
  .tasks .snooze { flex-basis: 100%; }
  .snooze { display: grid; gap: 8px; padding-top: 6px; border-top: 1px dashed var(--line); }
  .snooze .chips { margin: 0; }
  .snooze .custom { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .snooze input[type="date"] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; min-height: 40px; }
  .empty { text-align: center; padding: 8px 4px; }
  .empty h3 { margin: 0 0 4px; font-size: 1.2rem; }
  .empty p { margin: 0; color: var(--soft); }
  .cal-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: space-between; margin-bottom: 8px; }
  .cal-title { font-weight: 800; font-size: 1.15rem; }
  .cal-month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { font-size: .75rem; font-weight: 700; color: var(--soft); text-align: center; }
  .cal-cell { min-height: 48px; border: 1px solid var(--line); border-radius: 8px; padding: 3px 4px; font-size: .72rem; overflow-wrap: anywhere; background: var(--bg); }
  .cal-cell.blank { border-color: transparent; background: none; }
  .cal-cell.today { border-color: var(--accent); }
  .tour-item { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
  .tour h2 + .tour-item { border-top: 0; }
  .tour-emoji { font-size: 1.6rem; line-height: 1.2; flex: none; width: 2rem; text-align: center; }
  .tour-title { font-weight: 800; }
  .tour-desc { margin: 2px 0 0; color: var(--soft); font-size: .92rem; }
  button.cal-cell { text-align: left; color: var(--ink); font: inherit; font-size: .72rem; box-shadow: none; cursor: pointer; display: block; width: 100%; min-height: 48px; }
  .cal-cell.sel { background: var(--tint); border: 2px solid var(--accent); }
  .daylink { background: none; border: 0; box-shadow: none; padding: 2px 0; min-height: 0; color: var(--accent); font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; text-align: left; }
  .cal-day h3 .daylink { font-size: .95rem; }
  .daypanel { margin-top: 14px; border: 2px solid var(--accent); border-radius: 14px; padding: 12px; background: var(--surface); }
  .daypanel h3 { margin: 0 0 6px; }
  .daylist { list-style: none; padding: 0; display: grid; gap: 6px; }
  .daylist li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .dayadd { display: flex; gap: 8px; margin-top: 8px; } .dayadd input { flex: 1; min-width: 0; }
  .cal-cell b { display: block; font-size: .78rem; }
  .cal-dot { display: block; color: var(--accent); font-size: .6rem; letter-spacing: 1px; line-height: 1.1; }
  .cal-ev { display: block; background: var(--tint); border-radius: 4px; padding: 0 3px; margin-top: 2px; }
  .cal-list { display: grid; gap: 6px; }
  .cal-day { border-top: 1px solid var(--line); padding-top: 6px; }
  .cal-day h3 { margin: 0; font-size: .95rem; }
  .cal-day div { font-size: .92rem; }
  .cal-year { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); }
  ul.plain, ol.plain { margin: 4px 0 8px; padding-left: 20px; display: grid; gap: 2px; }
  .part, .diy { display: grid; gap: 6px; padding: 8px 0; border-top: 1px solid var(--line); }
  .part:first-of-type { border-top: 0; }
  a.chip { text-decoration: none; display: inline-flex; align-items: center; }
  .help-box { margin-top: 8px; }
  .help-box .m { color: var(--soft); font-size: .92rem; }
  .muted { color: var(--soft); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: 8px; margin-top: 8px; }
  .tile { flex-direction: column; gap: 6px; background: var(--bg); color: var(--ink); border: 2px solid var(--line); padding: 10px 8px; }
  .tile[aria-checked="true"] { border-color: var(--accent); }
  .bubbles { display: flex; gap: 4px; }
  .bubble { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(128,128,128,.35); display: block; }
  .tname { font-size: .85rem; }
  details.sub { border-top: 1px solid var(--line); padding: 8px 0; }
  details.sub summary { cursor: pointer; font-weight: 700; min-height: 36px; display: flex; align-items: center; }
  @media print {
    body { background: #fff; color: #000; padding: 0; }
    .noprint { display: none !important; }
    .card { box-shadow: none; border: 0; padding: 0; background: #fff; }
    .cal-cell, .cal-ev { background: #fff; border-color: #999; color: #000; }
    .cal-dot { display: block; color: var(--accent); font-size: .6rem; letter-spacing: 1px; line-height: 1.1; }
  .cal-ev { border: 1px solid #bbb; }
    .cal-title, h2, h3, .muted { color: #000; }
  }

  .party { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.22); cursor: pointer; overflow: hidden; }
  .pbox { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  .pdraw { width: 112px; height: 112px; filter: drop-shadow(0 6px 8px rgba(0,0,0,.3)); animation: pjump 1.1s ease-in-out infinite; }
  .pdraw svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .pdraw.waddle { animation: pwaddle .8s ease-in-out infinite; } .pdraw.sleep { animation: kbreathe 3s ease-in-out infinite; }
  .pscene { width: min(78vw, 300px); background: var(--surface); border: 3px solid var(--accent); border-radius: 22px; box-shadow: 0 6px 18px rgba(0,0,0,.35); overflow: hidden; }
  .pscene svg { display: block; width: 100%; height: auto; }
  .pdone { font: 700 .85rem/1 "Plus Jakarta Sans", ui-rounded, system-ui, sans-serif; color: var(--accent); background: var(--surface); border: 1.5px solid var(--accent); border-radius: 999px; padding: 4px 12px; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .pname { font-weight: 700; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .pp { position: absolute; top: 0; left: var(--x, 50%); font-size: var(--s, 22px); line-height: 1; animation-duration: var(--d, 2.4s); animation-delay: var(--dl, 0s); animation-fill-mode: both; animation-timing-function: ease-in; pointer-events: none; }
  .pp.fall { animation-name: pfall; } .pp.rise { top: 100%; animation-name: prise; animation-timing-function: ease-out; }
  .pp.burst { top: 42%; left: 50%; animation-name: pburst; animation-timing-function: ease-out; }
  .pp.chip { width: 10px; height: 14px; border-radius: 2px; font-size: 0; }
  @keyframes pfall { from { transform: translate(0,-12vh) rotate(0); opacity: 0; } 10% { opacity: 1; } to { transform: translate(var(--dx,0),115vh) rotate(380deg); opacity: 1; } }
  @keyframes prise { from { transform: translate(0,0) scale(.6); opacity: 0; } 15% { opacity: 1; } to { transform: translate(var(--dx,0),-115vh) scale(1.1); opacity: .9; } }
  @keyframes pburst { from { transform: translate(0,0) scale(.2); opacity: 0; } 15% { opacity: 1; } to { transform: translate(var(--dx),var(--dy)) scale(1) rotate(200deg); opacity: 0; } }
  @keyframes pjump { 0%,100% { transform: translateY(0) scale(1,1); } 25% { transform: translateY(-34px) scale(.96,1.04); } 50% { transform: translateY(0) scale(1.06,.94); } 75% { transform: translateY(-20px); } }
  @keyframes pwaddle { 0%,100% { transform: rotate(-9deg) translateX(-6px); } 50% { transform: rotate(9deg) translateX(6px); } }
  .zb { transform-origin: 44px 98px; animation: zbub 2.8s ease-in-out infinite; } .zb2 { animation-delay: 1.4s; }
  @keyframes zbub { 0% { transform: scale(.2); opacity: 0; } 45% { transform: scale(1.5); opacity: 1; } 85% { transform: translate(-6px,-10px) scale(1.8); opacity: .85; } 100% { transform: translate(-8px,-14px) scale(2); opacity: 0; } }
  .kbody { animation: kbreathe 3s ease-in-out infinite; } @keyframes kbreathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(2px); } }
  .snackico { display: inline-block; width: 34px; height: 34px; vertical-align: middle; margin-right: 8px; } .snackico svg { width: 100%; height: 100%; display: block; overflow: visible; }
  @media (prefers-reduced-motion: reduce) { .pp { display: none; } .pdraw, .pdraw.waddle, .pdraw.sleep, .zb, .kbody { animation: none; } .zb { opacity: 1; transform: scale(1.3); } }

  .punchy { position: fixed; z-index: 15; cursor: pointer; width: var(--psz, 108px); height: var(--psz, 108px); touch-action: none; user-select: none; -webkit-user-select: none; transform-origin: 100% 100%; transition: transform .5s cubic-bezier(.3,.7,.3,1); filter: drop-shadow(0 3px 3px rgba(0,0,0,.28)); }
  @media (max-width: 600px) { :root { --psz: 85px; } }
  /* Punchy is one size whether he stands, types, waves or flips (no jump in size). */
  .punchy.dressed .rig { display: none !important; } .punchy.dressed .rest { display: block !important; }
  .punchy, .punchy * { -webkit-touch-callout: none; touch-action: none; }
  html.punchy-drag, html.punchy-drag body { overscroll-behavior: none; overflow: hidden; }
  .punchy.dragging { cursor: grabbing; transition: none; }
  .punchy[hidden], .pocketpill[hidden] { display: none; }
  .pk { position: absolute; inset: 0; }
  .pk img, .pk svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; -webkit-user-drag: none; }
  .pk .armR { transform-origin: 71.9% 48.1%; } .pk .armL { transform-origin: 26.9% 48.1%; }
  .punchy:not([data-pose]) .rig, .punchy[data-pose="idle"] .rig { display: none; }
  .punchy[data-pose]:not([data-pose="idle"]) .rest { display: none; }
  .pk .gear { opacity: 0; transition: opacity .5s ease; } .punchy[data-pose="type"] .gear { opacity: 1; }
  .pk .body { animation: pbreathe 4.2s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes pbreathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.012,.99); } }
  .punchy[data-pose="wave"] .armR { animation: pwaveR 2.6s cubic-bezier(.45,0,.35,1) both; }
  .punchy[data-pose="wave"] .armL { animation: pwaveL 2.6s ease-in-out both; }
  .punchy[data-pose="wave"] .pk { animation: psway 2.6s ease-in-out both; }
  @keyframes pwaveR { 0% { transform: rotate(0); } 24% { transform: rotate(-122deg); } 36% { transform: rotate(-136deg); } 48% { transform: rotate(-118deg); } 60% { transform: rotate(-136deg); } 72% { transform: rotate(-120deg); } 82% { transform: rotate(-130deg); } 100% { transform: rotate(0); } }
  @keyframes pwaveL { 0%,100% { transform: rotate(0); } 25%,80% { transform: rotate(5deg); } }
  @keyframes psway { 0%,100% { transform: rotate(0); } 30% { transform: rotate(-2.5deg); } 60% { transform: rotate(1.5deg); } }
  .punchy[data-pose="flip"] .pk { animation: pflip 1.7s cubic-bezier(.4,.1,.3,1) both; transform-origin: 50% 56%; }
  .punchy[data-pose="flip"] .armR { animation: pflipR 1.7s ease-in-out both; } .punchy[data-pose="flip"] .armL { animation: pflipL 1.7s ease-in-out both; }
  @keyframes pflip { 0% { transform: translateY(0) scale(1,1) rotate(0); } 14% { transform: translateY(2%) scale(1.05,.93) rotate(0); } 52% { transform: translateY(-62%) scale(1,1) rotate(-200deg); } 86% { transform: translateY(-6%) scale(1,1) rotate(-350deg); } 93% { transform: translateY(1%) scale(1.05,.94) rotate(-360deg); } 100% { transform: translateY(0) scale(1,1) rotate(-360deg); } }
  @keyframes pflipR { 0%,12% { transform: rotate(0); } 40%,70% { transform: rotate(-38deg); } 100% { transform: rotate(0); } }
  @keyframes pflipL { 0%,12% { transform: rotate(0); } 40%,70% { transform: rotate(38deg); } 100% { transform: rotate(0); } }
  .punchy[data-pose="type"] .armR { animation: ptypeR .5s ease-in-out infinite alternate; transform: rotate(41deg); }
  .punchy[data-pose="type"] .armL { animation: ptypeL .5s ease-in-out .25s infinite alternate; transform: rotate(-41deg); }

wede mo pa ring i-save ang gamit nang walang plano.","您仍可在没有方案的情况下保存物品。","プランなしでもアイテムを保存できます。","계획 없이도 물건을 저장할 수 있어요.","Sie können den Gegenstand trotzdem ohne Plan speichern.","Vous pouvez quand même enregistrer l’objet sans plan.","Eşyayı yine de plansız kaydedebilirsiniz.","คุณยังบันทึกสิ่งของโดยไม่มีแผนได้","ທ່ານຍັງບັນທຶກສິ່ງຂອງໂດຍບໍ່ມີແຜນໄດ້"],"Type what the item is first.": ["Escribe primero qué es el objeto.","I-type muna kung ano ang gamit.","请先输入物品是什么。","先にアイテム名を入力してください。","먼저 물건이 무엇인지 입력하세요.","Geben Sie zuerst ein, was der Gegenstand ist.","Saisissez d’abord ce qu’est l’objet.","Önce eşyanın ne olduğunu yazın.","พิมพ์ก่อนว่าสิ่งของคืออะไร","ພິມກ່ອນວ່າສິ່ງຂອງແມ່ນຫຍັງ"],"Tell me what it is and add a photo or two. I’ll suggest a plan, and you choose what to keep.": ["Dime qué es y añade una foto o dos. Te sugeriré un plan y tú eliges qué conservar.","Sabihin mo kung ano ito at magdagdag ng isa o dalawang litrato. Magmumungkahi ako ng plano, at ikaw ang pipili ng itatago.","告诉我它是什么，再添加一两张照片。我会建议方案，由您决定保留哪些。","何なのかを教えて、写真を1～2枚追加してください。プランを提案するので、残すものを選んでください。","무엇인지 알려 주고 사진을 한두 장 추가하세요. 제가 계획을 제안하면 남길 것을 고르세요.","Sagen Sie mir, was es ist, und fügen Sie ein oder zwei Fotos hinzu. Ich schlage einen Plan vor, und Sie wählen, was bleibt.","Dites-moi ce que c’est et ajoutez une ou deux photos. Je proposerai un plan et vous choisirez ce que vous gardez.","Ne olduğunu söyleyin ve bir iki fotoğraf ekleyin. Bir plan önereyim, neyi tutacağınızı siz seçin.","บอกฉันว่าเป็นอะไรและเพิ่มรูปหนึ่งหรือสองรูป ฉันจะเสนอแผนให้ และคุณเลือกสิ่งที่จะเก็บไว้","ບອກຂ້ອຍວ່າແມ່ນຫຍັງ ແລະ ເພີ່ມຮູບນຶ່ງຫຼືສອງຮູບ. ຂ້ອຍຈະສະເໜີແຜນ ແລະ ທ່ານເລືອກສິ່ງທີ່ຈະເກັບໄວ້"],"I couldn’t read the answer. Try again, or type it in.": ["No pude leer la respuesta. Inténtalo de nuevo o escríbelo.","Hindi ko mabasa ang sagot. Subukan ulit, o i-type ito.","无法读取答案。请重试，或手动输入。","回答を読み取れませんでした。もう一度試すか、入力してください。","답변을 읽지 못했어요. 다시 시도하거나 직접 입력하세요.","Ich konnte die Antwort nicht lesen. Versuchen Sie es erneut oder geben Sie es ein.","Je n’ai pas pu lire la réponse. Réessayez ou saisissez-la.","Yanıtı okuyamadım. Tekrar deneyin veya elle yazın.","อ่านคำตอบไม่ได้ ลองอีกครั้งหรือพิมพ์เอง","ອ່ານຄຳຕອບບໍ່ໄດ້. ລອງໃໝ່ ຫຼື ພິມເອງ"],"Type what it is below.": ["Escribe abajo qué es.","I-type sa ibaba kung ano ito.","请在下方输入它是什么。","下に何なのか入力してください。","아래에 무엇인지 입력하세요.","Geben Sie unten ein, was es ist.","Saisissez ci-dessous ce que c’est.","Ne olduğunu aşağıya yazın.","พิมพ์ด้านล่างว่าเป็นอะไร","ພິມດ້ານລຸ່ມວ່າແມ່ນຫຍັງ"],"I could tell what it is, but not the make or model. A closer photo of the label can help.": ["Pude identificar qué es, pero no la marca ni el modelo. Una foto más cercana de la etiqueta puede ayudar.","Natukoy ko kung ano ito, pero hindi ang gawa o modelo. Makakatulong ang mas malapit na litrato ng label.","我能认出它是什么，但看不出品牌或型号。拍一张标签的近照会有帮助。","何なのかは分かりましたが、メーカーやモデルは分かりませんでした。ラベルを近くで撮った写真があると助かります。","무엇인지는 알겠지만 제조사나 모델은 알 수 없어요. 라벨을 가까이서 찍은 사진이 도움이 돼요.","Ich konnte erkennen, was es ist, aber nicht Marke oder Modell. Ein näheres Foto vom Etikett kann helfen.","J’ai pu identifier ce que c’est, mais pas la marque ni le modèle. Une photo plus proche de l’étiquette peut aider.","Ne olduğunu anladım ama marka veya modeli değil. Etiketin daha yakın bir fotoğrafı yardımcı olabilir.","ฉันบอกได้ว่าเป็นอะไร แต่ไม่รู้ยี่ห้อหรือรุ่น รูปถ่ายฉลากให้ใกล้ขึ้นจะช่วยได้","ຂ້ອຍບອກໄດ້ວ່າແມ່ນຫຍັງ ແຕ່ບໍ່ຮູ້ຍີ່ຫໍ້ ຫຼື ລຸ້ນ. ຮູບຖ່າຍປ້າຍໃຫ້ໃກ້ຂຶ້ນຈະຊ່ວຍໄດ້"],"Every week": ["Cada semana","Bawat linggo","每周","毎週","매주","Jede Woche","Chaque semaine","Her hafta","ทุกสัปดาห์","ທຸກອາທິດ"],"Every 2 weeks": ["Cada 2 semanas","Bawat 2 linggo","每 2 周","2週間ごと","2주마다","Alle 2 Wochen","Toutes les 2 semaines","2 haftada bir","ทุก 2 สัปดาห์","ທຸກ 2 ອາທິດ"],"Every 3 months": ["Cada 3 meses","Bawat 3 buwan","每 3 个月","3か月ごと","3개월마다","Alle 3 Monate","Tous les 3 mois","3 ayda bir","ทุก 3 เดือน","ທຸກ 3 ເດືອນ"],"Every 6 months": ["Cada 6 meses","Bawat 6 na buwan","每 6 个月","6か月ごと","6개월마다","Alle 6 Monate","Tous les 6 mois","6 ayda bir", ,"Pros recommandés, dont ceux près de chez vous","Önerilen ustalar, yakındakiler dahil","ช่างที่แนะนำ รวมถึงที่อยู่ใกล้","ຊ່າງທີ່ແນະນຳ ລວມທັງທີ່ຢູ່ໃກ້"],"Add your city in More to see the closest ones first.": ["Añade tu ciudad en Más para ver primero los más cercanos.","Idagdag ang lungsod mo sa Higit pa para makita muna ang pinakamalapit.","在“更多”中添加您的城市，即可优先看到最近的。","「その他」で市区町村を追加すると、近い順に表示されます。","더보기에서 도시를 추가하면 가까운 곳부터 보여 줘요.","Fügen Sie unter Mehr Ihre Stadt hinzu, um die nächstgelegenen zuerst zu sehen.","Ajoutez votre ville dans Plus pour voir d’abord les plus proches.","En yakınları önce görmek için Daha fazla bölümünde şehrinizi ekleyin.","เพิ่มเมืองของคุณที่ เพิ่มเติม เพื่อดูรายที่ใกล้ที่สุดก่อน","ເພີ່ມເມືອງຂອງທ່ານໃນ ເພີ່ມເຕີມ ເພື່ອເບິ່ງອັນທີ່ໃກ້ທີ່ສຸດກ່ອນ"],"Area they serve (city or region):": ["Zona que atienden (ciudad o región):","Lugar na pinaglilingkuran nila (lungsod o rehiyon):","服务区域（城市或地区）：","対応エリア（市区町村または地域）：","서비스 지역 (도시 또는 지역):","Einsatzgebiet (Stadt oder Region):","Zone desservie (ville ou région) :","Hizmet verdikleri alan (şehir veya bölge):","พื้นที่ให้บริการ (เมืองหรือภูมิภาค):","ເຂດທີ່ໃຫ້ບໍລິການ (ເມືອງ ຫຼື ພາກພື້ນ):"],"Save location": ["Guardar ubicación","I-save ang lokasyon","保存位置","場所を保存","위치 저장","Standort speichern","Enregistrer le lieu","Konumu kaydet","บันทึกตำแหน่ง","ບັນທຶກສະຖານທີ່"],"Saved to this home. I use it to point store and “near me” searches at your area. The photo AI never sees it. It only gets your country and currency.": ["Guardado en esta casa. Lo uso para dirigir las búsquedas de tiendas y «cerca de mí» a tu zona. La IA de fotos nunca lo ve. Solo recibe tu país y moneda.","Naka-save sa bahay na ito. Ginagamit ko ito para ituro sa lugar mo ang paghahanap ng tindahan at “malapit sa akin”. Hindi ito nakikita ng photo AI. Bansa at pera mo lang ang natatanggap nito.","已保存到这个家。我用它让商店和“附近”搜索指向您所在的区域。照片 AI 看不到它，只会获得您的国家和货币。","このホームに保存されます。お店や「近く」の検索を地域に合わせるために使います。写真AIには渡されず、国と通貨だけが渡されます。","이 집에 저장돼요. 매장과 '내 주변' 검색을 내 지역에 맞추는 데 사용해요. 사진 AI는 이 정보를 보지 못하고 국가와 통화만 받아요.","Für dieses Zuhause gespeichert. Ich nutze es, um Shop- und „In meiner Nähe“-Suchen auf Ihre Gegend auszurichten. Die Foto-KI sieht es nie, sie erhält nur Ihr Land und Ihre Währung.","Enregistré pour ce logement. Je m’en sers pour orienter les recherches de magasins et « près de chez moi » vers votre zone. L’IA photo ne le voit jamais ; elle ne reçoit que votre pays et votre devise.","Bu eve kaydedildi. Mağaza ve “yakınımda” aramalarını bölgenize yönlendirmek için kullanırım. Fotoğraf yapay zekâsı bunu asla görmez; yalnızca ülkenizi ve para biriminizi alır.","บันทึกกับบ้านนี้ ฉันใช้เพื่อชี้การค้นหาร้านค้าและ “ใกล้ฉัน” ไปยังพื้นที่ของคุณ AI รูปภาพไม่เห็นข้อมูลนี้ จะได้รับเฉพาะประเทศและสกุลเงินของคุณ","ບັນທຶກກັບບ້ານນີ້. ຂ້ອຍໃຊ້ເພື່ອຊີ້ການຄົ້ນຫາຮ້ານຄ້າ ແລະ “ໃກ້ຂ້ອຍ” ໄປຍັງເຂດຂອງທ່ານ. AI ຮູບພາບບໍ່ເຫັນຂໍ້ມູນນີ້ ແລະ ໄດ້ຮັບແຕ່ປະເທດ ແລະ ສະກຸນເງິນຂອງທ່ານ"],"Saved to this business. I use it to point store and “near me” searches at your area. The photo AI never sees it. It only gets your country and currency.": ["Guardado en este negocio. Lo uso para dirigir las búsquedas de tiendas y «cerca de mí» a tu zona. La IA de fotos nunca lo ve. Solo recibe tu país y moneda.","Naka-save sa negosyong ito. Ginagamit ko ito para ituro sa lugar mo ang paghahanap ng tindahan at “malapit sa akin”. Hindi ito nakikita ng photo AI. Bansa at pera mo lang ang natatanggap nito.","已保存到这家企业。我用它让商店和“附近”搜索指向您所在的区域。照片 AI 看不到它，只会获得您的国家和货币。","この事業所に保存されます。お店や「近く」の検索を地域に合わせるために使います。写真AIには渡されず、国と通貨だけが渡されます。","이 사업장에 저장돼요. 매장과 '내 주변' 검색을 내 지역에 맞추는 데 사용해요. 사진 AI는 이 정보를 보지 못하고 국가와 통화만 받아요.","Für dieses Geschäft gespeichert. Ich nutze es, um Shop- und „In meiner Nähe“-Suchen auf Ihre Gegend auszurichten. Die Foto-KI sieht es nie, sie erhält nur Ihr Land und Ihre Währung.","Enregistré pour cette entreprise. Je m’en sers pour orienter les recherches de magasins et « près de chez moi » vers votre zone. L’IA photo ne le voit jamais ; elle ne reçoit que votre pays et votre devise.","Bu işletmeye kaydedildi. Mağaza ve “yakınımda” aramalarını bölgenize yönlendirmek için kullanırım. Fotoğraf yapay zekâsı bunu asla görmez; yalnızca ülkenizi ve para biriminizi alır.","บันทึกกับธุรกิจนี้ ฉันใช้เพื่อชี้การค้นหาร้านค้าและ “ใกล้ฉัน” ไปยังพื้นที่ของคุณ AI รูปภาพไม่เห็นข้อมูลนี้ จะได้รับเฉพาะประเทศและสกุลเงินของคุณ","ບັນທຶກກັບທຸລະກິດນີ້. ຂ້ອຍໃຊ້ເພື່ອຊີ້ການຄົ້ນຫາຮ້ານຄ້າ ແລະ “ໃກ້ຂ້ອຍ” ໄປຍັງເຂດຂອງທ່ານ. AI ຮູບພາບບໍ່ເຫັນຂໍ້ມູນນີ້ ແລະ ໄດ້ຮັບແຕ່ປະເທດ ແລະ ສະກຸນເງິນຂອງທ່ານ"],"Come back later when I’ve gathered my thoughts!": ["¡Vuelve más tarde, cuando haya ordenado mis ideas!","Bumalik ka mamaya kapag naayos ko na ang mga iniisip ko!","等我整理好思路，请稍后再来！","考えがまとまったら、また来てね！","생각을 정리하고 나면 나중에 다시 와 주세요!","Kommen Sie später wieder, wenn ich meine Gedanken sortiert habe!","Revenez plus tard, quand j’aurai rassemblé mes idées !","Düşüncelerimi toparladığımda sonra tekrar gelin!","กลับมาใหม่ทีหลังนะ เมื่อฉันเรียบเรียงความคิดเสร็จแล้ว!","ກັບມາໃໝ່ພາຍຫຼັງ ເມື່ອຂ້ອຍຮຽບຮຽງຄວາມຄິດແລ້ວ!"],"People and sharing": ["Personas y compartir","Mga tao at pagbabahagi","成员与共享","メンバーと共有","사람 및 공유","Personen und Teilen","Personnes et partage","Kişiler ve paylaşım","ผู้คนและการแชร์","ຄົນ ແລະ ການແບ່ງປັນ"],"Add family, a partner or a team": ["Añade a tu familia, pareja o equipo","Magdagdag ng pamilya, partner o team","添加家人、伴侣或团队","家族、パートナー、チームを追加","가족, 파트너 또는 팀 추가","Familie, Partner oder Team hinzufügen","Ajoutez votre famille, partenaire ou équipe","Aile, partner veya ekip ekleyin","เพิ่มครอบครัว คู่ครอง หรือทีม","ເພີ່ມຄອບຄົວ, ຄູ່ ຫຼື ທີມ"],"Everyone here sees and edits the same rooms, items and reminders.": ["Todos aquí ven y editan las mismas habitaciones, objetos y recordatorios.","Lahat ng nandito ay nakikita at nae-edit ang parehong kuwarto, gamit at paalala.","这里的每个人看到和编辑的房间、物品和提醒都相同。","ここにいる全員が同じ部屋・アイテム・リマインダーを見て編集できます。","여기 있는 모든 사람이 같은 방, 물건, 알림을 보고 수정해요.","Alle hier sehen und bearbeiten dieselben Räume, Gegenstände und Erinnerungen.","Tout le monde ici voit et modifie les mêmes

<!doctype html>
<html lang="en" data-theme="pine" data-mode="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>One Place (Test Version)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      /* ---------- Theme palettes (6 themes × light/dark) ---------- */
      :root{
        --radius-card:20px; --radius-btn:13px; --radius-chip:999px;
        --shadow-card:0 1px 2px rgba(16,24,20,.05),0 10px 30px -18px rgba(16,24,20,.25);
        --shadow-nav:0 -6px 30px -12px rgba(16,24,20,.28);
        --ok:#1c7c4d; --ok-soft:#e2f3e9;
        --warn:#a86a08; --warn-soft:#fbf0d7;
        --bad:#b3362b; --bad-soft:#fbe7e3;
      }
      :root[data-theme="pine"]{--bg:#eef3f0;--bg2:#e3ece7;--surface:#ffffff;--surface2:#f2f6f3;--ink:#15211c;--ink2:#4c5d54;--ink3:#7d8d83;--line:#d8e2db;--accent:#146c54;--accent2:#0e5240;--accent-soft:#dcefe6;--accent-ink:#ffffff;--hero:#146c54;--hero-ink:#eafaf2;}
      :root[data-theme="pine"][data-mode="dark"]{--bg:#0d1311;--bg2:#0a0f0d;--surface:#182019;--surface2:#1f2a21;--ink:#eef5f0;--ink2:#b3c4b8;--ink3:#7f9284;--line:#2b3a2f;--accent:#3fae8d;--accent2:#63c3a5;--accent-soft:#1d332a;--accent-ink:#07130e;--hero:#1c5f4a;--hero-ink:#eafaf2;--ok:#4cc084;--ok-soft:#173527;--warn:#e0aa4e;--warn-soft:#3a2c12;--bad:#ef7d6f;--bad-soft:#3d1d18;}
      :root[data-theme="ocean"]{--bg:#edf2f7;--bg2:#e0eaf3;--surface:#ffffff;--surface2:#f0f5fa;--ink:#131e29;--ink2:#49596a;--ink3:#7a8b9c;--line:#d5e0ea;--accent:#1463ac;--accent2:#0e4e88;--accent-soft:#dbeafa;--accent-ink:#ffffff;--hero:#1463ac;--hero-ink:#eaf4fd;}
      :root[data-theme="ocean"][data-mode="dark"]{--bg:#0b1118;--bg2:#080d13;--surface:#16202c;--surface2:#1d2a3a;--ink:#edf4fa;--ink2:#aebfd0;--ink3:#7c90a5;--line:#28394c;--accent:#4d9be0;--accent2:#79b6ea;--accent-soft:#1a2f45;--accent-ink:#06121f;--hero:#17507f;--hero-ink:#eaf4fd;--ok:#4cc084;--ok-soft:#173527;--warn:#e0aa4e;--warn-soft:#3a2c12;--bad:#ef7d6f;--bad-soft:#3d1d18;}
      :root[data-theme="slate"]{--bg:#eff1f4;--bg2:#e4e8ee;--surface:#ffffff;--surface2:#f1f4f7;--ink:#161c24;--ink2:#4d5a6a;--ink3:#7f8b9a;--line:#d9dfe7;--accent:#455e7a;--accent2:#354a61;--accent-soft:#e0e8f1;--accent-ink:#ffffff;--hero:#455e7a;--hero-ink:#edf3fa;}
      :root[data-theme="slate"][data-mode="dark"]{--bg:#0e1216;--bg2:#0a0d10;--surface:#1a212a;--surface2:#222b36;--ink:#eef2f7;--ink2:#b2bfcd;--ink3:#8293a5;--line:#2d3947;--accent:#8fa9c4;--accent2:#a9bfd6;--accent-soft:#232f3e;--accent-ink:#0a1016;--hero:#37506c;--hero-ink:#edf3fa;--ok:#4cc084;--ok-soft:#173527;--warn:#e0aa4e;--warn-soft:#3a2c12;--bad:#ef7d6f;--bad-soft:#3d1d18;}
      :root[data-theme="clay"]{--bg:#f5f0ec;--bg2:#eee5dd;--surface:#ffffff;--surface2:#f7f2ed;--ink:#241a14;--ink2:#63534a;--ink3:#96837a;--line:#e7dbd0;--accent:#a84d24;--accent2:#8a3d1b;--accent-soft:#f7e3d5;--accent-ink:#ffffff;--hero:#a84d24;--hero-ink:#fdf0e7;}
      :root[data-theme="clay"][data-mode="dark"]{--bg:#151009;--bg2:#100b07;--surface:#241a12;--surface2:#2f2216;--ink:#faf2ea;--ink2:#cdb9aa;--ink3:#9d8574;--line:#3d2d1f;--accent:#dd8152;--accent2:#eba276;--accent-soft:#3a2517;--accent-ink:#1d0f05;--hero:#7e3a1a;--hero-ink:#fdf0e7;--ok:#4cc084;--ok-soft:#173527;--warn:#e0aa4e;--warn-soft:#3a2c12;--bad:#ef7d6f;--bad-soft:#3d1d18;}
      :root[data-theme="berry"]{--bg:#f5eff2;--bg2:#efe2e9;--surface:#ffffff;--surface2:#f7f0f4;--ink:#231419;--ink2:#5f4a53;--ink3:#937c88;--line:#e8d7df;--accent:#9c3460;--accent2:#7e274d;--accent-soft:#f6dde8;--accent-ink:#ffffff;--hero:#9c3460;--hero-ink:#fdeef4;}
      :root[data-theme="berry"][data-mode="dark"]{--bg:#140c10;--bg2:#100910;--surface:#231419;--surface2:#2e1b22;--ink:#faeef3;--ink2:#cfaebb;--ink3:#9d7f8d;--line:#3d2731;--accent:#d96e97;--accent2:#e892b3;--accent-soft:#38202c;--accent-ink:#1c0812;--hero:#77284a;--hero-ink:#fdeef4;--ok:#4cc084;--ok-soft:#173527;--warn:#e0aa4e;--warn-soft:#3a2c12;--bad:#ef7d6f;--bad-soft:#3d1d18;}
      :root[data-theme="marigold"]{--bg:#f5f2ea;--bg2:#eee9da;--surface:#ffffff;--surface2:#f7f4ec;--ink:#211c10;--ink2:#5d5643;--ink3:#948b73;--line:#e5ddc8;--accent:#9c6d0d;--accent2:#7d5707;--accent-soft:#f4e8c8;--accent-ink:#ffffff;--hero:#9c6d0d;--hero-ink:#fdf6e0;}
      :root[data-theme="marigold"][data-mode="dark"]{--bg:#131108;--bg2:#0f0d07;--surface:#221d10;--surface2:#2c2513;--ink:#faf5e6;--ink2:#cdc3a4;--ink3:#9c9274;--line:#3a331e;--accent:#d9a83f;--accent2:#eac26c;--accent-soft:#362b12;--accent-ink:#1d1503;--hero:#75560f;--hero-ink:#fdf6e0;--ok:#4cc084;--ok-soft:#173527;--warn:#e0aa4e;--warn-soft:#3a2c12;--bad:#ef7d6f;--bad-soft:#3d1d18;}

      *{box-sizing:border-box;}
      html{font-size:16.5px;}
      html,body{margin:0;padding:0;}
      body{
        font-family:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
        background:var(--bg2); color:var(--ink);
        -webkit-font-smoothing:antialiased; line-height:1.45;
      }
      button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
      input,select,textarea{font:inherit;color:var(--ink);}
      img{display:block;max-width:100%;}
      .ic{width:1.25rem;height:1.25rem;flex:none;display:inline-block;vertical-align:-.28em;}
      .ic svg{width:100%;height:100%;display:block;}

      /* ---------- App frame ---------- */
      .frame{max-width:1060px;margin:0 auto;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;}
      @media(min-width:1100px){.frame{box-shadow:0 0 60px rgba(10,15,12,.18);}}
      .content{flex:1;padding:1.1rem 1.1rem 7.5rem;width:100%;max-width:1060px;margin:0 auto;}
      @media(min-width:760px){.content{padding:1.6rem 2rem 8rem;}}

      /* ---------- Type ---------- */
      h1.page-title{font-size:1.72rem;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.12;}
      h2.sec-title{font-size:1.13rem;font-weight:800;letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:.6rem;}
      h2.sec-title::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px;}
      .sec{margin-top:1.7rem;}
      .label{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);}
      body.bold-off .label{font-weight:600;}
      body.bold-off h2.sec-title,body.bold-off .card-title,body.bold-off .nav-label{font-weight:700;}
      .muted{color:var(--ink2);} .small{font-size:.86rem;} .tiny{font-size:.76rem;}
      .strong{font-weight:700;}

      /* ---------- Header / place switcher ---------- */
      .placebar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:.7rem 1.1rem;}
      @media(min-width:760px){.placebar{padding:.7rem 2rem;}}
      .placebar-in{max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:.8rem;}
      .place-id{display:flex;align-items:center;gap:.65rem;min-width:0;}
      .place-emoji{width:2.5rem;height:2.5rem;border-radius:.8rem;background:var(--accent-soft);display:grid;place-items:center;font-size:1.3rem;flex:none;}
      .place-name{font-weight:800;font-size:1.06rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
      .place-tag{font-size:.78rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
      .switcher{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .1rem;scrollbar-width:none;}
      .switcher::-webkit-scrollbar{display:none;}
      .chip{flex:none;display:inline-flex;align-items:center;gap:.4rem;padding:.42rem .8rem;border-radius:var(--radius-chip);border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.88rem;transition:border-color .15s,background .15s;}
      .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
      .chip.add{border-style:dashed;color:var(--ink2);}

      /* ---------- Cards & buttons ---------- */
      .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:1.05rem 1.1rem;}
      .card-title{font-weight:800;font-size:1.02rem;letter-spacing:-.01em;}
      .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:.72rem 1.15rem;border-radius:var(--radius-btn);font-size:.98rem;transition:transform .08s,background .15s,opacity .15s;text-align:center;}
      .btn:active{transform:scale(.97);}
      .btn.block{width:100%;}
      .btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);}
      .btn.soft{background:var(--accent-soft);color:var(--accent2);}
      [data-mode="dark"] .btn.soft{color:var(--accent2);}
      .btn.danger{background:var(--bad-soft);color:var(--bad);}
      .btn.sm{padding:.5rem .85rem;font-size:.9rem;border-radius:11px;}
      .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;}
      .iconbtn{width:2.5rem;height:2.5rem;border-radius:.8rem;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);flex:none;}
      .pill{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .6rem;border-radius:var(--radius-chip);font-size:.76rem;font-weight:700;}
      .pill.ok{background:var(--ok-soft);color:var(--ok);}
      .pill.warn{background:var(--warn-soft);color:var(--warn);}
      .pill.bad{background:var(--bad-soft);color:var(--bad);}
      .pill.neutral{background:var(--surface2);color:var(--ink2);}
      .pill.accent{background:var(--accent-soft);color:var(--accent2);}
      [data-mode="dark"] .pill.accent{color:var(--accent2);}

      .hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:1.3rem 1.25rem;box-shadow:var(--shadow-card);position:relative;overflow:hidden;}
      .hero h2{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:-.015em;line-height:1.15;}
      .hero p{margin:.45rem 0 0;opacity:.88;font-size:.95rem;max-width:34rem;}
      .hero .btn{background:var(--surface);color:var(--ink);margin-top:1rem;}
      .hero .deco{position:absolute;right:-1.6rem;top:-1.6rem;width:9rem;height:9rem;border-radius:50%;background:rgba(255,255,255,.10);}
      .hero .deco2{position:absolute;right:3.4rem;bottom:-3.2rem;width:7rem;height:7rem;border-radius:50%;background:rgba(255,255,255,.07);}

      /* ---------- Lists & rows ---------- */
      .rows{display:flex;flex-direction:column;gap:.7rem;}
      .row-card{display:flex;gap:.85rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:.8rem .9rem;text-align:left;width:100%;transition:transform .08s;}
      button.row-card:active{transform:scale(.985);}
      .thumb{width:4.1rem;height:4.1rem;border-radius:.9rem;object-fit:cover;flex:none;background:var(--surface2);}
      .thumb-ph{width:4.1rem;height:4.1rem;border-radius:.9rem;flex:none;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;}
      .thumb-ph .ic{width:1.7rem;height:1.7rem;}
      .row-main{flex:1;min-width:0;}
      .row-name{font-weight:800;font-size:1rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
      .row-sub{font-size:.86rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
      .chev{color:var(--ink3);flex:none;}

      .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
      @media(min-width:760px){.grid2{grid-template-columns:repeat(4,1fr);}}
      .tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:1rem;display:flex;flex-direction:column;gap:.35rem;text-align:left;transition:transform .08s;}
      button.tile:active{transform:scale(.97);}
      .tile .ic{width:1.55rem;height:1.55rem;color:var(--accent);}
      .tile b{font-size:.98rem;font-weight:800;letter-spacing:-.01em;}
      .tile span{font-size:.82rem;color:var(--ink2);line-height:1.35;}

      .attn{display:flex;gap:.8rem;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:14px;padding:.85rem .95rem;box-shadow:var(--shadow-card);text-align:left;width:100%;}
      .attn.overdue{border-left-color:var(--bad);}
      .attn .ic{color:var(--warn);margin-top:.1rem;}
      .attn.overdue .ic{color:var(--bad);}

      /* ---------- Forms ---------- */
      .field{margin-bottom:.95rem;}
      .field label{display:block;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:.38rem;}
      body.bold-off .field label{font-weight:600;}
      .field input,.field select,.field textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:.68rem .8rem;font-size:1rem;outline:none;transition:border-color .15s;}
      .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
      .field textarea{resize:vertical;min-height:4.2rem;}
      .f2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
      .seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:.28rem;gap:.28rem;flex-wrap:wrap;}
      .seg button{flex:1;padding:.55rem .4rem;border-radius:10px;font-weight:700;font-size:.92rem;color:var(--ink2);white-space:nowrap;transition:background .15s,color .15s;}
      .seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(10,15,12,.14);}
      .pickrow{display:flex;flex-wrap:wrap;gap:.45rem;}
      .pick{padding:.5rem .85rem;border-radius:var(--radius-chip);border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;}
      .pick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
      .photo-pick{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
      .photo-btn{border:1.5px dashed var(--line);background:var(--surface2);border-radius:14px;padding:1rem .6rem;display:flex;flex-direction:column;align-items:center;gap:.4rem;font-weight:700;font-size:.9rem;color:var(--ink2);text-align:center;}
      .photo-btn .ic{width:1.5rem;height:1.5rem;color:var(--accent);}
      .photo-preview{width:100%;max-height:13rem;object-fit:cover;border-radius:14px;border:1px solid var(--line);}
      .identifying{display:flex;align-items:center;gap:.7rem;background:var(--accent-soft);border-radius:12px;padding:.8rem .95rem;font-weight:600;}
      .spinner{width:1.15rem;height:1.15rem;border-radius:50%;border:3px solid var(--accent);border-top-color:transparent;animation:spin .8s linear infinite;flex:none;}
      @keyframes spin{to{transform:rotate(360deg);}}
      @media(prefers-reduced-motion:reduce){.spinner{animation:none;}.btn,.tile,.row-card{transition:none;}}

      /* ---------- Bottom nav ---------- */
      .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;pointer-events:none;}
      .bottomnav-in{pointer-events:auto;max-width:1060px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--shadow-nav);display:grid;grid-template-columns:1fr 1fr 4.4rem 1fr 1fr;padding:.45rem .6rem calc(.45rem + env(safe-area-inset-bottom));position:relative;}
      @media(min-width:1100px){.bottomnav-in{border-left:1px solid var(--line);border-right:1px solid var(--line);}}
      .navbtn{display:flex;flex-direction:column;align-items:center;gap:.14rem;padding:.42rem .1rem;border-radius:12px;color:var(--ink3);}
      .navbtn .ic{width:1.4rem;height:1.4rem;}
      .nav-label{font-size:.72rem;font-weight:700;letter-spacing:.02em;}
      html[data-ts="2"] .nav-label,html[data-ts="3"] .nav-label{font-size:.64rem;}
      .navbtn.on{color:var(--accent);}
      .navbtn.on .nav-pill{background:var(--accent-soft);border-radius:var(--radius-chip);padding:.14rem .85rem;display:grid;place-items:center;}
      .nav-pill{display:grid;place-items:center;padding:.14rem .85rem;}
      .addbtn{position:absolute;left:50%;top:-1.35rem;transform:translateX(-50%);width:3.6rem;height:3.6rem;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(10,15,12,.5);border:4px solid var(--bg);}
      .addbtn .ic{width:1.7rem;height:1.7rem;}
      .addbtn:active{transform:translateX(-50%) scale(.94);}

      /* ---------- Modal / sheet ---------- */
      .scrim{position:fixed;inset:0;background:rgba(8,12,10,.52);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
      @media(min-width:760px){.scrim{align-items:center;padding:1.5rem;}}
      .sheet{background:var(--bg);width:100%;max-width:620px;max-height:92dvh;overflow-y:auto;border-radius:24px 24px 0 0;padding:1.3rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom));}
      @media(min-width:760px){.sheet{border-radius:24px;}}
      .sheet h3{margin:0 0 .2rem;font-size:1.3rem;font-weight:800;letter-spacing:-.015em;}
      .grab{width:2.6rem;height:.3rem;border-radius:99px;background:var(--line);margin:0 auto .9rem;}
      @media(min-width:760px){.grab{display:none;}}

      /* ---------- Detail bits ---------- */
      .detail-photo{width:100%;height:15rem;object-fit:cover;border-radius:20px;border:1px solid var(--line);}
      .kv{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line);}
      .kv:last-child{border-bottom:none;}
      .kv b{text-align:right;font-weight:700;}
      .task{display:flex;gap:.8rem;align-items:flex-start;padding:.85rem 0;border-bottom:1px solid var(--line);}
      .task:last-child{border-bottom:none;}
      .task-check{width:1.5rem;height:1.5rem;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent;margin-top:.1rem;background:var(--surface);}
      .task-check.done{background:var(--ok);border-color:var(--ok);color:#fff;}
      .steps{margin:.4rem 0 0;padding-left:1.25rem;}
      .steps li{margin-bottom:.35rem;}
      .swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;}
      .swatch{border:2px solid var(--line);border-radius:16px;padding:.8rem .7rem;display:flex;flex-direction:column;gap:.5rem;align-items:flex-start;font-weight:700;font-size:.92rem;background:var(--surface);text-align:left;}
      .swatch.on{border-color:var(--accent);}
      .swatch .dot{width:1.7rem;height:1.7rem;border-radius:50%;}
      .empty{border:1.5px dashed var(--line);border-radius:var(--radius-card);padding:1.6rem 1.2rem;text-align:center;color:var(--ink2);background:var(--surface2);}
      .empty b{color:var(--ink);display:block;font-size:1.02rem;margin-bottom:.25rem;}
      .toast{position:fixed;left:50%;bottom:6.4rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:12px;font-weight:600;font-size:.92rem;z-index:80;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);max-width:92vw;text-align:center;}
      .divider{height:1px;background:var(--line);margin:1.1rem 0;}
      .searchbar{display:flex;align-items:center;gap:.55rem;background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:.55rem .8rem;}
      .searchbar input{flex:1;border:none;background:none;outline:none;font-size:1rem;min-width:0;}
      .searchbar .ic{color:var(--ink3);}
      .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;}
      .stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.85rem .8rem;box-shadow:var(--shadow-card);}
      .stat b{display:block;font-size:1.25rem;font-weight:800;letter-spacing:-.02em;}
      .stat span{font-size:.78rem;color:var(--ink2);font-weight:600;}

      /* ---------- Onboarding ---------- */
      .onboard{max-width:640px;margin:0 auto;padding:2.2rem 1.2rem 3rem;width:100%;}
      .brandmark{width:4rem;height:4rem;border-radius:1.2rem;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900;font-size:1.5rem;letter-spacing:-.03em;}
      .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
      .role{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:1rem .9rem;text-align:left;font-weight:700;display:flex;flex-direction:column;gap:.25rem;}
      .role span{font-weight:500;font-size:.84rem;color:var(--ink2);}
      .role.on{border-color:var(--accent);background:var(--accent-soft);}

      /* ---------- Report / print ---------- */
      .report-sheet{background:#fff;color:#1a1a1a;border-radius:10px;padding:1.6rem;box-shadow:var(--shadow-card);}
      .report-sheet h1{font-size:1.5em;margin:0 0 .1em;letter-spacing:-.01em;}
      .report-sheet h2{font-size:1.12em;margin:1.3em 0 .45em;padding-bottom:.25em;border-bottom:2px solid #1a1a1a;}
      .report-sheet h3{font-size:1em;margin:.9em 0 .3em;}
      .report-sheet table{width:100%;border-collapse:collapse;font-size:.92em;}
      .report-sheet th{text-align:left;border-bottom:1.5px solid #999;padding:.3em .4em;font-weight:700;}
      .report-sheet td{border-bottom:1px solid #ddd;padding:.3em .4em;vertical-align:top;}
      .report-sheet .rmeta{color:#555;font-size:.9em;}
      @media print{
        body{background:#fff;}
        .no-print{display:none !important;}
        .frame{box-shadow:none;max-width:none;background:#fff;}
        .content{padding:0;}
        .report-sheet{box-shadow:none;border-radius:0;padding:0;}
      }

function fmtDate(d){ if(!d) return "—"; const x = new Date(d+"T12:00:00"); if(isNaN(x)) return "—"; return MONTHS[x.getMonth()]+" "+x.getDate()+", "+x.getFullYear(); }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addMonths(ds,m){ const d=new Date(ds+"T12:00:00"); d.setMonth(d.getMonth()+m); return d.toISOString().slice(0,10); }
function daysUntil(ds){ if(!ds) return null; const a=new Date(todayStr()+"T12:00:00"), b=new Date(ds+"T12:00:00"); return Math.round((b-a)/86400000); }
function dueInfo(ds,soonDays){ const n=daysUntil(ds); if(n===null) return null;
  if(n<0) return {cls:"bad",label:"Overdue by "+Math.abs(n)+"d"};
  if(n===0) return {cls:"bad",label:"Due today"};
  if(n<=(soonDays||45)) return {cls:"warn",label:"Due in "+n+"d"};
  return {cls:"ok",label:fmtDate(ds)}; }
function money(n){ if(n==null||n===""||isNaN(n)) return "—"; return "$"+Number(n).toLocaleString("en-US",{maximumFractionDigits:2}); }

function nextDueOf(task){ if(!task.lastDone) return null; return addMonths(task.lastDone, task.every); }
function attentionEvents(p){
  const ev=[];
  p.items.forEach(it=>{ (it.tasks||[]).forEach(t=>{ const nd=nextDueOf(t); const d= nd? daysUntil(nd) : null;
    if(d!==null && d<=45) ev.push({days:d,kind:"item",icon:ITEM_KB[it.type]?ITEM_KB[it.type].icon:"box",title:it.name+" — "+t.name,sub:nd?("Due "+fmtDate(nd)):"Not logged yet",view:"itemDetail",id:it.id}); }); });
  p.vehicles.forEach(v=>{ [["Registration renewal",v.regNext],["Smog / emissions check",v.smogNext]].forEach(([label,ds])=>{ if(!ds) return; const d=daysUntil(ds);
    if(d<=60) ev.push({days:d,kind:"vehicle",icon:"car",title:v.name+" — "+label,sub:"Due "+fmtDate(ds)+" · registered in "+v.state,view:"vehicleDetail",id:v.id}); }); });
  p.pets.forEach(pt=>{ (pt.records||[]).forEach(r=>{ if(!r.nextDue) return; const d=daysUntil(r.nextDue);
    if(d<=60) ev.push({days:d,kind:"pet",icon:"paw",title:pt.name+" — "+r.name,sub:"Due "+fmtDate(r.nextDue)+(r.clinic?" · "+r.clinic:""),view:"petDetail",id:pt.id}); }); });
  if(p.phonePlan){ p.phonePlan.lines.forEach(l=>{ [["Device payoff",l.payoff],["Upgrade eligibility",l.upgrade]].forEach(([label,ds])=>{ if(!ds) return; const d=daysUntil(ds);

    '<ul class="steps" style="list-style:disc"><li><b>Firebase</b> (Google) — sign-in plus a Firestore database.</li><li><b>Supabase</b> — sign-in plus a Postgres database.</li></ul>'+

/* ---------- Printable report ---------- */
function viewReport(p){
  const st=S.settings;
  let h = '<div class="no-print"><button class="btn ghost sm" data-act="go" data-view="home" style="margin-bottom:1rem">'+ic("chevL")+' Back</button>'+
    '<h1 class="page-title">Paper copy</h1><p class="muted" style="margin:.4rem 0 0;max-width:36rem">A simplified printout of this place: room by room, what’s been maintained or repaired, and how often to upkeep each thing. Set the text size to fit more or less per page, then print from your browser or device’s Print menu.</p>'+
    '<div class="label" style="margin:1rem 0 .5rem">Report text size</div><div class="seg" style="max-width:30rem">'+
    PRINT_SIZES.map((t,i)=>'<button class="'+(st.printSize===i?"on":"")+'" data-act="setPrintSize" data-id="'+i+'">'+t.n+'</button>').join("")+'</div></div>';
  let r = '<div class="report-sheet" style="font-size:'+PRINT_SIZES[st.printSize].em+';margin-top:1.2rem">';
  r += '<h1>'+esc(p.name)+'</h1><div class="rmeta">'+esc(p.role)+(p.tagline?" · "+esc(p.tagline):"")+' · Printed '+fmtDate(todayStr())+' · Owner: '+esc(ownerName())+'</div>';
  const ev = attentionEvents(p);
  if(ev.length){ r += '<h2>Needs attention</h2><table><tr><th>What</th><th>Details</th></tr>'+ev.map(e=>'<tr><td>'+esc(e.title)+'</td><td>'+esc(e.sub)+'</td></tr>').join("")+'</table>'; }
  p.rooms.forEach(rm=>{ const items=p.items.filter(i=>i.roomId===rm.id); if(!items.length) return;
    r += '<h2>'+esc(rm.name)+'</h2>';
    items.forEach(it=>{ r += '<h3>'+esc(it.name)+(it.brand?' <span class="rmeta">('+esc([it.brand,it.model,it.year].filter(Boolean).join(" ")) +')</span>':"")+'</h3>';
      if((it.tasks||[]).length) r += '<table><tr><th>Upkeep</th><th>How often</th><th>Last done</th><th>Next due</th></tr>'+it.tasks.map(t=>'<tr><td>'+esc(t.name)+'</td><td>Every '+t.every+' months</td><td>'+(t.lastDone?fmtDate(t.lastDone):"—")+'</td><td>'+(nextDueOf(t)?fmtDate(nextDueOf(t)):"—")+'</td></tr>').join("")+'</table>';
      const logs=asLogs(it.logs).slice(-4).reverse();
      if(logs.length) r += '<p style="margin:.35em 0 0" class="rmeta">Recent work: '+logs.map(l=>esc(l.what)+" — "+fmtDate(l.date)+" ("+esc(l.by)+")").join("; ")+'</p>';
    });
  });
  const unroomed = p.items.filter(i=>!p.rooms.find(rm=>rm.id===i.roomId));
  if(unroomed.length){ r += '<h2>Not filed in a room</h2>'+unroomed.map(it=>'<p style="margin:.2em 0">'+esc(it.name)+'</p>').join(""); }
  if(p.vehicles.length){ r += '<h2>Vehicles</h2><table><tr><th>Vehicle</th><th>Registered in</th><th>Registration due</th><th>Smog due</th></tr>'+p.vehicles.map(v=>'<tr><td>'+esc(v.name)+'</td><td>'+esc(v.state)+'</td><td>'+(v.regNext?fmtDate(v.regNext):"—")+'</td><td>'+(v.smogNext?fmtDate(v.smogNext):"—")+'</td></tr>').join("")+'</table>'; }
  if(p.pets.length){ r += '<h2>Pets</h2>'+p.pets.map(pt=>'<h3>'+esc(pt.name)+' <span class="rmeta">('+esc([pt.species,pt.breed].filter(Boolean).join(" ")) +')</span></h3>'+((pt.records||[]).length?'<table><tr><th>Record</th><th>Done</th><th>Next due</th><th>Where</th></tr>'+pt.records.map(rec=>'<tr><td>'+esc(rec.name)+'</td><td>'+fmtDate(rec.date)+'</td><td>'+(rec.nextDue?fmtDate(rec.nextDue):"—")+'</td><td>'+esc(rec.clinic||"")+(rec.location?" — "+esc(rec.location):"")+'</td></tr>').join("")+'</table>':"")).join(""); }
  if(p.phonePlan){ r += '<h2>Phone plan</h2><p style="margin:.2em 0">'+esc(p.phonePlan.carrier||"")+" · "+esc(p.phonePlan.planName||"")+" · "+p.phonePlan.lines.length+' lines · '+money(p.phonePlan.lines.reduce((s,l)=>s+(Number(l.cost)||0),0))+'/mo total</p>'; }
  if(!p.items.length && !p.vehicles.length && !p.pets.length) r += '<p style="margin-top:1em">Nothing filed yet — add rooms, items, vehicles, and pets and they will appear here.</p>';
  r += '<p class="rmeta" style="margin-top:1.6em">Generated by One Place.</p></div>';
  return h + r;
}

<script>
/* =====================================================================
   Modals, photo flow, actions
   ===================================================================== */
function openModal(html){ $("#modalRoot").innerHTML = '<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+html+'</div></div>'; const f=$(".sheet input, .sheet select, .sheet textarea"); }
function closeModal(){ $("#modalRoot").innerHTML=""; }
function modalHead(title,sub){ return '<h3>'+title+'</h3>'+(sub?'<p class="muted small" style="margin:0 0 1rem">'+sub+'</p>':'<div style="height:.6rem"></div>'); }

/* pending photo state per flow */
const PH = {item:null,vehicle:null,pet:null,diag:null,plan:null};
let photoTarget = null;
function photoSlotHtml(key){
  const src = PH[key];
  return src ? '<img class="photo-preview" src="'+src+'" alt="Selected photo" /><p class="tiny muted" style="margin:.35rem 0 0">Photo attached. Pick another to replace it.</p>' : '';
}
function wirePhoto(input, key){
  input.onchange = ()=>{ const f=input.files && input.files[0]; if(!f) return;
    if(PH[key]) URL.revokeObjectURL(PH[key]);
    PH[key]=URL.createObjectURL(f); input.value="";
    if(key==="diag"){ const slot=$("#diagPhotoSlot"); if(slot) slot.innerHTML=photoSlotHtml("diag"); }
    else { const slot=$("#photoSlot"); if(slot) slot.innerHTML=photoSlotHtml(key); const idn=$("#identifyNote"); if(idn){ idn.style.display="flex"; setTimeout(()=>{ idn.style.display="none"; const hint=$("#idHint"); if(hint) hint.style.display="block"; },1400); } }
  };
}
wirePhoto($("#fileCam"), null); wirePhoto($("#fileLib"), null);
/* re-wire with dynamic key via dataset */
function pickPhoto(key, mode){ photoTarget=key; const inp = mode==="cam" ? $("#fileCam") : $("#fileLib");
  inp.onchange = ()=>{ const f=inp.files && inp.files[0]; if(!f) return;
    if(PH[key]) URL.revokeObjectURL(PH[key]);
    PH[key]=URL.createObjectURL(f); inp.value="";
    if(key==="diag"){ const slot=$("#diagPhotoSlot"); if(slot) slot.innerHTML=photoSlotHtml("diag"); }
    else { const slot=$("#photoSlot"); if(slot) slot.innerHTML=photoSlotHtml(key); const idn=$("#identifyNote"); if(idn){ idn.style.display="flex"; const hint=$("#idHint"); if(hint) hint.style.display="none"; setTimeout(()=>{ idn.style.display="none"; if(hint) hint.style.display="block"; },1500); } }
  };
  inp.click();
}

function addVehicleModal(p){
  PH.vehicle=null;
  openModal(modalHead("Add a vehicle","Registration & smog reminders follow the state it’s registered in — even if it’s driven somewhere else.")+

    '<div class="photo-pick"><button class="photo-btn" data-act="photoPick" data-target="vehicle" data-mode="cam">'+ic("camera")+'Take a photo</button><button class="photo-btn" data-act="photoPick" data-target="vehicle" data-mode="lib">'+ic("image")+'Choose screenshot / photo</button></div>'+

document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act, p = place();
  if(act==="scrim"){ if(e.target===el) closeModal(); return; }
  switch(act){
    case "closeModal": closeModal(); break;
    /* onboarding */
    case "obRole": OB.role=el.dataset.role; OB.kind=el.dataset.kind; render(); break;
    case "obStart": {
      S.owner={first:$("#obFirst").value.trim(),last:$("#obLast").value.trim(),phone:$("#obPhone").value.trim(),email:$("#obEmail").value.trim(),city:$("#obCity").value.trim(),zip:$("#obZip").value.trim()};
      const pl=newPlace(OB.kind,OB.role,$("#obPlace").value.trim()); pl.emoji=$("#obEmoji").value.trim()||pl.emoji; pl.tagline=$("#obTag").value.trim();
      S.places=[pl]; S.activePlaceId=pl.id; S.onboarded=true; S.view="home"; render(); toast("Welcome to One Place"); break; }
    case "obSample": loadSample(); render(); toast("Sample home loaded — explore away"); break;
    case "loadSample": closeModal(); loadSample(); render(); toast("Sample home loaded"); break;
    case "resetAll": S.onboarded=false; S.places=[]; S.activePlaceId=null; S.view="home"; S.diagResult=null; closeModal(); render(); break;
    /* nav */
    case "go": S.view=el.dataset.view; if(S.view!=="diagnose"){S.diagResult=null; S.diagFor=null;} closeModal(); render(); window.scrollTo(0,0); break;
    case "switchPlace": S.activePlaceId=el.dataset.id; S.view="home"; S.sel={item:null,vehicle:null,pet:null}; render(); window.scrollTo(0,0); break;
    case "addMenu": addMenu(); break;
    case "openEvent": { const v=el.dataset.view; if(v){ S.view=v; const id=el.dataset.id; if(v==="itemDetail")S.sel.item=id; if(v==="vehicleDetail")S.sel.vehicle=id; if(v==="petDetail")S.sel.pet=id; render(); window.scrollTo(0,0);} break; }
    /* rooms & items */
    case "roomFilter": roomFilter=el.dataset.id; if(S.view!=="items"){S.view="items";} render(); break;
    case "addRoom": closeModal(); if(p) addRoomModal(p); break;
    case "roomSuggest": { const i=$("#roomName"); if(i) i.value=el.dataset.name; break; }
    case "saveRoom": { const n=$("#roomName").value.trim(); if(!n){ toast("Give the room a name"); break; } p.rooms.push({id:uid("rm"),name:n}); closeModal(); render(); toast("Room added"); break; }
    case "addItem": closeModal(); if(p) addItemModal(p); break;
    case "photoPick": pickPhoto(el.dataset.target, el.dataset.mode); break;
    case "saveItem": {
      const type=$("#itType").value; const kb=ITEM_KB[type];
      const name=$("#itName").value.trim() || type;
      let roomId=$("#itRoom") ? $("#itRoom").value : null;
      if(!roomId){ if(!p.rooms.length){ p.rooms.push({id:uid("rm"),name:"Kitchen"}); } roomId=p.rooms[0].id; }
      const it={id:uid("it"),type,name,brand:$("#itBrand").value.trim(),model:$("#itModel").value.trim(),year:$("#itYear").value.trim(),roomId,photo:PH.item,problem:$("#itProblem").value.trim(),
        tasks: kb? kb.tasks.map(t=>({...t,lastDone:null})) : [], logs:[]};
      p.items.push(it); PH.item=null; closeModal(); S.view="itemDetail"; S.sel.item=it.id; render(); window.scrollTo(0,0); toast("Item added — plan built"); break; }
    case "openItem": S.sel.item=el.dataset.id; S.view="itemDetail"; render(); window.scrollTo(0,0); break;
    case "markTaskDone": { const it=p.items.find(i=>i.id===S.sel.item); const t=it.tasks[+el.dataset.idx];
      memberPicker("Mark done: "+t.name, by=>{ t.lastDone=todayStr(); it.logs.push({what:t.name,by,date:todayStr()}); render(); toast("Logged — nice work, "+by); }); break; }
    case "pickMember": { const cb=window._memberCb; closeModal(); if(cb) cb(el.dataset.name); break; }
    case "moveItem": case "moveVehicle": { const isItem = act==="moveItem"; const id=el.dataset.id;
      const others=S.places.filter(x=>x.id!==p.id);
      if(!others.length){ toast("Add another place first (Home → Add place)"); break; }
      openModal(modalHead("Move to another place","Everything about it — schedule and history — moves with it.")+

    case "doMove": { const from=place(); const to=S.places.find(x=>x.id===el.dataset.to); const coll = el.dataset.kind==="item"?"items":"vehicles";
      const idx=from[coll].findIndex(x=>x.id===el.dataset.id); if(idx>=0){ to[coll].push(from[coll].splice(idx,1)[0]); }

      '<div class="f2"><div class="field"><label for="recDate">Date done</label><input id="recDate" type="date" value="'+(r.date||todayStr())+'" /></div>'+
      '<div class="field"><label for="recNext">Next due (optional)</label><input id="recNext" type="date" value="'+(r.nextDue||"")+'" /></div></div>'+
      '<div class="f2"><div class="field"><label for="recClinic">Vet / clinic name</label><input id="recClinic" value="'+esc(r.clinic||"")+'" placeholder="e.g. Seven Hills Animal Hospital" /></div>'+
      '<div class="field"><label for="recLoc">Location</label><input id="recLoc" value="'+esc(r.location||"")+'" placeholder="City, ST" /></div></div>'+
      '<div class="field"><label for="recNotes">Notes (optional)</label><textarea id="recNotes" placeholder="Anything worth remembering">'+esc(r.notes||"")+'</textarea></div>'+
      '<button class="btn block" data-act="saveRecord" data-idx="'+idx+'">Save record</button><button class="btn ghost block" data-act="closeModal" style="margin-top:.6rem">Cancel</button>'); break; }
    case "saveRecord": { const pt=p.pets.find(x=>x.id===S.sel.pet); const idx=+el.dataset.idx;
      const r={name:$("#recName").value.trim()||"Health record",date:$("#recDate").value||todayStr(),nextDue:$("#recNext").value||"",clinic:$("#recClinic").value.trim(),location:$("#recLoc").value.trim(),notes:$("#recNotes").value.trim()};
      if(idx>=0) pt.records[idx]=r; else pt.records.push(r);
      closeModal(); render(); toast("Record saved"); break; }
    case "recordAgain": { const pt=p.pets.find(x=>x.id===S.sel.pet); const r=pt.records[+el.dataset.idx];
      if(r.nextDue && r.date){ const gap=Math.max(1,Math.round((new Date(r.nextDue)-new Date(r.date))/86400000)); r.date=todayStr(); r.nextDue=new Date(Date.now()+gap*86400000).toISOString().slice(0,10); }
      else { r.date=todayStr(); }
      render(); toast("Logged again today — next due rolled forward"); break; }
    case "deleteRecord": { const pt=p.pets.find(x=>x.id===S.sel.pet); pt.records.splice(+el.dataset.idx,1); render(); toast("Record removed"); break; }
    case "deletePet": confirmModal("Remove this pet?","Their profile and health records will be removed too.","doDeletePet",el.dataset.id); break;
    case "doDeletePet": p.pets=p.pets.filter(x=>x.id!==el.dataset.id); closeModal(); S.view="pets"; render(); toast("Pet removed"); break;
    /* places */
    case "addPlace": case "addPlaceKind": { const kind = el.dataset.kind || "home";
      openModal(modalHead(kind==="business"?"Add a business":"Add a home","It gets its own rooms, items, vehicles, pets, and phone plan.")+
      '<div class="field"><label for="npRole">Your role</label><select id="npRole">'+(kind==="business"?'<option>Business owner</option><option>Business renter</option>':'<option>Homeowner</option><option>Home renter</option>')+'</select></div>'+
      '<div class="field"><label for="npName">Name it</label><input id="npName" placeholder="'+(kind==="business"?"e.g. The bakery":"e.g. The lake house")+'" /></div>'+
      '<div class="f2"><div class="field"><label for="npEmoji">Emoji</label><input id="npEmoji" maxlength="4" value="'+(kind==="business"?"🏢":"🏠")+'" /></div>'+
      '<div class="field"><label for="npTag">Tagline (optional)</label><input id="npTag" placeholder="City, ST" /></div></div>'+
      '<button class="btn block" data-act="savePlace" data-kind="'+kind+'">Add & switch to it</button><button class="btn ghost block" data-act="closeModal" style="margin-top:.6rem">Cancel</button>'); break; }
    case "savePlace": { const pl=newPlace(el.dataset.kind,$("#npRole").value,$("#npName").value.trim()); pl.emoji=$("#npEmoji").value.trim()||pl.emoji; pl.tagline=$("#npTag").value.trim();
      S.places.push(pl); S.activePlaceId=pl.id; closeModal(); S.view="home"; render(); window.scrollTo(0,0); toast("Place added"); break; }
    case "editPlace": { const pl=S.places.find(x=>x.id===el.dataset.id);
      openModal(modalHead("Edit place")+
      '<div class="field"><label for="epName">Name</label><input id="epName" value="'+esc(pl.name)+'" /></div>'+
      '<div class="f2"><div class="field"><label for="epEmoji">Emoji</label><input id="epEmoji" maxlength="4" value="'+esc(pl.emoji||"🏠")+'" /></div>'+
      '<div class="field"><label for="epTag">Tagline</label><input id="epTag" value="'+esc(pl.tagline||"")+'" /></div></div>'+
      '<div class="field"><label for="epRole">Role</label><select id="epRole">'+["Homeowner","Home renter","Business owner","Business renter"].map(r=>'<option'+(r===pl.role?" selected":"")+'>'+r+'</option>').join("")+'</select></div>'+
      '<button class="btn block" data-act="saveEditPlace" data-id="'+pl.id+'">Save changes</button><button class="btn ghost block" data-act="closeModal" style="margin-top:.6rem">Cancel</button>'+
      (S.places.length>1?'<div class="divider"></div><button class="btn danger block" data-act="deletePlace" data-id="'+pl.id+'">Remove this place & everything in it</button>':"")); break; }
    case "saveEditPlace": { const pl=S.places.find(x=>x.id===el.dataset.id); pl.name=$("#epName").value.trim()||pl.name; pl.emoji=$("#epEmoji").value.trim()||pl.emoji; pl.tagline=$("#epTag").value.trim(); pl.role=$("#epRole").value;
      closeModal(); render(); toast("Place updated"); break; }
    case "deletePlace": confirmModal("Remove this place?","Everything filed under it — items, vehicles, pets, records — will be removed too.","doDeletePlace",el.dataset.id); break;
    case "doDeletePlace": S.places=S.places.filter(x=>x.id!==el.dataset.id); if(S.activePlaceId===el.dataset.id) S.activePlaceId=S.places[0].id; closeModal(); S.view="more"; render(); toast("Place removed"); break;
    /* members */
    case "addMember": openModal(modalHead("Add a member","Household or team — they can be picked when logging work.")+
      '<div class="field"><label for="mbName">Name</label><input id="mbName" placeholder="Full name" /></div>'+
      '<div class="field"><label for="mbPhone">Phone (optional)</label><input id="mbPhone" type="tel" placeholder="(555) 555-5555" /></div>'+
      '<button class="btn block" data-act="saveMember">Add member</button><button class="btn ghost block" data-act="closeModal" style="margin-top:.6rem">Cancel</button>'); break;
    case "saveMember": { const n=$("#mbName").value.trim(); if(!n){ toast("Add a name"); break; } p.members.push({id:uid("mb"),name:n,phone:$("#mbPhone").value.trim()}); closeModal(); render(); toast("Member added"); break; }
    case "deleteMember": p.members.splice(+el.dataset.idx,1); render(); toast("Member removed"); break;
    /* diagnose */
    case "diagnoseFor": S.diagFor=el.dataset.id; S.view="diagnose"; S.diagResult=null; render(); window.scrollTo(0,0); break;
    case "diagClearTarget": S.diagFor=null; render(); break;
    case "runDiagnose": { const txt=($("#diagText")?$("#diagText").value:"").toLowerCase(); const raw=($("#diagText")?$("#diagText").value:"");
      if(!raw.trim()){ toast("Describe what’s happening first"); break; }
      S.diagText = raw;
      let best=null,score=0; DIAGNOSE_RULES.forEach(r=>{ const s=r.keys.filter(k=>txt.includes(k)).length; if(s>score){score=s;best=r;} });
      const r = best || DIAGNOSE_DEFAULT;
      const target = S.diagFor? p.items.find(i=>i.id===S.diagFor) : null;
      S.diagResult = {...r, photo:true, hadPhoto: !!PH.diag, conf: best? (score>=2?"high":"medium") : "low"};
      if(target){ target.problem = raw; }
      render(); window.scrollTo(0, document.body.scrollHeight); break; }
    /* pro quotes */
    case "bigJob": closeModal(); bigJobModal(el.dataset.name||""); break;
    case "sendQuote": { const job=($("#bjJob")?$("#bjJob").value:""); const nm=($("#bjName")?$("#bjName").value:""); const ph=($("#bjPhone")?$("#bjPhone").value:""); const em=($("#bjEmail")?$("#bjEmail").value:"");
      const body=encodeURIComponent("Hi "+el.dataset.biz+",\n\nI’d like a quote for:\n"+job+"\n\nName: "+nm+"\nPhone: "+ph+"\nEmail: "+em+"\n\nSent from One Place");
      window.location.href="mailto:?subject="+encodeURIComponent("Quote request: "+job)+"&body="+body; break; }
    /* feedback */
    case "feedback": feedbackModal(); break;
    case "sendFeedback": { const type=$("#fbType")?$("#fbType").value:"Feedback"; const msg=$("#fbText")?$("#fbText").value.trim():"";
      if(!msg){ toast("Write a few words first"); break; }
      const fbody=encodeURIComponent("Type: "+type+"\n\n"+msg+"\n\n— Sent from the One Place test version");
      window.location.href="mailto:angelisiopao@gmail.com?subject="+encodeURIComponent("One Place test feedback")+"&body="+fbody;
      closeModal(); toast("Opening your email app…"); break; }
    /* settings */
    case "setTheme": S.settings.theme=el.dataset.id; render(); break;
    case "setLighting": S.settings.lighting=el.dataset.id; render(); break;
    case "setTextSize": S.settings.textSize=+el.dataset.id; render(); break;
    case "setPrintSize": S.settings.printSize=+el.dataset.id; render(); break;
    case "setBold": S.settings.boldLabels = el.dataset.id==="1"; render(); break;
  }
});
document.addEventListener("input", e=>{
  if(e.target && e.target.id==="itemSearch"){ S.search=e.target.value; const pos=e.target.selectionStart; render(); const inp=$("#itemSearch"); if(inp){ inp.focus(); inp.setSelectionRange(pos,pos); } }
});

/* ---------- init ---------- */
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<title>One Place · back in a bite</title>
<style>
  :root {
    --bg: #efe4d5; --surface: #f8f1e6; --line: #dccbb4; --ink: #3a2a22; --soft: #7a6354;
    --shadow: 0 1px 2px rgba(70,40,25,.08), 0 8px 22px rgba(70,40,25,.08);
    --chick-hi: #fff2a0; --chick: #ffd84f; --chick-lo: #f5b82e;
    --beak: #ff8a3d; --beak-lo: #e8702a;
    --cookie: #dca064; --cookie-lo: #c5864a; --chip: #5a3a22;
    --hair: #1c1c1e; --halo: #f8f1e6; --blush: #ff9bb0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1814; --surface: #2a211b; --line: #43362c; --ink: #f3e8dc; --soft: #c4ae9a;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
      --halo: #8fa896; --chip: #4a2f1b;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); min-height: 100vh;
    font: 1rem/1.5 "Plus Jakarta Sans", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
    text-align: center;
  }
  main { max-width: 36rem; margin: 0 auto; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px 16px 20px; box-shadow: var(--shadow); }
  .chick { width: min(60vw, 14rem); height: auto; display: block; margin: 0 auto 1.1rem; overflow: visible; }
  .squish { transform-origin: 110px 190px; animation: chew 1.6s ease-in-out infinite; }
  .hair { transform-origin: 110px 56px; animation: sway 3.2s ease-in-out infinite; }
  .crumb { opacity: 0; animation: crumb 1.6s ease-in infinite; animation-delay: var(--d, 0s); }
  .cheek { transform-origin: 110px 132px; animation: stuff 6.4s ease-in-out infinite; }
  .biscuit { transform-origin: 110px 150px; animation: nibble 6.4s ease-in-out infinite; }
  @keyframes stuff {
    0% { transform: scale(1); }
    6%, 23% { transform: scale(1.1); }
    31%, 48% { transform: scale(1.2); }
    56%, 73% { transform: scale(1.3); }
    81%, 88% { transform: scale(1.4); }
    94% { transform: scale(.98); }
    100% { transform: scale(1); }
  }
  @keyframes nibble {
    0%, 4% { transform: scale(1); opacity: 1; }
    8%, 25% { transform: scale(.88); }
    33%, 50% { transform: scale(.76); }
    58%, 75% { transform: scale(.64); }
    83%, 90% { transform: scale(.5); opacity: 1; }
    94% { transform: scale(.4); opacity: 0; }
    97% { transform: scale(1); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes chew {
    0%, 100% { transform: scale(1, 1); }
    25% { transform: scale(1.025, .965); }
    50% { transform: scale(.992, 1.02); }
    75% { transform: scale(1.025, .965); }
  }
  @keyframes sway {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(2.5deg); }
  }
  @keyframes crumb {
    0% { opacity: 0; transform: translate(0, 0); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx, 4px), var(--dy, 34px)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .squish, .hair, .crumb, .cheek, .biscuit { animation: none; }
  }
  h1 { margin: 0 0 8px; font-size: 1.45rem; letter-spacing: -.01em; font-weight: 800; }
  p { margin: 0; font-size: .95rem; line-height: 1.5; color: var(--soft); }
  .name { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: .85rem; font-weight: 700; color: var(--soft); }
</style>
</head>
<body>
<main>
<section class="card">
  <svg class="chick" viewBox="0 0 220 220" role="img" aria-label="A fluffy round yellow plush chick with two black hair strands, munching on a cookie">
    <defs>
      <radialGradient id="fluff" cx="38%" cy="30%" r="80%">
        <stop offset="0" style="stop-color:var(--chick-hi)"/>
        <stop offset=".5" style="stop-color:var(--chick)"/>
        <stop offset="1" style="stop-color:var(--chick-lo)"/>
      </radialGradient>
      <radialGradient id="biscuit" cx="35%" cy="30%" r="80%">
        <stop offset="0" style="stop-color:var(--cookie)"/>
        <stop offset="1" style="stop-color:var(--cookie-lo)"/>
      </radialGradient>
      <mask id="bite">
        <rect width="220" height="220" fill="#fff"/>
        <circle cx="112" cy="140" r="11" fill="#000"/>
        <circle cx="94" cy="144" r="7" fill="#000"/>
      </mask>
    </defs>

    <ellipse cx="110" cy="205" rx="62" ry="8" fill="#000" opacity=".13"/>

    <g class="squish">
      <!-- feet -->
      <ellipse cx="82" cy="199" rx="17" ry="9" fill="var(--beak)"/>
      <ellipse cx="138" cy="199" rx="17" ry="9" fill="var(--beak)"/>

      <!-- hair: two fat black strands -->
      <g class="hair" fill="none" stroke-linecap="round">
        <g stroke="var(--halo)" stroke-width="11">
          <path d="M105 58 C104 46 98 38 88 38"/>
          <path d="M115 58 C116 46 122 38 132 38"/>
        </g>
        <g stroke="var(--hair)" stroke-width="7">
          <path d="M105 58 C104 46 98 38 88 38"/>
          <path d="M115 58 C116 46 122 38 132 38"/>
        </g>
      </g>

      <!-- body -->
      <ellipse cx="110" cy="124" rx="86" ry="78" fill="url(#fluff)"/>
      <ellipse cx="78" cy="84" rx="26" ry="13" fill="#fff" opacity=".4" transform="rotate(-24 78 84)"/>

      <!-- face -->
      <ellipse cx="80" cy="116" rx="8" ry="9.5" fill="#161616"/>
      <ellipse cx="140" cy="116" rx="8" ry="9.5" fill="#161616"/>
      <circle cx="83" cy="112.5" r="3.2" fill="#fff"/>
      <circle cx="143" cy="112.5" r="3.2" fill="#fff"/>
      <circle cx="77.5" cy="120" r="1.5" fill="#fff" opacity=".8"/>
      <circle cx="137.5" cy="120" r="1.5" fill="#fff" opacity=".8"/>
      <g class="cheek">
        <ellipse cx="60" cy="134" rx="15" ry="13" fill="url(#fluff)"/>
        <ellipse cx="160" cy="134" rx="15" ry="13" fill="url(#fluff)"/>
        <ellipse cx="58" cy="136" rx="12" ry="7" fill="var(--blush)" opacity=".6"/>
        <ellipse cx="162" cy="136" rx="12" ry="7" fill="var(--blush)" opacity=".6"/>
      </g>
      <path d="M99 128 Q110 120 121 128 Q118 140 110 141 Q102 140 99 128 Z" fill="var(--beak)"/>
      <path d="M104 126 Q110 123 116 126" fill="none" stroke="#ffb27a" stroke-width="2" stroke-linecap="round" opacity=".8"/>

      <!-- cookie -->
      <g class="biscuit"><g mask="url(#bite)">
        <circle cx="110" cy="166" r="27" fill="url(#biscuit)"/>
        <circle cx="98" cy="160" r="3.4" fill="var(--chip)"/>
        <circle cx="122" cy="168" r="3.6" fill="var(--chip)"/>
        <circle cx="106" cy="178" r="3.1" fill="var(--chip)"/>
        <circle cx="127" cy="154" r="2.8" fill="var(--chip)"/>
        <circle cx="92" cy="174" r="2.6" fill="var(--chip)"/>
      </g></g>

      <!-- stubby wings holding the cookie -->
      <ellipse cx="80" cy="168" rx="15" ry="10" fill="var(--chick)" transform="rotate(28 80 168)"/>
      <ellipse cx="140" cy="168" rx="15" ry="10" fill="var(--chick)" transform="rotate(-28 140 168)"/>
      <ellipse cx="76" cy="165" rx="7" ry="3.5" fill="var(--chick-hi)" opacity=".7" transform="rotate(28 76 165)"/>
      <ellipse cx="144" cy="165" rx="7" ry="3.5" fill="var(--chick-hi)" opacity=".7" transform="rotate(-28 144 165)"/>
    </g>

    <circle class="crumb" cx="100" cy="146" r="2.6" fill="var(--cookie)" style="--d:0s;--dx:-6px;--dy:36px"/>
    <circle class="crumb" cx="118" cy="148" r="2.2" fill="var(--cookie)" style="--d:0.2s;--dx:8px;--dy:32px"/>
    <circle class="crumb" cx="110" cy="151" r="1.9" fill="var(--cookie)" style="--d:0.45s;--dx:0px;--dy:38px"/>
    <circle class="crumb" cx="92" cy="142" r="2.0" fill="var(--cookie)" style="--d:0.7s;--dx:-12px;--dy:30px"/>
    <circle class="crumb" cx="126" cy="144" r="2.4" fill="var(--cookie)" style="--d:0.95s;--dx:14px;--dy:34px"/>
    <circle class="crumb" cx="106" cy="147" r="1.6" fill="var(--cookie)" style="--d:1.15s;--dx:-4px;--dy:40px"/>
    <circle class="crumb" cx="114" cy="150" r="2.1" fill="var(--cookie)" style="--d:1.3s;--dx:10px;--dy:28px"/>
    <circle class="crumb" cx="96" cy="150" r="1.7" fill="var(--cookie)" style="--d:0.35s;--dx:-9px;--dy:36px"/>
    <circle class="crumb" cx="122" cy="152" r="1.8" fill="var(--cookie)" style="--d:0.85s;--dx:6px;--dy:40px"/>
    <circle class="crumb" cx="103" cy="153" r="1.5" fill="var(--cookie)" style="--d:1.45s;--dx:-2px;--dy:32px"/>
  </svg>
  <h1>We’re having a snack.</h1>
  <p>We’ll be right back! One Place is getting a fresh start.</p>
  <div class="name">One Place</div>
</section>
</main>
</body>
</html>

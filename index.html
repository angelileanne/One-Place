<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>One Place</title>
<style>
  :root {
    --bg: #f1f5ee; --surface: #ffffff; --line: #d9e3d6; --ink: #1d3a2c; --soft: #4d6a5a;
    --accent: #1f5c43; --accent-ink: #ffffff; --ok: #1f7a4d; --bad: #b3261e; --wait: #8a6a12;
    --tint: #e6efe3;
    --shadow: 0 1px 2px rgba(29,58,44,.08), 0 6px 18px rgba(29,58,44,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13201a; --surface: #1b2c24; --line: #2c4237; --ink: #e6f1e8; --soft: #a9c2b1;
      --accent: #7fd1a5; --accent-ink: #0f1f17; --ok: #7fd1a5; --bad: #ff8a80; --wait: #e6c66b;
      --tint: #22372d;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
  }
  .wrap { max-width: 36rem; margin: 0 auto; display: grid; gap: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 2px; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .build { font-size: .8rem; color: var(--soft); text-align: center; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); }
  h2 { margin: 0 0 4px; font-size: 1.1rem; }
  .hint { margin: 0 0 12px; color: var(--soft); font-size: .92rem; }
  .row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; margin-top: 7px; background: var(--wait); }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  .label { font-weight: 700; }
  .detail { color: var(--soft); font-size: .92rem; overflow-wrap: anywhere; }
  button, .filebtn {
    font: inherit; font-weight: 700; cursor: pointer; background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 12px; padding: 10px 16px; min-height: 44px;
    transition: transform .12s ease, opacity .12s ease; display: inline-flex; align-items: center; justify-content: center;
  }
  button:active, .filebtn:active { transform: scale(.97); }
  button:disabled { opacity: .5; cursor: default; }
  button.quiet, .filebtn.quiet { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button.small { min-height: 36px; padding: 6px 12px; font-size: .9rem; }
  button.link { background: none; color: var(--accent); padding: 4px 0; min-height: 32px; text-decoration: underline; }
  input[type="text"], input[type="email"], input[type="password"], input[type="tel"], input[type="number"], select, textarea {
    font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; min-height: 44px; width: 100%;
  }
  textarea { min-height: 80px; resize: vertical; }
  input[type="file"] { display: none; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .field { display: grid; gap: 4px; margin-bottom: 12px; }
  .field > span { font-weight: 700; font-size: .92rem; }
  .field small { color: var(--soft); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg label { flex: 1 1 8rem; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: flex; align-items: center; justify-content: center; min-height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-weight: 700; cursor: pointer; background: var(--bg); text-align: center; }
  .seg input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .seg input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .chip { min-height: 36px; padding: 4px 14px; border-radius: 999px; background: var(--tint); color: var(--ink); border: 1px solid var(--line); font-weight: 600; font-size: .92rem; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .banner { border-radius: 12px; padding: 10px 12px; background: var(--tint); margin-bottom: 12px; font-size: .95rem; }
  .banner.bad { color: var(--bad); border: 1px solid var(--bad); background: transparent; }
  .result { margin-top: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .result.bad { color: var(--bad); }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .thumb { position: relative; width: 84px; height: 84px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; display: block; }
  .thumb button { position: absolute; top: -6px; right: -6px; min-height: 28px; width: 28px; padding: 0; border-radius: 50%; font-size: 1rem; }
  details.item { border-top: 1px solid var(--line); padding: 8px 0; }
  details.item:first-of-type { border-top: 0; }
  details.item summary { cursor: pointer; font-weight: 700; min-height: 36px; display: flex; align-items: center; gap: 8px; }
  details.item .body { padding: 4px 0 8px; display: grid; gap: 8px; }
  .tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .tasks li { flex-wrap: wrap; background: var(--bg); border-radius: 10px; padding: 8px 12px; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
  .tasks .t { font-weight: 600; } .tasks .m { color: var(--soft); font-size: .88rem; }
  .tasks label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; width: 100%; }
  .tasks input[type="checkbox"] { width: 22px; height: 22px; margin-top: 2px; flex: none; accent-color: var(--accent); }
  .badge { font-size: .75rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--tint); color: var(--soft); margin-left: 6px; }
  details.entry { border-top: 1px solid var(--line); padding: 8px 0; }
  details.entry:first-of-type { border-top: 0; }
  details.entry summary { cursor: pointer; font-weight: 700; min-height: 32px; }
  details.entry p { margin: 6px 0 0; color: var(--soft); }
  .new { font-style: italic; text-decoration: underline; color: var(--accent); margin-left: 6px; font-weight: 700; }
  .month { margin: 8px 0 0; font-size: .85rem; color: var(--soft); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .toast-wrap { position: fixed; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; justify-content: center; padding: 0 16px; pointer-events: none; z-index: 20; }
  .toast { pointer-events: auto; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 14px; display: flex; gap: 8px; align-items: center; box-shadow: var(--shadow); font-weight: 600; max-width: 32rem; }
  .toast button { background: none; color: inherit; text-decoration: underline; padding: 4px 6px; min-height: 36px; border-radius: 8px; }
  .attn { display: grid; gap: 8px; }
  .attn-item { background: var(--bg); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
  .attn-item .where { font-size: .82rem; color: var(--soft); font-weight: 700; }
  .due { font-size: .88rem; font-weight: 700; }
  .due.over { color: var(--bad); }
  .tasks .snooze { flex-basis: 100%; }
  .snooze { display: grid; gap: 8px; padding-top: 6px; border-top: 1px dashed var(--line); }
  .snooze .chips { margin: 0; }
  .snooze .custom { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .snooze input[type="date"] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; min-height: 40px; }
  .empty { text-align: center; padding: 8px 4px; }
  .empty h3 { margin: 0 0 4px; font-size: 1.2rem; }
  .empty p { margin: 0; color: var(--soft); }
  .cal-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: space-between; margin-bottom: 8px; }
  .cal-title { font-weight: 800; font-size: 1.15rem; }
  .cal-month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { font-size: .75rem; font-weight: 700; color: var(--soft); text-align: center; }
  .cal-cell { min-height: 48px; border: 1px solid var(--line); border-radius: 8px; padding: 3px 4px; font-size: .72rem; overflow-wrap: anywhere; background: var(--bg); }
  .cal-cell.blank { border-color: transparent; background: none; }
  .cal-cell.today { border-color: var(--accent); }
  .cal-cell b { display: block; font-size: .78rem; }
  .cal-dot { display: block; color: var(--accent); font-size: .6rem; letter-spacing: 1px; line-height: 1.1; }
  .cal-ev { display: block; background: var(--tint); border-radius: 4px; padding: 0 3px; margin-top: 2px; }
  .cal-list { display: grid; gap: 6px; }
  .cal-day { border-top: 1px solid var(--line); padding-top: 6px; }
  .cal-day h3 { margin: 0; font-size: .95rem; }
  .cal-day div { font-size: .92rem; }
  .cal-year { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); }
  .muted { color: var(--soft); }
  @media print {
    body { background: #fff; color: #000; padding: 0; }
    .noprint { display: none !important; }
    .card { box-shadow: none; border: 0; padding: 0; background: #fff; }
    .cal-cell, .cal-ev { background: #fff; border-color: #999; color: #000; }
    .cal-dot { color: #000; }
    .cal-ev { border: 1px solid #bbb; }
    .cal-title, h2, h3, .muted { color: #000; }
  }
  @media (prefers-reduced-motion: reduce) { button, .filebtn { transition: none; } }
</style>

<body>
<div class="wrap">
  <div id="app" data-testid="app-shell"></div>
  <section class="card noprint" aria-labelledby="newTitle" data-testid="whats-new">
    <h2 id="newTitle">What’s new</h2>

  </section>
  <div class="build noprint" data-testid="build-tag" id="buildTag"></div>
</div>
<div class="toast-wrap noprint" id="toast"></div>
<script>
(function () {
  "use strict";

  // ---- Build info + changelog. Every build adds an entry here (newest first). ----
  var BUILD = { version: "0.3.0", phase: "Phase 3 · Reminders" };
  var CHANGELOG = [
    {
      month: "November 2026",
      entries: [
        {
          date: "Nov 5",
          title: "Reminders and a calendar",
          detail: "A “Needs attention this month” list on the home screen. Tap Done! (with an Undo), or snooze a task for 1 week, 2 weeks, 1 month, 3 months, or a date you pick. There’s also a weekly, monthly, and yearly calendar you can print.",
          isNew: true
        },
        {
          date: "Nov 5",
          title: "Sign in, rooms, and Plan my fix",
          detail: "Sign in with your email, name your home, add rooms, then snap a photo and get a plan. Every suggested task is yours to accept or skip, and nothing is scheduled until you say so."
        },
        {
          date: "Nov 5",
          title: "Fresh start",
          detail: "One Place was rebuilt from the ground up. The first build proved the app, the database, and the photo AI are connected."
        }
      ]
    }
  ];

  // ---- Config. The publishable key is designed to be public; the database rules (RLS) are what protect data. ----
  var SUPABASE_URL = "https://ykqnjpgbdwrenilwxkio.supabase.co";
  var SUPABASE_KEY = "sb_publishable_1TrviuurElOjjrQRY56oUg_yzgNwHiR";
  var AI_MODELS = ["gemini-flash-latest", "gemini-2.5-flash", "gemini-flash-lite-latest"];
  var SESSION_KEY = "oneplace.session";
  var ROOM_IDEAS = ["Kitchen", "Bathroom", "Bedroom", "Living room", "Garage", "Yard"];

  var state = { rerender: null, cal: { mode: "month", anchor: "" }, session: null, person: null, profile: null, rooms: [], items: [], tasks: [], filter: "all", notice: "" };

  // ---- Tiny helpers ----
  function $(id) { return document.getElementById(id); }
  function h(tag, props, kids) {
    var el = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      var v = props[k];
      if (v === undefined || v === null || v === false) return;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
      else if (k === "value") el.value = v;
      else el.setAttribute(k, v === true ? "" : v);
    });
    [].concat(kids || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return el;
  }
  function view(nodes) {
    var app = $("app");
    app.textContent = "";
    [].concat(nodes).forEach(function (n) { if (n) app.appendChild(n); });
    window.scrollTo(0, 0);
  }
  // ---- Dates (all local, as YYYY-MM-DD text) ----
  function isoOf(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parseIso(iso) { var p = iso.split("-"); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])); }
  function todayIso() { return isoOf(new Date()); }
  function addDaysIso(iso, n) { var d = parseIso(iso); d.setDate(d.getDate() + n); return isoOf(d); }
  function addMonthsIso(iso, n) {
    var d = parseIso(iso), day = d.getDate();
    d.setDate(1); d.setMonth(d.getMonth() + n);
    var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, last));
    return isoOf(d);
  }
  function diffDays(aIso, bIso) { return Math.round((parseIso(bIso) - parseIso(aIso)) / 86400000); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function isoIn(days) {
    var d = new Date();
    d.setDate(d.getDate() + days);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function niceDate(iso) {
    return new Date(iso + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function repeatText(days) {
    if (!days) return "one time";
    if (days === 7) return "weekly";
    if (days === 30) return "monthly";
    if (days === 365) return "yearly";
    if (days % 365 === 0) return "every " + (days / 365) + " years";
    if (days % 30 === 0 && days < 365) return "every " + (days / 30) + " months";
    return "every " + days + " days";
  }
  function roomName(id) {
    for (var i = 0; i < state.rooms.length; i++) if (state.rooms[i].id === id) return state.rooms[i].name;
    return "";
  }

  // ---- Session (email + password through Supabase Auth) ----
  function loadSession() {
    try { var s = JSON.parse(localStorage.getItem(SESSION_KEY)); return s && s.access_token ? s : null; } catch (e) { return null; }
  }
  function saveSession(s) {
    try { if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(SESSION_KEY); } catch (e) {}
  }
  function setSession(body, user) {
    state.session = {
      access_token: body.access_token,
      refresh_token: body.refresh_token,
      expires_at: Date.now() + (body.expires_in || 3600) * 1000,
      user: body.user || user || (state.session && state.session.user) || null
    };
    saveSession(state.session);
  }
  function authFetch(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ apikey: SUPABASE_KEY, "Content-Type": "application/json" }, opts.headers || {});
    return fetch(SUPABASE_URL + "/auth/v1/" + path, opts);
  }
  function readJson(res) { return res.json().catch(function () { return null; }); }

  var refreshing = null;
  function ensureFresh() {
    var s = state.session;
    if (!s) return Promise.reject(new Error("Please sign in."));
    if (s.expires_at - Date.now() > 60000) return Promise.resolve(s);
    if (!refreshing) {
      refreshing = authFetch("token?grant_type=refresh_token", { method: "POST", body: JSON.stringify({ refresh_token: s.refresh_token }) })
        .then(function (res) {
          return readJson(res).then(function (b) {
            if (!res.ok || !b || !b.access_token) throw new Error("Your sign-in expired. Please sign in again.");
            setSession(b);
            return state.session;
          });
        })
        .then(function (x) { refreshing = null; return x; }, function (e) { refreshing = null; signOutLocal(); throw e; });
    }
    return refreshing;
  }
  function api(base, path, opts) {
    opts = opts || {};
    return ensureFresh().then(function (s) {
      opts.headers = Object.assign({ apikey: SUPABASE_KEY, Authorization: "Bearer " + s.access_token }, opts.headers || {});
      if (typeof opts.body === "string" && !opts.headers["Content-Type"]) opts.headers["Content-Type"] = "application/json";
      return fetch(SUPABASE_URL + base + path, opts);
    });
  }
  function dbMessage(res, body) {
    var code = body && body.code;
    if (res.status === 401) return "Your sign-in expired. Please sign in again.";
    if (res.status === 403 || code === "42501") return "Supabase blocked this by its security rules.";
    if (code === "23505") return "That one already exists.";
    return "Supabase answered with an error (" + res.status + ")" + (body && body.message ? ": " + body.message : ".");
  }
  // Returns the parsed rows/row, or throws an Error with a plain-language message.
  function rest(path, opts) {
    return api("/rest/v1/", path, opts).then(function (res) {
      return readJson(res).then(function (body) {
        if (!res.ok) { var e = new Error(dbMessage(res, body)); e.code = body && body.code; throw e; }
        return body;
      });
    }, function (err) {
      if (err && /sign in/i.test(err.message)) throw err;
      throw new Error("Couldn’t reach Supabase. Check the internet connection, then try again.");
    });
  }
  var JSON_ONE = { Prefer: "return=representation" };

  // ---- Sign in / create account ----
  function signOutLocal() {
    state.session = null; state.person = null; state.profile = null;
    state.rooms = []; state.items = []; state.tasks = [];
    saveSession(null);
  }
  function signOut() {
    var s = state.session;
    if (s) authFetch("logout", { method: "POST", headers: { Authorization: "Bearer " + s.access_token } }).catch(function () {});
    signOutLocal();
    showAuth("signin");
  }
  function authMessage(res, body) {
    var text = body && (body.error_description || body.msg || body.message || "");
    var code = body && (body.error_code || body.code || "");
    if (/invalid login/i.test(text)) return "That email and password don’t match.";
    if (/not confirmed/i.test(text) || code === "email_not_confirmed") return "Please confirm your email first. Check your inbox for the link.";
    if (res.status === 429 || /rate limit/i.test(text) || code === "over_email_send_rate_limit") return "Too many emails were sent just now. Wait a few minutes and try again.";
    if (/already registered/i.test(text) || code === "user_already_exists") return "That email already has an account. Try signing in.";
    if (/password/i.test(text) && /(short|least|weak)/i.test(text)) return "Choose a password with at least 8 characters.";
    return text || ("Sign-in answered with an error (" + res.status + ").");
  }

  function showAuth(mode, note) {
    var isNew = mode === "signup";
    var msg = h("div", { class: "result", role: "status", "data-testid": "auth-message" }, note || "");
    var email = h("input", { type: "email", id: "authEmail", autocomplete: "email", required: true, "data-testid": "auth-email" });
    var pw = h("input", { type: "password", id: "authPw", autocomplete: isNew ? "new-password" : "current-password", minlength: "8", required: true, "data-testid": "auth-password" });
    var submit = h("button", { type: "submit", "data-testid": "auth-submit", text: isNew ? "Create account" : "Sign in" });

    var form = h("form", { novalidate: true }, [
      h("label", { class: "field" }, [h("span", { text: "Email" }), email]),
      h("label", { class: "field" }, [h("span", { text: "Password" }), pw, isNew ? h("small", { text: "At least 8 characters." }) : null]),
      submit, msg
    ]);
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var em = email.value.trim(), p = pw.value;
      msg.className = "result";
      if (!/^\S+@\S+\.\S+$/.test(em)) { msg.className = "result bad"; msg.textContent = "Type a full email address."; return; }
      if (p.length < 8) { msg.className = "result bad"; msg.textContent = "Choose a password with at least 8 characters."; return; }
      submit.disabled = true;
      msg.textContent = isNew ? "Creating your account…" : "Signing in…";
      var req = isNew
        ? authFetch("signup", { method: "POST", body: JSON.stringify({ email: em, password: p }) })
        : authFetch("token?grant_type=password", { method: "POST", body: JSON.stringify({ email: em, password: p }) });
      req.then(function (res) {
        return readJson(res).then(function (b) {
          if (!res.ok) throw new Error(authMessage(res, b));
          if (b && b.access_token) { setSession(b); return loadAll(); }
          // Account made, but the email must be confirmed before signing in.
          showAuth("signin", "Almost there! We sent a link to " + em + ". Tap it to confirm, then sign in here.");
        });
      }).catch(function (err) {
        msg.className = "result bad";
        msg.textContent = err instanceof TypeError || !err.message ? "Couldn’t reach the sign-in service. Check the internet connection." : err.message;
        submit.disabled = false;
      });
    });

    var forgot = h("button", { type: "button", class: "link", text: "Forgot your password?", onclick: function () {
      var em = email.value.trim();
      if (!/^\S+@\S+\.\S+$/.test(em)) { msg.className = "result bad"; msg.textContent = "Type your email above first, then tap this again."; return; }
      msg.className = "result"; msg.textContent = "Sending…";
      authFetch("recover", { method: "POST", body: JSON.stringify({ email: em }) }).then(function (res) {
        return readJson(res).then(function (b) {
          if (!res.ok) throw new Error(authMessage(res, b));

  // Sign-in and reset links come back to this page with the tokens after a "#".
  function takeLinkTokens() {
    var hash = location.hash.replace(/^#/, "");
    if (hash.indexOf("access_token=") === -1) return Promise.resolve(null);
    var q = {};
    hash.split("&").forEach(function (p) { var i = p.indexOf("="); if (i > 0) q[decodeURIComponent(p.slice(0, i))] = decodeURIComponent(p.slice(i + 1)); });
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    if (!q.access_token) return Promise.resolve(null);
    return fetch(SUPABASE_URL + "/auth/v1/user", { headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + q.access_token } })
      .then(readJson).then(function (user) {
        if (!user || !user.id) return null;
        setSession({ access_token: q.access_token, refresh_token: q.refresh_token, expires_in: Number(q.expires_in) || 3600 }, user);
        return q.type || "signin";
      }).catch(function () { return null; });
  }

  function snapshot(t) {

  // ---- Calendar ----
  function eventsBetween(fromIso, toIso) {
    var out = [];
    state.tasks.forEach(function (t) {
      if (t.status !== "active" || !t.due_on) return;
      var d = effDate(t), r = t.repeat_days;
      if (r && d < fromIso) d = addDaysIso(d, Math.ceil(diffDays(d, fromIso) / r) * r);
      for (var n = 0; n < 400 && d <= toIso; n++) {
        if (d >= fromIso) out.push({ date: d, task: t });
        if (!r) break;
        d = addDaysIso(d, r);
      }
    });
    return out.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }
  function evLabel(e) { var it = itemOf(e.task); return (it ? it.name + ": " : "") + e.task.title; }
  function longDate(iso) { return parseIso(iso).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" }); }

  function showCalendar() {
    state.rerender = showCalendar;
    $("newTitle").closest("section").hidden = true;
    var c = state.cal, mode = c.mode, anchor = c.anchor || todayIso(), a = parseIso(anchor), today = todayIso();
    var from, to, title;
    if (mode === "week") {
      from = addDaysIso(anchor, -a.getDay()); to = addDaysIso(from, 6);
      title = "Week of " + niceDate(from) + " – " + niceDate(to) + ", " + parseIso(to).getFullYear();
    } else if (mode === "year") {
      from = a.getFullYear() + "-01-01"; to = a.getFullYear() + "-12-31"; title = String(a.getFullYear());
    } else {
      from = a.getFullYear() + "-" + pad(a.getMonth() + 1) + "-01";
      to = isoOf(new Date(a.getFullYear(), a.getMonth() + 1, 0));
      title = a.toLocaleDateString(undefined, { month: "long", year: "numeric" });
    }
    var evs = eventsBetween(from, to);
    var body;
    function byDay() {
      var map = {};
      evs.forEach(function (e) { (map[e.date] = map[e.date] || []).push(e); });
      return map;
    }
    var map = byDay();
    if (mode === "month") {
      var cells = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map(function (n) { return h("div", { class: "cal-dow", text: n }); });
      var first = parseIso(from), last = parseIso(to).getDate();
      for (var b = 0; b < first.getDay(); b++) cells.push(h("div", { class: "cal-cell blank" }));
      for (var day = 1; day <= last; day++) {
        var iso = from.slice(0, 8) + pad(day);
        cells.push(h("div", { class: "cal-cell" + (iso === today ? " today" : "") }, [h("b", { text: String(day) }), (map[iso] || []).length ? h("span", { class: "cal-dot", "aria-hidden": "true", text: "●".repeat(Math.min(map[iso].length, 4)) }) : null]));
      }
      body = h("div", {}, [
        h("div", { class: "cal-month", "data-testid": "cal-month" }, cells),
        h("div", { class: "cal-list", style: "margin-top:12px", "data-testid": "cal-month-list" }, evs.length
          ? evs.map(function (e) { return h("div", { class: "cal-day" }, [h("div", { text: niceDate(e.date) + " — " + evLabel(e) })]); })
          : [h("div", { class: "muted", text: "Nothing planned this month." })])
      ]);
    } else if (mode === "week") {
      var days = [];
      for (var i = 0; i < 7; i++) {
        var di = addDaysIso(from, i);
        days.push(h("div", { class: "cal-day" }, [h("h3", { text: longDate(di) + (di === today ? " (today)" : "") })].concat(
          (map[di] || []).length ? map[di].map(function (e) { return h("div", { text: "• " + evLabel(e) }); }) : [h("div", { class: "muted", text: "Nothing planned" })])));
      }
      body = h("div", { class: "cal-list", "data-testid": "cal-week" }, days);
    } else {
      var months = [];
      for (var m = 0; m < 12; m++) {
        var mm = pad(m + 1), list = evs.filter(function (e) { return e.date.slice(5, 7) === mm; });
        months.push(h("div", { class: "cal-day" }, [h("h3", { text: new Date(a.getFullYear(), m, 1).toLocaleDateString(undefined, { month: "long" }) })].concat(
          list.length ? list.map(function (e) { return h("div", { text: niceDate(e.date) + " — " + evLabel(e) }); }) : [h("div", { class: "muted", text: "Nothing planned" })])));
      }
      body = h("div", { class: "cal-year", "data-testid": "cal-year" }, months);
    }
    function step(dir) {
      if (mode === "week") c.anchor = addDaysIso(anchor, 7 * dir);
      else if (mode === "year") c.anchor = addMonthsIso(anchor, 12 * dir);

      showCalendar();
    }
    view([
      h("header", { class: "noprint" }, [
        h("h1", { text: "Calendar" }),
        h("button", { type: "button", class: "quiet small", text: "Back", "data-testid": "cal-back", onclick: showHome })

  // ---- Photo AI (through our own server function; sign-in required) ----
  function callAIWith(model, parts, opts) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, opts.timeoutMs);
    return ensureFresh().then(function (s) {
      return fetch("/api/gemini", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + s.access_token },
        signal: ctrl.signal,
        body: JSON.stringify({ model: model, contents: [{ role: "user", parts: parts }], generationConfig: opts.config })
      });
    }).catch(function (err) {
      var e;
      if (err && err.name === "AbortError") e = new Error("That model took too long to answer.");
      else if (err && /sign in/i.test(err.message || "")) { e = err; e.fatal = true; }
      else { e = new Error("Couldn’t reach the app’s server function (/api/gemini)."); e.fatal = true; }
      throw e;
    }).then(function (res) {
      return readJson(res).then(function (body) {
        if (!res.ok) {
          var e = new Error((body && body.error) || ("The photo AI answered with an error (" + res.status + ")."));
          e.fatal = res.status === 500 || res.status === 401;
          throw e;
        }
        var cands = body && body.candidates;
        var ps = cands && cands[0] && cands[0].content && cands[0].content.parts;
        var text = (ps || []).map(function (p) { return p.text || ""; }).join("").trim();
        if (!text) throw new Error("The photo AI answered, but with nothing in it.");
        return text;
      });
    }).then(function (t) { clearTimeout(timer); return t; }, function (e) { clearTimeout(timer); throw e; });
  }
  // Tries each model in turn; if one is busy or slow, the next one gets a go.
  function callAI(parts, opts) {
    opts = Object.assign({ timeoutMs: 12000, config: { temperature: 0.2, maxOutputTokens: 400 } }, opts || {});
    var i = 0, last = null;
    function next() {
      if (i >= AI_MODELS.length) throw new Error("The photo AI is busy right now. Wait a minute and try again. (" + (last && last.message || "no details") + ")");
      if (i > 0 && opts.onBackup) opts.onBackup();
      return callAIWith(AI_MODELS[i++], parts, opts).catch(function (err) { if (err.fatal) throw err; last = err; return next(); });
    }
    return next();
  }

  function planPrompt(f) {
    var lines = [
      "You help a person plan upkeep and repairs for something in their " + (state.profile && state.profile.kind === "business" ? "business" : "home") + ".",
      f.name ? "They say the item is: \"" + f.name + "\". Treat that as certain and do not rename it. Use the photos only for brand, model, year, material and condition." : "They did not name the item. Work out what it is from the photos.",
      f.roomName ? "Room: " + f.roomName + "." : "",
      f.brand || f.model ? "Known so far: " + [f.brand, f.model, f.year].filter(Boolean).join(" ") + "." : "",
      f.problem ? "What they say is wrong: \"" + f.problem + "\"." : "They did not describe a problem.",
      "Reply with JSON only, in exactly this shape:",
      "{\"name\": string, \"brand\": string|null, \"model\": string|null, \"year\": number|null, \"plate_visible\": boolean, \"closeup_hint\": string|null, \"summary\": string, \"tasks\": [{\"title\": string, \"detail\": string, \"kind\": \"maintenance\"|\"repair\", \"repeat_days\": number|null, \"first_due_in_days\": number}]}",
      "Rules: never guess a brand, model or year; use null unless you can read it or it was given. plate_visible is true only if a model or serial plate or label is readable. If no model can be read, closeup_hint is one short sentence on where to photograph the plate on this kind of item, otherwise null. Give 3 to 6 tasks, repairs first if a problem was described. Titles under 60 characters, details one or two plain sentences. repeat_days is null for a one-time repair. first_due_in_days is 0 to 365."
    ];
    return lines.filter(Boolean).join("\n");
  }
  function parsePlan(text) {
    var t = text.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "");
    var data;
    try { data = JSON.parse(t); } catch (e) {
      var m = t.match(/\{[\s\S]*\}/);
      try { data = m ? JSON.parse(m[0]) : null; } catch (e2) { data = null; }
    }
    if (!data || typeof data !== "object") throw new Error("The photo AI answered, but I couldn’t read its plan. Try again.");
    function clean(s, n) { return typeof s === "string" && s.trim() ? s.trim().slice(0, n) : null; }
    var year = Number(data.year);
    var tasks = (Array.isArray(data.tasks) ? data.tasks : []).slice(0, 8).map(function (t) {
      var rd = Math.round(Number(t && t.repeat_days)), fd = Math.round(Number(t && t.first_due_in_days));
      return {
        title: clean(t && t.title, 160),
        detail: clean(t && t.detail, 1000),
        kind: t && t.kind === "repair" ? "repair" : "maintenance",
        repeat_days: rd >= 1 && rd <= 3660 ? rd : null,
        first_due_in_days: fd >= 0 && fd <= 365 ? fd : 30
      };
    }).filter(function (t) { return t.title; });
    return {
      name: clean(data.name, 120), brand: clean(data.brand, 80), model: clean(data.model, 80),
      year: year >= 1900 && year <= 2100 ? Math.round(year) : null,
      plateVisible: data.plate_visible === true, closeupHint: clean(data.closeup_hint, 300),
      summary: clean(data.summary, 300), tasks: tasks
    };
  }

  // ---- Photos ----
  function downscale(file, maxSide) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        var w = Math.round(img.width * scale), hgt = Math.round(img.height * scale);
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = hgt;
        canvas.getContext("2d").drawImage(img, 0, 0, w, hgt);
        var dataUrl = canvas.toDataURL("image/jpeg", 0.8);
        URL.revokeObjectURL(url);
        canvas.toBlob(function (blob) {
          if (!blob) return reject(new Error("That file couldn’t be read as a photo."));
          resolve({ dataUrl: dataUrl, base64: dataUrl.split(",")[1], blob: blob });
        }, "image/jpeg", 0.8);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("That file couldn’t be read as a photo.")); };
      img.src = url;
    });
  }
  function uid() {

      .then(function (res) {
        if (res.ok) return path;
        return readJson(res).then(function (b) { throw new Error("A photo didn’t upload" + (b && b.message ? ": " + b.message : " (" + res.status + ").")); });
      });
  }

    var status = h("div", { class: "result", role: "status" });
    var saveBtn = h("button", { type: "button", "data-testid": "review-save", text: "Save" });
    var allBtn = h("button", { type: "button", class: "quiet", "data-testid": "add-all", text: "Add all", onclick: function () { boxes.forEach(function (b) { b.cb.checked = true; }); } });
    var skipAll = h("button", { type: "button", class: "quiet", "data-testid": "skip-list", text: "Skip the whole list" });
    var backBtn = h("button", { type: "button", class: "quiet", text: "Back", onclick: function () { renderStep1(f); } });

    function fields() {
      var y = Number(year.value);
      return { name: name.value.trim(), brand: brand.value.trim(), model: model.value.trim(), year: y >= 1900 && y <= 2100 ? Math.round(y) : "" };
    }
    function go(acceptAll) {
      var fl = fields();
      if (!fl.name) { status.className = "result bad"; status.textContent = "Give the item a name."; return; }
      [saveBtn, allBtn, skipAll, backBtn].forEach(function (b) { b.disabled = true; });
      status.className = "result"; status.textContent = "Saving…";
      var items = plan.tasks.map(function (t, i) { return Object.assign({}, t, { accept: acceptAll === false ? false : boxes[i].cb.checked }); });
      saveItem(f, fl, items).catch(function (err) {
        [saveBtn, allBtn, skipAll, backBtn].forEach(function (b) { b.disabled = false; });
        status.className = "result bad"; status.textContent = "Not saved. " + err.message;
      });
    }
    saveBtn.addEventListener("click", function () { go(); });
    skipAll.addEventListener("click", function () { go(false); });

    var needPlate = f.files.length && !plan.plateVisible && !(plan.brand && plan.model);
    view(h("section", { class: "card", "data-testid": "add-item-flow" }, [
      h("h2", { text: "Here’s the plan" }),
      plan.summary ? h("p", { class: "hint", text: plan.summary }) : null,
      needPlate ? h("div", { class: "banner", role: "status", "data-testid": "plate-notice" }, [
        "I couldn’t see a model plate in these photos. " + (plan.closeupHint || "A close-up of the model plate would help."),
        h("div", { class: "actions" }, [h("button", { type: "button", class: "small quiet", text: "Add a close-up", onclick: function () { renderStep1(f); } })])
      ]) : null,
      h("label", { class: "field" }, [h("span", { text: "Name" }), name]),
      h("div", { class: "two" }, [
        h("label", { class: "field" }, [h("span", { text: "Brand" }), brand]),
        h("label", { class: "field" }, [h("span", { text: "Model" }), model])
      ]),
      h("label", { class: "field" }, [h("span", { text: "Year" }), year]),
      boxes.length
        ? h("div", {}, [h("h2", { text: "Suggested tasks" }), h("p", { class: "hint", text: "Tick the ones you want as reminders. The rest stay here as suggestions." }), h("ul", { class: "tasks", "data-testid": "suggestions" }, boxes.map(function (b) { return b.li; }))])
        : h("p", { class: "hint", text: "No tasks were suggested. You can still save the item." }),
      h("div", { class: "actions" }, boxes.length ? [saveBtn, allBtn, skipAll, backBtn] : [saveBtn, backBtn]),
      status
    ]));
  }

  // ---- Save: room -> photos -> item -> tasks ----
  function saveItem(f, fl, tasks) {
    var roomId, itemRow;
    return resolveRoom(f).then(function (rid) {
      roomId = rid;
      return Promise.all(f.files.map(function (p) { return uploadPhoto(p.blob); }));
    }).then(function (paths) {
      var y = Number(fl.year);
      return rest("items", { method: "POST", headers: JSON_ONE, body: JSON.stringify({
        profile_id: state.profile.id, room_id: roomId, name: fl.name,
        brand: fl.brand || null, model: fl.model || null, year: y >= 1900 && y <= 2100 ? Math.round(y) : null,
        problem: f.problem || null, photos: paths
      }) });
    }).then(function (rows) {
      itemRow = rows[0];
      if (!tasks.length) return null;
      return rest("maintenance_tasks", { method: "POST", headers: JSON_ONE, body: JSON.stringify(tasks.map(function (t) {
        return {
          profile_id: state.profile.id, item_id: itemRow.id, title: t.title, detail: t.detail, kind: t.kind,
          repeat_days: t.repeat_days, status: t.accept ? "active" : "suggested",
          due_on: t.accept ? isoIn(t.first_due_in_days) : null
        };
      })) }).catch(function (err) { throw new Error("The item saved, but its tasks didn’t: " + err.message); });
    }).then(function () {
      var kept = tasks.filter(function (t) { return t.accept; }).length;
      state.notice = "Saved! " + fl.name + " is in " + roomName(roomId) + (kept ? ", with " + kept + (kept === 1 ? " reminder." : " reminders.") : ".");
      state.filter = "all";
      return loadHome().then(showHome);
    });
  }

  // ---- What's new ----
  function renderChangelog() {
    var root = $("changelog");
    CHANGELOG.forEach(function (group) {
      root.appendChild(h("div", { class: "month", text: group.month }));
      group.entries.forEach(function (entry) {
        var s = h("summary", { text: entry.date + " · " + entry.title });
        if (entry.isNew) s.appendChild(h("span", { class: "new", text: "New!" }));
        root.appendChild(h("details", { class: "entry", "data-testid": "whats-new-entry" }, [s, h("p", { text: entry.detail })]));
      });
    });
  }

  // ---- Start ----
  $("buildTag").textContent = BUILD.phase + " · v" + BUILD.version;
  renderChangelog();
  state.session = loadSession();
  takeLinkTokens().then(function (type) {
    if (type === "recovery") return showNewPassword();
    if (state.session) return loadAll();
    showAuth("signin");
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>One Place</title>
<style>
  :root {
    --bg: #f1f5ee; --surface: #ffffff; --line: #d9e3d6; --ink: #1d3a2c; --soft: #4d6a5a;
    --accent: #1f5c43; --accent-ink: #ffffff; --ok: #1f7a4d; --bad: #b3261e; --wait: #8a6a12;
    --tint: #e6efe3;
    --shadow: 0 1px 2px rgba(29,58,44,.08), 0 6px 18px rgba(29,58,44,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13201a; --surface: #1b2c24; --line: #2c4237; --ink: #e6f1e8; --soft: #a9c2b1;
      --accent: #7fd1a5; --accent-ink: #0f1f17; --ok: #7fd1a5; --bad: #ff8a80; --wait: #e6c66b;
      --tint: #22372d;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 1rem/1.5 ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
  }
  .wrap { max-width: 36rem; margin: 0 auto; display: grid; gap: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 2px; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .build { font-size: .8rem; color: var(--soft); text-align: center; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); }
  h2 { margin: 0 0 4px; font-size: 1.1rem; }
  .hint { margin: 0 0 12px; color: var(--soft); font-size: .92rem; }
  .row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; margin-top: 7px; background: var(--wait); }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  .label { font-weight: 700; }
  .detail { color: var(--soft); font-size: .92rem; overflow-wrap: anywhere; }
  button, .filebtn {
    font: inherit; font-weight: 700; cursor: pointer; background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 12px; padding: 10px 16px; min-height: 44px;
    transition: transform .12s ease, opacity .12s ease; display: inline-flex; align-items: center; justify-content: center;
  }
  button:active, .filebtn:active { transform: scale(.97); }
  button:disabled { opacity: .5; cursor: default; }
  button.quiet, .filebtn.quiet { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button.small { min-height: 36px; padding: 6px 12px; font-size: .9rem; }
  button.link { background: none; color: var(--accent); padding: 4px 0; min-height: 32px; text-decoration: underline; }
  input[type="text"], input[type="email"], input[type="password"], input[type="tel"], input[type="number"], select, textarea {
    font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; min-height: 44px; width: 100%;
  }
  textarea { min-height: 80px; resize: vertical; }
  input[type="file"] { display: none; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .field { display: grid; gap: 4px; margin-bottom: 12px; }
  .field > span { font-weight: 700; font-size: .92rem; }
  .field small { color: var(--soft); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg label { flex: 1 1 8rem; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: flex; align-items: center; justify-content: center; min-height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-weight: 700; cursor: pointer; background: var(--bg); text-align: center; }
  .seg input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .seg input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .chip { min-height: 36px; padding: 4px 14px; border-radius: 999px; background: var(--tint); color: var(--ink); border: 1px solid var(--line); font-weight: 600; font-size: .92rem; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .banner { border-radius: 12px; padding: 10px 12px; background: var(--tint); margin-bottom: 12px; font-size: .95rem; }
  .banner.bad { color: var(--bad); border: 1px solid var(--bad); background: transparent; }
  .result { margin-top: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .result.bad { color: var(--bad); }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .thumb { position: relative; width: 84px; height: 84px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; display: block; }
  .thumb button { position: absolute; top: -6px; right: -6px; min-height: 28px; width: 28px; padding: 0; border-radius: 50%; font-size: 1rem; }
  details.item { border-top: 1px solid var(--line); padding: 8px 0; }
  details.item:first-of-type { border-top: 0; }
  details.item summary { cursor: pointer; font-weight: 700; min-height: 36px; display: flex; align-items: center; gap: 8px; }
  details.item .body { padding: 4px 0 8px; display: grid; gap: 8px; }
  .tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .tasks li { flex-wrap: wrap; background: var(--bg); border-radius: 10px; padding: 8px 12px; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
  .tasks .t { font-weight: 600; } .tasks .m { color: var(--soft); font-size: .88rem; }
  .tasks label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; width: 100%; }
  .tasks input[type="checkbox"] { width: 22px; height: 22px; margin-top: 2px; flex: none; accent-color: var(--accent); }
  .badge { font-size: .75rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--tint); color: var(--soft); margin-left: 6px; }
  details.entry { border-top: 1px solid var(--line); padding: 8px 0; }
  details.entry:first-of-type { border-top: 0; }
  details.entry summary { cursor: pointer; font-weight: 700; min-height: 32px; }
  details.entry p { margin: 6px 0 0; color: var(--soft); }
  .new { font-style: italic; text-decoration: underline; color: var(--accent); margin-left: 6px; font-weight: 700; }
  .month { margin: 8px 0 0; font-size: .85rem; color: var(--soft); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .toast-wrap { position: fixed; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; justify-content: center; padding: 0 16px; pointer-events: none; z-index: 20; }
  .toast { pointer-events: auto; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 14px; display: flex; gap: 8px; align-items: center; box-shadow: var(--shadow); font-weight: 600; max-width: 32rem; }
  .toast button { background: none; color: inherit; text-decoration: underline; padding: 4px 6px; min-height: 36px; border-radius: 8px; }
  .attn { display: grid; gap: 8px; }
  .attn-item { background: var(--bg); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
  .attn-item .where { font-size: .82rem; color: var(--soft); font-weight: 700; }
  .due { font-size: .88rem; font-weight: 700; }
  .due.over { color: var(--bad); }
  .tasks .snooze { flex-basis: 100%; }
  .snooze { display: grid; gap: 8px; padding-top: 6px; border-top: 1px dashed var(--line); }
  .snooze .chips { margin: 0; }
  .snooze .custom { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .snooze input[type="date"] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; min-height: 40px; }
  .empty { text-align: center; padding: 8px 4px; }
  .empty h3 { margin: 0 0 4px; font-size: 1.2rem; }
  .empty p { margin: 0; color: var(--soft); }
  .cal-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: space-between; margin-bottom: 8px; }
  .cal-title { font-weight: 800; font-size: 1.15rem; }
  .cal-month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { font-size: .75rem; font-weight: 700; color: var(--soft); text-align: center; }
  .cal-cell { min-height: 48px; border: 1px solid var(--line); border-radius: 8px; padding: 3px 4px; font-size: .72rem; overflow-wrap: anywhere; background: var(--bg); }
  .cal-cell.blank { border-color: transparent; background: none; }
  .cal-cell.today { border-color: var(--accent); }
  .cal-cell b { display: block; font-size: .78rem; }
  .cal-dot { display: block; color: var(--accent); font-size: .6rem; letter-spacing: 1px; line-height: 1.1; }
  .cal-ev { display: block; background: var(--tint); border-radius: 4px; padding: 0 3px; margin-top: 2px; }
  .cal-list { display: grid; gap: 6px; }
  .cal-day { border-top: 1px solid var(--line); padding-top: 6px; }
  .cal-day h3 { margin: 0; font-size: .95rem; }
  .cal-day div { font-size: .92rem; }
  .cal-year { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); }
  ul.plain, ol.plain { margin: 4px 0 8px; padding-left: 20px; display: grid; gap: 2px; }
  .part, .diy { display: grid; gap: 6px; padding: 8px 0; border-top: 1px solid var(--line); }
  .part:first-of-type { border-top: 0; }
  a.chip { text-decoration: none; display: inline-flex; align-items: center; }
  .help-box { margin-top: 8px; }
  .help-box .m { color: var(--soft); font-size: .92rem; }
  .muted { color: var(--soft); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: 8px; margin-top: 8px; }
  .tile { flex-direction: column; gap: 6px; background: var(--bg); color: var(--ink); border: 2px solid var(--line); padding: 10px 8px; }
  .tile[aria-checked="true"] { border-color: var(--accent); }
  .bubbles { display: flex; gap: 4px; }
  .bubble { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(128,128,128,.35); display: block; }
  .tname { font-size: .85rem; }
  details.sub { border-top: 1px solid var(--line); padding: 8px 0; }
  details.sub summary { cursor: pointer; font-weight: 700; min-height: 36px; display: flex; align-items: center; }
  @media print {
    body { background: #fff; color: #000; padding: 0; }
    .noprint { display: none !important; }
    .card { box-shadow: none; border: 0; padding: 0; background: #fff; }
    .cal-cell, .cal-ev { background: #fff; border-color: #999; color: #000; }
    .cal-dot { display: block; color: var(--accent); font-size: .6rem; letter-spacing: 1px; line-height: 1.1; }
  .cal-ev { border: 1px solid #bbb; }
    .cal-title, h2, h3, .muted { color: #000; }
  }

  .party { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.22); cursor: pointer; overflow: hidden; }
  .pbox { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  .pface { width: 120px; height: 120px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 6px 18px rgba(0,0,0,.35); background: #fff; animation: pjump 1.1s ease-in-out infinite; }
  .pface.waddle { animation: pwaddle .8s ease-in-out infinite; }
  .pscene { width: min(78vw, 300px); background: var(--surface); border: 3px solid var(--accent); border-radius: 22px; box-shadow: 0 6px 18px rgba(0,0,0,.35); overflow: hidden; }
  .pscene svg { display: block; width: 100%; height: auto; }
  .pdone { font: 900 2.6rem/1 "Chalkboard SE","Marker Felt","Comic Sans MS",ui-rounded,system-ui,sans-serif; color: var(--accent); background: var(--surface); border: 3px solid var(--accent); border-radius: 999px; padding: 6px 22px; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
  .pname { font-weight: 700; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .pp { position: absolute; top: 0; left: var(--x, 50%); font-size: var(--s, 22px); line-height: 1; animation-duration: var(--d, 2.4s); animation-delay: var(--dl, 0s); animation-fill-mode: both; animation-timing-function: ease-in; pointer-events: none; }
  .pp.fall { animation-name: pfall; } .pp.rise { top: 100%; animation-name: prise; animation-timing-function: ease-out; }
  .pp.burst { top: 42%; left: 50%; animation-name: pburst; animation-timing-function: ease-out; }
  .pp.chip { width: 10px; height: 14px; border-radius: 2px; font-size: 0; }
  @keyframes pfall { from { transform: translate(0,-12vh) rotate(0); opacity: 0; } 10% { opacity: 1; } to { transform: translate(var(--dx,0),115vh) rotate(380deg); opacity: 1; } }
  @keyframes prise { from { transform: translate(0,0) scale(.6); opacity: 0; } 15% { opacity: 1; } to { transform: translate(var(--dx,0),-115vh) scale(1.1); opacity: .9; } }
  @keyframes pburst { from { transform: translate(0,0) scale(.2); opacity: 0; } 15% { opacity: 1; } to { transform: translate(var(--dx),var(--dy)) scale(1) rotate(200deg); opacity: 0; } }
  @keyframes pjump { 0%,100% { transform: translateY(0) scale(1,1); } 25% { transform: translateY(-34px) scale(.96,1.04); } 50% { transform: translateY(0) scale(1.06,.94); } 75% { transform: translateY(-20px); } }
  @keyframes pwaddle { 0%,100% { transform: rotate(-9deg) translateX(-6px); } 50% { transform: rotate(9deg) translateX(6px); } }
  .zb { transform-origin: 44px 98px; animation: zbub 2.8s ease-in-out infinite; } .zb2 { animation-delay: 1.4s; }
  @keyframes zbub { 0% { transform: scale(.2); opacity: 0; } 45% { transform: scale(1.5); opacity: 1; } 85% { transform: translate(-6px,-10px) scale(1.8); opacity: .85; } 100% { transform: translate(-8px,-14px) scale(2); opacity: 0; } }
  .kbody { animation: kbreathe 3s ease-in-out infinite; } @keyframes kbreathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(2px); } }
  .snackico { width: 30px; height: 30px; border-radius: 50%; vertical-align: middle; margin-right: 8px; background: #fff; }
  @media (prefers-reduced-motion: reduce) { .pp { display: none; } .pface, .pface.waddle, .zb, .kbody { animation: none; } .zb { opacity: 1; transform: scale(1.3); } }

  .punchy { position: fixed; z-index: 15; width: 64px; height: 64px; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; transform-origin: 100% 100%; transition: transform .5s cubic-bezier(.3,.7,.3,1); filter: drop-shadow(0 3px 3px rgba(0,0,0,.28)); }
  .punchy[data-acting="1"] { transform: scale(1.7); }
  .punchy.dragging { cursor: grabbing; transition: none; }
  .punchy[hidden], .pocketpill[hidden] { display: none; }
  .pk { position: absolute; inset: 0; }
  .pk img, .pk svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; -webkit-user-drag: none; }
  .pk .armR { transform-origin: 71.9% 48.1%; } .pk .armL { transform-origin: 26.9% 48.1%; }
  .punchy:not([data-pose]) .rig, .punchy[data-pose="idle"] .rig { display: none; }
  .punchy[data-pose]:not([data-pose="idle"]) .rest { display: none; }
  .pk .gear { opacity: 0; transition: opacity .5s ease; } .punchy[data-pose="type"] .gear { opacity: 1; }
  .pk .body { animation: pbreathe 4.2s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes pbreathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.012,.99); } }
  .punchy[data-pose="wave"] .armR { animation: pwaveR 2.6s cubic-bezier(.45,0,.35,1) both; }
  .punchy[data-pose="wave"] .armL { animation: pwaveL 2.6s ease-in-out both; }
  .punchy[data-pose="wave"] .pk { animation: psway 2.6s ease-in-out both; }
  @keyframes pwaveR { 0% { transform: rotate(0); } 24% { transform: rotate(-122deg); } 36% { transform: rotate(-136deg); } 48% { transform: rotate(-118deg); } 60% { transform: rotate(-136deg); } 72% { transform: rotate(-120deg); } 82% { transform: rotate(-130deg); } 100% { transform: rotate(0); } }
  @keyframes pwaveL { 0%,100% { transform: rotate(0); } 25%,80% { transform: rotate(5deg); } }
  @keyframes psway { 0%,100% { transform: rotate(0); } 30% { transform: rotate(-2.5deg); } 60% { transform: rotate(1.5deg); } }
  .punchy[data-pose="flip"] .pk { animation: pflip 1.7s cubic-bezier(.4,.1,.3,1) both; transform-origin: 50% 56%; }
  .punchy[data-pose="flip"] .armR { animation: pflipR 1.7s ease-in-out both; } .punchy[data-pose="flip"] .armL { animation: pflipL 1.7s ease-in-out both; }
  @keyframes pflip { 0% { transform: translateY(0) scale(1,1) rotate(0); } 14% { transform: translateY(2%) scale(1.05,.93) rotate(0); } 52% { transform: translateY(-62%) scale(1,1) rotate(-200deg); } 86% { transform: translateY(-6%) scale(1,1) rotate(-350deg); } 93% { transform: translateY(1%) scale(1.05,.94) rotate(-360deg); } 100% { transform: translateY(0) scale(1,1) rotate(-360deg); } }
  @keyframes pflipR { 0%,12% { transform: rotate(0); } 40%,70% { transform: rotate(-38deg); } 100% { transform: rotate(0); } }
  @keyframes pflipL { 0%,12% { transform: rotate(0); } 40%,70% { transform: rotate(38deg); } 100% { transform: rotate(0); } }
  .punchy[data-pose="type"] .armR { animation: ptypeR .5s ease-in-out infinite alternate; transform: rotate(41deg); }
  .punchy[data-pose="type"] .armL { animation: ptypeL .5s ease-in-out .25s infinite alternate; transform: rotate(-41deg); }
  .punchy[data-pose="type"] .pk .body { animation: ptypeHead 1.6s ease-in-out infinite; }
  @keyframes ptypeR { from { transform: rotate(41deg); } to { transform: rotate(47deg); } } @keyframes ptypeL { from { transform: rotate(-41deg); } to { transform: rotate(-47deg); } }
  @keyframes ptypeHead { 0%,100% { transform: rotate(0) translateY(0); } 50% { transform: rotate(1.2deg) translateY(.6%); } }
  .punchy[data-pose="clap"] .armR { animation: pclapR 1.5s ease-in-out both; } .punchy[data-pose="clap"] .armL { animation: pclapL 1.5s ease-in-out both; }
  .punchy[data-pose="clap"] .pk { animation: phop 1.5s ease-in-out both; }
  @keyframes pclapR { 0% { transform: rotate(0); } 25%,55%,85% { transform: rotate(64deg); } 40%,70% { transform: rotate(48deg); } 100% { transform: rotate(0); } }
  @keyframes pclapL { 0% { transform: rotate(0); } 25%,55%,85% { transform: rotate(-64deg); } 40%,70% { transform: rotate(-48deg); } 100% { transform: rotate(0); } }
  @keyframes phop { 0%,100% { transform: translateY(0); } 40%,70% { transform: translateY(-3%); } }
  .pocketlink { position: fixed; z-index: 15; font-size: .72rem; color: var(--soft); background: none; border: 0; text-decoration: underline; padding: 2px 4px; min-height: 0; opacity: .85; }
  .pocketpill { position: fixed; right: 12px; bottom: 12px; z-index: 15; font-size: .78rem; padding: 6px 12px; border-radius: 999px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow); min-height: 0; }
  @media (prefers-reduced-motion: reduce) { .pk, .pk .body, .pk .armR, .pk .armL { animation: none !important; transition: none; } .punchy { transition: none; } }
  @media (prefers-reduced-motion: reduce) { button, .filebtn { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div id="app" data-testid="app-shell"></div>
  <section class="card noprint" aria-labelledby="newTitle" data-testid="whats-new">
    <h2 id="newTitle">What’s new</h2>
    <div id="changelog"></div>
  </section>
  <div class="build noprint" data-testid="build-tag" id="buildTag"></div>
</div>
<div class="toast-wrap noprint" id="toast"></div>
<script>
(function () {
  "use strict";

  // ---- Build info + changelog. Every build adds an entry here (newest first). ----
  var BUILD = { version: "0.8.2", phase: "Phase 8 · Joy layer" };
  var CHANGELOG = [
    {
      month: "November 2026",
      entries: [
        {
          date: "Nov 6",
          title: "Punchy the helper",
          detail: "Punchy lives in the corner of your screen. Tap him to wave, tap again for a backflip, and drag him wherever you like (he remembers his spot). He types on his laptop with orange headphones while you fill things in, and claps when something saves. After you\u2019ve seen both tricks, a tiny \u201cput me in your pocket\u201d link lets you tuck him away.",
          isNew: true
        },
        {
          date: "Nov 6",
          title: "Stay signed in",
          detail: "Sign in once and One Place remembers you on this device (untick \u201cKeep me signed in\u201d on a shared phone). Your email is filled in next time, and losing internet no longer signs you out.",
          isNew: false
        },
        {
          date: "Nov 6",
          title: "Plushie squad: celebrations and a Why page",
          detail: "Finish a task and one of the plushies celebrates (silent, and calmer if your device asks for less motion). Everyone takes turns. A plushie also rotates onto the \u201cWhy I created One Place\u201d button at the bottom of home. Search What\u2019s new to find any fix.",
          isNew: false
        },
        {
          date: "Nov 6",
          title: "Vehicles, phones, pets and printing",
          detail: "Find \u201cMore to keep track of\u201d on home. Add a car, phone, pet or printer, set reminders like oil change, vet visit or ink check, and they show up in Needs attention and the calendar.",
          isNew: false
        },
        {

  // ---- Photo AI (through our own server function; sign-in required) ----
  function callAIWith(model, parts, opts) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, opts.timeoutMs);
    return ensureFresh().then(function (s) {
      return fetch("/api/gemini", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + s.access_token },
        signal: ctrl.signal,
        body: JSON.stringify({ model: model, contents: [{ role: "user", parts: parts }], generationConfig: opts.config })
      });
    }).catch(function (err) {
      var e;
      if (err && err.name === "AbortError") e = new Error("That model took too long to answer.");
      else if (err && /sign in/i.test(err.message || "")) { e = err; e.fatal = true; }
      else { e = new Error("Couldn’t reach the app’s server function (/api/gemini)."); e.fatal = true; }
      throw e;
    }).then(function (res) {
      return readJson(res).then(function (body) {
        if (!res.ok) {
          var e = new Error((body && body.error) || ("The photo AI answered with an error (" + res.status + ")."));
          e.fatal = res.status === 500 || res.status === 401;
          throw e;
        }
        var cands = body && body.candidates;
        var ps = cands && cands[0] && cands[0].content && cands[0].content.parts;
        var text = (ps || []).map(function (p) { return p.text || ""; }).join("").trim();
        if (!text) throw new Error("The photo AI answered, but with nothing in it.");
        return text;
      });
    }).then(function (t) { clearTimeout(timer); return t; }, function (e) { clearTimeout(timer); throw e; });
  }
  // Tries each model in turn; if one is busy or slow, the next one gets a go.
  function callAI(parts, opts) {
    opts = Object.assign({ timeoutMs: 12000, config: { temperature: 0.2, maxOutputTokens: 400 } }, opts || {});
    var i = 0, last = null;
    function next() {
      if (i >= AI_MODELS.length) throw new Error("The photo AI is busy right now. Wait a minute and try again. (" + (last && last.message || "no details") + ")");
      if (i > 0 && opts.onBackup) opts.onBackup();
      return callAIWith(AI_MODELS[i++], parts, opts).catch(function (err) { if (err.fatal) throw err; last = err; return next(); });
    }
    return next();
  }

  // ---- Photos ----
  function downscale(file, maxSide) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        var w = Math.round(img.width * scale), hgt = Math.round(img.height * scale);
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = hgt;
        canvas.getContext("2d").drawImage(img, 0, 0, w, hgt);
        var dataUrl = canvas.toDataURL("image/jpeg", 0.8);
        URL.revokeObjectURL(url);
        canvas.toBlob(function (blob) {
          if (!blob) return reject(new Error("That file couldn’t be read as a photo."));
          resolve({ dataUrl: dataUrl, base64: dataUrl.split(",")[1], blob: blob });
        }, "image/jpeg", 0.8);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("That file couldn’t be read as a photo.")); };
      img.src = url;
    });
  }

  function resolveRoom(f) {
    if (f.roomId && f.roomId !== "__new") return Promise.resolve(f.roomId);
    return addRoom(f.newRoom).then(function (r) { return r.id; });
  }

  function renderStep1(f) {
    var name = h("input", { type: "text", maxlength: "120", value: f.name, placeholder: "e.g. Oven, toilet, stair railing", "data-testid": "add-item-name" });
    var roomSel = h("select", { "data-testid": "add-item-room" },
      [h("option", { value: "", text: "Choose a room" })]
        .concat(state.rooms.map(function (r) { return h("option", { value: r.id, text: r.name }); }))
        .concat([h("option", { value: "__new", text: "+ New room…" })]));
    roomSel.value = f.roomId;
    var newRoom = h("input", { type: "text", maxlength: "60", value: f.newRoom, placeholder: "Room name, like Guest Bathroom", "aria-label": "New room name", style: "margin-top:8px", "data-testid": "add-item-new-room" });
    function syncRoom() { newRoom.style.display = roomSel.value === "__new" ? "" : "none"; }
    roomSel.addEventListener("change", syncRoom); syncRoom();
    var problem = h("textarea", { maxlength: "1000", placeholder: "e.g. The oven light is out", "data-testid": "add-item-problem" });
    problem.value = f.problem;

    var thumbs = h("div", { class: "thumbs" });
    var count = h("div", { class: "detail" });
    var photoMsg = h("div", { class: "result", role: "status" });
    function drawThumbs() {
      thumbs.textContent = "";
      f.files.forEach(function (p, idx) {
        thumbs.appendChild(h("div", { class: "thumb" }, [
          h("img", { src: p.dataUrl, alt: "Chosen photo " + (idx + 1) }),
          h("button", { type: "button", "aria-label": "Remove photo " + (idx + 1), text: "×", onclick: function () { f.files.splice(idx, 1); drawThumbs(); } })
        ]));
      });
      count.textContent = f.files.length + " of " + MAX_PHOTOS + " photos";
      addLabel.style.display = f.files.length >= MAX_PHOTOS ? "none" : "";
    }
    var fileInput = h("input", { type: "file", id: "addPhotos", accept: "image/*", multiple: true, "data-testid": "add-item-photos" });
    var addLabel = h("label", { class: "filebtn quiet", for: "addPhotos", text: "Add photos" });
    fileInput.addEventListener("change", function () {
      var picked = [].slice.call(fileInput.files || []).slice(0, MAX_PHOTOS - f.files.length);
      var tooMany = (fileInput.files || []).length > picked.length;
      fileInput.value = "";
      photoMsg.className = "result"; photoMsg.textContent = picked.length ? "Getting your photos ready…" : "";
      Promise.all(picked.map(function (file) { return downscale(file, 900).then(function (p) { return p; }, function (e) { return { error: e.message }; }); })).then(function (res) {
        var bad = res.filter(function (r) { return r.error; })[0];
        res.filter(function (r) { return !r.error; }).forEach(function (r) { f.files.push(r); });
        drawThumbs();
        photoMsg.className = bad ? "result bad" : "result";
        photoMsg.textContent = bad ? bad.error : (tooMany ? "Only " + MAX_PHOTOS + " photos fit. The rest were left out." : "");
      });
    });

    var status = h("div", { class: "result", role: "status", "data-testid": "add-item-status" });
    var planBtn = h("button", { type: "button", "data-testid": "plan-submit", text: "Plan my fix" });
    var skipBtn = h("button", { type: "button", class: "quiet", "data-testid": "save-without-plan", text: "Save without a plan" });
    var backBtn = h("button", { type: "button", class: "quiet", text: "Back", onclick: function () { showHome(); } });

    function collect() {
      f.name = name.value.trim(); f.problem = problem.value.trim();
      f.roomId = roomSel.value; f.newRoom = newRoom.value.trim();
    }
    function fail(msg) { status.className = "result bad"; status.textContent = msg; }
    function roomOk() {
      if (!f.roomId) { fail("Choose a room first."); return false; }
      if (f.roomId === "__new" && !f.newRoom) { fail("Type a name for the new room."); return false; }
      return true;
    }
    function busy(on) { [planBtn, skipBtn, backBtn].forEach(function (b) { b.disabled = on; }); }

    planBtn.addEventListener("click", function () {
      collect(); status.className = "result";
      if (!f.name && !f.files.length) return fail("Add a photo or type what the item is.");
      if (!roomOk()) return;
      f.roomName = f.roomId === "__new" ? f.newRoom : roomName(f.roomId);
      busy(true);
      var onBackup = false;
      status.textContent = "Looking at your item…";
      var slow = setTimeout(function () { if (!onBackup) status.textContent = "Let me think harder about this, one moment…"; }, 6000);
      var parts = [{ text: planPrompt(f) }].concat(f.files.map(function (p) { return { inline_data: { mime_type: "image/jpeg", data: p.base64 } }; }));
      callAI(parts, { timeoutMs: 30000, config: { temperature: 0.2, maxOutputTokens: 2048, responseMimeType: "application/json" },
        onBackup: function () { onBackup = true; status.textContent = "That model is busy. Trying a backup…"; } })
        .then(parsePlan).then(function (plan) { clearTimeout(slow); f.plan = plan; renderReview(f); })
        .catch(function (err) {
          clearTimeout(slow); busy(false);
          if (/sign in/i.test(err.message)) { showAuth("signin", err.message); return; }
          fail(err.message + " You can still save the item without a plan.");
        });
    });
    skipBtn.addEventListener("click", function () {
      collect(); status.className = "result";
      if (!f.name) return fail("Type what the item is first.");
      if (!roomOk()) return;
      busy(true); status.textContent = "Saving…";
      saveItem(f, { name: f.name, brand: f.brand, model: f.model, year: f.year }, []).catch(function (err) { busy(false); fail("Not saved. " + err.message); });
    });

    drawThumbs();
    view(h("section", { class: "card", "data-testid": "add-item-flow" }, [
      h("h2", { text: f.another ? "Add another " + (f.name || "item").toLowerCase() : "Plan my fix" }),
      h("p", { class: "hint", text: "Tell me what it is and add a photo or two. I’ll suggest a plan, and you choose what to keep." }),
      h("label", { class: "field" }, [h("span", { text: "What is it?" }), name]),
      h("label", { class: "field" }, [h("span", { text: "Which room?" }), roomSel, newRoom]),
      h("div", { class: "field" }, [h("span", { text: "Photos (up to 6)" }), h("div", { class: "actions" }, [addLabel, fileInput]), thumbs, count, photoMsg,
        h("small", { text: "Include the model plate or label if you can see one." })]),
      h("label", { class: "field" }, [h("span", { text: "What’s wrong? (optional)" }), problem]),
      h("div", { class: "actions" }, [planBtn, skipBtn, backBtn]),
      status
    ]));
  }

  // ---- Add an item: step 2 (review the plan) ----
  function renderReview(f) {
    var plan = f.plan;
    var name = h("input", { type: "text", maxlength: "120", value: f.name || plan.name || "", "data-testid": "review-name" });
    var brand = h("input", { type: "text", maxlength: "80", value: f.brand || plan.brand || "" });
    var model = h("input", { type: "text", maxlength: "80", value: f.model || plan.model || "" });
    var year = h("input", { type: "number", min: "1900", max: "2100", inputmode: "numeric", value: f.year || plan.year || "" });
    var boxes = plan.tasks.map(function (t) {
      var cb = h("input", { type: "checkbox", "data-testid": "task-accept", "aria-label": "Add " + t.title });
      var li = h("li", {}, [h("label", {}, [cb, h("div", {}, [
        h("div", { class: "t", text: t.title }),
        h("div", { class: "m", text: (t.kind === "repair" ? "Repair" : "Upkeep") + " · " + repeatText(t.repeat_days) + (t.kind === "repair" || t.repeat_days === null ? "" : " · first due " + niceDate(isoIn(t.first_due_in_days))) }),
        t.detail ? h("div", { class: "m", text: t.detail }) : null
      ])])]);
      return { cb: cb, li: li };
    });

    var status = h("div", { class: "result", role: "status" });
    var saveBtn = h("button", { type: "button", "data-testid": "review-save", text: "Save" });
    var allBtn = h("button", { type: "button", class: "quiet", "data-testid": "add-all", text: "Add all", onclick: function () { boxes.forEach(function (b) { b.cb.checked = true; }); } });
    var skipAll = h("button", { type: "button", class: "quiet", "data-testid": "skip-list", text: "Skip the whole list" });
    var backBtn = h("button", { type: "button", class: "quiet", text: "Back", onclick: function () { renderStep1(f); } });

    function fields() {
      var y = Number(year.value);
      return { name: name.value.trim(), brand: brand.value.trim(), model: model.value.trim(), year: y >= 1900 && y <= 2100 ? Math.round(y) : "" };
    }
    function go(acceptAll) {
      var fl = fields();
      if (!fl.name) { status.className = "result bad"; status.textContent = "Give the item a name."; return; }
      [saveBtn, allBtn, skipAll, backBtn].forEach(function (b) { b.disabled = true; });
      status.className = "result"; status.textContent = "Saving…";
      var items = plan.tasks.map(function (t, i) { return Object.assign({}, t, { accept: acceptAll === false ? false : boxes[i].cb.checked }); });
      saveItem(f, fl, items).catch(function (err) {
        [saveBtn, allBtn, skipAll, backBtn].forEach(function (b) { b.disabled = false; });
        status.className = "result bad"; status.textContent = "Not saved. " + err.message;
      });
    }
    saveBtn.addEventListener("click", function () { go(); });
    skipAll.addEventListener("click", function () { go(false); });

    var needPlate = f.files.length && !plan.plateVisible && !(plan.brand && plan.model);
    view(h("section", { class: "card", "data-testid": "add-item-flow" }, [
      h("h2", { text: "Here’s the plan" }),
      plan.summary ? h("p", { class: "hint", text: plan.summary }) : null,
      needPlate ? h("div", { class: "banner", role: "status", "data-testid": "plate-notice" }, [
        "I couldn’t see a model plate in these photos. " + (plan.closeupHint || "A close-up of the model plate would help."),
        h("div", { class: "actions" }, [h("button", { type: "button", class: "small quiet", text: "Add a close-up", onclick: function () { renderStep1(f); } })])
      ]) : null,
      h("label", { class: "field" }, [h("span", { text: "Name" }), name]),
      h("div", { class: "two" }, [
        h("label", { class: "field" }, [h("span", { text: "Brand" }), brand]),
        h("label", { class: "field" }, [h("span", { text: "Model" }), model])
      ]),
      h("label", { class: "field" }, [h("span", { text: "Year" }), year]),
      boxes.length
        ? h("div", {}, [h("h2", { text: "Suggested tasks" }), h("p", { class: "hint", text: "Tick the ones you want as reminders. The rest stay here as suggestions." }), h("ul", { class: "tasks", "data-testid": "suggestions" }, boxes.map(function (b) { return b.li; }))])
        : h("p", { class: "hint", text: "No tasks were suggested. You can still save the item." }),
      h("div", { class: "actions" }, boxes.length ? [saveBtn, allBtn, skipAll, backBtn] : [saveBtn, backBtn]),
      status
    ]));
  }

  // ---- Save: room -> photos -> item -> tasks ----
  function saveItem(f, fl, tasks) {
    var roomId, itemRow;
    return resolveRoom(f).then(function (rid) {
      roomId = rid;
      return Promise.all(f.files.map(function (p) { return uploadPhoto(p.blob); }));
    }).then(function (paths) {
      var y = Number(fl.year);
      return rest("items", { method: "POST", headers: JSON_ONE, body: JSON.stringify({
        profile_id: state.profile.id, room_id: roomId, name: fl.name,
        brand: fl.brand || null, model: fl.model || null, year: y >= 1900 && y <= 2100 ? Math.round(y) : null,
        problem: f.problem || null, photos: paths
      }) });
    }).then(function (rows) {
      itemRow = rows[0];
      if (!tasks.length) return null;
      return rest("maintenance_tasks", { method: "POST", headers: JSON_ONE, body: JSON.stringify(tasks.map(function (t) {
        return {
          profile_id: state.profile.id, item_id: itemRow.id, title: t.title, detail: t.detail, kind: t.kind,
          repeat_days: t.repeat_days, status: t.accept ? "active" : "suggested",
          due_on: t.accept ? isoIn(t.first_due_in_days) : null
        };
      })) }).catch(function (err) { throw new Error("The item saved, but its tasks didn’t: " + err.message); });
    }).then(function () {
      var kept = tasks.filter(function (t) { return t.accept; }).length;
      state.notice = "Saved! " + fl.name + " is in " + roomName(roomId) + (kept ? ", with " + kept + (kept === 1 ? " reminder." : " reminders.") : ".");
      state.filter = "all";
      return loadHome().then(showHome);
    });
  }

    }
    var idx = st.bag.pop();

  var PUNCHY_GEAR = '<svg class="gear" viewBox="0 0 1600 1600" aria-hidden="true"><defs><linearGradient id="lap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe3e8"/><stop offset="1" stop-color="#aab1b9"/></linearGradient><linearGradient id="hp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa64d"/><stop offset="1" stop-color="#e0741a"/></linearGradient></defs>'
    + '<path d="M455 575 C395 340 560 172 800 168 C1040 172 1205 340 1145 575" fill="none" stroke="#b8590f" stroke-width="40" stroke-linecap="round" opacity=".55"/><path d="M455 575 C395 340 560 172 800 168 C1040 172 1205 340 1145 575" fill="none" stroke="url(#hp)" stroke-width="30" stroke-linecap="round"/>'
    + '<g><ellipse cx="452" cy="612" rx="60" ry="88" fill="#b8590f"/><ellipse cx="456" cy="610" rx="50" ry="78" fill="url(#hp)"/><ellipse cx="440" cy="590" rx="14" ry="30" fill="#fff" opacity=".28"/><ellipse cx="1148" cy="612" rx="60" ry="88" fill="#b8590f"/><ellipse cx="1144" cy="610" rx="50" ry="78" fill="url(#hp)"/><ellipse cx="1132" cy="590" rx="14" ry="30" fill="#fff" opacity=".28"/></g>'
    + '<ellipse cx="800" cy="1346" rx="360" ry="26" fill="#000" opacity=".16"/><rect x="480" y="1118" width="640" height="220" rx="30" fill="url(#lap)" stroke="#8d949c" stroke-width="5"/><rect x="480" y="1318" width="640" height="26" rx="12" fill="#8d949c"/><circle cx="800" cy="1228" r="22" fill="#f2f4f6" opacity=".7"/></svg>';
  function punchyBuild() {
    var el = h("div", { class: "punchy noprint", "data-testid": "punchy", role: "img", "aria-label": "Punchy, the little helper" });
    el.innerHTML = '<div class="pk"><img class="rest" alt="" src="' + PUNCHY_IMG.full + '"><div class="rig" style="position:absolute;inset:0"><img class="body" alt="" src="' + PUNCHY_IMG.noarm + '"></div></div>';
    var pk = el.firstChild, rig = pk.querySelector(".rig");
    // gear sits between body and arms; arms on top.
    var gear = document.createElement("div"); gear.style.cssText = "position:absolute;inset:0"; gear.innerHTML = PUNCHY_GEAR; rig.appendChild(gear);
    ["armL", "armR"].forEach(function (c) { var a = document.createElement("img"); a.className = c; a.alt = ""; a.src = PUNCHY_IMG[c]; rig.appendChild(a); });
    return el;
  }
  function punchyPose(name, ms, after) {
    var el = punchy.el; if (!el) return;
    clearTimeout(punchy.timer); el.setAttribute("data-pose", name);
    el.setAttribute("data-acting", name === "idle" ? "0" : "1");
    if (ms) punchy.timer = setTimeout(function () { punchyPose(punchy.typing ? "type" : "idle"); if (after) after(); }, ms);
  }
  function punchySave() { lsSetJson(PUNCHY_KEY, { x: punchy.x, y: punchy.y, pocket: punchy.pocket, seenWave: punchy.seenWave, seenFlip: punchy.seenFlip }); }
  function punchyPlace() {
    var el = punchy.el, w = window.innerWidth, hh = window.innerHeight, size = 64;
    var x = punchy.x === null ? w - size - 10 : punchy.x * (w - size), y = punchy.y === null ? hh - size - 12 : punchy.y * (hh - size);
    x = Math.max(0, Math.min(w - size, x)); y = Math.max(0, Math.min(hh - size, y));
    el.style.left = x + "px"; el.style.top = y + "px";
    punchyLink(x, y, size);
  }
  function punchyLink(x, y, size) {
    var l = punchy.link; if (!l) return;
    l.hidden = punchy.pocket || !(punchy.seenWave && punchy.seenFlip);
    var w = window.innerWidth; l.style.top = Math.min(window.innerHeight - 22, y + size + 2) + "px";
    l.style.left = Math.max(2, Math.min(w - (l.offsetWidth || 120) - 6, x - 22)) + "px";
  }
  function punchyTap() {
    if (punchy.pose === "flip" || punchy.pose === "wave") return;
    var next = punchy.seenWave && !punchy.nextIsWave ? "flip" : "wave";
    if (!punchy.seenWave) next = "wave"; else if (!punchy.seenFlip) next = "flip"; else next = punchy.lastWasWave ? "flip" : "wave";
    punchy.lastWasWave = next === "wave";
    punchy.pose = next;
    punchyPose(next, next === "wave" ? 2700 : 1800, function () { punchy.pose = "idle"; if (next === "wave") punchy.seenWave = true; else punchy.seenFlip = true; punchySave(); punchyPlace(); });
  }
  function punchySetTyping(on) {
    punchy.typing = on; if (!punchy.el || punchy.pocket) return;
    if (punchy.pose === "wave" || punchy.pose === "flip" || punchy.pose === "clap") return;
    punchyPose(on ? "type" : "idle");
  }
  function punchyClap() {
    if (!punchy.el || punchy.pocket || punchy.pose === "wave" || punchy.pose === "flip") return;
    punchy.pose = "clap"; punchyPose("clap", 1600, function () { punchy.pose = "idle"; });
  }
  function punchyPocket(on) {
    punchy.pocket = on; punchy.el.hidden = on; punchy.pill.hidden = !on; punchySave(); punchyPlace();
  }
  function startPunchy() {
    var st = lsGetJson(PUNCHY_KEY, {});
    punchy.x = typeof st.x === "number" ? st.x : null; punchy.y = typeof st.y === "number" ? st.y : null;
    punchy.pocket = !!st.pocket; punchy.seenWave = !!st.seenWave; punchy.seenFlip = !!st.seenFlip; punchy.typing = false;
    var el = punchy.el = punchyBuild(); document.body.appendChild(el);
    punchy.link = h("button", { type: "button", class: "pocketlink noprint", text: "put me in your pocket", "data-testid": "punchy-pocket", hidden: true, onclick: function () { punchyPocket(true); } }); document.body.appendChild(punchy.link);
    punchy.pill = h("button", { type: "button", class: "pocketpill noprint", text: "Muse is in your pocket", "data-testid": "punchy-restore", hidden: true, onclick: function () { punchyPocket(false); } }); document.body.appendChild(punchy.pill);
    var drag = null;
    el.addEventListener("pointerdown", function (e) { drag = { sx: e.clientX, sy: e.clientY, ox: el.offsetLeft, oy: el.offsetTop, moved: false }; try { el.setPointerCapture(e.pointerId); } catch (x) {} });
    el.addEventListener("pointermove", function (e) {
      if (!drag) return; var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 7) return;
      drag.moved = true; el.classList.add("dragging");
      var w = window.innerWidth, hh = window.innerHeight;
      var nx = Math.max(0, Math.min(w - 64, drag.ox + dx)), ny = Math.max(0, Math.min(hh - 64, drag.oy + dy));
      el.style.left = nx + "px"; el.style.top = ny + "px"; punchyLink(nx, ny, 64);
    });
    function end() {
      if (!drag) return; var d = drag; drag = null; el.classList.remove("dragging");
      if (d.moved) { var w = window.innerWidth, hh = window.innerHeight; punchy.x = el.offsetLeft / (w - 64); punchy.y = el.offsetTop / (hh - 64); punchySave(); }
      else punchyTap();
    }
    el.addEventListener("pointerup", end); el.addEventListener("pointercancel", function () { drag = null; el.classList.remove("dragging"); });
    window.addEventListener("resize", punchyPlace);
    // Types along while someone is filling something in.
    document.addEventListener("focusin", function (e) { if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && e.target.type !== "checkbox") { clearTimeout(punchy.typingTimer); punchySetTyping(true); } });
    document.addEventListener("focusout", function () { clearTimeout(punchy.typingTimer); punchy.typingTimer = setTimeout(function () { punchySetTyping(false); }, 900); });
    punchy.pocket ? punchyPocket(true) : punchyPlace();
    el.hidden = punchy.pocket; punchy.pill.hidden = !punchy.pocket;
  }

  // ---- What's new ----
  function renderChangelog() {
    var root = $("changelog");
    var q = h("input", { type: "search", placeholder: "Search fixes", "aria-label": "Search what\u2019s new", "data-testid": "whats-new-search" });
    root.parentNode.insertBefore(q, root);
    q.addEventListener("input", function () {
      var needle = q.value.trim().toLowerCase();
      [].forEach.call(root.querySelectorAll("details.entry"), function (d) { d.hidden = !!needle && d.textContent.toLowerCase().indexOf(needle) < 0; });
    });
    CHANGELOG.forEach(function (group) {
      root.appendChild(h("div", { class: "month", text: group.month }));
      group.entries.forEach(function (entry) {
        var s = h("summary", { text: entry.date + " · " + entry.title });
        if (entry.isNew) s.appendChild(h("span", { class: "new", text: "New!" }));
        root.appendChild(h("details", { class: "entry", "data-testid": "whats-new-entry" }, [s, h("p", { text: entry.detail })]));
      });
    });
  }

  // ---- Start ----
  $("buildTag").textContent = BUILD.phase + " · v" + BUILD.version;
  renderChangelog();
  startPunchy();
  startTranslator();
  state.session = loadSessionAny();
  takeLinkTokens().then(function (type) {
    if (type === "recovery") return showNewPassword();
    if (state.session) return loadAll();
    showAuth("signin");
  });
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>One Place · back in a bite</title>
<style>
  :root {
    --bg: #f1f5ee;
    --ink: #1d3a2c;
    --soft: #4d6a5a;
    --chick: #ffd54a;
    --chick-edge: #f2b92c;
    --beak: #ff8a3d;
    --cookie: #d99a5b;
    --chip: #5a3a22;
    --eye: #1a1a1a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #13201a;
      --ink: #e6f1e8;
      --soft: #a9c2b1;
      --chick: #ffd54a;
      --chick-edge: #e9ac1f;
      --cookie: #d99a5b;
      --chip: #4a2f1b;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Quicksand", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid;
    place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    text-align: center;
  }
  main { max-width: 30rem; }
  .chick { width: min(62vw, 15rem); height: auto; display: block; margin: 0 auto 1.5rem; overflow: visible; }
  .body { transform-origin: 100px 170px; animation: chew 1.6s ease-in-out infinite; }
  .crumb { animation: crumb 1.6s ease-in infinite; opacity: 0; }
  .crumb:nth-of-type(2) { animation-delay: .5s; }
  .crumb:nth-of-type(3) { animation-delay: 1s; }
  @keyframes chew {
    0%, 100% { transform: scale(1, 1); }
    25% { transform: scale(1.03, .96); }
    50% { transform: scale(.99, 1.02); }
    75% { transform: scale(1.03, .96); }
  }
  @keyframes crumb {
    0% { opacity: 0; transform: translate(0, 0); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translate(6px, 26px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .body, .crumb { animation: none; }
  }
  h1 { font-size: clamp(1.9rem, 6vw, 2.6rem); line-height: 1.15; margin: 0 0 .6rem; font-weight: 800; letter-spacing: -.01em; }
  p { margin: 0; font-size: 1.1rem; line-height: 1.5; color: var(--soft); }
  .name { margin-top: 2rem; font-size: .95rem; font-weight: 700; color: var(--ink); }
</style>
</head>
<body>
<main>
  <svg class="chick" viewBox="0 0 200 200" role="img" aria-label="A round yellow chick munching on a cookie">
    <defs>
      <mask id="bite">
        <rect width="200" height="200" fill="#fff"/>
        <circle cx="163" cy="132" r="11" fill="#000"/>
      </mask>
    </defs>
    <ellipse cx="100" cy="188" rx="46" ry="6" fill="#000" opacity=".12"/>
    <g class="body">
      <path d="M90 40 L82 22 M96 40 L100 20" stroke="var(--chick-edge)" stroke-width="8" stroke-linecap="round" fill="none"/>
      <circle cx="100" cy="110" r="72" fill="var(--chick)" stroke="var(--chick-edge)" stroke-width="3"/>
      <circle cx="78" cy="104" r="6" fill="var(--eye)"/>
      <circle cx="122" cy="104" r="6" fill="var(--eye)"/>
      <circle cx="80" cy="102" r="1.8" fill="#fff"/>
      <circle cx="124" cy="102" r="1.8" fill="#fff"/>
      <ellipse cx="66" cy="122" rx="9" ry="5" fill="#ff9a7a" opacity=".55"/>
      <ellipse cx="134" cy="122" rx="9" ry="5" fill="#ff9a7a" opacity=".55"/>
      <path d="M92 118 Q100 112 108 118 Q104 128 100 128 Q96 128 92 118 Z" fill="var(--beak)"/>
      <path d="M62 150 Q44 140 40 126" fill="none" stroke="var(--chick-edge)" stroke-width="12" stroke-linecap="round"/>
      <path d="M142 148 Q158 148 162 136" fill="none" stroke="var(--chick-edge)" stroke-width="12" stroke-linecap="round"/>
      <g mask="url(#bite)">
        <circle cx="160" cy="140" r="26" fill="var(--cookie)"/>
        <circle cx="150" cy="132" r="3.2" fill="var(--chip)"/>
        <circle cx="168" cy="146" r="3.4" fill="var(--chip)"/>
        <circle cx="154" cy="152" r="3" fill="var(--chip)"/>
        <circle cx="172" cy="130" r="2.6" fill="var(--chip)"/>
      </g>
      <path d="M82 178 L76 190 M88 178 L88 190 M112 178 L112 190 M118 178 L124 190" stroke="var(--beak)" stroke-width="4" stroke-linecap="round"/>
    </g>
    <circle class="crumb" cx="116" cy="130" r="2.4" fill="var(--cookie)"/>
    <circle class="crumb" cx="124" cy="132" r="2" fill="var(--cookie)"/>
    <circle class="crumb" cx="110" cy="132" r="1.8" fill="var(--cookie)"/>
  </svg>
  <h1>We’re having a snack</h1>
  <p>We’ll be right back. One Place is getting a fresh start.</p>
  <div class="name">One Place</div>
</main>
</body>
</html>

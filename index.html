ous partagez maintenant ce lieu.","Katıldınız! Artık bu yeri paylaşıyorsunuz.","เข้าร่วมแล้ว! ตอนนี้คุณแชร์สถานที่นี้","ເຂົ້າຮ່ວມແລ້ວ! ຕອນນີ້ທ່ານແບ່ງປັນສະຖານທີ່ນີ້"],"Tap any calendar day, shared homes and every language": ["Toca cualquier día del calendario, casas compartidas y todos los idiomas","I-tap ang kahit anong araw sa kalendaryo, nakabahaging bahay at lahat ng wika","点击日历上的任意一天、共享家庭和所有语言","カレンダーの日付をタップ、共有の家、そしてすべての言語","달력의 아무 날짜나 탭하기, 함께 쓰는 집, 모든 언어","Jeden Kalendertag antippen, gemeinsame Zuhause und alle Sprachen","Touchez n’importe quel jour du calendrier, maisons partagées et toutes les langues","Takvimde herhangi bir güne dokunun, paylaşılan evler ve tüm diller","แตะวันไหนก็ได้ในปฏิทิน บ้านที่ใช้ร่วมกัน และทุกภาษา","ແຕະມື້ໃດກໍໄດ້ໃນປະຕິທິນ ບ້ານທີ່ໃຊ້ຮ່ວມກັນ ແລະ ທຸກພາສາ"],"Tap any day on the calendar to see everything planned and add your own note. Holidays now switch right away when you change your country. Invite family, a partner or a team to share a home or business under More, then People and sharing. The whole app now speaks 11 languages, with a language picker on the welcome screen, and dates follow your country. Everyone makes a free account first so nothing is ever lost.": ["Toca cualquier día del calendario para ver todo lo planeado y añadir tu propia nota. Los festivos ahora cambian al instante cuando cambias de país. Invita a tu familia, pareja o equipo a compartir una casa o negocio en Más, luego Personas y compartir. Toda la app ahora habla 11 idiomas, con un selector de idioma en la pantalla de bienvenida, y las fechas siguen a tu país. Todos crean primero una cuenta gratis para que nunca se pierda nada.","I-tap ang kahit anong araw sa kalendaryo para makita ang lahat ng nakaplano at magdagdag ng sarili mong tala. Agad nang nagbabago ang mga holiday kapag nagpalit ka ng bansa. Imbitahan ang pamilya, partner o team na magbahagi ng bahay o negosyo sa Higit pa, tapos Mga tao at pagbabahagi. Nagsasalita na ng 11 wika ang buong app, may tagapili ng wika sa welcome screen, at sumusunod ang mga petsa sa bansa mo. Gumagawa muna ng libreng account ang lahat para walang mawala.","点击日历上的任意一天，即可查看所有安排并添加自己的备注。更改国家后，节假日会立即更新。在“更多”中的“成员与共享”里，邀请家人、伴侣或团队共享一个家或企业。整个应用现在支持 11 种语言，欢迎页提供语言选择，日期会跟随您的国家。每个人都先创建免费账号，确保数据不会丢失。","カレンダーの日付をタップすると、その日の予定をすべて確認して、自分のメモを追加できます。国を変えると、祝日がすぐに切り替わります。「その他」の「メンバーと共有」から、家族やパートナー、チームを招待して、家や事業所を共有できます。アプリ全体が11言語に対応し、ようこそ画面で言語を選べて、日付の表示も国に合わせて変わります。データがなくならないよう、まず無料アカウントを作成します。","달력에서 아무 날짜나 탭하면 그날의 모든 일정을 보고 나만의 메모를 추가할 수 있어요. 국가를 바꾸면 공휴일이 바로 바뀝니다. 더보기의 ‘사람과 공유’에서 가족, 파트너, 팀을 초대해 집이나 사업장을 함께 쓰세요. 이제 앱 전체가 11개 언어를 지원하고, 환영 화면에서 언어를 고를 수 있으며, 날짜는 국가에 맞게 표시돼요. 아무것도 잃어버리지 않도록 모두 먼저 무료 계정을 만듭니다.","Tippen Sie im Kalender auf einen beliebigen Tag, um alles Geplante zu sehen und eine eigene Notiz hinzuzufügen. Feiertage wechseln jetzt sofort, wenn Sie das Land ändern. Laden Sie unter Mehr, dann Personen und Teilen, Familie, Partner oder Team ein, ein Zuhause oder Geschäft gemeinsam zu nutzen. Die ganze App spricht jetzt 11 Sprachen, mit einer Sprachauswahl auf dem Begrüßungsbildschirm, und Datumsangaben folgen Ihrem Land. Alle legen zuerst ein kostenloses Konto an, damit nichts verloren geht.","Touchez n’importe quel jour du calendrier pour voir tout ce qui est prévu et ajouter votre propre note. Les jours fériés changent maintenant immédiatement quand vous changez de pays. Invitez votre famille, votre partenaire ou votre équipe à partager une maison ou une entreprise dans Plus, puis Personnes et partage. Toute l’appli parle désormais 11 langues, avec un sélecteur de langue sur l’écran d’accueil, et les dates suivent votre pays. Chacun crée d’abord un compte gratuit pour que rien ne soit jamais perdu.","Takvimde herhangi bir güne dokunarak planlanan her şeyi görün ve kendi notunuzu ekleyin. Ülkenizi değiştirdiğinizde tatiller artık hemen güncelleniyor. Daha fazla bölümünde Kişiler ve paylaşım altından aile, partner veya ekibinizi bir evi ya da işletmeyi paylaşmaya davet edin. Uygulamanın tamamı artık 11 dilde konuşuyor; karşılama ekranında dil seçici var ve tarihler ülkenizi takip ediyor. Hiçbir şey kaybolmasın diye herkes önce ücretsiz bir hesap oluşturuyor.","แตะวันไหนก็ได้ในปฏิทินเพื่อดูทุกอย่างที่วางแผนไว้และเพิ่มโน้ตของคุณเอง วันหยุดจะเปลี่ยนทันทีเมื่อคุณเปลี่ยนประเทศ เชิญครอบครัว คู่ของคุณ หรือทีมมาใช้บ้านหรือธุรกิจร่วมกันได้ที่เพิ่มเติม แล้วเลือกผู้คนและการแชร์ ตอนนี้แอปทั้งหมดรองรับ 11 ภาษา มีตัวเลือกภาษาที่หน้าต้อนรับ และวันที่จะตามประเทศของคุณ ทุกคนสร้างบัญชีฟรีก่อน เพื่อไม่ให้ข้อมูลหายไป","ແຕະມື້ໃດກໍໄດ້ໃນປະຕິທິນເພື່ອເບິ່ງທຸກຢ່າງທີ່ວາງແຜນໄວ້ ແລະ ເພີ່ມບັນທຶກຂອງທ່ານເອງ. ວັນພັກຈະປ່ຽນທັນທີເມື່ອທ່ານປ່ຽນປະເທດ. ເຊີນຄອບຄົວ, ຄູ່ຂອງທ່ານ ຫຼື ທີມມາໃຊ້ບ້ານ ຫຼື ທຸລະກິດຮ່ວມກັນໄດ້ທີ່ ເພີ່ມເຕີມ ແລ້ວເລືອກ ຄົນ ແລະ ການແບ່ງປັນ. ຕອນນີ້ແອັບທັງໝົດຮອງຮັບ 11 ພາສາ, ມີຕົວເລືອກພາສາຢູ່ໜ້າຕ້ອນຮັບ ແລະ ວັນທີຈະຕາມປະເທດຂອງທ່ານ. ທຸກຄົນສ້າງບັນຊີຟຣີກ່ອນ ເພື່ອບໍ່ໃຫ້ຂໍ້ມູນສູນຫາຍ."],"Finishing tasks now earns coins for Punchy’s Closet (opening soon). Everyday tasks earn 2. Big jobs earn 100 when they repeat every 3 months or less often (deep cleaning, yard work) and 75 when they’re one-offs, but only once the reminder is at least a day old. Vehicle tasks earn 50 and pet tasks 20 when they’re weekly or rarer. Setting a reminder earns 1 (up to 7 a day), and adding One Place to your Home Screen earns 50. Undo takes the coins back. Adding a reminder is easier too: paste a link to the product you buy, or snap a photo and the photo helper works out the make and model. Your coins show in More. One Place now stays in light mode unless you choose Dark under More, Look and feel.": ["Terminar tareas ahora te da monedas para el Armario de Punchy (próximamente). Las tareas cotidianas dan 2. Los trabajos grandes dan 100 si se repiten cada 3 meses o con menos frecuencia (limpieza profunda, jardín) y 75 si son únicos, pero solo cuando el recordatorio tiene al menos un día. Las tareas del vehículo dan 50 y las de mascotas 20 si son semanales o menos frecuentes. Crear un recordatorio da 1 (hasta 7 al día) y añadir One Place a tu pantalla de inicio da 50. Deshacer devuelve las monedas. Añadir un recordatorio también es más fácil: pega un enlace del producto que compras o toma una foto y el asistente de fotos averigua la marca y el modelo. Tus monedas aparecen en Más. One Place ahora se queda en modo claro, salvo que elijas Oscuro en Más, Aspecto.","Ang pagtapos ng mga gawain ay nagbibigay na ng barya para sa Closet ni Punchy (malapit nang magbukas). 2 ang bawat pang-araw-araw na gawain. 100 ang malalaking trabaho kapag inuulit tuwing 3 buwan o mas matagal (deep cleaning, gawain sa bakuran) at 75 kapag isang beses lang, pero kapag isang araw na man lang ang reminder. 50 ang gawain sa sasakyan at 20 ang gawain sa alagang hayop kapag lingguhan o mas bihira. 1 ang pagtatakda ng reminder (hanggang 7 kada araw), at 50 ang pagdagdag ng One Place sa Home Screen. Ibinabalik ng Undo ang mga barya. Mas madali na rin ang pagdagdag ng reminder: mag-paste ng link ng produktong binibili mo, o kumuha ng litrato at hahanapin ng photo helper ang brand at model. Makikita ang mga barya mo sa Higit pa. Mananatili na sa light mode ang One Place maliban kung pipiliin mo ang Dark sa Higit pa, Hitsura.","完成任务现在可以为 Punchy 的衣橱赚取金币（即将开放）。日常任务得 2 枚。大型任务若每 3 个月或更久重复一次（深度清洁、庭院工作）得 100 枚，一次性任务得 75 枚，但提醒需创建满一天。车辆任务得 50 枚，宠物任务得 20 枚，需为每周或更低频率。设置提醒得 1 枚（每天最多 7 枚），把 One Place 添加到主屏幕得 50 枚。撤销会收回金币。添加提醒也更简单：粘贴您常买产品的链接，或拍张照片，照片助手会识别品牌和型号。金币显示在“更多”里。One Place 现在默认保持浅色模式，除非您在“更多”的“外观”中选择深色。","タスクを終えると、Punchyのクローゼット（近日オープン）用のコインがもらえます。毎日のタスクは2枚。大きな作業は、3か月以下の間隔で繰り返すもの（大掃除、庭仕事）が100枚、1回きりのものが75枚で、リマインダーが作成から1日以上たっている場合のみです。車のタスクは50枚、ペットのタスクは20枚で、週1回以下の頻度のものが対象です。リマインダーの設定は1枚（1日最大7枚）、One Placeをホーム画面に追加すると50枚。元に戻すとコインも戻ります。リマインダーの追加も簡単に：いつも買う商品のリンクを貼るか、写真を撮ると、写真アシスタントがメーカーと型番を見つけます。コインは「その他」に表示されます。One Placeは、「その他」の「外観」でダークを選ばない限りライトモードのままです。","이제 할 일을 끝내면 Punchy의 옷장(곧 오픈)에 쓸 코인을 받아요. 일상적인 할 일은 2개예요. 큰 작업은 3개월 이하 간격으로 반복하면(대청소, 마당 일) 100개, 한 번만 하면 75개이며, 알림을 만든 지 하루 이상 지나야 해요. 차량 할 일은 50개, 반려동물 할 일은 20개이고, 매주 또는 그보다 드문 경우에 해당해요. 알림을 설정하면 1개(하루 최대 7개), One Place를 홈 화면에 추가하면 50개예요. 실행 취소하면 코인도 돌려받아요. 알림 추가도 더 쉬워졌어요. 자주 사는 제품의 링크를 붙여넣거나 사진을 찍으면 사진 도우미가 브랜드와 모델을 알아내요. 코인은 더보기에서 확인하세요. 이제 One Place는 더보기의 ‘외관’에서 다크를 고르지 않는 한 라이트 모드로 유지돼요.","Aufgaben zu erledigen bringt jetzt Münzen für Punchys Kleiderschrank (bald verfügbar). Alltägliche Aufgaben bringen 2. Große Aufgaben bringen 100, wenn sie alle 3 Monate oder seltener wiederkehren (Grundreinigung, Gartenarbeit), und 75, wenn sie einmalig sind, aber erst, wenn die Erinnerung mindestens einen Tag alt ist. Fahrzeugaufgaben bringen 50 und Haustieraufgaben 20, wenn sie wöchentlich oder seltener sind. Eine Erinnerung zu setzen bringt 1 (bis zu 7 pro Tag), One Place zum Home-Bildschirm hinzuzufügen bringt 50. Rückgängig macht die Münzen wieder rückgängig. Auch das Hinzufügen einer Erinnerung ist einfacher: Fügen Sie einen Link zum Produkt ein, das Sie kaufen, oder machen Sie ein Foto, und der Foto-Helfer erkennt Marke und Modell. Ihre Münzen sehen Sie unter Mehr. One Place bleibt jetzt im hellen Modus, außer Sie wählen unter Mehr, Aussehen den dunklen Modus.","Terminer des tâches rapporte désormais des pièces pour le dressing de Punchy (bientôt ouvert). Les tâches du quotidien en rapportent 2. Les gros travaux en rapportent 100 s’ils reviennent tous les 3 mois ou moins souvent (grand nettoyage, jardinage) et 75 s’ils sont ponctuels, mais seulement quand le rappel a au moins un jour. Les tâches du véhicule en rapportent 50 et celles des animaux 20, si elles sont hebdomadaires ou plus rares. Créer un rappel en rapporte 1 (jusqu’à 7 par jour), et ajouter One Place à votre écran d’accueil en rapporte 50. Annuler reprend les pièces. Ajouter un rappel est aussi plus simple : collez un lien vers le produit que vous achetez, ou prenez une photo et l’assistant photo trouve la marque et le modèle. Vos pièces apparaissent dans Plus. One Place reste maintenant en mode clair, sauf si vous choisissez Sombre dans Plus, Apparence.","Görevleri tamamlamak artık Punchy’nin Gardırobu için jeton kazandırıyor (yakında açılıyor). Günlük görevler 2 jeton kazandırır. Büyük işler 3 ayda bir veya daha seyrek tekrarlanıyorsa (derin temizlik, bahçe işleri) 100, tek seferlikse 75 jeton kazandırır; ancak hatırlatıcı en az bir günlük olmalıdır. Araç görevleri 50, evcil hayvan görevleri 20 jeton kazandırır; haftalık veya daha seyrek olmaları gerekir. Hatırlatıcı kurmak 1 jeton (günde en fazla 7), One Place’i Ana Ekrana eklemek 50 jeton kazandırır. Geri al, jetonları geri alır. Hatırlatıcı eklemek de kolaylaştı: sık aldığınız ürünün bağlantısını yapıştırın veya fotoğraf çekin, fotoğraf yardımcısı marka ve modeli bulsun. Jetonlarınız Daha fazla bölümünde görünür. One Place artık, Daha fazla, Görünüm altında Koyu’yu seçmediğiniz sürece açık modda kalır.","การทำงานให้เสร็จตอนนี้ได้เหรียญสำหรับตู้เสื้อผ้าของPunchy (เปิดเร็วๆ นี้) งานประจำวันได้ 2 เหรียญ งานใหญ่ได้ 100 เหรียญถ้าทำซ้ำทุก 3 เดือนหรือนานกว่า (ทำความสะอาดครั้งใหญ่ งานสวน) และ 75 เหรียญถ้าเป็นงานครั้งเดียว แต่ต้องเป็นการเตือนที่สร้างไว้อย่างน้อยหนึ่งวัน งานรถได้ 50 เหรียญ งานสัตว์เลี้ยงได้ 20 เหรียญ เมื่อเป็นงานรายสัปดาห์หรือห่างกว่านั้น การตั้งการเตือนได้ 1 เหรียญ (สูงสุด 7 ต่อวัน) และการเพิ่ม One Place ไปที่หน้าจอโฮมได้ 50 เหรียญ การเลิกทำจะเอาเหรียญคืน การเพิ่มการเตือนก็ง่ายขึ้น: วางลิงก์สินค้าที่คุณซื้อ หรือถ่ายรูป แล้วผู้ช่วยดูรูปจะหายี่ห้อและรุ่นให้ เหรียญของคุณแสดงที่เพิ่มเติม ตอนนี้ One Place จะอยู่ในโหมดสว่าง เว้นแต่คุณเลือกมืดที่เพิ่มเติม แล้วหน้าตา","ການເຮັດວຽກໃຫ້ສຳເລັດຕອນນີ້ໄດ້ເຫຼຍນສຳລັບຕູ້ເສື້ອຜ້າຂອງPunchy (ເປີດໄວໆນີ້). ວຽກປະຈຳວັນໄດ້ 2 ເຫຼຍນ. ວຽກໃຫຍ່ໄດ້ 100 ເຫຼຍນ ຖ້າເຮັດຊ້ຳທຸກ 3 ເດືອນ ຫຼື ຫ່າງກວ່ານັ້ນ (ທຳຄວາມສະອາດໃຫຍ່, ວຽກສວນ) ແລະ 75 ເຫຼຍນ ຖ້າເປັນວຽກຄັ້ງດຽວ, ແຕ່ການເຕືອນຕ້ອງສ້າງໄວ້ຢ່າງໜ້ອຍໜຶ່ງມື້. ວຽກລົດໄດ້ 50 ແລະ ວຽກສັດລ້ຽງໄດ້ 20 ເມື່ອເປັນລາຍອາທິດ ຫຼື ຫ່າງກວ່ານັ້ນ. ການຕັ້ງການເຕືອນໄດ້ 1 ເຫຼຍນ (ສູງສຸດ 7 ຕໍ່ມື້), ແລະ ການເພີ່ມ One Place ໃສ່ໜ້າຈໍຫຼັກໄດ້ 50 ເຫຼຍນ. ການຍົກເລີກຈະເອົາເຫຼຍນຄືນ. ການເພີ່ມການເຕືອນກໍງ່າຍຂຶ້ນ: ວາງລິ້ງສິນຄ້າທີ່ທ່ານຊື້ ຫຼື ຖ່າຍຮູບ ແລ້ວຜູ້ຊ່ວຍເບິ່ງຮູບຈະຫາຍີ່ຫໍ້ ແລະ ລຸ້ນໃຫ້. ເຫຼຍນຂອງທ່ານສະແດງຢູ່ ເພີ່ມເຕີມ. ຕອນນີ້ One Place ຈະຢູ່ໃນໂໝດສະຫວ່າງ ເວັ້ນແຕ່ທ່ານເລືອກມືດທີ່ ເພີ່ມເຕີມ, ຮູບລັກສະນະ."],"Holidays: rest days built in": ["Festivos: días de descanso incluidos","Mga holiday: may kasamang araw ng pahinga","节假日：内置休息日","祝日：お休みの日を組み込み済み","공휴일: 쉬는 날이 기본 포함","Feiertage: Ruhetage eingebaut","Jours fériés : jours de repos intégrés","Tatiller: dinlenme günleri dahil","วันหยุด: มีวันพักในตัว","ວັນພັກ: ມີວັນພັກໃນຕົວ"],"Public holidays for your country now show on the calendar with a 🎉. By default, reminders that land on a holiday move to the next day, and your morning notification skips holidays so you can relax. Turn it off any time in More, then Holidays. Covers major national holidays for 2026 to 2028; regional ones may be missing.": ["Los festivos de tu país ahora aparecen en el calendario con un 🎉. De forma predeterminada, los recordatorios que caen en festivo pasan al día siguiente, y tu notificación matutina se salta los festivos para que descanses. Desactívalo cuando quieras en Más, Festivos. Cubre los principales festivos nacionales de 2026 a 2028; puede que falten los regionales.","Lumalabas na sa kalendaryo na may 🎉 ang mga pampublikong holiday ng bansa mo. Bilang default, ang mga paalalang tumatama sa holiday ay lilipat sa susunod na araw, at nilalaktawan ng morning notification mo ang mga holiday para makapagpahinga ka. I-off ito anumang oras sa Higit pa, Mga holiday. Sakop ang mga pangunahing pambansang holiday mula 2026 hanggang 2028; maaaring kulang ang panrehiyon.","您所在国家的公共假日现在会带着 🎉 显示在日历上。默认情况下，落在假日的提醒会顺延到第二天，早晨通知也会跳过假日，让您好好休息。可随时在“更多”的“节假日”中关闭。涵盖 2026 至 2028 年的主要国家法定假日，地区性假日可能缺失。","お住まいの国の祝日が 🎉 付きでカレンダーに表示されます。初期設定では、祝日にあたるリマインダーは翌日に移り、朝の通知も祝日はお休みします。「その他」の「祝日」でいつでもオフにできます。2026年から2028年の主な国民の祝日に対応しています。地域ごとの祝日は含まれない場合があります。","이제 내 나라의 공휴일이 🎉와 함께 달력에 표시돼요. 기본적으로 공휴일에 걸린 알림은 다음 날로 옮겨지고, 아침 알림도 공휴일에는 쉬어요. 더보기의 ‘공휴일’에서 언제든 끌 수 있어요. 2026년부터 2028년까지의 주요 국경일을 다루며, 지역 공휴일은 빠질 수 있어요.","Gesetzliche Feiertage Ihres Landes erscheinen jetzt mit einem 🎉 im Kalender. Standardmäßig werden Erinnerungen, die auf einen Feiertag fallen, auf den nächsten Tag verschoben, und Ihre Morgenbenachrichtigung überspringt Feiertage, damit Sie sich erholen können. Unter Mehr, Feiertage können Sie das jederzeit ausschalten. Enthalten sind die wichtigsten nationalen Feiertage 2026 bis 2028; regionale fehlen eventuell.","Les jours fériés de votre pays apparaissent maintenant dans le calendrier avec un 🎉. Par défaut, les rappels qui tombent un jour férié passent au lendemain, et votre notification du matin saute les jours fériés pour que vous vous reposiez. Désactivez-le à tout moment dans Plus, Jours fériés. Couvre les principaux jours fériés nationaux de 2026 à 2028 ; les jours régionaux peuvent manquer.","Ülkenizin resmî tatilleri artık takvimde 🎉 ile görünüyor. Varsayılan olarak tatile denk gelen hatırlatıcılar ertesi güne kayar ve sabah bildiriminiz dinlenebilmeniz için tatilleri atlar. Daha fazla, Tatiller bölümünden istediğiniz zaman kapatabilirsiniz. 2026–2028 arasındaki başlıca ulusal tatilleri kapsar; bölgesel olanlar eksik olabilir.","วันหยุดราชการของประเทศคุณจะแสดงในปฏิทินพร้อม 🎉 โดยค่าเริ่มต้น การเตือนที่ตรงกับวันหยุดจะเลื่อนไปวันถัดไป และการแจ้งเตือนตอนเช้าจะข้ามวันหยุดเพื่อให้คุณได้พักผ่อน ปิดได้ทุกเมื่อที่เพิ่มเติม แล้ววันหยุด ครอบคลุมวันหยุดหลักของประเทศปี 2026 ถึง 2028 วันหยุดระดับภูมิภาคอาจไม่มี","ວັນພັກທາງການຂອງປະເທດທ່ານຈະສະແດງໃນປະຕິທິນພ້ອມ 🎉. ຕາມຄ່າເລີ່ມຕົ້ນ, ການເຕືອນທີ່ຕົກໃນວັນພັກຈະເລື່ອນໄປມື້ຕໍ່ໄປ ແລະ ການແຈ້ງເຕືອນຕອນເຊົ້າຈະຂ້າມວັນພັກເພື່ອໃຫ້ທ່ານໄດ້ພັກຜ່ອນ. ປິດໄດ້ທຸກເວລາທີ່ ເພີ່ມເຕີມ, ວັນພັກ. ຄອບຄຸມວັນພັກຫຼັກຂອງປະເທດປີ 2026 ຫາ 2028; ວັນພັກຂອງເຂດອາດບໍ່ມີ."],"Look around as a guest, a cozier welcome, Home Screen steps and easy reordering": ["Explora como invitado, una bienvenida más acogedora, pasos para la pantalla de inicio y reordenación fácil","Mag-ikot bilang guest, mas maaliwalas na pagtanggap, mga hakbang sa Home Screen at madaling pag-reorder","以访客身份浏览、更温馨的欢迎、主屏幕步骤和轻松排序","ゲストとして見て回る、あたたかい歓迎、ホーム画面の手順、かんたん並べ替え","게스트로 둘러보기, 더 아늑한 환영, 홈 화면 안내, 쉬운 순서 변경","Als Gast umsehen, ein gemütlicherer Empfang, Home-Bildschirm-Schritte und einfaches Sortieren","Explorer en invité, un accueil plus chaleureux, étapes de l’écran d’accueil et réorganisation facile","Misafir olarak göz atma, daha sıcak bir karşılama, Ana Ekran adımları ve kolay sıralama","ดูรอบๆ ในฐานะผู้เยี่ยมชม การต้อนรับที่อบอุ่นขึ้น ขั้นตอนหน้าจอหลัก และการจัดเรียงที่ง่าย","ເບິ່ງຮອບໆ ໃນຖານະຜູ້ເຂົ້າຊົມ, ການຕ້ອນຮັບທີ່ອົບອຸ່ນຂຶ້ນ, ຂັ້ນຕອນໜ້າຈໍຫຼັກ ແລະ ການຈັດລຽງງ່າຍໆ"],"New visitors can tap Just look around to try One Place without signing up. After two things are saved or done, it asks if you’re ready to make an account, and everything you added comes with you. The welcome screen has a warmer, cozier look. Reminders can now remember the make, model or size (like the exact air filter) and where you buy it, with a Reorder button that opens that store or your pasted product link. One look everywhere (warm latte theme from the welcome screen to the last page), a calmer More tab, a quieter first Home, a This week summary, Snooze to Saturday, and Download or Delete my data. Local pros: see recommended pros near you and add your own. Add your own recommended pros (handymen, landscapers, mechanics) under My pros and track when you use them. Peek in More for Punchy’s Closet, coming soon: earn coins for finishing tasks and dress Punchy up. And Show me how walks you through adding One Place to your Home Screen with steps for your exact device (iPhone, Android, Windows or Mac).": ["Los nuevos visitantes pueden tocar Solo echar un vistazo para probar One Place sin registrarse. Tras guardar o completar dos cosas, pregunta si quieres crear una cuenta, y todo lo que añadiste se viene contigo. La pantalla de bienvenida tiene un aspecto más cálido y acogedor. Los recordatorios ahora pueden recordar la marca, el modelo o el tamaño (como el filtro de aire exacto) y dónde lo compras, con un botón Volver a pedir que abre esa tienda o tu enlace de producto. Un mismo aspecto en todas partes (tema latte cálido de la bienvenida a la última página), una pestaña Más más tranquila, un primer Inicio más sereno, un resumen de Esta semana, Posponer al sábado, y Descargar o Eliminar mis datos. Profesionales locales: mira profesionales recomendados cerca de ti y añade los tuyos. Añade tus propios profesionales recomendados (manitas, jardineros, mecánicos) en Mis profesionales y registra cuándo los usas. Echa un vistazo en Más al Armario de Punchy, próximamente: gana monedas por terminar tareas y viste a Punchy. Y Muéstrame cómo te guía para añadir One Place a tu pantalla de inicio con pasos para tu dispositivo exacto (iPhone, Android, Windows o Mac).","Maaari nang i-tap ng mga bagong bisita ang Mag-ikot lang para subukan ang One Place nang hindi nagsa-sign up. Pagkatapos ng dalawang na-save o natapos, itatanong nito kung handa ka nang gumawa ng account, at kasama mo ang lahat ng idinagdag mo. Mas mainit at maaliwalas ang itsura ng welcome screen. Natatandaan na ng mga paalala ang make, model o laki (tulad ng eksaktong air filter) at kung saan mo ito binibili, may Reorder button na magbubukas ng tindahang iyon o ng na-paste mong link ng produkto. Iisang itsura sa lahat ng dako (mainit na latte theme mula sa welcome screen hanggang sa huling pahina), mas kalmadong Higit pa tab, mas tahimik na unang Home, buod na Ngayong linggo, Snooze hanggang Sabado, at I-download o Burahin ang data ko. Mga lokal na pro: tingnan ang mga inirerekomendang pro malapit sa iyo at idagdag ang sarili mo. Idagdag ang sarili mong mga inirerekomendang pro (handyman, landscaper, mekaniko) sa Mga pro ko at subaybayan kung kailan mo sila ginagamit. Silipin sa Higit pa ang Closet ni Punchy, malapit na: kumita ng barya sa pagtapos ng gawain at bihisan si Punchy. At ginagabayan ka ng Ipakita kung paano sa pagdagdag ng One Place sa Home Screen na may mga hakbang para sa mismong device mo (iPhone, Android, Windows o Mac).","新访客可以点击“先随便看看”，无需注册就能试用 One Place。保存或完成两件事后，会询问您是否准备好创建账号，您添加的所有内容都会保留。欢迎页更温暖舒适。提醒现在可以记住品牌、型号或尺寸（比如确切的空气滤网）以及购买地点，并带有“重新订购”按钮，打开那家商店或您粘贴的商品链接。从欢迎页到最后一页统一的外观（温暖的拿铁主题）、更平静的“更多”页、更清爽的首页、“本周”摘要、“推迟到周六”，以及“下载或删除我的数据”。本地师傅：查看您附近的推荐师傅并添加自己的。在“我的师傅”中添加您自己推荐的师傅（修理工、园艺师、技师），并记录使用时间。到“更多”里看看 Punchy 的衣橱（即将推出）：完成任务赚金币，给 Punchy 换装。“教我怎么做”会一步步带您把 One Place 添加到主屏幕，并提供适合您设备（iPhone、Android、Windows 或 Mac）的步骤。","新しい訪問者は「まずは見てみる」をタップすると、登録なしで One Place を試せます。2つのことを保存または完了すると、アカウントを作る準備ができたか尋ね、追加した内容はそのまま引き継がれます。ようこそ画面はよりあたたかく居心地のよい見た目になりました。リマインダーに、メーカー、型番、サイズ（エアフィルターの正確なサイズなど）と購入先を覚えさせられるようになり、「再注文」ボタンでそのお店や貼り付けた商品リンクが開きます。ようこそ画面から最後のページまで同じ見た目（あたたかいラテのテーマ）、落ち着いた「その他」タブ、すっきりした最初のホーム、「今週」のまとめ、土曜日までスヌーズ、「データをダウンロード・削除」。地域の業者：近くのおすすめ業者を見たり、自分で追加できます。「マイ業者」に自分のおすすめ業者（便利屋、造園業者、整備士）を追加し、利用した日を記録できます。「その他」で近日公開の Punchy のクローゼットものぞいてみてください：タスクを終えてコインを貯め、Punchy を着せ替えできます。「やり方を見る」では、お使いの端末（iPhone、Android、Windows、Mac）に合わせた手順で、One Place をホーム画面に追加する方法を案内します。","새 방문자는 ‘일단 둘러보기’를 탭해 가입 없이 One Place를 써볼 수 있어요. 두 가지를 저장하거나 완료하면 계정을 만들 준비가 되었는지 물어보고, 추가한 내용은 그대로 따라와요. 환영 화면이 더 따뜻하고 포근해졌어요. 알림이 이제 제조사, 모델, 크기(정확한 공기 필터 같은)와 구매처를 기억하고, ‘재주문’ 버튼으로 그 매장이나 붙여넣은 제품 링크를 열어줘요. 환영 화면부터 마지막 페이지까지 하나의 통일된 모습(따뜻한 라떼 테마), 한결 차분한 더보기 탭, 더 조용한 첫 홈, ‘이번 주’ 요약, 토요일까지 미루기, ‘내 데이터 다운로드 또는 삭제’. 지역 전문가: 근처의 추천 전문가를 보고 직접 추가하세요. ‘내 전문가’에서 나만의 추천 전문가(수리공, 조경사, 정비사)를 추가하고 이용 시점을 기록하세요. 더보기에서 곧 열릴 Punchy의 옷장도 살짝 엿보세요: 할 일을 끝내 코인을 모으고 Punchy를 꾸밀 수 있어요. 그리고 ‘방법 보기’는 내 기기(iPhone, Android, Windows 또는 Mac)에 맞는 단계로 One Place를 홈 화면에 추가하는 방법을 안내해요.","Neue Besucher können auf Erst mal umschauen tippen, um One Place ohne Anmeldung auszuprobieren. Nachdem zwei Dinge gespeichert oder erledigt sind, fragt die App, ob Sie ein Konto anlegen möchten, und alles, was Sie hinzugefügt haben, wird übernommen. Der Begrüßungsbildschirm sieht wärmer und gemütlicher aus. Erinnerungen können sich jetzt Marke, Modell oder Größe (etwa den genauen Luftfilter) und die Bezugsquelle merken, mit einem Nachbestellen-Button, der diesen Shop oder Ihren eingefügten Produktlink öffnet. Ein einheitlicher Look überall (warmes Latte-Design vom Begrüßungsbildschirm bis zur letzten Seite), ein ruhigerer Mehr-Tab, ein ruhigerer erster Start, eine Zusammenfassung Diese Woche, Auf Samstag verschieben sowie Meine Daten herunterladen oder löschen. Lokale Profis: Sehen Sie empfohlene Profis in Ihrer Nähe und fügen Sie eigene hinzu. Fügen Sie unter Meine Profis Ihre eigenen empfohlenen Profis (Handwerker, Gärtner, Mechaniker) hinzu und halten Sie fest, wann Sie sie nutzen. Werfen Sie unter Mehr einen Blick auf Punchys Kleiderschrank, bald verfügbar: Verdienen Sie Münzen für erledigte Aufgaben und ziehen Sie Punchy an. Und Zeig mir, wie führt Sie Schritt für Schritt dazu, One Place zum Home-Bildschirm hinzuzufügen, mit Schritten für Ihr genaues Gerät (iPhone, Android, Windows oder Mac).","Les nouveaux visiteurs peuvent toucher Juste jeter un œil pour essayer One Place sans s’inscrire. Après deux choses enregistrées ou terminées, l’appli demande si vous êtes prêt à créer un compte, et tout ce que vous avez ajouté vous suit. L’écran d’accueil a un look plus chaleureux et douillet. Les rappels peuvent maintenant retenir la marque, le modèle ou la taille (comme le filtre à air exact) et où vous l’achetez, avec un bouton Recommander qui ouvre ce magasin ou votre lien produit collé. Un même look partout (thème latte chaleureux de l’écran d’accueil à la dernière page), un onglet Plus plus calme, un premier Accueil plus tranquille, un résumé Cette semaine, Reporter à samedi, et Télécharger ou Supprimer mes données. Pros locaux : voyez les pros recommandés près de chez vous et ajoutez les vôtres. Ajoutez vos propres pros recommandés (bricoleurs, jardiniers, mécaniciens) dans Mes pros et suivez quand vous les utilisez. Jetez un œil dans Plus au dressing de Punchy, bientôt disponible : gagnez des pièces en terminant des tâches et habillez Punchy. Et Montrez-moi comment vous guide pour ajouter One Place à votre écran d’accueil avec des étapes pour votre appareil exact (iPhone, Android, Windows ou Mac).","Yeni ziyaretçiler Sadece göz at’a dokunarak One Place’i kaydolmadan deneyebilir. İki şey kaydedildikten veya tamamlandıktan sonra hesap oluşturmaya hazır olup olmadığınızı sorar ve eklediğiniz her şey sizinle gelir. Karşılama ekranı daha sıcak ve samimi görünüyor. Hatırlatıcılar artık marka, model veya boyutu (tam hava filtresi gibi) ve nereden aldığınızı hatırlayabiliyor; Yeniden sipariş düğmesi o mağazayı veya yapıştırdığınız ürün bağlantısını açar. Her yerde tek bir görünüm (karşılama ekranından son sayfaya sıcak latte teması), daha sakin bir Daha fazla sekmesi, daha sakin ilk Ana sayfa, Bu hafta özeti, Cumartesiye ertele ve Verilerimi indir veya sil. Yerel ustalar: yakınınızdaki önerilen ustaları görün ve kendinizinkini ekleyin. Ustalarım bölümüne kendi önerdiğiniz ustaları (tamirci, bahçıvan, makinist) ekleyin ve onları ne zaman kullandığınızı takip edin. Daha fazla bölümünde yakında gelecek Punchy’nin Gardırobu’na göz atın: görevleri bitirerek jeton kazanın ve Punchy’yi giydirin. Nasıl yapılacağını göster ise One Place’i Ana Ekranınıza eklemeniz için tam cihazınıza (iPhone, Android, Windows veya Mac) göre adımlarla yol gösterir.","ผู้เยี่ยมชมใหม่แตะดูก่อนเพื่อลองใช้ One Place โดยไม่ต้องสมัครได้ หลังจากบันทึกหรือทำเสร็จสองอย่าง แอปจะถามว่าพร้อมสร้างบัญชีหรือยัง และทุกอย่างที่คุณเพิ่มจะตามไปด้วย หน้าต้อนรับดูอบอุ่นและน่าอยู่ขึ้น การเตือนจำยี่ห้อ รุ่น หรือขนาด (เช่นไส้กรองอากาศที่ตรงรุ่น) และที่ที่คุณซื้อได้แล้ว พร้อมปุ่มสั่งซ้ำที่เปิดร้านนั้นหรือลิงก์สินค้าที่คุณวางไว้ หน้าตาเดียวกันทุกที่ (ธีมลาเต้อบอุ่นตั้งแต่หน้าต้อนรับถึงหน้าสุดท้าย) แท็บเพิ่มเติมที่สงบขึ้น หน้าโฮมแรกที่เงียบขึ้น สรุปสัปดาห์นี้ เลื่อนเตือนไปวันเสาร์ และดาวน์โหลดหรือลบข้อมูลของฉัน ช่างในพื้นที่: ดูช่างที่แนะนำใกล้คุณและเพิ่มช่างของคุณเอง เพิ่มช่างที่คุณแนะนำเอง (ช่างซ่อม คนจัดสวน ช่างเครื่อง) ที่ช่างของฉัน และติดตามว่าใช้ตอนไหน แอบดูตู้เสื้อผ้าของ Punchy ที่เพิ่มเติม เร็วๆ นี้: ทำงานเสร็จเพื่อสะสมเหรียญและแต่งตัวให้ Punchy และแสดงวิธีทำจะพาคุณเพิ่ม One Place ไปที่หน้าจอโฮมพร้อมขั้นตอนตามอุปกรณ์ของคุณ (iPhone, Android, Windows หรือ Mac)","ຜູ້ເຂົ້າຊົມໃໝ່ແຕະເບິ່ງກ່ອນເພື່ອທົດລອງໃຊ້ One Place ໂດຍບໍ່ຕ້ອງສະໝັກໄດ້. ຫຼັງຈາກບັນທຶກ ຫຼື ເຮັດສຳເລັດສອງຢ່າງ, ແອັບຈະຖາມວ່າພ້ອມສ້າງບັນຊີບໍ ແລະ ທຸກຢ່າງທີ່ທ່ານເພີ່ມຈະຕິດໄປນຳ. ໜ້າຕ້ອນຮັບເບິ່ງອົບອຸ່ນ ແລະ ໜ້າຢູ່ຂຶ້ນ. ການເຕືອນຈື່ຍີ່ຫໍ້, ລຸ້ນ ຫຼື ຂະໜາດ (ເຊັ່ນ ໄສ້ກອງອາກາດທີ່ຖືກລຸ້ນ) ແລະ ບ່ອນທີ່ທ່ານຊື້ໄດ້ແລ້ວ ພ້ອມປຸ່ມສັ່ງຊ້ຳທີ່ເປີດຮ້ານນັ້ນ ຫຼື ລິ້ງສິນຄ້າທີ່ທ່ານວາງໄວ້. ໜ້າຕາດຽວກັນທຸກບ່ອນ (ທີມລາເຕ້ອົບອຸ່ນ ຕັ້ງແຕ່ໜ້າຕ້ອນຮັບຈົນເຖິງໜ້າສຸດທ້າຍ), ແຖບເພີ່ມເຕີມທີ່ສະຫງົບຂຶ້ນ, ໜ້າຫຼັກທຳອິດທີ່ງຽບຂຶ້ນ, ສະຫຼຸບອາທິດນີ້, ເລື່ອນການເຕືອນໄປວັນເສົາ, ແລະ ດາວໂຫຼດ ຫຼື ລຶບຂໍ້ມູນຂອງຂ້ອຍ. ຊ່າງໃນທ້ອງຖິ່ນ: ເບິ່ງຊ່າງແນະນຳໃກ້ທ່ານ ແລະ ເພີ່ມຂອງທ່ານເອງ. ເພີ່ມຊ່າງທີ່ທ່ານແນະນຳເອງ (ຊ່າງສ້ອມ, ຄົນຈັດສວນ, ຊ່າງຈັກ) ທີ່ ຊ່າງຂອງຂ້ອຍ ແລະ ຕິດຕາມວ່າໃຊ້ຕອນໃດ. ແອບເບິ່ງຕູ້ເສື້ອຜ້າຂອງ Punchy ທີ່ ເພີ່ມເຕີມ ໄວໆນີ້: ເຮັດວຽກສຳເລັດເພື່ອສະສົມເຫຼຍນ ແລະ ແຕ່ງຕົວໃຫ້ Punchy. ແລະ ສະແດງວິທີເຮັດຈະນຳທາງທ່ານເພີ່ມ One Place ໃສ່ໜ້າຈໍຫຼັກ ພ້ອມຂັ້ນຕອນຕາມອຸປະກອນຂອງທ່ານ (iPhone, Android, Windows ຫຼື Mac)."],"Welcome, notifications and calendar": ["Bienvenida, notificaciones y calendario","Pagtanggap, mga notification at kalendaryo","欢迎、通知和日历","ようこそ、通知、カレンダー","환영, 알림, 캘린더","Willkommen, Benachrichtigungen und Kalender","Bienvenue, notifications et calendrier","Hoş geldiniz, bildirimler ve takvim","ยินดีต้อนรับ การแจ้งเตือน และปฏิทิน","ຍິນດີຕ້ອນຮັບ, ການແຈ້ງເຕືອນ ແລະ ປະຕິທິນ"],"First-time visitors get a welcome and a nudge to sign in. After you save your first reminder, One Place offers a morning notification when something is due (on iPhone, add it to your Home Screen first, and it shows you how). Turn it on or off any time in More. Every active reminder also has “Add to my calendar”, which saves it to your phone calendar with its repeat and a 9am alert.": ["Los nuevos visitantes reciben una bienvenida y una invitación a iniciar sesión. Tras guardar tu primer recordatorio, One Place ofrece una notificación matutina cuando algo vence (en iPhone, primero añádelo a tu pantalla de inicio, y te muestra cómo). Actívala o desactívala cuando quieras en Más. Cada recordatorio activo también tiene “Añadir a mi calendario”, que lo guarda en el calendario de tu teléfono con su repetición y una alerta a las 9 a. m.","May welcome at paalala ang mga unang beses na bisita para mag-sign in. Pagkatapos mong i-save ang una mong paalala, nag-aalok ang One Place ng morning notification kapag may due (sa iPhone, idagdag muna sa Home Screen, at ipapakita nito kung paano). I-on o i-off ito anumang oras sa Higit pa. Bawat aktibong paalala ay may “Idagdag sa kalendaryo ko”, na isine-save ito sa kalendaryo ng telepono mo kasama ang pag-uulit at alerto sa 9am.","首次访问的用户会看到欢迎页并被提示登录。保存第一个提醒后，One Place 会提供到期时的早晨通知（在 iPhone 上需要先添加到主屏幕，它会告诉您怎么做）。可随时在“更多”中开启或关闭。每个进行中的提醒还有“添加到我的日历”，会连同重复规则和早上 9 点的提醒一起保存到手机日历。","初めての訪問者にはようこそ画面とサインインのご案内が表示されます。最初のリマインダーを保存すると、期限が来たときの朝の通知をおすすめします（iPhone では先にホーム画面に追加が必要で、手順も表示されます）。「その他」でいつでもオン・オフできます。有効なリマインダーには「カレンダーに追加」もあり、繰り返し設定と午前9時のアラート付きでスマホのカレンダーに保存されます。","처음 방문하면 환영 화면과 로그인 안내가 나와요. 첫 알림을 저장하면 기한이 됐을 때 아침 알림을 켤 수 있도록 안내해요(iPhone에서는 먼저 홈 화면에 추가해야 하며, 방법도 알려줘요). 더보기에서 언제든 켜고 끌 수 있어요. 활성화된 알림마다 ‘내 캘린더에 추가’도 있어서, 반복 설정과 오전 9시 알림과 함께 휴대폰 캘린더에 저장돼요.","Erstbesucher erhalten einen Willkommensgruß und eine Aufforderung zur Anmeldung. Nachdem Sie Ihre erste Erinnerung gespeichert haben, bietet One Place eine Morgenbenachrichtigung an, wenn etwas fällig ist (auf dem iPhone zuerst zum Home-Bildschirm hinzufügen, die App zeigt Ihnen, wie). Unter Mehr jederzeit ein- oder ausschaltbar. Jede aktive Erinnerung hat außerdem „Zu meinem Kalender hinzufügen“, das sie samt Wiederholung und einer Erinnerung um 9 Uhr im Telefonkalender speichert.","Les nouveaux visiteurs reçoivent un accueil et une invitation à se connecter. Après avoir enregistré votre premier rappel, One Place propose une notification du matin quand quelque chose est dû (sur iPhone, ajoutez d’abord l’appli à l’écran d’accueil, elle vous montre comment). Activez-la ou désactivez-la à tout moment dans Plus. Chaque rappel actif a aussi « Ajouter à mon calendrier », qui l’enregistre dans le calendrier de votre téléphone avec sa répétition et une alerte à 9 h.","İlk kez gelen ziyaretçiler bir karşılama ve oturum açma daveti görür. İlk hatırlatıcınızı kaydettiğinizde One Place, bir şeyin zamanı geldiğinde sabah bildirimi sunar (iPhone’da önce Ana Ekrana ekleyin, nasıl yapılacağını gösterir). Daha fazla bölümünden istediğiniz zaman açıp kapatın. Her etkin hatırlatıcıda ayrıca “Takvimime ekle” bulunur; bu, hatırlatıcıyı tekrarı ve sabah 9 uyarısıyla telefon takviminize kaydeder.","ผู้เยี่ยมชมครั้งแรกจะเห็นหน้าต้อนรับและคำชวนให้เข้าสู่ระบบ หลังจากบันทึกการเตือนแรก One Place จะเสนอการแจ้งเตือนตอนเช้าเมื่อมีสิ่งที่ถึงกำหนด (บน iPhone ให้เพิ่มไปที่หน้าจอโฮมก่อน แอปจะแสดงวิธีให้) เปิดหรือปิดได้ทุกเมื่อที่เพิ่มเติม การเตือนที่ใช้งานอยู่ทุกรายการยังมี “เพิ่มลงปฏิทินของฉัน” ซึ่งบันทึกลงปฏิทินในโทรศัพท์พร้อมการทำซ้ำและการเตือน 9 โมงเช้า","ຜູ້ເຂົ້າຊົມຄັ້ງທຳອິດຈະເຫັນໜ້າຕ້ອນຮັບ ແລະ ຄຳເຊີນໃຫ້ເຂົ້າສູ່ລະບົບ. ຫຼັງຈາກບັນທຶກການເຕືອນທຳອິດ, One Place ຈະສະເໜີການແຈ້ງເຕືອນຕອນເຊົ້າເມື່ອມີສິ່ງທີ່ຮອດກຳນົດ (ໃນ iPhone ໃຫ້ເພີ່ມໃສ່ໜ້າຈໍຫຼັກກ່ອນ, ແອັບຈະສະແດງວິທີໃຫ້). ເປີດ ຫຼື ປິດໄດ້ທຸກເວລາທີ່ ເພີ່ມເຕີມ. ການເຕືອນທີ່ໃຊ້ງານທຸກອັນຍັງມີ “ເພີ່ມໃສ່ປະຕິທິນຂອງຂ້ອຍ” ເຊິ່ງບັນທຶກລົງປະຕິທິນໃນໂທລະສັບພ້ອມການຊ້ຳ ແລະ ການເຕືອນ 9 ໂມງເຊົ້າ."],"More than one home or business": ["Más de una casa o negocio","Higit sa isang bahay o negosyo","多个住所或企业","複数の自宅や事業所","둘 이상의 집이나 사업장","Mehr als ein Zuhause oder Geschäft","Plus d’un logement ou commerce","Birden fazla ev veya işletme","มากกว่าหนึ่งบ้านหรือธุรกิจ","ຫຼາຍກວ່າໜຶ່ງເຮືອນ ຫຼື ທຸລະກິດ"],"The top of Home now has a bar to switch between your homes and businesses, and “+ Add another home or business”. Each one keeps its own rooms, items and reminders, and the app opens on the one you used last. Open an item and tap “Move to another home or business” if you added it in the wrong place: photos, reminders and history all come along, and there’s an Undo.": ["La parte superior de Inicio ahora tiene una barra para cambiar entre tus casas y negocios, y “+ Añadir otra casa o negocio”. Cada uno guarda sus propias habitaciones, objetos y recordatorios, y la app se abre en el último que usaste. Abre un objeto y toca “Mover a otra casa o negocio” si lo añadiste en el lugar equivocado: las fotos, recordatorios e historial se van con él, y hay Deshacer.","May bar na sa itaas ng Home para lumipat sa pagitan ng mga bahay at negosyo mo, at ang “+ Magdagdag ng isa pang bahay o negosyo”. May sariling mga kuwarto, gamit at paalala ang bawat isa, at nagbubukas ang app sa huli mong ginamit. Buksan ang isang gamit at i-tap ang “Ilipat sa ibang bahay o negosyo” kung mali ang pinagdagdagan mo: kasama ang mga litrato, paalala at kasaysayan, at may Undo.","首页顶部现在有一个栏，可在您的住所和企业之间切换，还有“+ 添加另一个住所或企业”。每个都有自己的房间、物品和提醒，应用会打开您上次使用的那个。如果物品加错了地方，打开它并点击“移到其他家或企业”：照片、提醒和历史记录都会一起带走，还可以撤销。","ホームの上部に、自宅や事業所を切り替えるバーと「+ 別の自宅または事業所を追加」が加わりました。それぞれが独自の部屋、アイテム、リマインダーを持ち、アプリは最後に使ったところで開きます。違う場所に追加してしまったら、アイテムを開いて「別の自宅・事業所に移動」をタップしてください。写真、リマインダー、履歴もいっしょに移り、元に戻すこともできます。","이제 홈 상단에 집과 사업장을 전환하는 바와 ‘+ 다른 집이나 사업장 추가’가 생겼어요. 각각 자신만의 방, 물품, 알림을 갖고, 앱은 마지막에 쓴 곳에서 열려요. 엉뚱한 곳에 추가했다면 물품을 열고 ‘다른 집이나 사업장으로 이동’을 탭하세요. 사진, 알림, 기록이 모두 함께 이동하고, 실행 취소도 가능해요.","Oben auf Zuhause gibt es jetzt eine Leiste zum Wechseln zwischen Ihren Zuhause und Geschäften sowie „+ Weiteres Zuhause oder Geschäft hinzufügen“. Jedes hat seine eigenen Räume, Gegenstände und Erinnerungen, und die App öffnet sich bei dem, das Sie zuletzt genutzt haben. Öffnen Sie einen Gegenstand und tippen Sie auf „In ein anderes Zuhause oder Geschäft verschieben“, falls Sie ihn am falschen Ort angelegt haben: Fotos, Erinnerungen und Verlauf ziehen mit um, und es gibt Rückgängig.","Le haut de l’Accueil comporte maintenant une barre pour passer d’une maison ou entreprise à l’autre, et « + Ajouter une autre maison ou entreprise ». Chacune garde ses propres pièces, objets et rappels, et l’appli s’ouvre sur celle que vous avez utilisée en dernier. Ouvrez un objet et touchez « Déplacer vers une autre maison ou entreprise » si vous l’avez ajouté au mauvais endroit : photos, rappels et historique suivent, et il y a Annuler.","Ana sayfanın üstünde artık evleriniz ve işletmeleriniz arasında geçiş yapmak için bir çubuk ve “+ Başka bir ev veya işletme ekle” var. Her birinin kendi odaları, eşyaları ve hatırlatıcıları vardır; uygulama en son kullandığınızda açılır. Yanlış yere eklediyseniz bir eşyayı açıp “Başka bir ev veya işletmeye taşı”ya dokunun: fotoğraflar, hatırlatıcılar ve geçmiş de gelir, Geri al da var.","ด้านบนของหน้าโฮมมีแถบสลับระหว่างบ้านและธุรกิจของคุณ และ “+ เพิ่มบ้านหรือธุรกิจอื่น” แต่ละแห่งมีห้อง สิ่งของ และการเตือนของตัวเอง และแอปจะเปิดที่แห่งที่คุณใช้ล่าสุด ถ้าเพิ่มผิดที่ ให้เปิดสิ่งของแล้วแตะ “ย้ายไปบ้านหรือธุรกิจอื่น” รูป การเตือน และประวัติจะย้ายไปด้วย และมีเลิกทำ","ເທິງສຸດຂອງໜ້າຫຼັກມີແຖບສະຫຼັບລະຫວ່າງບ້ານ ແລະ ທຸລະກິດຂອງທ່ານ ແລະ “+ ເພີ່ມບ້ານ ຫຼື ທຸລະກິດອື່ນ”. ແຕ່ລະບ່ອນມີຫ້ອງ, ສິ່ງຂອງ ແລະ ການເຕືອນຂອງຕົນເອງ, ແລະ ແອັບຈະເປີດບ່ອນທີ່ທ່ານໃຊ້ຄັ້ງຫຼ້າສຸດ. ຖ້າເພີ່ມຜິດບ່ອນ ໃຫ້ເປີດສິ່ງຂອງແລ້ວແຕະ “ຍ້າຍໄປບ້ານ ຫຼື ທຸລະກິດອື່ນ”: ຮູບ, ການເຕືອນ ແລະ ປະຫວັດຈະຍ້າຍໄປນຳ ແລະ ມີຍົກເລີກ."],"Everyday reminders": ["Recordatorios diarios","Mga pang-araw-araw na paalala","日常提醒","日常のリマインダー","일상 알림","Alltagserinnerungen","Rappels du quotidien","Günlük hatırlatmalar","การเตือนประจำวัน","ການເຕືອນປະຈຳວັນ"],"New “Add a reminder” on Home for things like medical device supplies, pet supplies, air filters in each room or a humidifier. Say what it is, pick a room (or Around the house), how often (weekly up to yearly, or your own), and the first due date. It shows up in Needs attention this month and the calendar, and comes back around each time you mark it done.": ["Nuevo “Añadir un recordatorio” en Inicio para cosas como suministros de dispositivos médicos, suministros para mascotas, filtros de aire en cada habitación o un humidificador. Di qué es, elige una habitación (o Por la casa), cada cuánto (de semanal a anual, o el tuyo) y la primera fecha. Aparece en Requiere atención este mes y en el calendario, y vuelve cada vez que lo marcas como hecho.","Bagong “Magdagdag ng paalala” sa Home para sa mga bagay tulad ng gamit sa medical device, gamit ng alagang hayop, air filter sa bawat kuwarto o humidifier. Sabihin kung ano ito, pumili ng kuwarto (o Sa paligid ng bahay), gaano kadalas (lingguhan hanggang taunan, o sarili mo), at ang unang due date. Lumalabas ito sa Kailangang asikasuhin ngayong buwan at sa kalendaryo, at bumabalik sa tuwing minamarkahan mong tapos na.","首页新增“添加提醒”，适用于医疗设备耗材、宠物用品、各房间的空气滤网或加湿器等。说明它是什么，选择房间（或“屋内其他”）、频率（每周到每年，或自定义）以及第一次到期日。它会出现在“本月需要处理”和日历中，每次标记完成后会再次循环。","ホームに「リマインダーを追加」が登場。医療機器の消耗品、ペット用品、各部屋のエアフィルター、加湿器などに使えます。何かを入力し、部屋（または「家のあちこち」）、頻度（毎週から毎年まで、または自分で設定）、最初の期限を選びます。「今月の要対応」とカレンダーに表示され、完了にするたびにまた巡ってきます。","홈에 ‘알림 추가’가 새로 생겼어요. 의료기기 소모품, 반려동물 용품, 방마다 있는 공기 필터, 가습기 같은 것에 쓰세요. 무엇인지 적고, 방(또는 ‘집 안 곳곳’), 주기(매주부터 매년까지, 또는 직접 설정), 첫 기한을 고르세요. ‘이번 달 확인할 일’과 달력에 나타나고, 완료할 때마다 다시 돌아와요.","Neu: „Erinnerung hinzufügen“ auf Zuhause für Dinge wie Zubehör für medizinische Geräte, Haustierbedarf, Luftfilter in jedem Raum oder einen Luftbefeuchter. Sagen Sie, was es ist, wählen Sie einen Raum (oder Rund ums Haus), wie oft (wöchentlich bis jährlich oder eigener Rhythmus) und das erste Fälligkeitsdatum. Es erscheint unter Diesen Monat zu erledigen und im Kalender und kommt jedes Mal wieder, wenn Sie es als erledigt markieren.","Nouveau « Ajouter un rappel » sur l’Accueil pour des choses comme les fournitures d’appareils médicaux, les fournitures pour animaux, les filtres à air de chaque pièce ou un humidificateur. Dites ce que c’est, choisissez une pièce (ou Dans la maison), la fréquence (de hebdomadaire à annuelle, ou la vôtre) et la première échéance. Il apparaît dans À traiter ce mois-ci et dans le calendrier, et revient chaque fois que vous le marquez comme terminé.","Ana sayfada tıbbi cihaz malzemeleri, evcil hayvan malzemeleri, her odadaki hava filtreleri veya nemlendirici gibi şeyler için yeni “Hatırlatma ekle” var. Ne olduğunu yazın, bir oda seçin (veya Evin çevresi), ne sıklıkta olduğunu (haftalıktan yıllığa veya kendi seçiminiz) ve ilk son tarihi belirleyin. Bu ay ilgilenilecekler listesinde ve takvimde görünür, her tamamlandı işaretlediğinizde yeniden gelir.","ใหม่ “เพิ่มการเตือน” บนหน้าโฮม สำหรับสิ่งต่างๆ เช่น อุปกรณ์สิ้นเปลืองของเครื่องมือแพทย์ ของใช้สัตว์เลี้ยง ไส้กรองอากาศในแต่ละห้อง หรือเครื่องเพิ่มความชื้น บอกว่าคืออะไร เลือกห้อง (หรือรอบบ้าน) ความถี่ (รายสัปดาห์ถึงรายปี หรือกำหนดเอง) และวันครบกำหนดแรก จะแสดงในรายการที่ต้องดูแลเดือนนี้และในปฏิทิน และกลับมาทุกครั้งที่คุณกดว่าเสร็จแล้ว","ໃໝ່ “ເພີ່ມການເຕືອນ” ໃນໜ້າຫຼັກ ສຳລັບສິ່ງຕ່າງໆ ເຊັ່ນ ອຸປະກອນສິ້ນເປືອງຂອງເຄື່ອງມືແພດ, ຂອງໃຊ້ສັດລ້ຽງ, ໄສ້ກອງອາກາດໃນແຕ່ລະຫ້ອງ ຫຼື ເຄື່ອງເພີ່ມຄວາມຊື້ນ. ບອກວ່າແມ່ນຫຍັງ, ເລືອກຫ້ອງ (ຫຼື ອ້ອມເຮືອນ), ຄວາມຖີ່ (ລາຍອາທິດຫາລາຍປີ ຫຼື ກຳນົດເອງ) ແລະ ວັນຄົບກຳນົດທຳອິດ. ຈະສະແດງໃນລາຍການທີ່ຕ້ອງເບິ່ງແຍງເດືອນນີ້ ແລະ ໃນປະຕິທິນ, ແລະ ກັບມາທຸກຄັ້ງທີ່ທ່ານກົດວ່າສຳເລັດ."],"Pick your own due date": ["Elige tu propia fecha límite","Pumili ng sarili mong due date","自选到期日","期日を自分で選ぶ","기한 직접 선택","Eigenes Fälligkeitsdatum wählen","Choisissez votre propre échéance","Kendi vade tarihinizi seçin","เลือกวันครบกำหนดเอง","ເລືອກວັນຄົບກຳນົດເອງ"],"Not ready for a suggested task? Pick a due date for it instead of skipping. It still gets added, and shows up in Needs attention this month and the calendar when it’s due. Suggestions you saved earlier have a “pick a due date” box too.": ["¿No estás listo para una tarea sugerida? Elige una fecha límite en lugar de omitirla. Se añade igualmente y aparece en Requiere atención este mes y en el calendario cuando toca. Las sugerencias que guardaste antes también tienen una casilla “elegir fecha límite”.","Hindi pa handa sa iminumungkahing gawain? Pumili ng due date para dito sa halip na laktawan. Idinadagdag pa rin ito, at lalabas sa Kailangang asikasuhin ngayong buwan at sa kalendaryo kapag due na. May kahon ding “pumili ng due date” ang mga mungkahing na-save mo dati.","还没准备好做建议的任务？可以为它选一个到期日，而不是跳过。它仍会被添加，到期时出现在“本月需要处理”和日历中。您之前保存的建议也有“选择到期日”框。","提案されたタスクの準備がまだ？スキップせずに期限を選べます。ちゃんと追加され、期限が来たら「今月の要対応」とカレンダーに表示されます。以前に保存した提案にも「期限を選ぶ」欄があります。","추천 할 일을 하기엔 아직 이른가요? 건너뛰는 대신 기한을 골라보세요. 그래도 추가되고, 기한이 되면 ‘이번 달 확인할 일’과 달력에 나타나요. 전에 저장한 추천에도 ‘기한 고르기’ 칸이 있어요.","Noch nicht bereit für eine vorgeschlagene Aufgabe? Wählen Sie stattdessen ein Fälligkeitsdatum, statt sie zu überspringen. Sie wird trotzdem hinzugefügt und erscheint zur Fälligkeit unter Diesen Monat zu erledigen und im Kalender. Auch früher gespeicherte Vorschläge haben ein Feld „Fälligkeitsdatum wählen“.","Pas prêt pour une tâche suggérée ? Choisissez une échéance au lieu de l’ignorer. Elle est quand même ajoutée et apparaît dans À traiter ce mois-ci et dans le calendrier à l’échéance. Les suggestions enregistrées plus tôt ont aussi une case « choisir une échéance ».","Önerilen bir göreve hazır değil misiniz? Atlamak yerine bir son tarih seçin. Yine de eklenir ve zamanı gelince Bu ay ilgilenilecekler listesinde ve takvimde görünür. Daha önce kaydettiğiniz önerilerde de “son tarih seç” kutusu var.","ยังไม่พร้อมทำงานที่แนะนำ? เลือกวันครบกำหนดแทนการข้าม งานจะยังถูกเพิ่ม และแสดงในรายการที่ต้องดูแลเดือนนี้และในปฏิทินเมื่อถึงกำหนด คำแนะนำที่คุณบันทึกไว้ก่อนหน้านี้ก็มีช่อง “เลือกวันครบกำหนด” ด้วย","ຍັງບໍ່ພ້ອມເຮັດວຽກທີ່ແນະນຳ? ເລືອກວັນຄົບກຳນົດແທນການຂ້າມ. ວຽກຈະຍັງຖືກເພີ່ມ ແລະ ສະແດງໃນລາຍການທີ່ຕ້ອງເບິ່ງແຍງເດືອນນີ້ ແລະ ໃນປະຕິທິນເມື່ອຮອດກຳນົດ. ຄຳແນະນຳທີ່ທ່ານບັນທຶກໄວ້ກ່ອນໜ້ານີ້ກໍມີຊ່ອງ “ເລືອກວັນຄົບກຳນົດ” ເຊັ່ນກັນ."],"Punchy the helper": ["Punchy el ayudante","Si Punchy na katulong","小帮手 Punchy","お手伝いの Punchy","도우미 Punchy","Punchy, der Helfer","Punchy l’assistant","Yardımcı Punchy","Punchy ผู้ช่วย","Punchy ຜູ້ຊ່ວຍ"],"Punchy lives in the corner of your screen. Tap him to wave, tap again for a backflip, and drag him wherever you like (he remembers his spot). He works on his laptop with orange headphones whenever you’re adding things or tapping around, so you’re both busy together, and he claps when something saves. After you’ve seen both tricks, a tiny “tuck me in” link lets him nap.": ["Punchy vive en la esquina de tu pantalla. Tócalo para que salude, tócalo otra vez para una voltereta, y arrástralo adonde quieras (recuerda su sitio). Trabaja en su portátil con auriculares naranjas cuando añades cosas o tocas por la app, así que ambos están ocupados, y aplaude cuando algo se guarda. Cuando hayas visto ambos trucos, un pequeño enlace “arrópame” le deja echarse una siesta.","Nakatira si Punchy sa sulok ng screen mo. I-tap siya para kumaway, i-tap ulit para sa backflip, at i-drag kahit saan mo gusto (natatandaan niya ang puwesto niya). Nagtatrabaho siya sa laptop na may orange na headphones tuwing nagdadagdag ka o nagta-tap sa app, kaya parehong abala kayo, at pumapalakpak siya kapag may na-save. Kapag nakita mo na ang dalawang trick, hinahayaan siyang umidlip ng maliit na link na “patulugin mo ako”.","Punchy 住在您屏幕的角落。点他一下会挥手，再点一下会后空翻，还能把他拖到喜欢的位置（他会记住）。当您添加内容或点来点去时，他会戴着橙色耳机在笔记本电脑上工作，你们一起忙碌，保存成功时他还会鼓掌。看过两个特技后，一个小小的“哄我睡觉”链接可以让他小睡一会儿。","Punchy は画面の隅に住んでいます。タップすると手を振り、もう一度タップするとバク転、好きな場所にドラッグもできます（場所を覚えています）。何かを追加したり操作したりしているあいだ、オレンジのヘッドホンをつけてノートパソコンで作業し、いっしょに忙しくしてくれます。保存されると拍手も。2つの技を見たあとは、小さな「寝かせてあげる」リンクで昼寝させられます。","Punchy는 화면 구석에 살아요. 탭하면 손을 흔들고, 한 번 더 탭하면 백플립을 해요. 원하는 곳으로 끌어다 놓을 수도 있어요(자리를 기억해요). 무언가를 추가하거나 앱을 누르는 동안 주황색 헤드폰을 쓰고 노트북으로 일하며 함께 바쁘게 지내고, 저장되면 박수를 쳐요. 두 가지 묘기를 다 본 뒤에는 작은 ‘재워주기’ 링크로 낮잠을 재울 수 있어요.","Punchy wohnt in der Ecke Ihres Bildschirms. Tippen Sie ihn an, damit er winkt, noch einmal für einen Rückwärtssalto, und ziehen Sie ihn, wohin Sie möchten (er merkt sich seinen Platz). Er arbeitet mit orangefarbenen Kopfhörern an seinem Laptop, wenn Sie etwas hinzufügen oder herumtippen, sodass Sie beide beschäftigt sind, und er klatscht, wenn etwas gespeichert wird. Nachdem Sie beide Tricks gesehen haben, lässt ihn ein winziger Link „Zudecken“ ein Nickerchen machen.","Punchy vit dans le coin de votre écran. Touchez-le pour qu’il fasse coucou, touchez encore pour un salto arrière, et faites-le glisser où vous voulez (il se souvient de sa place). Il travaille sur son ordinateur avec un casque orange quand vous ajoutez des choses ou touchez l’appli, vous êtes donc occupés ensemble, et il applaudit quand quelque chose est enregistré. Après avoir vu les deux tours, un petit lien « border Punchy » lui permet de faire la sieste.","Punchy ekranınızın köşesinde yaşıyor. Ona dokunun, el sallasın; bir daha dokunun, ters takla atsın; istediğiniz yere sürükleyin (yerini hatırlar). Bir şey eklerken veya uygulamada dolaşırken turuncu kulaklıklarıyla dizüstü bilgisayarında çalışır, böylece ikiniz de meşgul olursunuz; bir şey kaydedildiğinde alkışlar. İki numarayı da gördükten sonra küçük bir “beni yatır” bağlantısı onu uyutur.","Punchy อาศัยอยู่ที่มุมหน้าจอของคุณ แตะเขาเพื่อให้โบกมือ แตะอีกครั้งเพื่อตีลังกาหลัง และลากไปไว้ตรงไหนก็ได้ (เขาจำที่ของเขาได้) เขาจะทำงานบนแล็ปท็อปพร้อมหูฟังสีส้มเมื่อคุณเพิ่มของหรือแตะไปมา เลยยุ่งด้วยกันทั้งคู่ และเขาจะปรบมือเมื่อบันทึกสำเร็จ หลังจากเห็นทั้งสองลูกเล่นแล้ว ลิงก์เล็กๆ “ห่มผ้าให้ฉัน” จะให้เขางีบได้","Punchy ອາໄສຢູ່ມຸມໜ້າຈໍຂອງທ່ານ. ແຕະລາວເພື່ອໃຫ້ໂບກມື, ແຕະອີກຄັ້ງເພື່ອຕີລັງກາຫຼັງ, ແລະ ລາກໄປບ່ອນໃດກໍໄດ້ (ລາວຈື່ບ່ອນຂອງລາວ). ລາວຈະເຮັດວຽກໃນແລັບທັອບພ້ອມຫູຟັງສີສົ້ມເມື່ອທ່ານເພີ່ມຂອງ ຫຼື ແຕະໄປມາ, ສະນັ້ນທັງສອງຄົນຈຶ່ງຫຍຸ້ງນຳກັນ, ແລະ ລາວຈະຕົບມືເມື່ອບັນທຶກສຳເລັດ. ຫຼັງຈາກເຫັນທັງສອງກົນແລ້ວ, ລິ້ງນ້ອຍໆ “ຫົ່ມຜ້າໃຫ້ຂ້ອຍ” ຈະໃຫ້ລາວຫຼັບໄດ້."],"Stay signed in": ["Mantener sesión iniciada","Manatiling naka-sign in","保持登录","ログイン状態を保つ","로그인 유지","Angemeldet bleiben","Rester connecté","Oturumu açık tut","อยู่ในระบบ","ຢູ່ໃນລະບົບ"],"Sign in once and One Place remembers you on this device (untick “Keep me signed in” on a shared phone). Your email is filled in next time, and losing internet no longer signs you out.": ["Inicia sesión una vez y One Place te recuerda en este dispositivo (desmarca “Mantener sesión iniciada” en un teléfono compartido). Tu correo se rellena la próxima vez, y perder internet ya no cierra tu sesión.","Mag-sign in nang isang beses at maaalala ka ng One Place sa device na ito (alisin ang tsek sa “Manatiling naka-sign in” sa pinagsasaluhang telepono). Napupunan na ang email mo sa susunod, at hindi ka na nagsa-sign out kapag nawalan ng internet.","登录一次，One Place 就会在此设备上记住您（在共用手机上请取消勾选“保持登录”）。下次会自动填好您的邮箱，断网也不会再把您登出。","一度サインインすると、この端末で One Place があなたを覚えます（共有のスマホでは「サインインしたままにする」のチェックを外してください）。次回はメールアドレスが入力済みになり、ネットが切れてもサインアウトされません。","한 번 로그인하면 One Place가 이 기기에서 나를 기억해요(공용 휴대폰에서는 ‘로그인 유지’를 해제하세요). 다음에는 이메일이 미리 채워지고, 인터넷이 끊겨도 더 이상 로그아웃되지 않아요.","Einmal anmelden, und One Place erkennt Sie auf diesem Gerät wieder (auf einem geteilten Telefon „Angemeldet bleiben“ abwählen). Ihre E-Mail wird beim nächsten Mal ausgefüllt, und ein Internetausfall meldet Sie nicht mehr ab.","Connectez-vous une fois et One Place vous reconnaît sur cet appareil (décochez « Rester connecté » sur un téléphone partagé). Votre e-mail est prérempli la fois suivante, et perdre la connexion internet ne vous déconnecte plus.","Bir kez oturum açın, One Place sizi bu cihazda hatırlasın (paylaşılan telefonda “Oturumu açık tut” işaretini kaldırın). E-postanız bir dahaki sefere dolu gelir ve internet kesilince artık oturumunuz kapanmaz.","เข้าสู่ระบบครั้งเดียว One Place จะจำคุณบนอุปกรณ์นี้ (เลิกติ๊ก “ไม่ต้องล็อกอินซ้ำ” บนโทรศัพท์ที่ใช้ร่วมกัน) อีเมลของคุณจะถูกกรอกให้ครั้งหน้า และอินเทอร์เน็ตหลุดก็ไม่ทำให้คุณหลุดจากระบบอีกต่อไป","ເຂົ້າສູ່ລະບົບຄັ້ງດຽວ One Place ຈະຈື່ທ່ານໃນອຸປະກອນນີ້ (ເອົາເຄື່ອງໝາຍອອກຈາກ “ຢູ່ໃນລະບົບຕະຫຼອດ” ໃນໂທລະສັບທີ່ໃຊ້ຮ່ວມກັນ). ອີເມວຂອງທ່ານຈະຖືກຕື່ມໃຫ້ຄັ້ງຕໍ່ໄປ ແລະ ອິນເຕີເນັດຂາດກໍບໍ່ເຮັດໃຫ້ທ່ານອອກຈາກລະບົບອີກ."],"Plushie squad: celebrations and a Why page": ["Escuadrón de peluches: celebraciones y una página de Por qué","Plushie squad: mga selebrasyon at pahina ng Bakit","玩偶小队：庆祝动画和“为什么”页面","ぬいぐるみ隊：お祝い演出と「なぜ」ページ","인형 친구들: 축하 연출과 ‘왜’ 페이지","Kuschelteam: Feiern und eine Warum-Seite","Équipe de peluches : célébrations et page « Pourquoi »","Peluş ekibi: kutlamalar ve Neden sayfası","ทีมตุ๊กตา: การเฉลิมฉลองและหน้า ทำไม","ທີມຕຸ໊ກກະຕາ: ການສະຫຼອງ ແລະ ໜ້າ ເປັນຫຍັງ"],"Finish a task and one of the squad (all hand-drawn, fluffy and fat) celebrates (silent, and calmer if your device asks for less motion). Everyone takes turns. The “Why I created One Place” button at the bottom of home is a little duck with a question mark. Search What’s New! to find any fix.": ["Termina una tarea y uno del equipo (todos dibujados a mano, mullidos y rechonchos) celebra (en silencio, y más tranquilo si tu dispositivo pide menos movimiento). Se turnan. El botón “Por qué creé One Place” al final de inicio es un patito con un signo de interrogación. Busca en Novedades para encontrar cualquier arreglo.","Tapusin ang isang gawain at may isa sa squad (lahat ay guhit-kamay, malambot at mataba) na magse-selebrate (tahimik, at mas kalmado kung humihingi ng mas kaunting galaw ang device mo). Salitan sila. Ang button na “Bakit ko ginawa ang One Place” sa ibaba ng home ay isang maliit na pato na may tandang pananong. Hanapin sa What’s New! ang anumang ayos.","完成一项任务，小队中的一位（全是手绘的，毛茸茸圆滚滚）就会庆祝（无声，若您的设备要求减少动态效果则更平静）。大家轮流上场。首页底部的“我为什么创建 One Place”按钮是一只带问号的小鸭子。在“What’s New!”中搜索即可找到任何修复。","タスクを終えると、チームのひとり（全員手描きで、ふわふわでまんまる）がお祝いしてくれます（音は出ず、端末が動きを控えめにする設定なら、さらに穏やかに）。みんな順番に登場します。ホーム下部の「One Place を作った理由」ボタンは、はてなマークのついた小さなアヒルです。What’s New! で検索すると、どの修正も見つかります。","할 일을 끝내면 친구들 중 한 명(모두 손으로 그린, 폭신하고 통통한 친구들)이 축하해줘요(소리 없이, 기기에서 움직임 줄이기를 켰다면 더 차분하게). 모두 돌아가며 나와요. 홈 아래쪽의 ‘One Place를 만든 이유’ 버튼은 물음표를 든 작은 오리예요. What’s New!에서 검색하면 어떤 수정이든 찾을 수 있어요.","Erledigen Sie eine Aufgabe, und jemand aus dem Team (alle handgezeichnet, flauschig und kugelrund) feiert (lautlos, und ruhiger, wenn Ihr Gerät weniger Bewegung wünscht). Alle kommen abwechselnd dran. Der Button „Warum ich One Place erstellt habe“ unten auf Zuhause ist eine kleine Ente mit Fragezeichen. Suchen Sie in What’s New!, um jede Korrektur zu finden.","Terminez une tâche et un membre de l’équipe (tous dessinés à la main, doux et rondouillets) fête ça (en silence, et plus calmement si votre appareil demande moins de mouvement). Chacun son tour. Le bouton « Pourquoi j’ai créé One Place » en bas de l’accueil est un petit canard avec un point d’interrogation. Cherchez dans What’s New! pour trouver n’importe quelle correction.","Bir görevi bitirin, ekipten biri (hepsi elle çizilmiş, kabarık ve tombul) kutlama yapsın (sessizce, cihazınız daha az hareket istiyorsa daha sakin). Sırayla gelirler. Ana sayfanın altındaki “One Place’i neden oluşturdum” düğmesi soru işaretli küçük bir ördek. Herhangi bir düzeltmeyi bulmak için What’s New!’da arayın.","ทำงานเสร็จ แล้วสมาชิกในทีมสักคน (วาดด้วยมือทั้งหมด ฟูและอ้วนกลม) จะฉลองให้ (แบบเงียบๆ และสงบขึ้นถ้าอุปกรณ์ของคุณขอให้ลดการเคลื่อนไหว) ทุกคนผลัดกันมา ปุ่ม “ทำไมฉันสร้าง One Place” ที่ด้านล่างของหน้าโฮมคือเป็ดน้อยถือเครื่องหมายคำถาม ค้นหาใน What’s New! เพื่อหาการแก้ไขทุกอย่าง","ເຮັດວຽກສຳເລັດ ແລ້ວສະມາຊິກໃນທີມຄົນໜຶ່ງ (ແຕ້ມດ້ວຍມືທັງໝົດ, ຟູ ແລະ ອ້ວນກົມ) ຈະສະຫຼອງໃຫ້ (ແບບງຽບໆ ແລະ ສະຫງົບຂຶ້ນຖ້າອຸປະກອນຂອງທ່ານຂໍໃຫ້ຫຼຸດການເຄື່ອນໄຫວ). ທຸກຄົນຜັດກັນມາ. ປຸ່ມ “ເປັນຫຍັງຂ້ອຍສ້າງ One Place” ທີ່ລຸ່ມສຸດຂອງໜ້າຫຼັກແມ່ນເປັດນ້ອຍຖືເຄື່ອງໝາຍຄຳຖາມ. ຄົ້ນຫາໃນ What’s New! ເພື່ອຫາການແກ້ໄຂທຸກຢ່າງ."],"Vehicles, phones, pets and printing": ["Vehículos, teléfonos, mascotas e impresión","Mga sasakyan, telepono, alagang hayop at pag-print","车辆、手机、宠物和打印","乗り物、携帯電話、ペット、印刷","차량, 휴대폰, 반려동물, 인쇄","Fahrzeuge, Handys, Haustiere und Drucken","Véhicules, téléphones, animaux et impression","Araçlar, telefonlar, evcil hayvanlar ve yazdırma","ยานพาหนะ โทรศัพท์ สัตว์เลี้ยง และการพิมพ์","ຍານພາຫະນະ, ໂທລະສັບ, ສັດລ້ຽງ ແລະ ການພິມ"],"Find “More to keep track of” on home. Add a car, phone, pet or printer, set reminders like oil change, vet visit or ink check, and they show up in Needs attention and the calendar.": ["Encuentra “Más cosas que controlar” en inicio. Añade un coche, teléfono, mascota o impresora, configura recordatorios como cambio de aceite, visita al veterinario o revisión de tinta, y aparecen en Requiere atención y en el calendario.","Hanapin ang “Iba pang susubaybayan” sa home. Magdagdag ng kotse, telepono, alagang hayop o printer, magtakda ng mga paalala tulad ng palit-langis, pagbisita sa beterinaryo o pag-check ng tinta, at lalabas ang mga ito sa Kailangang asikasuhin at sa kalendaryo.","在首页找到“更多需要管理的事项”。添加汽车、手机、宠物或打印机，设置换机油、看兽医或检查墨水之类的提醒，它们会出现在“需要处理”和日历中。","ホームの「ほかの管理項目」を開いてください。車、スマホ、ペット、プリンターを追加し、オイル交換、動物病院、インクのチェックなどのリマインダーを設定すると、「要対応」とカレンダーに表示されます。","홈에서 ‘더 관리할 항목’을 찾아보세요. 자동차, 휴대폰, 반려동물, 프린터를 추가하고 오일 교환, 동물병원 방문, 잉크 점검 같은 알림을 설정하면 ‘확인할 일’과 달력에 나타나요.","Unter „Mehr zum Verwalten“ auf Zuhause finden Sie es. Fügen Sie ein Auto, Telefon, Haustier oder einen Drucker hinzu, richten Sie Erinnerungen wie Ölwechsel, Tierarztbesuch oder Tintenkontrolle ein, und sie erscheinen unter „Zu erledigen“ und im Kalender.","Trouvez « Autres choses à suivre » sur l’accueil. Ajoutez une voiture, un téléphone, un animal ou une imprimante, réglez des rappels comme la vidange, la visite chez le vétérinaire ou le contrôle de l’encre, et ils apparaissent dans À traiter et dans le calendrier.","Ana sayfada “Takip edilecek diğer şeyler”i bulun. Bir araba, telefon, evcil hayvan veya yazıcı ekleyin, yağ değişimi, veteriner ziyareti veya mürekkep kontrolü gibi hatırlatıcılar kurun; bunlar İlgilenilecekler listesinde ve takvimde görünür.","หา “สิ่งอื่นที่ต้องติดตาม” บนหน้าโฮม เพิ่มรถ โทรศัพท์ สัตว์เลี้ยง หรือเครื่องพิมพ์ ตั้งการเตือนอย่างเปลี่ยนน้ำมันเครื่อง พาไปหาสัตวแพทย์ หรือเช็กหมึก แล้วจะแสดงในรายการที่ต้องดูแลและในปฏิทิน","ຊອກຫາ “ສິ່ງອື່ນທີ່ຕ້ອງຕິດຕາມ” ໃນໜ້າຫຼັກ. ເພີ່ມລົດ, ໂທລະສັບ, ສັດລ້ຽງ ຫຼື ເຄື່ອງພິມ, ຕັ້ງການເຕືອນເຊັ່ນ ປ່ຽນນ້ຳມັນເຄື່ອງ, ພາໄປຫາສັດຕະວະແພດ ຫຼື ກວດໝຶກ, ແລ້ວຈະສະແດງໃນລາຍການທີ່ຕ້ອງເບິ່ງແຍງ ແລະ ໃນປະຕິທິນ."],"Make it yours: themes, lighting, text size, languages": ["Hazlo tuyo: temas, iluminación, tamaño de texto, idiomas","Gawin itong iyo: mga tema, liwanag, laki ng teksto, wika","打造专属风格：主题、光线、字号、语言","自分好みに：テーマ、明るさ、文字サイズ、言語","나만의 스타일: 테마, 밝기, 글자 크기, 언어","Machen Sie es zu Ihrem: Designs, Beleuchtung, Textgröße, Sprachen","Personnalisez : thèmes, luminosité, taille du texte, langues","Kendinize göre ayarlayın: temalar, aydınlatma, yazı boyutu, diller","ทำให้เป็นของคุณ: ธีม แสง ขนาดตัวอักษร ภาษา","ເຮັດໃຫ້ເປັນຂອງທ່ານ: ທີມ, ແສງ, ຂະໜາດຕົວອັກສອນ, ພາສາ"],"Open “Make it yours” at the bottom of home. Pick one of 10 themes, choose Auto, Light or Dark, pick one of 11 languages, and make the text bigger or smaller. It only changes the look, and it’s remembered on your device.": ["Abre “Hazlo tuyo” al final de inicio. Elige uno de 10 temas, elige Automático, Claro u Oscuro, elige uno de 11 idiomas, y haz el texto más grande o más pequeño. Solo cambia el aspecto, y se recuerda en tu dispositivo.","Buksan ang “Gawing sa iyo” sa ibaba ng home. Pumili ng isa sa 10 tema, pumili ng Awtomatiko, Maliwanag o Madilim, pumili ng isa sa 11 wika, at palakihin o paliitin ang teksto. Itsura lang ang binabago nito, at naaalala ito sa device mo.","打开首页底部的“个性化”。从 10 个主题中选一个，选择自动、浅色或深色，从 11 种语言中选一种，并调大或调小文字。它只改变外观，并会记在您的设备上。","ホーム下部の「自分好みに」を開いてください。10種類のテーマから選び、自動・ライト・ダークを選び、11言語から選び、文字を大きくしたり小さくしたりできます。見た目だけが変わり、この端末に記憶されます。","홈 아래쪽의 ‘나에게 맞게’를 열어보세요. 10가지 테마 중 하나를 고르고, 자동·라이트·다크를 고르고, 11개 언어 중 하나를 고르고, 글자를 더 크게 또는 작게 만들 수 있어요. 모양만 바뀌고, 이 기기에 기억돼요.","Öffnen Sie „Nach deinem Geschmack“ unten auf Zuhause. Wählen Sie eines von 10 Designs, wählen Sie Automatisch, Hell oder Dunkel, wählen Sie eine von 11 Sprachen und machen Sie den Text größer oder kleiner. Das ändert nur das Aussehen und wird auf Ihrem Gerät gespeichert.","Ouvrez « Personnaliser » en bas de l’accueil. Choisissez l’un des 10 thèmes, choisissez Auto, Clair ou Sombre, choisissez l’une des 11 langues, et agrandissez ou réduisez le texte. Cela ne change que l’apparence, et c’est mémorisé sur votre appareil.","Ana sayfanın altındaki “Sana göre ayarla”yı açın. 10 temadan birini seçin, Otomatik, Açık veya Koyu’yu seçin, 11 dilden birini seçin ve yazıyı büyütün ya da küçültün. Yalnızca görünümü değiştirir ve cihazınızda hatırlanır.","เปิด “ปรับให้เป็นของคุณ” ที่ด้านล่างของหน้าโฮม เลือกหนึ่งใน 10 ธีม เลือกอัตโนมัติ สว่าง หรือมืด เลือกหนึ่งใน 11 ภาษา และทำให้ตัวอักษรใหญ่ขึ้นหรือเล็กลง เปลี่ยนแค่หน้าตา และจดจำไว้บนอุปกรณ์ของคุณ","ເປີດ “ປັບໃຫ້ເປັນຂອງທ່ານ” ຢູ່ລຸ່ມສຸດຂອງໜ້າຫຼັກ. ເລືອກໜຶ່ງໃນ 10 ທີມ, ເລືອກອັດຕະໂນມັດ, ແສງ ຫຼື ມືດ, ເລືອກໜຶ່ງໃນ 11 ພາສາ, ແລະ ເຮັດໃຫ້ຕົວອັກສອນໃຫຍ່ຂຶ້ນ ຫຼື ນ້ອຍລົງ. ປ່ຽນແຕ່ໜ້າຕາເທົ່ານັ້ນ ແລະ ຈື່ໄວ້ໃນອຸປະກອນຂອງທ່ານ."],"Send feedback and invite friends": ["Envía comentarios e invita a amigos","Magpadala ng feedback at mag-imbita ng kaibigan","发送反馈并邀请朋友","フィードバック送信と友だち招待","피드백 보내기 및 친구 초대","Feedback senden und Freunde einladen","Envoyer des commentaires et inviter des amis","Geri bildirim gönderin ve arkadaşlarınızı davet edin","ส่งความคิดเห็นและชวนเพื่อน","ສົ່ງຄຳຕິຊົມ ແລະ ເຊີນໝູ່"],"Tap “Send feedback” at the bottom of home to tell us what you love or what broke, with an optional photo. “Invite a friend” gives you a ready-made message to share.": ["Toca “Enviar comentarios” al final de inicio para contarnos qué te encanta o qué falló, con una foto opcional. “Invitar a un amigo” te da un mensaje listo para compartir.","I-tap ang “Magpadala ng feedback” sa ibaba ng home para sabihin kung ano ang gusto mo o ano ang nasira, na may opsyonal na litrato. Ang “Mag-imbita ng kaibigan” ay nagbibigay ng handang mensaheng maibabahagi.","点击首页底部的“发送反馈”，告诉我们您喜欢什么或哪里出了问题，还可以附上照片。“邀请朋友”会给您一条现成的消息可以分享。","ホーム下部の「フィードバックを送る」をタップすると、気に入った点や不具合を、写真つきでも送れます。「友だちを招待」では、すぐ共有できるメッセージが用意されます。","홈 아래쪽의 ‘피드백 보내기’를 탭해 마음에 든 점이나 문제가 생긴 점을 알려주세요. 사진도 첨부할 수 있어요. ‘친구 초대’는 바로 공유할 수 있는 메시지를 만들어줘요.","Tippen Sie unten auf Zuhause auf „Feedback senden“, um uns zu sagen, was Ihnen gefällt oder was kaputt ist, optional mit Foto. „Freund einladen“ gibt Ihnen eine fertige Nachricht zum Teilen.","Touchez « Envoyer un commentaire » en bas de l’accueil pour nous dire ce que vous aimez ou ce qui ne marche pas, avec une photo en option. « Inviter un ami » vous donne un message prêt à partager.","Ana sayfanın altındaki “Geri bildirim gönder”e dokunarak neyi sevdiğinizi veya neyin bozulduğunu bize söyleyin, isterseniz fotoğraf ekleyin. “Bir arkadaşını davet et” paylaşmaya hazır bir mesaj verir.","แตะ “ส่งความคิดเห็น” ที่ด้านล่างของหน้าโฮม เพื่อบอกเราว่าคุณชอบอะไรหรืออะไรเสีย พร้อมแนบรูปได้ตามต้องการ “ชวนเพื่อน” จะให้ข้อความสำเร็จรูปสำหรับแชร์","ແຕະ “ສົ່ງຄຳຕິຊົມ” ຢູ່ລຸ່ມສຸດຂອງໜ້າຫຼັກ ເພື່ອບອກພວກເຮົາວ່າທ່ານມັກຫຍັງ ຫຼື ຫຍັງເສຍ, ແນບຮູບໄດ້ຕາມຕ້ອງການ. “ເຊີນໝູ່” ຈະໃຫ້ຂໍ້ຄວາມສຳເລັດຮູບເພື່ອແບ່ງປັນ."],"Fix-it help: Parts, DIY, and Big job?": ["Ayuda para arreglar: Piezas, Hazlo tú y ¿Trabajo grande?","Tulong sa pag-aayos: Parts, DIY, at Malaking trabaho?","维修帮助：配件、自己动手、大工程？","修理のヒント：部品、DIY、大きな作業？","수리 도움말: 부품, 직접 하기, 큰 작업?","Reparaturhilfe: Teile, Selbermachen und Großer Auftrag?","Aide à la réparation : pièces, bricolage et gros travaux ?","Onarım yardımı: Parçalar, Kendin Yap ve Büyük iş?","ตัวช่วยซ่อม: อะไหล่ ทำเอง และงานใหญ่?","ຕົວຊ່ວຍແປງ: ອະໄຫຼ່, ເຮັດເອງ ແລະ ວຽກໃຫຍ່?"],"Open any item to find three new buttons. Parts suggests what to replace and links to stores for your country. DIY gives full instructions with tools, quantities, and how to protect around the job. Big job? helps you ask a pro for a quote. Pick your country at the bottom of home.": ["Abre cualquier objeto para ver tres botones nuevos. Piezas sugiere qué reemplazar y enlaza a tiendas de tu país. Hazlo tú da instrucciones completas con herramientas, cantidades y cómo proteger los alrededores. ¿Trabajo grande? te ayuda a pedir un presupuesto a un profesional. Elige tu país al final de inicio.","Buksan ang kahit anong gamit para makita ang tatlong bagong button. Ang Parts ay nagmumungkahi ng papalitan at may link sa mga tindahan sa bansa mo. Ang DIY ay nagbibigay ng kumpletong tagubilin na may mga kagamitan, dami, at kung paano protektahan ang paligid. Ang Malaking trabaho? ay tumutulong humingi ng quote sa isang pro. Piliin ang bansa mo sa ibaba ng home.","打开任意物品，会看到三个新按钮。“配件”建议更换什么，并链接到您所在国家的商店。“自己动手”提供完整说明，包括工具、数量以及如何保护周围。“大工程？”帮您向专业人士索取报价。在首页底部选择您的国家。","アイテムを開くと、3つの新しいボタンがあります。「部品」は交換するものを提案し、お住まいの国のお店にリンクします。「DIY」は工具や数量、周りの保護方法まで含めた手順を案内します。「大きな作業？」は業者に見積もりを頼むのを手伝います。国はホーム下部で選んでください。","물품을 열면 새 버튼 세 개가 있어요. ‘부품’은 교체할 것을 제안하고 내 나라의 매장으로 연결해요. ‘직접 하기’는 도구, 수량, 주변 보호 방법까지 담은 상세한 방법을 알려줘요. ‘큰 작업?’은 전문가에게 견적을 요청하도록 도와줘요. 국가는 홈 아래쪽에서 선택하세요.","Öffnen Sie einen beliebigen Gegenstand, um drei neue Buttons zu finden. Teile schlägt vor, was ersetzt werden sollte, und verlinkt auf Shops für Ihr Land. Selbermachen gibt vollständige Anleitungen mit Werkzeugen, Mengen und Schutz der Umgebung. Großer Auftrag? hilft Ihnen, ein Angebot von einem Profi einzuholen. Wählen Sie Ihr Land unten auf Zuhause.","Ouvrez n’importe quel objet pour trouver trois nouveaux boutons. Pièces suggère quoi remplacer et renvoie vers des magasins de votre pays. Bricolage donne des instructions complètes avec outils, quantités et protection autour du chantier. Gros travaux ? vous aide à demander un devis à un pro. Choisissez votre pays en bas de l’accueil.","Herhangi bir eşyayı açın, üç yeni düğme göreceksiniz. Parçalar neyin değiştirileceğini önerir ve ülkenizdeki mağazalara bağlantı verir. Kendin Yap; araçlar, miktarlar ve işin çevresinin nasıl korunacağıyla tam talimat verir. Büyük iş? bir ustadan teklif istemenize yardım eder. Ülkenizi ana sayfanın altından seçin.","เปิดสิ่งของใดก็ได้เพื่อดูปุ่มใหม่สามปุ่ม อะไหล่แนะนำสิ่งที่ควรเปลี่ยนและลิงก์ไปร้านค้าในประเทศของคุณ ทำเองให้คำแนะนำครบถ้วนพร้อมเครื่องมือ ปริมาณ และวิธีป้องกันบริเวณรอบงาน งานใหญ่? ช่วยให้คุณขอใบเสนอราคาจากช่าง เลือกประเทศของคุณที่ด้านล่างของหน้าโฮม","ເປີດສິ່ງຂອງໃດກໍໄດ້ເພື່ອເບິ່ງປຸ່ມໃໝ່ສາມປຸ່ມ. ອະໄຫຼ່ແນະນຳສິ່ງທີ່ຄວນປ່ຽນ ແລະ ລິ້ງໄປຮ້ານໃນປະເທດຂອງທ່ານ. ເຮັດເອງໃຫ້ຄຳແນະນຳຄົບຖ້ວນພ້ອມເຄື່ອງມື, ປະລິມານ ແລະ ວິທີປ້ອງກັນບໍລິເວນອ້ອມງານ. ວຽກໃຫຍ່? ຊ່ວຍໃຫ້ທ່ານຂໍໃບສະເໜີລາຄາຈາກຊ່າງ. ເລືອກປະເທດຂອງທ່ານຢູ່ລຸ່ມສຸດຂອງໜ້າຫຼັກ."],"Reminders and a calendar": ["Recordatorios y un calendario","Mga paalala at kalendaryo","提醒和日历","リマインダーとカレンダー","알림과 캘린더","Erinnerungen und ein Kalender","Rappels et un calendrier","Hatırlatmalar ve bir takvim","การเตือนและปฏิทิน","ການເຕືອນ ແລະ ປະຕິທິນ"],"A “Needs attention this month” list on the home screen. Tap Done! (with an Undo), or snooze a task for 1 week, 2 weeks, 1 month, 3 months, or a date you pick. There’s also a weekly, monthly, and yearly calendar you can print.": ["Una lista “Requiere atención este mes” en la pantalla de inicio. Toca ¡Listo! (con Deshacer), o pospón una tarea 1 semana, 2 semanas, 1 mes, 3 meses o una fecha que elijas. También hay un calendario semanal, mensual y anual que puedes imprimir.","May listahang “Kailangang asikasuhin ngayong buwan” sa home screen. I-tap ang Tapos na! (may Undo), o i-snooze ang gawain nang 1 linggo, 2 linggo, 1 buwan, 3 buwan, o petsang pipiliin mo. May lingguhan, buwanan at taunang kalendaryo ring puwedeng i-print.","首页新增“本月需要处理”列表。点击“完成！”（可撤销），或把任务推迟 1 周、2 周、1 个月、3 个月，或您选的日期。还有可打印的周、月、年日历。","ホーム画面に「今月の要対応」リストが加わりました。「完了！」をタップ（元に戻せます）するか、タスクを1週間、2週間、1か月、3か月、または好きな日付までスヌーズできます。印刷できる週・月・年のカレンダーもあります。","홈 화면에 ‘이번 달 확인할 일’ 목록이 생겼어요. ‘완료!’를 탭하거나(실행 취소 가능), 할 일을 1주, 2주, 1개월, 3개월 또는 원하는 날짜까지 미룰 수 있어요. 인쇄할 수 있는 주간·월간·연간 달력도 있어요.","Eine Liste „Diesen Monat zu erledigen“ auf dem Startbildschirm. Tippen Sie auf Erledigt! (mit Rückgängig) oder verschieben Sie eine Aufgabe um 1 Woche, 2 Wochen, 1 Monat, 3 Monate oder auf ein gewähltes Datum. Außerdem gibt es einen Wochen-, Monats- und Jahreskalender zum Drucken.","Une liste « À traiter ce mois-ci » sur l’écran d’accueil. Touchez Terminé ! (avec Annuler), ou reportez une tâche de 1 semaine, 2 semaines, 1 mois, 3 mois ou à une date de votre choix. Il y a aussi un calendrier hebdomadaire, mensuel et annuel imprimable.","Ana ekranda bir “Bu ay ilgilenilecekler” listesi. Tamam!’a dokunun (Geri al ile) veya bir görevi 1 hafta, 2 hafta, 1 ay, 3 ay ya da seçtiğiniz bir tarihe erteleyin. Yazdırabileceğiniz haftalık, aylık ve yıllık bir takvim de var.","รายการ “ต้องดูแลเดือนนี้” บนหน้าจอโฮม แตะเสร็จแล้ว! (มีเลิกทำ) หรือเลื่อนงานออกไป 1 สัปดาห์ 2 สัปดาห์ 1 เดือน 3 เดือน หรือวันที่คุณเลือก และยังมีปฏิทินรายสัปดาห์ รายเดือน และรายปีที่พิมพ์ได้","ລາຍການ “ຕ້ອງເບິ່ງແຍງເດືອນນີ້” ໃນໜ້າຈໍຫຼັກ. ແຕະສຳເລັດ! (ມີຍົກເລີກ) ຫຼື ເລື່ອນວຽກອອກໄປ 1 ອາທິດ, 2 ອາທິດ, 1 ເດືອນ, 3 ເດືອນ ຫຼື ວັນທີທີ່ທ່ານເລືອກ. ຍັງມີປະຕິທິນລາຍອາທິດ, ລາຍເດືອນ ແລະ ລາຍປີທີ່ພິມໄດ້."],"Sign in, rooms, and Plan my fix": ["Inicio de sesión, habitaciones y Planificar mi arreglo","Sign in, mga kuwarto, at Planuhin ang ayos","登录、房间和规划维修","ログイン、部屋、修理プラン","로그인, 방, 수리 계획 세우기","Anmeldung, Räume und Reparatur planen","Connexion, pièces et Planifier ma réparation","Giriş, odalar ve Onarımı planla","เข้าสู่ระบบ ห้อง และวางแผนซ่อม","ເຂົ້າສູ່ລະບົບ, ຫ້ອງ ແລະ ວາງແຜນແປງ"],"Sign in with your email, name your home, add rooms, then snap a photo and get a plan. Every suggested task is yours to accept or skip, and nothing is scheduled until you say so.": ["Inicia sesión con tu correo, ponle nombre a tu casa, añade habitaciones, haz una foto y recibe un plan. Cada tarea sugerida puedes aceptarla u omitirla, y nada se programa hasta que lo digas.","Mag-sign in gamit ang email mo, pangalanan ang bahay mo, magdagdag ng mga kuwarto, kumuha ng litrato at kumuha ng plano. Ikaw ang magpapasya kung tatanggapin o lalaktawan ang bawat iminumungkahing gawain, at walang naka-schedule hangga’t hindi mo sinasabi.","用邮箱登录，给您的家命名，添加房间，然后拍张照片获取计划。每个建议的任务都由您决定接受或跳过，在您同意之前不会安排任何事。","メールでサインインし、家に名前をつけ、部屋を追加して、写真を撮るとプランが届きます。提案されたタスクは受け入れるかスキップするかを選べて、あなたが言うまで何も予定されません。","이메일로 로그인하고, 집 이름을 정하고, 방을 추가한 다음 사진을 찍으면 계획을 받아요. 제안된 모든 할 일은 수락하거나 건너뛸 수 있고, 내가 말하기 전에는 아무것도 예약되지 않아요.","Melden Sie sich mit Ihrer E-Mail an, benennen Sie Ihr Zuhause, fügen Sie Räume hinzu, machen Sie ein Foto und erhalten Sie einen Plan. Jede vorgeschlagene Aufgabe können Sie annehmen oder überspringen, und nichts wird geplant, bevor Sie es sagen.","Connectez-vous avec votre e-mail, nommez votre maison, ajoutez des pièces, prenez une photo et obtenez un plan. Chaque tâche suggérée est à vous d’accepter ou d’ignorer, et rien n’est planifié tant que vous ne le dites pas.","E-postanızla oturum açın, evinize ad verin, oda ekleyin, fotoğraf çekin ve bir plan alın. Önerilen her görevi kabul etmek veya atlamak size kalmış; siz söylemedikçe hiçbir şey planlanmaz.","เข้าสู่ระบบด้วยอีเมล ตั้งชื่อบ้านของคุณ เพิ่มห้อง แล้วถ่ายรูปเพื่อรับแผน ทุกงานที่แนะนำคุณเลือกรับหรือข้ามได้ และจะไม่มีอะไรถูกกำหนดจนกว่าคุณจะบอก","ເຂົ້າສູ່ລະບົບດ້ວຍອີເມວ, ຕັ້ງຊື່ບ້ານຂອງທ່ານ, ເພີ່ມຫ້ອງ, ແລ້ວຖ່າຍຮູບເພື່ອຮັບແຜນ. ທຸກວຽກທີ່ແນະນຳທ່ານເລືອກຮັບ ຫຼື ຂ້າມໄດ້, ແລະ ຈະບໍ່ມີຫຍັງຖືກກຳນົດຈົນກວ່າທ່ານຈະບອກ."],"Fresh start": ["Nuevo comienzo","Bagong simula","重新开始","新たなスタート","새 출발","Neuanfang","Nouveau départ","Yeni başlangıç","เริ่มต้นใหม่","ເລີ່ມໃໝ່"],"One Place was rebuilt from the ground up. The first build proved the app, the database, and the photo AI are connected.": ["One Place se reconstruyó desde cero. La primera versión demostró que la app, la base de datos y la IA de fotos están conectadas.","Muling ginawa ang One Place mula sa simula. Pinatunayan ng unang build na magkakakonekta ang app, ang database at ang photo AI.","One Place 已从头重新构建。第一个版本证明了应用、数据库和照片 AI 已连通。","One Place はゼロから作り直されました。最初のビルドで、アプリ、データベース、写真 AI がつながることを確認しました。","One Place는 처음부터 다시 만들어졌어요. 첫 번째 빌드에서 앱, 데이터베이스, 사진 AI가 연결됨을 확인했어요.","One Place wurde von Grund auf neu gebaut. Der erste Build hat bewiesen, dass App, Datenbank und Foto-KI verbunden sind.","One Place a été reconstruit de zéro. La première version a prouvé que l’appli, la base de données et l’IA photo sont connectées.","One Place sıfırdan yeniden inşa edildi. İlk sürüm, uygulamanın, veritabanının ve fotoğraf yapay zekasının birbirine bağlı olduğunu kanıtladı.","One Place ถูกสร้างใหม่ตั้งแต่ต้น เวอร์ชันแรกพิสูจน์ว่าแอป ฐานข้อมูล และ AI ดูรูปเชื่อมต่อกันได้","One Place ຖືກສ້າງໃໝ່ຕັ້ງແຕ່ຕົ້ນ. ເວີຊັນທຳອິດພິສູດວ່າແອັບ, ຖານຂໍ້ມູນ ແລະ AI ເບິ່ງຮູບເຊື່ອມຕໍ່ກັນໄດ້."],"Tap a day to see everything planned and add your own.": ["Toca un día para ver todo lo planeado y añadir lo tuyo.","I-tap ang isang araw para makita ang lahat ng nakaplano at magdagdag ng sarili mo.","点击某一天，查看所有安排并添加自己的内容。","日付をタップすると、予定をすべて確認して自分の予定を追加できます。","날짜를 탭하면 모든 일정을 보고 직접 추가할 수 있어요.","Tippen Sie auf einen Tag, um alles Geplante zu sehen und Eigenes hinzuzufügen.","Touchez un jour pour voir tout ce qui est prévu et ajouter le vôtre.","Bir güne dokunarak planlananları görün ve kendinizinkini ekleyin.","แตะวันที่เพื่อดูทุกอย่างที่วางแผนไว้และเพิ่มของคุณเอง","ແຕະວັນທີເພື່ອເບິ່ງທຸກຢ່າງທີ່ວາງແຜນໄວ້ ແລະ ເພີ່ມຂອງທ່ານເອງ."],"Add something for this day": ["Añade algo para este día","Magdagdag ng bagay para sa araw na ito","为这一天添加内容","この日の予定を追加","이 날에 추가하기","Für diesen Tag etwas hinzufügen","Ajouter quelque chose pour ce jour","Bu gün için bir şey ekleyin","เพิ่มบางอย่างสำหรับวันนี้","ເພີ່ມບາງຢ່າງສຳລັບມື້ນີ້"],"Nothing planned for this day.": ["Nada planificado para este día.","Walang nakaplano para sa araw na ito.","这一天暂无安排。","この日の予定はありません。","이 날은 예정이 없어요.","Für diesen Tag ist nichts geplant.","Rien de prévu pour ce jour.","Bu gün için planlanmış bir şey yok.","วันนี้ไม่มีแผน","ມື້ນີ້ບໍ່ມີແຜນ."],"Type what you want to add.": ["Escribe lo que quieres añadir.","I-type ang gusto mong idagdag.","请输入要添加的内容。","追加する内容を入力してください。","추가할 내용을 입력하세요.","Geben Sie ein, was Sie hinzufügen möchten.","Saisissez ce que vous voulez ajouter.","Eklemek istediğinizi yazın.","พิมพ์สิ่งที่ต้องการเพิ่ม","ພິມສິ່ງທີ່ຕ້ອງການເພີ່ມ."],"Co-owner": ["Copropietario","Co-owner","共同所有者","共同オーナー","공동 소유자","Mitinhaber","Copropriétaire","Ortak sahip","เจ้าของร่วม","ເຈົ້າຂອງຮ່ວມ"],"Invited as co-owner": ["Invitado como copropietario","Inimbitahan bilang co-owner","已邀请为共同所有者","共同オーナーとして招待済み","공동 소유자로 초대됨","Als Mitinhaber eingeladen","Invité comme copropriétaire","Ortak sahip olarak davet edildi","เชิญเป็นเจ้าของร่วมแล้ว","ເຊີນເປັນເຈົ້າຂອງຮ່ວມແລ້ວ"],"Make co-owner": ["Hacer copropietario","Gawing co-owner","设为共同所有者","共同オーナーにする","공동 소유자로 지정","Zum Mitinhaber machen","Passer trato, paalala at kasaysayan. Mapupunta ito sa kuwartong may parehong pangalan doon, at gagawin kung wala pa.","所有内容都会一起移动：照片、提醒和历史记录。它会进入对方同名的房间，若没有则自动创建。","写真・リマインダー・履歴もすべて一緒に移動します。移動先の同じ名前の部屋に入り、なければ自動で作られます。","사진, 알림, 기록이 모두 함께 이동해요. 같은 이름의 방으로 들어가며, 없으면 새로 만들어 드려요.","Alles geht mit: Fotos, Erinnerungen und Verlauf. Es landet in einem Raum mit demselben Namen, der bei Bedarf neu angelegt wird.","Tout suit : photos, rappels et historique. Il arrive dans une pièce du même nom, créée pour vous si elle n’existe pas.","Her şey onunla gider: fotoğraflar, hatırlatmalar ve geçmiş. Aynı adlı odaya yerleşir, yoksa sizin için oluşturulur.","ทุกอย่างจะย้ายไปด้วย: รูปภาพ การเตือน และประวัติ จะไปอยู่ในห้องชื่อเดียวกันที่นั่น หากยังไม่มีจะสร้างให้","ທຸກຢ່າງຈະຍ້າຍໄປນຳ: ຮູບ, ການເຕືອນ ແລະ ປະຫວັດ. ຈະຢູ່ໃນຫ້ອງຊື່ດຽວກັນຢູ່ບ່ອນນັ້ນ ຖ້າຍັງບໍ່ມີຈະສ້າງໃຫ້"],"Filled in from the link. Check it looks right.": ["Rellenado desde el enlace. Comprueba que sea correcto.","Napunan mula sa link. Tingnan kung tama.","已根据链接填写，请确认是否正确。","リンクから入力しました。内容を確認してください。","링크에서 채웠어요. 맞는지 확인하세요.","Aus dem Link ausgefüllt. Bitte prüfen, ob es stimmt.","Rempli à partir du lien. Vérifiez que c’est correct.","Bağlantıdan dolduruldu. Doğru olup olmadığını kontrol edin.","กรอกจากลิงก์แล้ว โปรดตรวจสอบว่าถูกต้อง","ຕື່ມຈາກລິ້ງແລ້ວ. ກະລຸນາກວດເບິ່ງວ່າຖືກຕ້ອງ"],"Filters, humidifiers, medical device supplies, pet supplies, anything that repeats. Pick a room and how often.": ["Filtros, humidificadores, suministros médicos, para mascotas, todo lo que se repite. Elige una habitación y la frecuencia.","Filter, humidifier, medical supplies, pet supplies, anumang paulit-ulit. Pumili ng kuwarto at kung gaano kadalas.","滤网、加湿器、医疗设备耗材、宠物用品，任何需要重复的事。选择房间和频率。","フィルター、加湿器、医療機器の消耗品、ペット用品など、繰り返すものに。部屋と頻度を選んでください。","필터, 가습기, 의료기기 소모품, 반려동물 용품 등 반복되는 모든 것. 방과 주기를 고르세요.","Filter, Luftbefeuchter, medizinisches Zubehör, Tierbedarf, alles Wiederkehrende. Raum und Häufigkeit wählen.","Filtres, humidificateurs, fournitures médicales, produits pour animaux, tout ce qui se répète. Choisissez une pièce et la fréquence.","Filtreler, nemlendiriciler, tıbbi cihaz malzemeleri, evcil hayvan malzemeleri, tekrar eden her şey. Bir oda ve sıklık seçin.","ไส้กรอง เครื่องเพิ่มความชื้น อุปกรณ์การแพทย์ ของใช้สัตว์เลี้ยง ทุกอย่างที่ต้องทำซ้ำ เลือกห้องและความถี่","ໄສ້ກອງ, ເຄື່ອງເພີ່ມຄວາມຊຸ່ມ, ອຸປະກອນການແພດ, ຂອງໃຊ້ສັດລ້ຽງ, ທຸກຢ່າງທີ່ຕ້ອງເຮັດຊ້ຳ. ເລືອກຫ້ອງ ແລະ ຄວາມຖີ່"],"First due": ["Primer vencimiento","Unang due","首次到期","最初の期日","첫 기한","Erstmals fällig","Première échéance","İlk vade","ครบกำหนดครั้งแรก","ຄົບກຳນົດຄັ້ງທຳອິດ"],"First name": ["Nombre","Pangalan","名字","名","이름","Vorname","Prénom","Ad","ชื่อ","ຊື່"],"For everyday things that need doing on a schedule, like filters and supplies. Start with a link or a photo, or just type it.": ["Para cosas cotidianas que se hacen con regularidad, como filtros y suministros. Empieza con un enlace o una foto, o simplemente escríbelo.","Para sa pang-araw-araw na gawaing may iskedyul, tulad ng filter at supplies. Magsimula sa link o litrato, o i-type lang.","适用于需要定期做的日常事务，比如滤网和耗材。可从链接或照片开始，也可以直接输入。","フィルターや消耗品など、定期的に必要な日常のことに。リンクか写真から始めるか、そのまま入力してください。","필터나 소모품처럼 일정에 따라 해야 하는 일상적인 일에 쓰세요. 링크나 사진으로 시작하거나 직접 입력하세요.","Für alltägliche, regelmäßige Dinge wie Filter und Verbrauchsmaterial. Starten Sie mit einem Link oder Foto oder tippen Sie es einfach ein.","Pour les tâches courantes à planifier, comme les filtres et fournitures. Commencez par un lien ou une photo, ou tapez-le simplement.","Filtre ve sarf malzemesi gibi düzenli yapılması gereken günlük işler için. Bağlantı veya fotoğrafla başlayın ya da doğrudan yazın.","สำหรับเรื่องประจำวันที่ต้องทำตามกำหนด เช่น ไส้กรองและของใช้ เริ่มจากลิงก์หรือรูปภาพ หรือพิมพ์เองก็ได้","ສຳລັບເລື່ອງປະຈຳວັນທີ່ຕ້ອງເຮັດຕາມກຳນົດ ເຊັ່ນ ໄສ້ກອງ ແລະ ຂອງໃຊ້. ເລີ່ມຈາກລິ້ງ ຫຼື ຮູບ ຫຼື ພິມເອງກໍໄດ້"],"Forgot your password?": ["¿Olvidaste tu contraseña?","Nakalimutan ang password?","忘记密码？","パスワードをお忘れですか？","비밀번호를 잊으셨나요?","Passwort vergessen?","Mot de passe oublié ?","Şifrenizi mi unuttunuz?","ลืมรหัสผ่าน?","ລືມລະຫັດຜ່ານບໍ?"],"Gathering everything…": ["Reuniendo todo…","Kinokolekta ang lahat…","正在整理所有内容…","すべてをまとめています…","모든 것을 모으는 중…","Alles wird zusammengetragen…","Rassemblement de tout…","Her şey toplanıyor…","กำลังรวบรวมทุกอย่าง…","ກຳລັງລວບລວມທຸກຢ່າງ…"],"Get a copy of your homes, rooms, items, reminders, history and pros as a file.": ["Obtén un archivo con tus casas, habitaciones, objetos, recordatorios, historial y profesionales.","Kumuha ng kopya ng mga bahay, kuwarto, gamit, paalala, kasaysayan at pro mo bilang file.","以文件形式获取您的住所、房间、物品、提醒、历史记录和师傅副本。","自宅・部屋・アイテム・リマインダー・履歴・業者のコピーをファイルで入手できます。","집, 방, 물건, 알림, 기록, 전문가 정보를 파일로 받아 보세요.","Erhalten Sie eine Kopie Ihrer Zuhause, Räume, Gegenstände, Erinnerungen, Verläufe und Profis als Datei.","Obtenez une copie de vos logements, pièces, objets, rappels, historique et pros sous forme de fichier.","Evlerinizin, odalarınızın, eşyalarınızın, hatırlatmalarınızın, geçmişinizin ve ustalarınızın bir kopyasını dosya olarak alın.","รับสำเนาบ้าน ห้อง สิ่งของ การเตือน ประวัติ และช่างของคุณเป็นไฟล์","ຮັບສຳເນົາເຮືອນ, ຫ້ອງ, ສິ່ງຂອງ, ການເຕືອນ, ປະຫວັດ ແລະ ຊ່າງຂອງທ່ານເປັນໄຟລ໌"],"Get started": ["Empezar","Magsimula","开始使用","はじめる","시작하기","Los geht’s","Commencer","Başla","เริ่มต้น","ເລີ່ມຕົ້ນ"],"Getting your photo ready…": ["Preparando tu foto…","Inihahanda ang litrato mo…","正在处理您的照片…","写真を準備しています…","사진을 준비하는 중…","Ihr Foto wird vorbereitet…","Préparation de votre photo…","Fotoğrafınız hazırlanıyor…","กำลังเตรียมรูปของคุณ…","ກຳລັງກະກຽມຮູບຂອງທ່ານ…"],"Give it a name.": ["Ponle un nombre.","Bigyan ito ng pangalan.","请给它起个名字。","名前をつけてください。","이름을 지어 주세요.","Geben Sie einen Namen ein.","Donnez-lui un nom.","Bir ad verin.","ตั้งชื่อให้หน่อย","ຕັ້ງຊື່ໃຫ້ມັນ"],"Give the item a name.": ["Ponle un nombre al objeto.","Bigyan ng pangalan ang gamit.","请给物品起个名字。","アイテムに名前をつけてください。","물건에 이름을 지어 주세요.","Geben Sie dem Gegenstand einen Namen.","Donnez un nom à l’objet.","Eşyaya bir ad verin.","ตั้งชื่อให้สิ่งของ","ຕັ້ງຊື່ໃຫ້ສິ່ງຂອງ"],"Heads up: One Place may reach out to the pros you add to invite them to be listed. Your name and details are never shared with them.": ["Aviso: One Place puede contactar a los profesionales que añadas para invitarlos a figurar. Tu nombre y datos nunca se comparten con ellos.","Paalala: Maaaring kontakin ng One Place ang mga pro na idinagdag mo para imbitahan silang mailista. Hindi kailanman ibinabahagi ang pangalan at detalye mo.","温馨提示：One Place 可能会联系您添加的师傅，邀请他们入驻。您的姓名和信息绝不会透露给他们。","ご注意：One Place は、追加された業者に掲載を案内する場合があります。あなたの名前や情報が共有されることはありません。","알림: One Place는 추가하신 전문가에게 등록을 제안하기 위해 연락할 수 있어요. 회원님의 이름과 정보는 절대 공유되지 않아요.","Hinweis: One Place kann die von Ihnen hinzugefügten Profis kontaktieren, um sie zum Eintrag einzuladen. Ihr Name und Ihre Daten werden nie weitergegeben.","À savoir : One Place peut contacter les pros que vous ajoutez pour les inviter à être référencés. Votre nom et vos informations ne sont jamais partagés avec eux.","Bilgi: One Place, eklediğiniz ustalara listelenmeleri için ulaşabilir. Adınız ve bilgileriniz onlarla asla paylaşılmaz.","โปรดทราบ: One Place อาจติดต่อช่างที่คุณเพิ่มเพื่อเชิญให้ลงรายการ ชื่อและข้อมูลของคุณจะไม่ถูกแชร์ให้พวกเขา","ແຈ້ງໃຫ້ຮູ້: One Place ອາດຕິດຕໍ່ຊ່າງທີ່ທ່ານເພີ່ມເພື່ອເຊີນເຂົາເຈົ້າລົງລາຍຊື່. ຊື່ ແລະ ຂໍ້ມູນຂອງທ່ານຈະບໍ່ຖືກແບ່ງປັນໃຫ້ເຂົາເຈົ້າ"],"Here’s the plan": ["Este es el plan","Narito ang plano","这是计划","プランはこちら","계획은 이렇습니다","Hier ist der Plan","Voici le plan","İşte plan","นี่คือแผน","ນີ້ຄືແຜນ"],"Homeowner": ["Propietario","May-ari ng bahay","房主","持ち家の方","주택 소유자","Eigentümer","Propriétaire","Ev sahibi","เจ้าของบ้าน","ເຈົ້າຂອງເຮືອນ"],"How coins will work: finishing tasks earns coins (bigger jobs earn more), setting reminders earns a few, and adding One Place to your Home Screen earns a bonus. Coins live in your account, so guests start earning once they sign up.": ["Cómo funcionarán las monedas: completar tareas da monedas (los trabajos grandes dan más), crear recordatorios da algunas y añadir One Place a tu pantalla de inicio da un extra. Las monedas están en tu cuenta, así que los invitados empiezan a ganar al registrarse.","Paano gagana ang coins: kumikita ng coins sa pagtapos ng gawain (mas marami sa malalaking trabaho), may kaunti sa pag-set ng paalala, at may bonus sa pagdagdag ng One Place sa Home Screen. Nasa account mo ang coins, kaya magsisimulang kumita ang mga guest pagkatapos mag-sign up.","金币规则：完成任务可得金币（大工程更多），设置提醒可得少量金币，把 One Place 添加到主屏幕还有奖励。金币保存在您的账户中，访客注册后开始累积。","コインの仕組み：タスクを終えるとコインがもらえます（大きな作業ほど多く）。リマインダーの設定でも少しもらえ、One Place をホーム画面に追加するとボーナスがあります。コインはアカウントに保存されるため、ゲストは登録後から貯まります。","코인 규칙: 작업을 끝내면 코인을 받고(큰 작업일수록 더 많이), 알림을 설정하면 조금, One Place를 홈 화면에 추가하면 보너스를 받아요. 코인은 계정에 저장되므로 게스트는 가입한 뒤부터 모을 수 있어요.","So funktionieren Münzen: Aufgaben erledigen bringt Münzen (größere Aufgaben mehr), Erinnerungen einrichten einige, und One Place zum Home-Bildschirm hinzuzufügen einen Bonus. Münzen gehören zu Ihrem Konto, Gäste sammeln also erst nach der Anmeldung.","Comment fonctionnent les pièces : terminer des tâches en rapporte (plus pour les gros travaux), créer des rappels en rapporte quelques-unes, et ajouter One Place à l’écran d’accueil donne un bonus. Les pièces sont liées à votre compte : les invités commencent à en gagner après l’inscription.","Jetonlar nasıl çalışır: görevleri bitirmek jeton kazandırır (büyük işler daha fazla), hatırlatma kurmak birkaç jeton, One Place’i Ana Ekran’a eklemek bonus kazandırır. Jetonlar hesabınızda durur; misafirler kaydolduktan sonra kazanmaya başlar.","วิธีใช้เหรียญ: ทำงานเสร็จได้เหรียญ (งานใหญ่ได้มากกว่า) ตั้งการเตือนได้เล็กน้อย และเพิ่ม One Place ลงหน้าจอหลักได้โบนัส เหรียญอยู่ในบัญชีของคุณ ผู้เยี่ยมชมจึงเริ่มสะสมได้หลังสมัคร","ເຫຼຽນໃຊ້ແນວໃດ: ເຮັດວຽກສຳເລັດໄດ້ເຫຼຽນ (ວຽກໃຫຍ່ໄດ້ຫຼາຍກວ່າ), ຕັ້ງການເຕືອນໄດ້ເລັກນ້ອຍ ແລະ ເພີ່ມ One Place ໃສ່ໜ້າຈໍຫຼັກໄດ້ໂບນັດ. ເຫຼຽນຢູ່ໃນບັນຊີຂອງທ່ານ ຜູ້ເຂົ້າຊົມຈຶ່ງເລີ່ມສະສົມໄດ້ຫຼັງສະໝັກ"],"How often?": ["¿Con qué frecuencia?","Gaano kadalas?","多久一次？","どのくらいの頻度？","얼마나 자주?","Wie oft?","À quelle fréqu

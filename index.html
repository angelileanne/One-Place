document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act, p = place();
  if(act==="scrim"){ if(e.target===el) closeModal(); return; }
  switch(act){
    case "closeModal": closeModal(); break;
    /* onboarding */
    case "obRole": OB.role=el.dataset.role; OB.kind=el.dataset.kind; render(); break;
    case "obStart": {
      S.owner={first:$("#obFirst").value.trim(),last:$("#obLast").value.trim(),phone:$("#obPhone").value.trim(),email:$("#obEmail").value.trim(),city:$("#obCity").value.trim(),zip:$("#obZip").value.trim()};
      const pl=newPlace(OB.kind,OB.role,$("#obPlace").value.trim()); pl.emoji=$("#obEmoji").value.trim()||pl.emoji; pl.tagline=$("#obTag").value.trim();
      S.places=[pl]; S.activePlaceId=pl.id; S.onboarded=true; S.view="home"; render(); toast("Welcome to One Place"); break; }
    case "obSample": loadSample(); render(); toast("Sample home loaded — explore away"); break;
    case "loadSample": closeModal(); loadSample(); render(); toast("Sample home loaded"); break;
    case "resetAll": S.onboarded=false; S.places=[]; S.activePlaceId=null; S.members=[]; S.quotes=[]; S.owner={first:"",last:"",phone:"",email:"",city:"",zip:""}; S.view="home"; S.diagResult=null; closeModal(); render(); break;
    /* nav */
    case "go": S.view=el.dataset.view; if(S.view!=="diagnose"){S.diagResult=null; S.diagFor=null; S.diagAiNote=null; S.diagBusy=false;} closeModal(); render(); window.scrollTo(0,0); break;
    case "switchPlace": S.activePlaceId=el.dataset.id; S.view="home"; S.sel={item:null,vehicle:null,pet:null}; render(); window.scrollTo(0,0); break;
    case "addMenu": addMenu(); break;
    case "openEvent": { const v=el.dataset.view; if(v){ S.view=v; const id=el.dataset.id; if(v==="itemDetail")S.sel.item=id; if(v==="vehicleDetail")S.sel.vehicle=id; if(v==="petDetail")S.sel.pet=id; render(); window.scrollTo(0,0);} break; }
    /* rooms & items */
    case "roomFilter": roomFilter=el.dataset.id; if(S.view!=="items"){S.view="items";} render(); break;
    case "addRoom": closeModal(); if(p) addRoomModal(p); break;
    case "roomSuggest": { const i=$("#roomName"); if(i) i.value=el.dataset.name; break; }
    case "saveRoom": { const n=$("#roomName").value.trim(); if(!n){ toast("Give the room a name"); break; } p.rooms.push({id:uid("rm"),name:n}); closeModal(); render(); toast("Room added"); break; }
    case "addItem": closeModal(); if(p) addItemModal(p); break;
    case "photoPick": pickPhoto(el.dataset.target, el.dataset.mode); break;
    case "photoRemove": { const key=el.dataset.key, idx=+el.dataset.idx; if(PHA[key]){ PHA[key].splice(idx,1); PH[key]=PHA[key][0]||null; photosChanged(key); } break; }
    /* DIY project (AI plan from photos) */
    case "diyProject": closeModal(); if(p) diyProjectModal(p); break;
    case "aiPlanProject": planDiyProject(p); break;
    case "saveProject": { if(!DIY_PLAN){ toast("Plan the project first"); break; }
      let roomId=$("#diyRoom") ? $("#diyRoom").value : null;
      if(!roomId){ if(!p.rooms.length){ p.rooms.push({id:uid("rm"),name:"Kitchen"}); } roomId=p.rooms[0].id; }
      const plan={...DIY_PLAN, title: $("#diyTitle")? ($("#diyTitle").value.trim()||DIY_PLAN.title) : DIY_PLAN.title,
        time: $("#diyTime")? $("#diyTime").value.trim() : DIY_PLAN.time, cost: $("#diyCost")? $("#diyCost").value.trim() : DIY_PLAN.cost};
      const it={id:uid("it"),type:"Other / not listed",name:plan.title,brand:"",model:"",year:"",roomId,photo:PHA.diy[0]||null,problem:"",tasks:[],logs:[],project:plan};
      p.items.push(it); PH.diy=null; PHA.diy=[]; DIY_PLAN=null; closeModal(); S.view="itemDetail"; S.sel.item=it.id; render(); window.scrollTo(0,0); toast("Project saved — its plan is on its page"); break; }
    case "saveProjectBasic": { const goal=($("#diyGoal")? $("#diyGoal").value.trim() : "");
      let roomId=null; if(!p.rooms.length){ p.rooms.push({id:uid("rm"),name:"Kitchen"}); } roomId=p.rooms[0].id;
      const it={id:uid("it"),type:"Other / not listed",name:goal? goal.slice(0,70) : "DIY project",brand:"",model:"",year:"",roomId,photo:PHA.diy[0]||null,problem:"",tasks:[],logs:[]};
      p.items.push(it); PH.diy=null; PHA.diy=[]; closeModal(); S.view="itemDetail"; S.sel.item=it.id; render(); window.scrollTo(0,0); toast("Saved as a basic item — add details any time"); break; }
    case "saveItem": {
      const type=$("#itType").value; const kb=ITEM_KB[type];
      const name=$("#itName").value.trim() || type;
      let roomId=$("#itRoom") ? $("#itRoom").value : null;
      if(!roomId){ if(!p.rooms.length){ p.rooms.push({id:uid("rm"),name:"Kitchen"}); } roomId=p.rooms[0].id; }
      const it={id:uid("it"),type,name,brand:$("#itBrand").value.trim(),model:$("#itModel").value.trim(),year:$("#itYear").value.trim(),roomId,photo:PH.item,problem:$("#itProblem").value.trim(),
        tasks: (AI_ITEM && AI_ITEM.type===type && AI_ITEM.tasks.length) ? AI_ITEM.tasks.map(t=>({...t,lastDone:null})) : (kb? kb.tasks.map(t=>({...t,lastDone:null})) : []), logs:[]};
      p.items.push(it); PH.item=null; PHA.item=[]; AI_ITEM=null; closeModal(); S.view="itemDetail"; S.sel.item=it.id; render(); window.scrollTo(0,0); toast("Item added — plan built"); break; }
    case "openItem": S.sel.item=el.dataset.id; S.view="itemDetail"; render(); window.scrollTo(0,0); break;
    case "markTaskDone": { const it=p.items.find(i=>i.id===S.sel.item); const t=it.tasks[+el.dataset.idx];
      memberPicker("Mark done: "+t.name, by=>{ t.lastDone=todayStr(); it.logs.push({what:t.name,by,date:todayStr()}); render(); toast("Logged — nice work, "+by); }); break; }
    case "pickMember": { const cb=window._memberCb; closeModal(); if(cb) cb(el.dataset.name); break; }
    case "moveItem": case "moveVehicle": { const isItem = act==="moveItem"; const id=el.dataset.id;
      const others=S.places.filter(x=>x.id!==p.id);
      if(!others.length){ toast("Add another place first (Home → Add place)"); break; }
      openModal(modalHead("Move to another place","Everything about it — schedule and history — moves with it.")+
        '<div class="rows">'+others.map(o=>'<button class="row-card" data-act="doMove" data-kind="'+(isItem?"item":"vehicle")+'" data-id="'+id+'" data-to="'+o.id+'"><div class="place-emoji">'+esc(o.emoji||"🏠")+'</div><div class="row-main"><div class="row-name">'+esc(o.name)+'</div><div class="row-sub">'+esc(o.role)+'</div></div>'+ic("chevR","chev")+'</button>').join("")+'</div><button class="btn ghost block" data-act="closeModal" style="margin-top:1rem">Cancel</button>'); break; }
    case "doMove": { const from=place(); const to=S.places.find(x=>x.id===el.dataset.to); const coll = el.dataset.kind==="item"?"items":"vehicles";
      const idx=from[coll].findIndex(x=>x.id===el.dataset.id); if(idx>=0){ to[coll].push(from[coll].splice(idx,1)[0]); }
      closeModal(); S.view = el.dataset.kind==="item"?"items":"vehicles"; render(); toast("Moved to "+to.name); break; }
    case "deleteItem": confirmModal("Remove this item?","Its schedule and history will be removed too.","doDeleteItem",el.dataset.id); break;
    case "doDeleteItem": p.items=p.items.filter(i=>i.id!==el.dataset.id); closeModal(); S.view="items"; render(); toast("Item removed"); break;
    /* vehicles */
    case "addVehicle": closeModal(); if(p) addVehicleModal(p); break;
    case "saveVehicle": { const rule=stateRule($("#vState").value);
      const v={id:uid("veh"),name:$("#vName").value.trim()||($("#vYear").value+" "+$("#vMake").value+" "+$("#vModel").value).trim()||"Vehicle",
        year:$("#vYear").value.trim(),make:$("#vMake").value.trim(),model:$("#vModel").value.trim(),miles:$("#vMiles").value.replace(/[^0-9]/g,""),
        state:$("#vState").value,photo:PH.vehicle,regNext:$("#vReg").value||null,smogNext: rule.smogMonths? ($("#vSmog").value||null):null,
        tasks:VEHICLE_TASKS.map(t=>({...t,lastDone:null})),logs:[]};
      p.vehicles.push(v); PH.vehicle=null; closeModal(); S.view="vehicleDetail"; S.sel.vehicle=v.id; render(); window.scrollTo(0,0); toast("Vehicle added"); break; }
    case "openVehicle": S.sel.vehicle=el.dataset.id; S.view="vehicleDetail"; render(); window.scrollTo(0,0); break;
    case "markVehicleTask": { const v=p.vehicles.find(x=>x.id===S.sel.vehicle); const t=v.tasks[+el.dataset.idx];
      memberPicker("Mark done: "+t.name, by=>{ t.lastDone=todayStr(); v.logs.push({what:t.name,by,date:todayStr()}); render(); toast("Logged"); }); break; }
    case "renewReg": { const v=p.vehicles.find(x=>x.id===S.sel.vehicle); v.regNext = v.regNext? addMonths(v.regNext,12) : addMonths(todayStr(),12); v.logs.push({what:"Registration renewed ("+v.state+")",by:ownerName(),date:todayStr()}); render(); toast("Registration rolled forward a year"); break; }
    case "doneSmog": { const v=p.vehicles.find(x=>x.id===S.sel.vehicle); const r=stateRule(v.state); const base=v.smogNext||todayStr(); v.smogNext=addMonths(base, r.smogMonths||24); v.logs.push({what:"Smog / emissions check passed",by:ownerName(),date:todayStr()}); render(); toast("Smog check logged"); break; }
    case "deleteVehicle": confirmModal("Remove this vehicle?","Its schedule and history will be removed too.","doDeleteVehicle",el.dataset.id); break;
    case "doDeleteVehicle": p.vehicles=p.vehicles.filter(v=>v.id!==el.dataset.id); closeModal(); S.view="vehicles"; render(); toast("Vehicle removed"); break;
    /* phone */
    case "editPlan": { const plan=p.phonePlan||{carrier:"",planName:"",holder:ownerName(),lines:[]};
      PH.plan=null; PHA.plan=[]; PLAN_DRAFT=null;
      openModal(modalHead(p.phonePlan?"Edit phone plan":"Add phone plan","Or add screenshots of your carrier’s plan page (up to 6) — One Place reads the plan and every line off them, as a draft you review before saving.")+
      '<div id="photoSlot"></div><div class="photo-pick"><button class="photo-btn" data-act="photoPick" data-target="plan" data-mode="lib">'+ic("image")+'Choose plan screenshots</button><button class="photo-btn" data-act="photoPick" data-target="plan" data-mode="cam">'+ic("camera")+'Take a photo</button></div>'+
      '<div class="identifying" id="identifyNote" style="display:none;margin:.7rem 0"><span class="spinner"></span> Reading the screenshot…</div>'+
      '<div id="aiMsg"></div><div id="planDraft"></div>'+
      '<p class="small muted" id="idHint" style="display:none;margin:.5rem 0">Review everything below before saving — leave anything blank that the screenshot didn’t show.</p>'+
      '<div class="field" style="margin-top:.9rem"><label for="plCarrier">Carrier</label><input id="plCarrier" value="'+esc(plan.carrier)+'" placeholder="e.g. T-Mobile" /></div>'+
      '<div class="field"><label for="plName">Plan name</label><input id="plName" value="'+esc(plan.planName)+'" placeholder="e.g. Go5G Plus" /></div>'+
      '<div class="field"><label for="plHolder">Account holder</label><input id="plHolder" value="'+esc(plan.holder)+'" /></div>'+
      '<button class="btn block" data-act="savePlan">Save plan</button><button class="btn ghost block" data-act="closeModal" style="margin-top:.6rem">Cancel</button>'); break; }
    case "savePlan": { if(!p.phonePlan) p.phonePlan={carrier:"",planName:"",holder:"",lines:[]};
      p.phonePlan.carrier=$("#plCarrier").value.trim(); p.phonePlan.planName=$("#plName").value.trim(); p.phonePlan.holder=$("#plHolder").value.trim();
      if(PLAN_DRAFT){ p.phonePlan.lines = PLAN_DRAFT.lines; PLAN_DRAFT=null; }
      PH.plan=null; PHA.plan=[];
      closeModal(); S.view="phone"; render(); toast("Plan saved"); break; }
    case "editLine": { const idx=+el.dataset.idx; const plan=p.phonePlan||(p.phonePlan={carrier:"",planName:"",holder:ownerName(),lines:[]}); const l= idx>=0? plan.lines[idx] : {person:"",number:"",device:"",cost:"",balance:"",payoff:"",upgrade:""};
      const memberOpts = allMembers(p).map(m=>m.name);
      openModal(modalHead(idx>=0?"Edit line":"Add a line")+
      '<div class="field"><label for="lnPerson">Whose line?</label><input id="lnPerson" list="memberNames" value="'+esc(l.person)+'" placeholder="Name" /><datalist id="memberNames">'+memberOpts.map(n=>'<option value="'+esc(n)+'">').join("")+'</datalist></div>'+
      '<div class="f2"><div class="field"><label for="lnNumber">Number (optional)</label><input id="lnNumber" value="'+esc(l.number)+'" placeholder="(555) 555-5555" /></div>'+
      '<div class="field"><label for="lnDevice">Device</label><input id="lnDevice" value="'+esc(l.device)+'" placeholder="iPhone 15 Pro" /></div></div>'+
      '<div class="f2"><div class="field"><label for="lnCost">Their monthly cost ($)</label><input id="lnCost" inputmode="decimal" value="'+(l.cost===""?"":l.cost)+'" placeholder="45" /></div>'+
      '<div class="field"><label for="lnBalance">Device balance ($)</label><input id="lnBalance" inputmode="decimal" value="'+(l.balance===""?"":l.balance)+'" placeholder="0" /></div></div>'+
      '<div class="f2"><div class="field"><label for="lnPayoff">Payoff date</label><input id="lnPayoff" type="date" value="'+(l.payoff||"")+'" /></div>'+
      '<div class="field"><label for="lnUpgrade">Upgrade eligible</label><input id="lnUpgrade" type="date" value="'+(l.upgrade||"")+'" /></div></div>'+
      '<button class="btn block" data-act="saveLine" data-idx="'+idx+'">Save line</button><button class="btn ghost block" data-act="closeModal" style="margin-top:.6rem">Cancel</button>'); break; }
    case "saveLine": { const idx=+el.dataset.idx; const plan=p.phonePlan;
      const l={person:$("#lnPerson").value.trim(),number:$("#lnNumber").value.trim(),device:$("#lnDevice").value.trim(),cost:parseFloat($("#lnCost").value)||0,balance:parseFloat($("#lnBalance").value)||0,payoff:$("#lnPayoff").value||"",upgrade:$("#lnUpgrade").value||""};
      if(idx>=0) plan.lines[idx]=l; else plan.lines.push(l);
      closeModal(); render(); toast("Line saved"); break; }
    case "deleteLine": { p.phonePlan.lines.splice(+el.dataset.idx,1); render(); toast("Line removed"); break; }
    /* pets */
    case "addPet": closeModal(); if(p) addPetModal(p); break;
    case "savePet": { const pt={id:uid("pet"),name:$("#petName").value.trim()||"Pet",species:$("#petSpecies").value,breed:$("#petBreed").value.trim(),birth:$("#petBirth").value||null,weight:$("#petWeight").value.trim(),photo:PH.pet,records:[]};
      p.pets.push(pt); PH.pet=null; closeModal(); S.view="petDetail"; S.sel.pet=pt.id; render(); window.scrollTo(0,0); toast("Pet added"); break; }
    case "openPet": S.sel.pet=el.dataset.id; S.view="petDetail"; render(); window.scrollTo(0,0); break;
    case "editRecord": { const pt=p.pets.find(x=>x.id===S.sel.pet); const idx=+el.dataset.idx; const r= idx>=0? pt.records[idx] : {name:"",date:todayStr(),nextDue:"",clinic:"",location:"",notes:""};
      openModal(modalHead(idx>=0?"Edit record":"Add a health record","Vaccinations, checkups, anything vet-related — with where it was done and when the next one is due.")+
      '<div class="field"><label for="recName">What was done</label><input id="recName" list="recPresets" value="'+esc(r.name)+'" placeholder="e.g. Rabies vaccination" /><datalist id="recPresets">'+PET_RECORD_PRESETS.map(n=>'<option value="'+n+'">').join("")+'</datalist></div>'+
      '<div class="f2"><div class="field"><label for="recDate">Date done</label><input id="recDate" type="date" value="'+(r.date||todayStr())+'" /></div>'+
      '<div class="field"><label for="recNext">Next due (optional)</label><input id="recNext" type="date" value="'+(r.nextDue||"")+'" /></div></div>'+
      '<div class="f2"><div class="field"><label for="recClinic">Vet / clinic name</label><input id="recClinic" value="'+esc(r.clinic||"")+'" placeholder="e.g. Seven Hills Animal Hospital" /></div>'+
      '<div class="field"><label for="recLoc">Location</label><input id="recLoc" value="'+esc(r.location||"")+'" placeholder="City, ST" /></div></div>'+
      '<div class="field"><label for="recNotes">Notes (optional)</label><textarea id="recNotes" placeholder="Anything worth remembering">'+esc(r.notes||"")+'</textarea></div>'+
      '<button class="btn block" data-act="saveRecord" data-idx="'+idx+'">Save record</button><button class="btn ghost block" data-act="closeModal" style="margin-top:.6rem">Cancel</button>'); break; }
    case "saveRecord": { const pt=p.pets.find(x=>x.id===S.sel.pet); const idx=+el.dataset.idx;
      const r={name:$("#recName").value.trim()||"Health record",date:$("#recDate").value||todayStr(),nextDue:$("#recNext").value||"",clinic:$("#recClinic").value.trim(),location:$("#recLoc").value.trim(),notes:$("#recNotes").value.trim()};
      if(idx>=0) pt.records[idx]=r; else pt.records.push(r);
      closeModal(); render(); toast("Record saved"); break; }
    case "recordAgain": { const pt=p.pets.find(x=>x.id===S.sel.pet); const r=pt.records[+el.dataset.idx];
      if(r.nextDue && r.date){ const gap=Math.max(1,Math.round((new Date(r.nextDue)-new Date(r.date))/86400000)); r.date=todayStr(); r.nextDue=new Date(Date.now()+gap*86400000).toISOString().slice(0,10); }
      else { r.date=todayStr(); }
      render(); toast("Logged again today — next due rolled forward"); break; }
    case "deleteRecord": { const pt=p.pets.find(x=>x.id===S.sel.pet); pt.records.splice(+el.dataset.idx,1); render(); toast("Record removed"); break; }
    case "deletePet": confirmModal("Remove this pet?","Their profile and health records will be removed too.","doDeletePet",el.dataset.id); break;
    case "doDeletePet": p.pets=p.pets.filter(x=>x.id!==el.dataset.id); closeModal(); S.view="pets"; render(); toast("Pet removed"); break;
    /* places */
    case "addPlace": case "addPlaceKind": { const kind = el.dataset.kind || "home";
      openModal(modalHead(kind==="business"?"Add a business":"Add a home","It gets its own rooms, items, vehicles, pets, and phone plan.")+
      '<div class="field"><label for="npRole">Your role</label><select id="npRole">'+(kind==="business"?'<option>Business owner</option><option>Business renter</option>':'<option>Homeowner</option><option>Home renter</option>')+'</select></div>'+
      '<div class="field"><label for="npName">Name it</label><input id="npName" placeholder="'+(kind==="business"?"e.g. The bakery":"e.g. The lake house")+'" /></div>'+
      '<div class="f2"><div class="field"><label for="npEmoji">Emoji</label><input id="npEmoji" maxlength="4" value="'+(kind==="business"?"🏢":"🏠")+'" /></div>'+
      '<div class="field"><label for="npTag">Tagline (optional)</label><input id="npTag" placeholder="City, ST" /></div></div>'+
      '<button class="btn block" data-act="savePlace" data-kind="'+kind+'">Add & switch to it</button><button class="btn ghost block" data-act="closeModal" style="margin-top:.6rem">Cancel</button>'); break; }
    case "savePlace": { const pl=newPlace(el.dataset.kind,$("#npRole").value,$("#npName").value.trim()); pl.emoji=$("#npEmoji").value.trim()||pl.emoji; pl.tagline=$("#npTag").value.trim();
      S.places.push(pl); S.activePlaceId=pl.id; closeModal(); S.view="home"; render(); window.scrollTo(0,0); toast("Place added"); break; }
    case "editPlace": { const pl=S.places.find(x=>x.id===el.dataset.id);
      openModal(modalHead("Edit place")+
      '<div class="field"><label for="epName">Name</label><input id="epName" value="'+esc(pl.name)+'" /></div>'+
      '<div class="f2"><div class="field"><label for="epEmoji">Emoji</label><input id="epEmoji" maxlength="4" value="'+esc(pl.emoji||"🏠")+'" /></div>'+
      '<div class="field"><label for="epTag">Tagline</label><input id="epTag" value="'+esc(pl.tagline||"")+'" /></div></div>'+
      '<div class="field"><label for="epRole">Role</label><select id="epRole">'+["Homeowner","Home renter","Business owner","Business renter"].map(r=>'<option'+(r===pl.role?" selected":"")+'>'+r+'</option>').join("")+'</select></div>'+
      '<button class="btn block" data-act="saveEditPlace" data-id="'+pl.id+'">Save changes</button><button class="btn ghost block" data-act="closeModal" style="margin-top:.6rem">Cancel</button>'+
      (S.places.length>1?'<div class="divider"></div><button class="btn danger block" data-act="deletePlace" data-id="'+pl.id+'">Remove this place & everything in it</button>':"")); break; }
    case "saveEditPlace": { const pl=S.places.find(x=>x.id===el.dataset.id); pl.name=$("#epName").value.trim()||pl.name; pl.emoji=$("#epEmoji").value.trim()||pl.emoji; pl.tagline=$("#epTag").value.trim(); pl.role=$("#epRole").value;
      closeModal(); render(); toast("Place updated"); break; }
    case "deletePlace": confirmModal("Remove this place?","Everything filed under it — items, vehicles, pets, records — will be removed too.","doDeletePlace",el.dataset.id); break;
    case "doDeletePlace": S.places=S.places.filter(x=>x.id!==el.dataset.id); if(S.activePlaceId===el.dataset.id) S.activePlaceId=S.places[0].id; closeModal(); S.view="more"; render(); toast("Place removed"); break;
    /* members */
    case "addMember": openModal(modalHead("Add a member","Household or team — they can be picked when logging work.")+
      '<div class="field"><label for="mbName">Name</label><input id="mbName" placeholder="Full name" /></div>'+
      '<div class="field"><label for="mbPhone">Phone (optional)</label><input id="mbPhone" type="tel" placeholder="(555) 555-5555" /></div>'+
      '<button class="btn block" data-act="saveMember">Add member</button><button class="btn ghost block" data-act="closeModal" style="margin-top:.6rem">Cancel</button>'); break;
    case "saveMember": { const n=$("#mbName").value.trim(); if(!n){ toast("Add a name"); break; } S.members.push({id:uid("mb"),name:n,phone:$("#mbPhone").value.trim()}); closeModal(); render(); toast("Member added"); break; }
    case "deleteMember": S.members.splice(+el.dataset.idx,1); render(); toast("Member removed"); break;
    /* diagnose */
    case "diagnoseFor": S.diagFor=el.dataset.id; S.view="diagnose"; S.diagResult=null; render(); window.scrollTo(0,0); break;
    case "diagClearTarget": S.diagFor=null; render(); break;
    case "runDiagnose": runDiagnose(p); break;
    /* pro quotes */
    case "bigJob": closeModal(); bigJobModal(el.dataset.name||""); break;
    case "sendQuote": { const job=($("#bjJob")?$("#bjJob").value:""); const nm=($("#bjName")?$("#bjName").value:""); const ph=($("#bjPhone")?$("#bjPhone").value:""); const em=($("#bjEmail")?$("#bjEmail").value:"");
      S.quotes.push({placeKey:p? p.id : "", company:el.dataset.biz, job:job, status:"Sent", notes:"Quote requested by "+nm+(ph?" · "+ph:"")+(em?" · "+em:"")});
      queueSave(); /* save the quote request now, before the mail app opens */
      const body=encodeURIComponent("Hi "+el.dataset.biz+",\n\nI’d like a quote for:\n"+job+"\n\nName: "+nm+"\nPhone: "+ph+"\nEmail: "+em+"\n\nSent from One Place");
      openMail("mailto:?subject="+encodeURIComponent("Quote request: "+job)+"&body="+body); break; }
    /* saved-data setup SQL */
    case "copySql": { const done=()=>toast("Setup SQL copied — paste it into Supabase’s SQL Editor");
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(SUPABASE_SQL).then(done).catch(()=>{ const b=$("#sqlBox"); if(b){ b.style.display="block"; b.textContent=SUPABASE_SQL; } toast("Copying was blocked — the SQL is shown below to copy by hand"); }); }
      else { const b=$("#sqlBox"); if(b){ b.style.display="block"; b.textContent=SUPABASE_SQL; } toast("The SQL is shown below — select it all to copy"); } break; }
    case "dlSql": { const blob=new Blob([SUPABASE_SQL],{type:"text/sql"}); const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download="supabase-schema.sql"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); toast("supabase-schema.sql downloading"); break; }
    case "toggleSql": { const b=$("#sqlBox"); if(b){ const show=b.style.display==="none"; if(show && !b.textContent) b.textContent=SUPABASE_SQL; b.style.display=show?"block":"none"; el.textContent=show?"Hide SQL":"Show SQL"; el.setAttribute("aria-expanded", show?"true":"false"); } break; }
    /* feedback */
    case "feedback": feedbackModal(); break;
    case "sendFeedback": { const type=$("#fbType")?$("#fbType").value:"Feedback"; const msg=$("#fbText")?$("#fbText").value.trim():"";
      if(!msg){ toast("Write a few words first"); break; }
      const fbody=encodeURIComponent("Type: "+type+"\n\n"+msg+"\n\n— Sent from the One Place test version");
      openMail("mailto:angelisiopao@gmail.com?subject="+encodeURIComponent("One Place test feedback")+"&body="+fbody);
      closeModal(); toast("Opening your email app…"); break; }
    /* settings */
    case "setTheme": S.settings.theme=el.dataset.id; render(); break;
    case "setLighting": S.settings.lighting=el.dataset.id; render(); break;
    case "setTextSize": S.settings.textSize=+el.dataset.id; render(); break;
    case "setPrintSize": S.settings.printSize=+el.dataset.id; render(); break;
    case "setBold": S.settings.boldLabels = el.dataset.id==="1"; render(); break;
  }
  /* Every handled action may have changed data — persist (debounced,
     serialized; the local snapshot updates instantly, Supabase follows). */
  persist();
});
document.addEventListener("input", e=>{
  if(e.target && e.target.id==="itemSearch"){ S.search=e.target.value; const pos=e.target.selectionStart; render(); const inp=$("#itemSearch"); if(inp){ inp.focus(); inp.setSelectionRange(pos,pos); } }
});

/* ---------- init ---------- */
bootPromise = boot();
</script>
</body>
</html>

room yet.": ["Aún no hay objetos en esta habitación.","Wala pang gamit sa kuwartong ito.","这个房间里还没有物品。","この部屋にはまだアイテムがありません。","이 방에는 아직 물건이 없어요.","In diesem Raum sind noch keine Gegenstände.","Aucun objet dans cette pièce pour l’instant.","Bu odada henüz eşya yok.","ยังไม่มีสิ่งของในห้องนี้","ຍັງບໍ່ມີສິ່ງຂອງໃນຫ້ອງນີ້"],"No local pros are listed for your area yet. Add the ones you trust above, and we’ll look into inviting them.": ["Aún no hay profesionales locales en tu zona. Añade arriba los de tu confianza y consideraremos invitarlos.","Wala pang nakalistang lokal na pro sa lugar mo. Idagdag sa itaas ang mga pinagkakatiwalaan mo at pag-aaralan naming imbitahan sila.","您所在地区暂无本地师傅。请在上方添加您信任的师傅，我们会考虑邀请他们。","お住まいのエリアに掲載中の業者はまだありません。上で信頼できる業者を追加してください。ご招待を検討します。","지역에 등록된 전문가가 아직 없어요. 위에 믿을 만한 전문가를 추가해 주시면 초대를 검토할게요.","Für Ihre Region sind noch keine lokalen Profis eingetragen. Fügen Sie oben Ihre Vertrauten hinzu, wir prüfen eine Einladung.","Aucun pro local n’est encore référencé dans votre zone. Ajoutez ci-dessus ceux en qui vous avez confiance et nous envisagerons de les inviter.","Bölgeniz için henüz listelenmiş yerel usta yok. Güvendiklerinizi yukarıya ekleyin, onları davet etmeyi değerlendirelim.","ยังไม่มีช่างในพื้นที่ของคุณในรายการ เพิ่มช่างที่คุณไว้ใจด้านบน แล้วเราจะพิจารณาเชิญพวกเขา","ຍັງບໍ່ມີຊ່າງໃນເຂດຂອງທ່ານໃນລາຍການ. ເພີ່ມຊ່າງທີ່ທ່ານໄວ້ໃຈຂ້າງເທິງ ແລ້ວພວກເຮົາຈະພິຈາລະນາເຊີນເຂົາເຈົ້າ"],"No parts came to mind for this one. Try DIY or Big job? instead.": ["No se me ocurrieron piezas para esto. Prueba Hazlo tú o ¿Trabajo grande?","Walang parts na naisip para dito. Subukan ang DIY o Malaking trabaho?","这个我想不出需要的配件，试试“自己动手”或“大工程？”。","これに必要な部品は思いつきませんでした。DIY または 大きな作業？ をお試しください。","이 건 떠오르는 부품이 없어요. 대신 직접 하기나 큰 작업?을 눌러 보세요.","Mir fallen dafür keine Teile ein. Probieren Sie stattdessen Selbermachen oder Großer Auftrag?","Aucune pièce ne me vient pour celui-ci. Essayez plutôt Bricolage ou Gros travaux ?","Bunun için aklıma parça gelmedi. Bunun yerine Kendin Yap veya Büyük iş? deneyin.","ไม่มีอะไหล่ที่นึกออกสำหรับรายการนี้ ลองกด ทำเอง หรือ งานใหญ่? แทน","ບໍ່ມີອະໄຫຼ່ທີ່ນຶກອອກສຳລັບອັນນີ້. ລອງ ເຮັດເອງ ຫຼື ວຽກໃຫຍ່? ແທນ"],"No pros yet. Add the handyman, mechanic or pool cleaner you swear by.": ["Aún no hay profesionales. Añade al manitas, mecánico o limpiapiscinas en quien confías.","Wala pang pro. Idagdag ang handyman, mekaniko o taga-linis ng pool na pinagkakatiwalaan mo.","还没有师傅。添加您最信赖的维修工、机修师或泳池清洁工吧。","まだ業者がいません。信頼している修理屋さん、整備士、プール清掃員を追加しましょう。","아직 전문가가 없어요. 믿고 맡기는 수리공, 정비사, 수영장 청소 업체를 추가해 보세요.","Noch keine Profis. Fügen Sie den Handwerker, Mechaniker oder Poolreiniger hinzu, auf den Sie schwören.","Aucun pro pour l’instant. Ajoutez le bricoleur, mécanicien ou pisciniste auquel vous faites confiance.","Henüz usta yok. Gözünüz kapalı güvendiğiniz tamirci, motor ustası veya havuz temizlikçisini ekleyin.","ยังไม่มีช่าง เพิ่มช่างซ่อม ช่างยนต์ หรือคนทำความสะอาดสระที่คุณไว้ใจ","ຍັງບໍ່ມີຊ່າງ. ເພີ່ມຊ່າງແປງ, ຊ່າງເຄື່ອງຈັກ ຫຼື ຄົນເຮັດຄວາມສະອາດສະລອຍນ້ຳທີ່ທ່ານໄວ້ໃຈ"],"No recommendations yet.": ["Aún no hay recomendaciones.","Wala pang rekomendasyon.","暂无推荐。","おすすめはまだありません。","아직 추천이 없어요.","Noch keine Empfehlungen.","Pas encore de recommandations.","Henüz öneri yok.","ยังไม่มีคำแนะนำ","ຍັງບໍ່ມີຄຳແນະນຳ"],"No tasks were suggested. You can still save the item.": ["No se sugirieron tareas. Aun así puedes guardar el objeto.","Walang iminungkahing gawain. Maaari mo pa ring i-save ang gamit.","没有建议的任务，您仍可保存该物品。","提案されたタスクはありません。アイテムは保存できます。","제안된 작업이 없어요. 물건은 그대로 저장할 수 있어요.","Es wurden keine Aufgaben vorgeschlagen. Sie können den Gegenstand trotzdem speichern.","Aucune tâche suggérée. Vous pouvez quand même enregistrer l’objet.","Önerilen görev yok. Eşyayı yine de kaydedebilirsiniz.","ไม่มีงานที่แนะนำ คุณยังบันทึกสิ่งของได้","ບໍ່ມີວຽກທີ່ແນະນຳ. ທ່ານຍັງບັນທຶກສິ່ງຂອງໄດ້"],"Not now": ["Ahora no","Hindi muna","以后再说","今はしない","나중에","Jetzt nicht","Pas maintenant","Şimdi değil","ไม่ใช่ตอนนี้","ບໍ່ແມ່ນຕອນນີ້"],"Notes": ["Notas","Mga tala","备注","メモ","메모","Notizen","Notes","Notlar","บันทึก","ບັນທຶກ"],"Nothing finished yet. When you tap Done! on a reminder, it moves here so your main page stays tidy.": ["Nada terminado aún. Cuando pulses ¡Listo! en un recordatorio, pasa aquí para mantener ordenada la página principal.","Wala pang natapos. Kapag pinindot mo ang Tapos na! sa isang paalala, lilipat ito rito para maayos ang pangunahing pahina.","还没有完成的事项。点击提醒上的“完成！”后，它会移到这里，让主页保持整洁。","まだ完了したものはありません。リマインダーの「完了！」を押すとここに移動し、メイン画面がすっきりします。","아직 끝낸 일이 없어요. 알림에서 완료!를 누르면 여기로 옮겨져 메인 화면이 깔끔해져요.","Noch nichts erledigt. Wenn Sie bei einer Erinnerung auf Erledigt! tippen, landet sie hier und die Hauptseite bleibt aufgeräumt.","Rien de terminé pour l’instant. Quand vous touchez Terminé ! sur un rappel, il passe ici pour garder la page principale ordonnée.","Henüz biten bir şey yok. Bir hatırlatmada Tamam! düğmesine dokunduğunuzda buraya taşınır ve ana sayfanız düzenli kalır.","ยังไม่มีอะไรเสร็จ เมื่อแตะ เสร็จแล้ว! ที่การเตือน มันจะย้ายมาที่นี่เพื่อให้หน้าหลักเป็นระเบียบ","ຍັງບໍ່ມີຫຍັງສຳເລັດ. ເມື່ອແຕະ ສຳເລັດ! ທີ່ການເຕືອນ ມັນຈະຍ້າຍມາບ່ອນນີ້ເພື່ອໃຫ້ໜ້າຫຼັກເປັນລະບຽບ"],"Nothing here yet.": ["Aquí aún no hay nada.","Wala pang laman dito.","这里还没有内容。","まだ何もありません。","아직 아무것도 없어요.","Hier ist noch nichts.","Rien ici pour l’instant.","Burada henüz bir şey yok.","ยังไม่มีอะไรที่นี่","ຍັງບໍ່ມີຫຍັງຢູ່ນີ້"],"Nothing here yet. Tap “Plan my fix” to add your first item.": ["Aquí aún no hay nada. Toca «Planificar mi arreglo» para añadir tu primer objeto.","Wala pang laman. I-tap ang “Planuhin ang ayos” para idagdag ang unang gamit mo.","这里还没有内容。点击“规划维修”添加您的第一件物品。","まだ何もありません。「修理プランを作る」をタップして最初のアイテムを追加しましょう。","아직 아무것도 없어요. “수리 계획 세우기”를 눌러 첫 물건을 추가하세요.","Hier ist noch nichts. Tippen Sie auf „Reparatur planen“, um Ihren ersten Gegenstand hinzuzufügen.","Rien ici pour l’instant. Touchez « Planifier ma réparation » pour ajouter votre premier objet.","Burada henüz bir şey yok. İlk eşyanızı eklemek için “Onarımı planla”ya dokunun.","ยังไม่มีอะไรที่นี่ แตะ “วางแผนซ่อม” agawin ngayon.","现在没有要做的事。","今のところやることはありません。","지금은 할 일이 없어요.","Im Moment nichts zu tun.","Rien à faire pour l’instant.","Şu anda yapılacak bir şey yok.","ตอนนี้ไม่มีอะไรต้องทำ","ຕອນນີ້ບໍ່ມີຫຍັງຕ້ອງເຮັດ"],"Off. Turn on a morning nudge for reminders that are due.": ["Desactivado. Activa un aviso por la mañana para los recordatorios que vencen.","Naka-off. I-on ang paalala sa umaga para sa mga due na paalala.","已关闭。开启早晨提示，提醒到期事项。","オフ。期限が来たリマインダーの朝のお知らせをオンにできます。","꺼짐. 기한이 된 알림을 아침에 알려 주는 기능을 켜 보세요.","Aus. Aktivieren Sie eine Morgenerinnerung für fällige Erinnerungen.","Désactivé. Activez un rappel matinal pour les échéances.","Kapalı. Vadesi gelen hatırlatmalar için sabah bildirimini açın.","ปิดอยู่ เปิดการแจ้งเตือนตอนเช้าสำหรับการเตือนที่ถึงกำหนด","ປິດຢູ່. ເປີດການແຈ້ງເຕືອນຕອນເຊົ້າສຳລັບການເຕືອນທີ່ຮອດກຳນົດ"],"On a different device?": ["¿En otro dispositivo?","Sa ibang device?","换了其他设备？","別のデバイスですか？","다른 기기인가요?","Auf einem anderen Gerät?","Sur un autre appareil ?","Farklı bir cihazda mı?","อุปกรณ์เครื่องอื่น?","ໃນອຸປະກອນອື່ນບໍ?"],"On iPhone, add One Place to your Home Screen first. Then notifications work from there.": ["En iPhone, añade primero One Place a tu pantalla de inicio. Luego las notificaciones funcionan desde ahí.","Sa iPhone, idagdag muna ang One Place sa Home Screen mo. Pagkatapos ay gagana ang notifications mula roon.","在 iPhone 上，请先将 One Place 添加到主屏幕，之后通知即可从那里使用。","iPhone では、まず One Place をホーム画面に追加してください。そこから通知が使えるようになります。","iPhone에서는 먼저 One Place를 홈 화면에 추가하세요. 그다음부터 알림이 작동해요.","Auf dem iPhone fügen Sie One Place zuerst zum Home-Bildschirm hinzu. Dann funktionieren Benachrichtigungen von dort.","Sur iPhone, ajoutez d’abord One Place à l’écran d’accueil. Les notifications fonctionneront ensuite depuis là.","iPhone’da önce One Place’i Ana Ekran’a ekleyin. Bildirimler ondan sonra oradan çalışır.","บน iPhone ให้เพิ่ม One Place ลงหน้าจอหลักก่อน จากนั้นการแจ้งเตือนจะทำงานจากที่นั่น","ໃນ iPhone ໃຫ້ເພີ່ມ One Place ໃສ່ໜ້າຈໍຫຼັກກ່ອນ ຈາກນັ້ນການແຈ້ງເຕືອນຈະເຮັດວຽກຈາກບ່ eguro, usarlo en el teléfono y el ordenador, tener el asistente de fotos y recibir recordatorios por la mañana. Todo lo que has añadido te acompaña.","Nananatili sa device na ito ang idinadagdag mo. Gumawa ng libreng account para mapanatili itong ligtas, magamit sa phone at computer, makuha ang photo helper, at makatanggap ng paalala sa umaga. Kasama mo ang lahat ng idinagdag mo.","您添加的内容只保存在此设备上。创建免费账户即可安全保存，在手机和电脑上使用，获得照片助手和早晨提醒。您添加的一切都会一起带过去。","追加した内容はこのデバイスにのみ保存されます。無料アカウントを作ると、安全に保管でき、スマホとパソコンで使え、写真ヘルパーや朝のリマインダーも利用できます。追加した内容はそのまま引き継がれます。","추가한 내용은 이 기기에만 저장돼요. 무료 계정을 만들면 안전하게 보관하고, 휴대폰과 컴퓨터에서 사용하고, 사진 도우미와 아침 알림도 받을 수 있어요. 추가한 모든 것이 그대로 따라와요.","Was Sie hinzufügen, bleibt auf diesem Gerät. Erstellen Sie ein kostenloses Konto, um es sicher aufzubewahren, auf Handy und Computer zu nutzen, den Foto-Helfer zu erhalten und Morgenerinnerungen zu bekommen. Alles, was Sie hinzugefügt haben, kommt mit.","Ce que vous ajoutez reste sur cet appareil. Créez un compte gratuit pour le garder en sécurité, l’utiliser sur téléphone et ordinateur, avoir l’assistant photo et recevoir des rappels le matin. Tout ce que vous avez ajouté vous suit.","Eklediğiniz her şey bu cihazda kalır. Güvende tutmak, telefon ve bilgisayarda kullanmak, fotoğraf yardımcısını ve sabah hatırlatmalarını almak için ücretsiz bir hesap oluşturun. Eklediğiniz her şey sizinle gelir.","สิ่งที่คุณเพิ่มจะอยู่ในอุปกรณ์นี้ สร้างบัญชีฟรีเพื่อเก็บอย่างปลอดภัย ใช้บนโทรศัพท์และคอมพิวเตอร์ รับตัวช่วยรูปภาพ และการเตือนตอนเช้า ทุกอย่างที่คุณเพิ่มจะไปกับคุณ","ສິ່ງທີ່ທ່ານເພີ່ມຈະຢູ່ໃນອຸປະກອນນີ້. ສ້າງບັນຊີຟຣີເພື່ອເກັບຢ່າງປອດໄພ ໃຊ້ໃນໂທລະສັບ ແລະ ຄອມພິວເຕີ ຮັບຕົວຊ່ວຍຮູບ ແລະ ການເຕືອນຕອນເຊົ້າ. ທຸກຢ່າງທີ່ທ່ານເພີ່ມຈະໄປນຳ"],"What’s on your mind?": ["¿Qué tienes en mente?","Ano ang nasa isip mo?","您在想什么？","気になることは？","무슨 생각을 하고 계신가요?","Was beschäftigt Sie?","À quoi pensez-vous ?","Aklınızda ne var?","คุณกำลังคิดอะไรอยู่?","ທ່ານກຳລັງຄິດຫຍັງຢູ່?"],"What’s wrong? (optional)": ["¿Qué falla? (opcional)","Ano ang problema? (opsyonal)","哪里出 オンにできます。","괜찮아요. 나중에 더보기에서 켤 수 있어요.","Kein Problem. Sie können sie später unter Mehr einschalten.","Pas de souci. Vous pourrez les activer plus tard dans Plus.","Sorun değil. Daha sonra Daha fazla bölümünden açabilirsiniz.","ไม่เป็นไร คุณเปิดได้ภายหลังที่ เพิ่มเติม","ບໍ່ເປັນຫຍັງ. ທ່ານສາມາດເປີດພາຍຫຼັງໄດ້ໃນ ເພີ່ມເຕີມ"],"On iPhone: tap the Share button (the square with an arrow), choose Add to Home Screen, then open One Place from your Home Screen. Notifications work from there.": ["En iPhone: toca el botón Compartir (el cuadrado con una flecha), elige Añadir a pantalla de inicio y abre One Place desde tu pantalla de inicio. Desde ahí funcionan las notificaciones.","Sa iPhone: i-tap ang Share button (ang parisukat na may arrow), piliin ang Add to Home Screen, at buksan ang One Place mula sa Home Screen mo. Doon gagana ang mga notification.","在 iPhone 上：点按“分享”按钮（带箭头的方框），选择“添加到主屏幕”，然后从主屏幕打开 One Place。通知从那里开始生效。","iPhoneの場合：共有ボタン（矢印付きの四角）をタップして「ホーム画面に追加」を選び、ホーム画面から One Place を開きます。通知はそこから使えます。","iPhone에서: 공유 버튼(화살표가 있는 네모)을 누르고 '홈 화면에 추가'를 선택한 뒤 홈 화면에서 One Place를 여세요. 알림은 거기서부터 작동해요.","Auf dem iPhone: Tippen Sie auf „Teilen“ (das Quadrat mit Pfeil), wählen Sie „Zum Home-Bildschirm“ und öffnen Sie One Place von dort. Benachrichtigungen funktionieren dann.","Sur iPhone : touchez le bouton Partager (le carré avec une flèche), choisissez « Sur l’écran d’accueil », puis ouvrez One Place depuis l’écran d’accueil. Les notifications fonctionnent à partir de là.","iPhone’da: Paylaş düğmesine (oklu kare) dokunun, Ana Ekrana Ekle’yi seçin ve One Place’i Ana Ekran’dan açın. Bildirimler oradan çalışır.","บน iPhone: แตะปุ่มแชร์ (สี่เหลี่ยมมีลูกศร) เลือกเพิ่มลงในหน้าจอโฮม แล้วเปิด One Place จากหน้าจอโฮม การแจ้งเตือนจะทำงานจากตรงนั้น","ໃນ iPhone: ແຕະປຸ່ມແບ່ງປັນ (ສີ່ຫຼ່ຽມມີລູກສອນ), ເລືອກເພີ່ມໃສ່ໜ້າຈໍຫຼັກ, ແລ້ວເປີດ One Place ຈາກໜ້າຈໍຫຼັກ. ການແຈ້ງເຕືອນຈະເຮັດວຽກຈາກບ່ອນນັ້ນ"],"It opens like an app, one tap away, and it’s how reminders reach your iPhone.": ["Se abre como una app, a un toque, y así te llegan los recordatorios en tu iPhone.","Bubukas ito na parang app, isang tap lang, at ito ang paraan para makarating sa iPhone mo ang mga paalala.","它像应用一样打开，一点即达，提醒也是这样送达您的 iPhone。","アプリのように1タップで開け、リマインダーがiPhoneに届くようになります。","앱처럼 한 번에 열리고, 알림이 iPhone에 도착하는 방법이기도 해요.","Sie öffnet sich wie eine App, mit einem Tipp, und so erreichen Sie die Erinnerungen auf dem iPhone.","Elle s’ouvre comme une appli, en un geste, et c’est ainsi que les rappels arrivent sur votre iPhone.","Uygulama gibi açılır, tek dokunuşla ulaşırsınız ve hatırlatmalar iPhone’unuza böyle gelir.","เปิดได้เหมือนแอปด้วยการแตะครั้งเดียว และเป็นวิธีที่การเตือนส่งถึง iPhone ของคุณ","ເປີດໄດ້ຄືແອັບດ້ວຍການແຕະດຽວ ແລະ ເປັນວິທີທີ່ການເຕືອນສົ່ງເຖິງ iPhone ຂອງທ່ານ"],"It opens like an app, one tap away, and reminders can reach you in the morning.": ["Se abre como una app, a un toque, y los recordatorios pueden llegarte por la mañana.","Bubukas ito na parang app, isang tap lang, at makakarating sa iyo ang mga paalala sa umaga.","它像应用一样打开，一点即达，提醒也能在早晨送到您手中。","アプリのように1タップで開け、朝にリマインダーが届きます。","앱처럼 한 번에 열리고, 아침에 알림을 받을 수 있어요.","Sie öffnet sich wie eine App, mit einem Tipp, und Erinnerungen erreichen Sie am Morgen.","Elle s’ouvre comme une appli, en un geste, et les rappels peuvent vous parvenir le matin.","Uygulama gibi açılır, tek dokunuşla ulaşırsınız ve hatırlatmalar sabah size ulaşabilir.","เปิดได้เหมือนแอปด้วยการแตะครั้งเดียว และการเตือนจะส่งถึงคุณตอนเช้า","ເປີດໄດ້ຄືແອັບດ້ວຍການແຕະດຽວ ແລະ ການເຕືອນສາມາດເຖິງທ່ານຕອນເຊົ້າ"],"Yes, remind me": ["Sí, recuérdamelo","Oo, paalalahanan mo ako","好的，提醒我","はい、お知らせください","네, 알려 주세요","Ja, erinnern Sie mich","Oui, rappelez-moi","Evet, hatırlat","ใช่ เตือนฉัน","ແມ່ນ, ເຕືອນຂ້ອຍ"],"Later": ["Más tarde","Mamaya na","稍后","あとで","나중에","Später","Plus tard","Sonra","ไว้ทีหลัง","ພາຍຫຼັງ"],"Want a morning nudge?": ["¿Quieres un aviso por la mañana?","Gusto mo ba ng paalala sa umaga?","想要早晨提醒吗？","朝のお知らせをオンにしますか？","아침 알림을 받을까요?","Möchten Sie einen Morgenhinweis?","Un petit rappel le matin ?","Sabah bir dürtme ister misiniz?","ต้องการให้เตือนตอนเช้าไหม","ຢາກໃຫ້ເຕືອນຕອນເຊົ້າບໍ?"],"Your reminder is saved. On iPhone, reminders reach you once One Place is on your Home Screen. It takes about 20 seconds, and I’ll show you how.": ["Tu recordatorio está guardado. En iPhone, los recordatorios te llegan cuando One Place está en tu pantalla de inicio. Tarda unos 20 segundos y te muestro cómo.","Na-save ang paalala mo. Sa iPhone, darating ang mga paalala kapag nasa Home Screen mo na ang One Place. Mga 20 segundo lang, at ipapakita ko kung paano.","提醒已保存。在 iPhone 上，把 One Place 添加到主屏幕后才能收到提醒。大约只需 20 秒，我来教您。","リマインダーを保存しました。iPhoneでは、One Place をホーム画面に追加すると通知が届きます。約20秒で、やり方をご案内します。","알림을 저장했어요. iPhone에서는 One Place를 홈 화면에 추가해야 알림을 받을 수 있어요. 약 20초면 되고, 방법을 알려 드릴게요.","Ihre Erinnerung ist gespeichert. Auf dem iPhone erreichen Sie Erinnerungen, sobald One Place auf dem Home-Bildschirm liegt. Das dauert etwa 20 Sekunden, ich zeige es Ihnen.","Votre rappel est enregistré. Sur iPhone, les rappels vous parviennent une fois One Place sur l’écran d’accueil. Cela prend environ 20 secondes, je vous montre comment.","Hatırlatmanız kaydedildi. iPhone’da hatırlatmalar, One Place Ana Ekran’ınızda olduğunda size ulaşır. Yaklaşık 20 saniye sürer, nasıl yapılacağını göstereyim.","บันทึกการเตือนแล้ว บน iPhone การเตือนจะส่งถึงคุณเมื่อ One Place อยู่บนหน้าจอโฮม ใช้เวลาประมาณ 20 วินาที เดี๋ยวฉันจะแสดงวิธีให้","ບັນທຶກການເຕືອນແລ້ວ. ໃນ iPhone ການເຕືອນຈະເຖິງທ່ານເມື່ອ One Place ຢູ່ໜ້າຈໍຫຼັກ. ໃຊ້ເວລາປະມານ 20 ວິນາທີ ແລະ ຂ້ອຍຈະສະແດງວິທີໃຫ້"],"Your reminder is saved. I can send one friendly notification in the morning when something is due, so nothing slips. You can turn it off any time in More.": ["Tu recordatorio está guardado. Puedo enviarte una notificación amable por la mañana cuando algo venza, para que nada se escape. Puedes desactivarla cuando quieras en Más.","Na-save ang paalala mo. Puwede akong magpadala ng isang magiliw na notification sa umaga kapag may due, para walang malimutan. Puwede mo itong i-off anumang oras sa Higit pa.","提醒已保存。有事项到期时，我可以在早晨发一条友好的通知，让您不会错过。您可随时在“更多”中关闭。","リマインダーを保存しました。期日が来たら朝にやさしい通知をお送りできます。「その他」からいつでもオフにできます。","알림을 저장했어요. 기한이 된 일이 있으면 아침에 다정한 알림을 한 번 보내 드릴 수 있어요. 더보기에서 언제든 끌 수 있어요.","Ihre Erinnerung ist gespeichert. Ich kann Ihnen morgens eine freundliche Benachrichtigung senden, wenn etwas fällig ist. Unter Mehr können Sie sie jederzeit ausschalten.","Votre rappel est enregistré. Je peux vous envoyer une gentille notification le matin quand quelque chose est dû. Vous pouvez la désactiver à tout moment dans Plus.","Hatırlatmanız kaydedildi. Bir şeyin vadesi geldiğinde sabah size tek bir nazik bildirim gönderebilirim. Daha fazla bölümünden istediğiniz zaman kapatabilirsiniz.","บันทึกการเตือนแล้ว ฉันส่งการแจ้งเตือนเบาๆ ตอนเช้าเมื่อมีงานครบกำหนดได้ จะได้ไม่พลาด ปิดได้ทุกเมื่อที่ เพิ่มเติม","ບັນທຶກການເຕືອນແລ້ວ. ຂ້ອຍສົ່ງການແຈ້ງເຕືອນເບົາໆຕອນເຊົ້າເມື່ອມີວຽກຄົບກຳນົດ ເພື່ອບໍ່ໃຫ້ພາດ. ທ່ານປິດໄດ້ທຸກເວລາໃນ ເພີ່ມເຕີມ"],"Where:": ["Dónde:","Saan:","地点：","場所：","위치:","Wo:","Où :","Nerede:","ที่ไหน:","ຢູ່ໃສ:"],"Back to my visit": ["Volver a mi visita","Bumalik sa pagbisita ko","返回我的浏览","見ていたところに戻る","둘러보던 곳으로 돌아가기","Zurück zu meinem Besuch","Retour à ma visite","Ziyaretime dön","กลับไปที่การเยี่ยมชมของฉัน","ກັບຄືນໄປການເຂົ້າຊົມຂອງຂ້ອຍ"],"My place": ["Mi lugar","Aking lugar","我的地方","マイプレイス","내 공간","Mein Ort","Mon lieu","Yerim","สถานที่ของฉัน","ສະຖານທີ່ຂອງຂ້ອຍ"],"That part needs a free account. Tap More, then Create account, and everything you’ve added comes with you.": ["Esa parte necesita una cuenta gratuita. Toca Más, luego Crear cuenta, y todo lo que añadiste te acompaña.","Kailangan ng libreng account para diyan. I-tap ang Higit pa, tapos Gumawa ng account, at kasama mo ang lahat ng idinagdag mo.","这部分需要免费账户。点按“更多”，再点“创建账户”，您添加的内容都会保留。","この機能には無料アカウントが必要です。「その他」から「アカウント作成」をタップすると、追加した内容も引き継がれます。","이 기능은 무료 계정이 필요해요. 더보기에서 계정 만들기를 누르면 추가한 내용이 그대로 이어져요.","Dafür brauchen Sie ein kostenloses Konto. Tippen Sie auf Mehr, dann auf Konto erstellen, und alles, was Sie hinzugefügt haben, kommt mit.","Cette partie nécessite un compte gratuit. Touchez Plus, puis Créer un compte, et tout ce que vous avez ajouté vous suit.","Bu bölüm için ücretsiz hesap gerekir. Daha fazla’ya, ardından Hesap oluştur’a dokunun; eklediğiniz her şey sizinle gelir.","ส่วนนี้ต้องมีบัญชีฟรี แตะ เพิ่มเติม แล้วเลือก สร้างบัญชี ทุกอย่างที่คุณเพิ่มจะติดตามไปด้วย","ສ່ວນນີ້ຕ້ອງມີບັນຊີຟຣີ. ແຕະ ເພີ່ມເຕີມ ແລ້ວ ສ້າງບັນຊີ ທຸກຢ່າງທີ່ທ່ານເພີ່ມຈະຕິດຕາມໄປນຳ"],"Extra homes and businesses come with a free account.": ["Las casas y negocios adicionales vienen con una cuenta gratuita.","Ang karagdagang bahay at negosyo ay kasama sa libreng account.","更多的家和企业需要免费账户。","ホームや事業所の追加は無料アカウントで使えます。","집과 사업장을 더 추가하려면 무료 계정이 필요해요.","Weitere Zuhause und Geschäfte gibt es mit einem kostenlosen Konto.","Les logements et commerces supplémentaires sont inclus avec un compte gratuit.","Ek ev ve işletmeler ücretsiz hesapla gelir.","บ้านและธุรกิจเพิ่มเติมมาพร้อมกับบัญชีฟรี","ບ້ານ ແລະ ທຸລະກິດເພີ່ມເຕີມມາພ້ອມບັນຊີຟຣີ"],"Nice! Make your account and everything you’ve added comes with you.": ["¡Genial! Crea tu cuenta y todo lo que añadiste te acompaña.","Ang galing! Gumawa ng account at kasama mo ang lahat ng idinagdag mo.","太棒了！创建账户后，您添加的内容都会保留。","いいですね！アカウントを作ると、追加した内容も引き継がれます。","좋아요! 계정을 만들면 추가한 내용이 그대로 이어져요.","Super! Erstellen Sie Ihr Konto, und alles, was Sie hinzugefügt haben, kommt mit.","Super ! Créez votre compte et tout ce que vous avez ajouté vous suit.","Harika! Hesabınızı oluşturun; eklediğiniz her şey sizinle gelir.","เยี่ยม! สร้างบัญชี แล้วทุกอย่างที่คุณเพิ่มจะติดตามไปด้วย","ດີຫຼາຍ! ສ້າງບັນຊີ ແລ້ວທຸກຢ່າງທີ່ທ່ານເພີ່ມຈະຕິດຕາມໄປນຳ"],"Open One Place in Safari": ["Abre One Place en Safari","Buksan ang One Place sa Safari","在 Safari 中打开 One Place","One Place をSafariで開く","Safari에서 One Place 열기","One Place in Safari öffnen","Ouvrez One Place dans Safari","One Place’i Safari’de açın","เปิด One Place ใน Safari","ເປີດ One Place ໃນ Safari"],"It has to be Safari for this to work. If you opened the link from a message or another app, tap the link and choose Open in Safari.": ["Tiene que ser Safari para que funcione. Si abriste el enlace desde un mensaje u otra app, toca el enlace y elige Abrir en Safari.","Kailangang Safari ito para gumana. Kung binuksan mo ang link mula sa mensahe o ibang app, i-tap ang link at piliin ang Open in Safari.","必须使用 Safari 才行。如果您是从信息或其他应用打开的链接，请点按链接并选择“在 Safari 中打开”。","これにはSafariが必要です。メッセージや他のアプリからリンクを開いた場合は、リンクをタップして「Safariで開く」を選んでください。","Safari여야 작동해요. 메시지나 다른 앱에서 링크를 열었다면 링크를 누르고 'Safari에서 열기'를 선택하세요.","Es muss Safari sein. Wenn Sie den Link aus einer Nachricht oder einer anderen App geöffnet haben, tippen Sie darauf und wählen Sie „In Safari öffnen“.","Il faut utiliser Safari pour que cela fonctionne. Si vous avez ouvert le lien depuis un message ou une autre appli, touchez-le et choisissez « Ouvrir dans Safari ».","Bunun çalışması için Safari gerekir. Bağlantıyı bir mesajdan veya başka bir uygulamadan açtıysanız, bağlantıya dokunup Safari’de Aç’ı seçin.","ต้องใช้ Safari เท่านั้นจึงจะได้ ถ้าคุณเปิดลิงก์จากข้อความหรือแอปอื่น ให้แตะลิงก์แล้วเลือกเปิดใน Safari","ຕ້ອງໃຊ້ Safari ຈຶ່ງຈະໄດ້. ຖ້າທ່ານເປີດລິ້ງຈາກຂໍ້ຄວາມ ຫຼື ແອັບອື່ນ ໃຫ້ແຕະລິ້ງແລ້ວເລືອກເປີດໃນ Safari"],"Tap the Share button": ["Toca el botón Compartir","I-tap ang Share button","点按“分享”按钮","共有ボタンをタップ","공유 버튼 누르기","Tippen Sie auf „Teilen“","Touchez le bouton Partager","Paylaş düğmesine dokunun","แตะปุ่มแชร์","ແຕະປຸ່ມແບ່ງປັນ"],"It’s the square with an arrow pointing up, at the bottom of the screen (top right on iPad).": ["Es el cuadrado con una flecha hacia arriba, en la parte inferior de la pantalla (arriba a la derecha en iPad).","Ito ang parisukat na may arrow na nakaturo pataas, sa ibaba ng screen (sa kanang itaas sa iPad).","就是带向上箭头的方框，位于屏幕底部（iPad 上在右上角）。","上向きの矢印が付いた四角いアイコンで、画面の下（iPadでは右上）にあります。","위쪽 화살표가 있는 네모 모양으로, 화면 아래(iPad는 오른쪽 위)에 있어요.","Es ist das Quadrat mit dem Pfeil nach oben, unten auf dem Bildschirm (beim iPad oben rechts).","C’est le carré avec une flèche vers le haut, en bas de l’écran (en haut à droite sur iPad).","Yukarı oklu karedir; ekranın altındadır (iPad’de sağ üstte).","เป็นสี่เหลี่ยมมีลูกศรชี้ขึ้น อยู่ด้านล่างของหน้าจอ (มุมขวาบนบน iPad)","ເປັນສີ່ຫຼ່ຽມມີລູກສອນຊີ້ຂຶ້ນ ຢູ່ລຸ່ມຂອງໜ້າຈໍ (ມຸມຂວາເທິງໃນ iPad)"],"Choose Add to Home Screen": ["Elige Añadir a pantalla de inicio","Piliin ang Add to Home Screen","选择“添加到主屏幕”","「ホーム画面に追加」を選ぶ","'홈 화면에 추가' 선택","Wählen Sie „Zum Home-Bildschirm“","Choisissez « Sur l’écran d’accueil »","Ana Ekrana Ekle’yi seçin","เลือกเพิ่มลงในหน้าจอโฮม","ເລືອກເພີ່ມໃສ່ໜ້າຈໍຫຼັກ"],"Scroll down the list a little if you don’t see it right away. If it’s missing, tap View More first.": ["Desplázate un poco por la lista si no lo ves enseguida. Si no aparece, toca Ver más primero.","I-scroll nang kaunti pababa kung hindi mo agad makita. Kung wala, i-tap muna ang View More.","如果没有立刻看到，请向下滚动列表。如果没有该选项，先点按“查看更多”。","すぐに見つからない場合は、リストを少し下にスクロールしてください。なければ先に「その他を表示」をタップします。","바로 보이지 않으면 목록을 조금 아래로 스크롤하세요. 없으면 먼저 '더 보기'를 누르세요.","Scrollen Sie die Liste etwas nach unten, falls Sie es nicht gleich sehen. Fehlt es, tippen Sie zuerst auf „Mehr anzeigen“.","Faites défiler un peu la liste si vous ne le voyez pas tout de suite. S’il manque, touchez d’abord « Plus ».","Hemen görmezseniz listeyi biraz aşağı kaydırın. Yoksa önce Daha Fazla Göster’e dokunun.","เลื่อนรายการลงเล็กน้อยหากไม่เห็นทันที ถ้าไม่มี ให้แตะดูเพิ่มเติมก่อน","ເລື່ອນລາຍການລົງເລັກນ້ອຍຖ້າບໍ່ເຫັນທັນທີ. ຖ້າບໍ່ມີ ໃຫ້ແຕະເບິ່ງເພີ່ມເຕີມກ່ອນ"],"Tap Add": ["Toca Añadir","I-tap ang Add","点按“添加”","「追加」をタップ","'추가' 누르기","Tippen Sie auf „Hinzufügen“","Touchez « Ajouter »","Ekle’ye dokunun","แตะเพิ่ม","ແຕະເພີ່ມ"],"You can rename it if you like. Then tap Add in the top right corner.": ["Puedes cambiarle el nombre si quieres. Luego toca Añadir en la esquina superior derecha.","Puwede mo itong palitan ng pangalan kung gusto mo. Pagkatapos, i-tap ang Add sa kanang itaas.","您可以按需重命名，然后点按右上角的“添加”。","お好みで名前を変更できます。そのあと右上の「追加」をタップします。","원하면 이름을 바꿀 수 있어요.   // ---- Photo AI (through our own server function; sign-in required) ----
  function callAIWith(model, parts, opts) {

    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, opts.timeoutMs);
    return ensureFresh().then(function (s) {
      return fetch("/api/gemini", {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + s.access_token },
        signal: ctrl.signal,
        body: JSON.stringify({ model: model, contents: [{ role: "user", parts: parts }], generationConfig: opts.config })
      });
    }).catch(function (err) {
      var e;
      if (err && err.name === "AbortError") e = new Error("That model took too long to answer.");
      else if (err && /sign in/i.test(err.message || "")) { e = err; e.fatal = true; }
      else { e = new Error("Couldn’t reach the app’s server function (/api/gemini)."); e.fatal = true; }
      throw e;
    }).then(function (res) {
      return readJson(res).then(function (body) {
        if (!res.ok) {
          var e = new Error((body && body.error) || ("The photo AI answered with an error (" + res.status + ")."));
          e.fatal = res.status === 500 || res.status === 401;
          throw e;
        }
        var cands = body && body.candidates;
        var ps = cands && cands[0] && cands[0].content && cands[0].content.parts;
        var text = (ps || []).map(function (p) { return p.text || ""; }).join("").trim();
        if (!text) throw new Error("The photo AI answered, but with nothing in it.");
        return text;
      });
    }).then(function (t) { clearTimeout(timer); return t; }, function (e) { clearTimeout(timer); throw e; });
  }
  // Tries each model in turn; if one is busy or slow, the next one gets a go.
  function callAI(parts, opts) {
    opts = Object.assign({ timeoutMs: 12000, config: { temperature: 0.2, maxOutputTokens: 400 } }, opts || {});
    var i = 0, last = null;
    function next() {
      if (i >= AI_MODELS.length) throw new Error("The photo AI is busy right now. Wait a minute and try again. (" + (last && last.message || "no details") + ")");
      if (i > 0 && opts.onBackup) opts.onBackup();
      return callAIWith(AI_MODELS[i++], parts, opts).catch(function (err) { if (err.fatal) throw err; last = err; return next(); });
    }
    return next();
  }

  var MAKER_EMAIL = "angelisiopao@gmail.com";
  function whyCard() {
    var user = (state.session && state.session.user) || {};
    var isMaker = String(user.email || "").toLowerCase() === MAKER_EMAIL;
    var snack = h("span", { class: "snackico", "data-testid": "snack-icon", "aria-hidden": "true" }); snack.innerHTML = plushSvg("duck", "");
    var body = h("div", { "data-testid": "why-body" }, [h("p", { class: "hint", text: "Loading…" })]);
    var loaded = false, note = "";
    function draw(editing) {
      body.textContent = "";
      if (editing) {
        var ta = h("textarea", { "aria-label": "Why I created One Place", placeholder: "Write why you created One Place...", "data-testid": "why-text" });
        ta.value = note;
        var msg = h("div", { class: "result", role: "status" });
        body.appendChild(ta);
        body.appendChild(h("div", { class: "actions" }, [h("button", { type: "button", class: "small", text: "Save", "data-testid": "why-save", onclick: function () {
          rest("app_notes?on_conflict=key", { method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=representation" }, body: JSON.stringify({ key: "why", body: ta.value.trim(), updated_at: new Date().toISOString() }) })
            .then(function () { note = ta.value.trim(); draw(false); }, function (err) { msg.className = "result bad"; msg.textContent = "Not saved. " + err.message; });
        } })]));
        body.appendChild(msg);
        return;
      }
      body.appendChild(h("p", { "data-testid": "why-note", style: "white-space:pre-wrap", text: note || "Come back later when I’ve gathered my thoughts!" }));
      if (isMaker) body.appendChild(h("div", { class: "actions" }, [h("button", { type: "button", class: "quiet small", text: note ? "Edit" : "Write it", "data-testid": "why-edit", onclick: function () { draw(true); } })]));
    }
    var det = h("details", { class: "card noprint", "data-testid": "why-card" }, [
      h("summary", { style: "cursor:pointer;font-weight:700" }, [snack, "Why I created One Place"]),
      body
    ]);
    det.addEventListener("toggle", function () {
      if (!det.open || loaded) return;
      loaded = true;
      rest("app_notes?key=eq.why&select=body").then(function (rows) { note = (rows && rows[0] && rows[0].body) || ""; draw(false); }, function () { loaded = false; body.textContent = ""; body.appendChild(h("p", { class: "hint", text: "Couldn’t load this right now. Close and open it to try again." })); });
    });
    return det;
  }

    el.addEventListener("pointerdown", function (e) { drag = { sx: e.clientX, sy: e.clientY, ox: el.offsetLeft, oy: el.offsetTop, moved: false }; try { el.setPointerCapture(e.pointerId); } catch (x) {} });
    el.addEventListener("pointermove", function (e) {
      return; // docked: no dragging
      if (!drag) return; var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 7) return;
      drag.moved = true; el.classList.add("dragging"); document.documentElement.classList.add("punchy-drag");
      var w = window.innerWidth, hh = window.innerHeight;
      var nx = Math.max(0, Math.min(w - punchySize(), drag.ox + dx)), ny = Math.max(0, Math.min(hh - punchySize(), drag.oy + dy));
      el.style.left = nx + "px"; el.style.top = ny + "px"; punchyLink(nx, ny, punchySize());
    });
    function end() {
      if (!drag) return; var d = drag; drag = null; el.classList.remove("dragging"); document.documentElement.classList.remove("punchy-drag");
      if (d.moved) { var w = window.innerWidth, hh = window.innerHeight; punchy.x = el.offsetLeft / (w - punchySize()); punchy.y = el.offsetTop / (hh - punchySize()); punchySave(); }
      else punchyTap();
    }
    // Keep the page (and a host app's pull-down sheet) still while Punchy is being dragged.
    ["touchstart", "touchmove"].forEach(function (ev) { el.addEventListener(ev, function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false }); });
    el.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    el.addEventListener("pointerup", end); el.addEventListener("pointercancel", function () { drag = null; el.classList.remove("dragging"); document.documentElement.classList.remove("punchy-drag"); });
    window.addEventListener("resize", punchyPlace);
    // Works on his laptop whenever someone is busy: typing, tapping around, scrolling. Rests after a few quiet seconds.
    function busy(e) {
      if (e && e.target && e.target.closest && e.target.closest(".punchy, .pocketlink, .punchysleep")) return;
      clearTimeout(punchy.typingTimer); punchySetTyping(true);
      punchy.typingTimer = setTimeout(function () { punchySetTyping(false); }, 4000);
    }
    ["pointerdown", "keydown", "input", "change", "focusin", "touchmove", "wheel"].forEach(function (ev) { document.addEventListener(ev, busy, { passive: true, capture: true }); });
    window.addEventListener("scroll", busy, { passive: true });
    punchy.pocket ? punchyPocket(true) : punchyPlace();
    el.hidden = punchy.pocket; punchy.sleeper.hidden = !punchy.pocket; punchyPlace();
  }

  // ---- What's new ----
  function renderChangelog() {
    var root = $("changelog");
    var q = h("input", { type: "search", placeholder: "Search What\u2019s New", "aria-label": "Search What\u2019s New", "data-testid": "whats-new-search" });
    root.parentNode.insertBefore(q, root);
    CHANGELOG.forEach(function (group) {
      var dates = [], byDate = {};
      group.entries.forEach(function (e) { if (!byDate[e.date]) { byDate[e.date] = []; dates.push(e.date); } byDate[e.date].push(e); });
      var month = h("details", { class: "wn-month", "data-testid": "whats-new-month" }, [h("summary", { text: group.month })]);
      dates.forEach(function (d) {
        var items = byDate[d], hasNew = items.some(function (e) { return e.isNew; });
        var sum = h("summary", { text: d }, [h("span", { class: "wn-count", text: items.length + (items.length === 1 ? " update" : " updates") })]);
        if (hasNew) sum.appendChild(h("span", { class: "new", text: "New!" }));
        var day = h("details", { class: "wn-date", "data-testid": "whats-new-date" }, [sum]);
        items.forEach(function (e) {
          var t = h("div", { class: "wn-title", text: e.title });
          if (e.isNew) t.appendChild(h("span", { class: "new", text: "New!" }));
          day.appendChild(h("div", { class: "wn-item", "data-testid": "whats-new-entry" }, [t, h("p", { text: e.detail })]));
        });
        month.appendChild(day);
      });
      root.appendChild(month);
    });
    q.addEventListener("input", function () {
      var needle = q.value.trim().toLowerCase();
      [].forEach.call(root.querySelectorAll(".wn-month"), function (m) {
        var monthHit = false;
        [].forEach.call(m.querySelectorAll(".wn-date"), function (d) {
          var hit = false;
          [].forEach.call(d.querySelectorAll(".wn-item"), function (it) { var ok = !needle || it.textContent.toLowerCase().indexOf(needle) >= 0; it.hidden = !ok; if (ok) hit = true; });
          d.hidden = !hit; d.open = !!needle && hit; if (hit) monthHit = true;
        });
        m.hidden = !monthHit; m.open = !!needle && monthHit;
      });
    });
  }

  [].forEach.call(document.querySelectorAll("#tabbar button"), function (b) {
    b.addEventListener("click", function () { var t = b.getAttribute("data-tab"); if (t === "home") showHome(); else if (t === "calendar") showCalendar(); else showMore(); });
  });

  // ---- Start ----
  $("buildTag").textContent = BUILD.phase + " · v" + BUILD.version;
  document.body.insertAdjacentHTML("beforeend", PLUSH_DEFS);
  renderChangelog();
  startPunchy();
  startTranslator();
  lsSet("oneplace.visits", String(Number(lsGet("oneplace.visits") || 0) + 1));
  state.session = loadSessionAny();
  takeLinkTokens().then(function (type) {
    if (type === "recovery") return showNewPassword();
    if (state.session) return loadAll();
    if (guestHas() && lsGet("oneplace.welcomed")) return startGuest();
    if (!lsGet("oneplace.welcomed")) return showIntro();
    showAuth("signin");
  });
})();
</script>

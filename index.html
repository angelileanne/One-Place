<!doctype html>
<html lang="en" data-theme="pine" data-mode="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>One Place (Test Version)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Public+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <style>
      /* ---------- Theme palettes (10 themes × light/dark, same as the main app) ----------
         Each theme sets only its base tokens; the softer tokens below them
         (--bg2, --ink3, --accent2, --accent-soft, --hero) are derived with
         color-mix so every palette stays in step automatically. */
      @font-face{font-family:"Organic Source Serif";src:local("Source Serif 4");}
      @font-face{font-family:"Organic Instrument Sans";src:local("Instrument Sans");}
      @font-face{font-family:"Botanical Garamond";src:local("EB Garamond");}
      @font-face{font-family:"Botanical Instrument";src:local("Instrument Sans");}
      @font-face{font-family:"Luxury Garamond";src:local("EB Garamond");}
      @font-face{font-family:"Luxury Sans";src:local("Instrument Sans");}
      @font-face{font-family:"Claymorphism Instrument";src:local("Instrument Sans");}
      :root{
        --radius-card:20px; --radius-btn:13px; --radius-chip:999px;
        --shadow-card:0 1px 2px rgb(23 32 27/.04),0 18px 40px -26px rgb(23 32 27/.28);
        --shadow-nav:0 -14px 34px -22px rgb(23 32 27/.28);
        --font-heading:"Manrope","Public Sans",system-ui,sans-serif;
        --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
        --bg2:color-mix(in srgb,var(--bg) 90%,var(--ink));
        --ink3:color-mix(in srgb,var(--ink) 52%,var(--bg));
        --accent2:color-mix(in srgb,var(--accent) 82%,var(--ink));
        --accent-soft:color-mix(in srgb,var(--accent) 13%,var(--surface));
        --hero:var(--accent); --hero-ink:var(--accent-ink);
      }
      :root[data-mode="dark"]{--shadow-card:0 1px 2px rgb(0 0 0/.4),0 18px 40px -26px rgb(0 0 0/.8);--shadow-nav:0 -14px 34px -22px rgb(0 0 0/.8);}
      :root[data-theme="pine"]{--bg:#F3F5F3;--surface:#FFFFFF;--surface2:#E9EFEA;--ink:#17201B;--ink2:#59665D;--line:#DCE3DC;--accent:#17453A;--accent-ink:#FFFFFF;--ok:#2E7D4F;--ok-soft:#E4F1E8;--warn:#8F6B0D;--warn-soft:#FBF2D3;--bad:#C2521F;--bad-soft:#FBEAE1;}
      :root[data-theme="pine"][data-mode="dark"]{--bg:#0E1210;--surface:#171D19;--surface2:#232B25;--ink:#E9EEE9;--ink2:#A7B3A9;--line:#2F3A32;--accent:#7FC7A8;--accent-ink:#0E2019;--ok:#7FC48F;--ok-soft:#1E2F24;--warn:#E3B84D;--warn-soft:#332B16;--bad:#E88A5A;--bad-soft:#3A241A;}
      :root[data-theme="ocean"]{--bg:#F2F6F8;--surface:#FFFFFF;--surface2:#E2EBF0;--ink:#132229;--ink2:#546873;--line:#D3DFE6;--accent:#0F5E75;--accent-ink:#FFFFFF;--ok:#22784A;--ok-soft:#E2F1E7;--warn:#8F6B0D;--warn-soft:#FBF2D3;--bad:#C2521F;--bad-soft:#FBEAE1;}
      :root[data-theme="ocean"][data-mode="dark"]{--bg:#0B1216;--surface:#151E24;--surface2:#202C34;--ink:#E8EFF3;--ink2:#A3B6C1;--line:#2C3E49;--accent:#7CC0DE;--accent-ink:#0A1D29;--ok:#7FC48F;--ok-soft:#1C2E26;--warn:#E3B84D;--warn-soft:#332B16;--bad:#E88A5A;--bad-soft:#3A241A;}
      :root[data-theme="sunset"]{--bg:#FAF5F1;--surface:#FFFFFF;--surface2:#F3E7DD;--ink:#26180F;--ink2:#6E5A4C;--line:#E8D9CC;--accent:#B4491F;--accent-ink:#FFFFFF;--ok:#35794D;--ok-soft:#E7F1E4;--warn:#8F6209;--warn-soft:#FBF0D3;--bad:#B23A17;--bad-soft:#FAE4D8;}
      :root[data-theme="sunset"][data-mode="dark"]{--bg:#161009;--surface:#221812;--surface2:#31231A;--ink:#F5EADA;--ink2:#BFA78F;--line:#453325;--accent:#F0955C;--accent-ink:#2A1204;--ok:#8FCB8F;--ok-soft:#24301F;--warn:#E3B84D;--warn-soft:#332B16;--bad:#F08A5F;--bad-soft:#3D2317;}
      :root[data-theme="berry"]{--bg:#F7F4F8;--surface:#FFFFFF;--surface2:#ECE4EE;--ink:#251A28;--ink2:#63536A;--line:#DED2E2;--accent:#71295F;--accent-ink:#FFFFFF;--ok:#2B7A4C;--ok-soft:#E4F1E7;--warn:#8F6B0D;--warn-soft:#FBF2D3;--bad:#C2521F;--bad-soft:#FBEAE1;}
      :root[data-theme="berry"][data-mode="dark"]{--bg:#140D16;--surface:#201222;--surface2:#2D1B30;--ink:#F3E9F4;--ink2:#BBA6C0;--line:#402A44;--accent:#D99ACB;--accent-ink:#2A0E24;--ok:#7FC48F;--ok-soft:#1E2F24;--warn:#E3B84D;--warn-soft:#332B16;--bad:#F08A5F;--bad-soft:#3A241A;}
      :root[data-theme="sunny"]{--bg:#FAF7EC;--surface:#FFFFFF;--surface2:#F1EAD0;--ink:#28220A;--ink2:#665D40;--line:#E4DCBB;--accent:#7A5E00;--accent-ink:#FFFFFF;--ok:#2B7A4C;--ok-soft:#E7F2DF;--warn:#8F6B0D;--warn-soft:#FFF3C4;--bad:#C2521F;--bad-soft:#FBEAE1;}
      :root[data-theme="sunny"][data-mode="dark"]{--bg:#141106;--surface:#1F1A0D;--surface2:#2C2514;--ink:#F5EFDB;--ink2:#BBAE86;--line:#403619;--accent:#EAC54D;--accent-ink:#241B02;--ok:#8FCB8F;--ok-soft:#24301F;--warn:#E3B84D;--warn-soft:#332B16;--bad:#F08A5F;--bad-soft:#3A241A;}
      :root[data-theme="midnight"]{--bg:#EEF1F5;--surface:#FFFFFF;--surface2:#DFE5EC;--ink:#161D27;--ink2:#525F6E;--line:#CFD8E2;--accent:#2F6EA3;--accent-ink:#FFFFFF;--ok:#22784A;--ok-soft:#E2F1E7;--warn:#8F6B0D;--warn-soft:#FBF2D3;--bad:#C2521F;--bad-soft:#FBEAE1;}
      :root[data-theme="midnight"][data-mode="dark"]{--bg:#12151A;--surface:#1C2027;--surface2:#282E38;--ink:#EDEFF3;--ink2:#AAB3C0;--line:#39424F;--accent:#7FB8E8;--accent-ink:#0E1620;--ok:#7FC48F;--ok-soft:#1E2F24;--warn:#E3B84D;--warn-soft:#332B16;--bad:#E88A5A;--bad-soft:#3A241A;}
      :root[data-theme="organic"]{--bg:#EEE6D6;--surface:#F5EDDF;--surface2:#DDD5C3;--ink:#29251D;--ink2:#443B2F;--line:#CFC4AB;--accent:#35422D;--accent-ink:#F5EDDF;--ok:#4A6741;--ok-soft:#DFE1C9;--warn:#7D6116;--warn-soft:#EFE3BC;--bad:#9C4A1F;--bad-soft:#F0DAC6;--field:#694737;--highlight:#B9B28B;--art-accent:#AD7D62;--grain-rgb:41 37 29;--shadow-card:0 1px 0 rgb(105 71 55/.06),0 14px 26px -20px rgb(41 37 29/.4);--shadow-nav:0 -12px 26px -20px rgb(41 37 29/.4);--font-heading:"Organic Source Serif","Source Serif 4",Georgia,serif;--font-body:"Organic Instrument Sans","Instrument Sans",system-ui,sans-serif;--hero:var(--field);--hero-ink:#F5EDDF;}
      :root[data-theme="organic"][data-mode="dark"]{--bg:#211C15;--surface:#2B251C;--surface2:#3A3122;--ink:#EFE6D2;--ink2:#C2B498;--line:#4A3F2D;--accent:#A9BD8F;--accent-ink:#232B1A;--ok:#A9C98D;--ok-soft:#2C3822;--warn:#DCBB6A;--warn-soft:#3D3319;--bad:#E0956A;--bad-soft:#40271A;--field:#8A6A52;--highlight:#8F8A5E;--art-accent:#C79B7C;--grain-rgb:245 237 223;--shadow-card:0 1px 0 rgb(0 0 0/.25),0 14px 26px -20px rgb(0 0 0/.75);--shadow-nav:0 -12px 26px -20px rgb(0 0 0/.75);}
      :root[data-theme="botanical"]{--bg:#F5EFDF;--surface:#FBF7EA;--surface2:#E0E5D3;--ink:#1E382C;--ink2:#4D5C50;--line:#D4D0BD;--accent:#1E382C;--accent-ink:#F5EFDF;--ok:#2E6B45;--ok-soft:#DDE5CF;--warn:#7D6116;--warn-soft:#F0E3BD;--bad:#9C4A24;--bad-soft:#F0DCC9;--warm-field:#E6CBB8;--clay:#895440;--ornament-line:#B5BAA4;--field-line:#697961;--grain-rgb:30 56 44;--shadow-card:0 1px 0 rgb(30 56 44/.05),0 12px 24px -18px rgb(30 56 44/.3);--shadow-nav:0 -10px 24px -18px rgb(30 56 44/.3);--font-heading:"Botanical Garamond","EB Garamond",Georgia,serif;--font-body:"Botanical Instrument","Instrument Sans",system-ui,sans-serif;}
      :root[data-theme="botanical"][data-mode="dark"]{--bg:#14231B;--surface:#1D2F24;--surface2:#2A4032;--ink:#F0EAD6;--ink2:#B3BFA9;--line:#3C5344;--accent:#A8C69A;--accent-ink:#16241A;--ok:#9CCB8F;--ok-soft:#24382A;--warn:#DCBB6A;--warn-soft:#38331A;--bad:#E0956A;--bad-soft:#40271A;--warm-field:#4E3628;--clay:#C08A6E;--ornament-line:#5F7052;--field-line:#8A9A82;--grain-rgb:240 234 214;--shadow-card:0 1px 0 rgb(0 0 0/.25),0 12px 24px -18px rgb(0 0 0/.7);--shadow-nav:0 -10px 24px -18px rgb(0 0 0/.7);}
      :root[data-theme="luxury"]{--bg:#F3EEE4;--surface:#FBF8F1;--surface2:#E4DBCC;--ink:#262321;--ink2:#5F5750;--line:#D5CAB8;--accent:#262321;--accent-ink:#F3EEE4;--ok:#4A6741;--ok-soft:#E3E0CB;--warn:#76591F;--warn-soft:#EFE3C2;--bad:#9C4A1F;--bad-soft:#EFDBC4;--gold:#B69355;--gold-text:#76591F;--gold-light:#D2B071;--gold-focus:#76591F;--panel-line:#C6B89F;--field:#262321;--field-deep:#302C29;--field-line:#46403A;--shadow-card:none;--shadow-nav:0 -1px 0 0 var(--line);--font-heading:"Luxury Garamond","EB Garamond",Georgia,"Times New Roman",serif;--font-body:"Luxury Sans","Instrument Sans","Helvetica Neue",Arial,sans-serif;}
      :root[data-theme="luxury"][data-mode="dark"]{--bg:#1B1917;--surface:#262321;--surface2:#302C29;--ink:#F3EEE4;--ink2:#C6BDB0;--line:#46403A;--accent:#D2B071;--accent-ink:#262321;--ok:#A9C98D;--ok-soft:#2C3324;--warn:#D2B071;--warn-soft:#38301C;--bad:#E0956A;--bad-soft:#40271A;--gold:#B69355;--gold-text:#D2B071;--gold-light:#D2B071;--gold-focus:#D2B071;--panel-line:#57493A;--field:#262321;--field-deep:#302C29;--field-line:#46403A;--shadow-card:none;--shadow-nav:0 -1px 0 0 var(--line);}
      :root[data-theme="claymorphism"]{--bg:#F1F2FA;--surface:#FFFDF7;--surface2:#DED0F9;--ink:#383139;--ink2:#48404B;--line:#E3D9EC;--accent:#D96CA6;--accent-ink:#FFFFFF;--ok:#1F6B4A;--ok-soft:#C0EFDC;--warn:#7A5B00;--warn-soft:#F9E7A8;--bad:#B23A6B;--bad-soft:#FBDCEA;--support:#C0EFDC;--compare:#DED0F9;--warm:#F9E7A8;--cool:#C5E5FB;--pink:#F6A3CA;--shadow-card:inset 2px 2px 6px rgb(255 255 255/.75),inset -5px -5px 12px rgb(56 49 57/.08),0 20px 34px -20px rgb(56 49 57/.35);--shadow-nav:inset 0 2px 6px rgb(255 255 255/.6),inset -5px -5px 12px rgb(56 49 57/.06),0 -16px 30px -20px rgb(56 49 57/.3);--font-heading:"Claymorphism Instrument","Instrument Sans",system-ui,sans-serif;--font-body:"Claymorphism Instrument","Instrument Sans",system-ui,sans-serif;}
      :root[data-theme="claymorphism"][data-mode="dark"]{--bg:#241E26;--surface:#322A34;--surface2:#3E3442;--ink:#F5EFF4;--ink2:#C9BCC6;--line:#524657;--accent:#F6A3CA;--accent-ink:#383139;--ok:#8FE3BC;--ok-soft:#1E3830;--warn:#F2D67C;--warn-soft:#453A1E;--bad:#F095B5;--bad-soft:#42222F;--support:#24503E;--compare:#4A3D6B;--warm:#5A4A1F;--cool:#2A4A66;--pink:#F6A3CA;--shadow-card:inset 2px 2px 6px rgb(255 255 255/.08),inset -5px -5px 12px rgb(0 0 0/.35),0 20px 34px -20px rgb(0 0 0/.7);--shadow-nav:inset 0 2px 6px rgb(255 255 255/.06),inset -5px -5px 12px rgb(0 0 0/.3),0 -16px 30px -20px rgb(0 0 0/.7);}

      *{box-sizing:border-box;}
      html{font-size:16.5px;}
      html,body{margin:0;padding:0;}
      body{
        font-family:var(--font-body);
        background:var(--bg2); color:var(--ink);
        -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; line-height:1.45;
      }
      h1.page-title,h2.sec-title,.card-title,.sheet h3,.place-name,.hero h2,.stat b,.report-sheet h1,.report-sheet h2,.report-sheet h3{font-family:var(--font-heading);}
      ::selection{background:color-mix(in srgb,var(--accent) 28%,transparent);}

      /* ---------- Sleek interaction layer (all themes) ---------- */
      button,a,input,select,textarea{transition:background-color .16s ease,border-color .16s ease,color .16s ease,box-shadow .2s ease,transform .12s ease;}
      input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent);}
      :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
      @media(hover:hover) and (pointer:fine){.card:hover,.row-card:hover,.tile:hover{box-shadow:0 2px 4px rgb(23 32 27/.05),0 24px 48px -26px rgb(23 32 27/.38);}}
      @media(prefers-reduced-motion:reduce){button,a,input,select,textarea{transition:none;}button:active,.btn:active,.tile:active,.row-card:active,.addbtn:active{transform:none;}}
      button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
      input,select,textarea{font:inherit;color:var(--ink);}
      img{display:block;max-width:100%;}
      .ic{width:1.25rem;height:1.25rem;flex:none;display:inline-block;vertical-align:-.28em;}
      .ic svg{width:100%;height:100%;display:block;}

      /* ---------- App frame ---------- */
      .frame{max-width:1060px;margin:0 auto;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;}
      @media(min-width:1100px){.frame{box-shadow:0 0 60px rgba(10,15,12,.18);}}
      .content{flex:1;padding:1.1rem 1.1rem 7.5rem;width:100%;max-width:1060px;margin:0 auto;}
      @media(min-width:760px){.content{padding:1.6rem 2rem 8rem;}}

      /* ---------- Type ---------- */
      h1.page-title{font-size:1.72rem;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.12;}
      h2.sec-title{font-size:1.13rem;font-weight:800;letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:.6rem;}
      h2.sec-title::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px;}
      .sec{margin-top:1.7rem;}
      .label{font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);}
      body.bold-off .label{font-weight:600;}
      body.bold-off h2.sec-title,body.bold-off .card-title,body.bold-off .nav-label{font-weight:700;}
      .muted{color:var(--ink2);} .small{font-size:.86rem;} .tiny{font-size:.76rem;}
      .strong{font-weight:700;}

      /* ---------- Header / place switcher ---------- */
      .placebar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:.7rem 1.1rem;}
      @media(min-width:760px){.placebar{padding:.7rem 2rem;}}
      .placebar-in{max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:.8rem;}
      .place-id{display:flex;align-items:center;gap:.65rem;min-width:0;}
      .place-emoji{width:2.5rem;height:2.5rem;border-radius:.8rem;background:var(--accent-soft);display:grid;place-items:center;font-size:1.3rem;flex:none;}
      .place-name{font-weight:800;font-size:1.06rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
      .place-tag{font-size:.78rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
      .switcher{display:flex;gap:.45rem;overflow-x:auto;padding:.55rem 0 .1rem;scrollbar-width:none;}
      .switcher::-webkit-scrollbar{display:none;}
      .chip{flex:none;display:inline-flex;align-items:center;gap:.4rem;padding:.42rem .8rem;border-radius:var(--radius-chip);border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.88rem;transition:border-color .15s,background .15s;}
      .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
      .chip.add{border-style:dashed;color:var(--ink2);}

      /* ---------- Cards & buttons ---------- */
      .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:1.05rem 1.1rem;}
      .card-title{font-weight:800;font-size:1.02rem;letter-spacing:-.01em;}
      .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:.72rem 1.15rem;border-radius:var(--radius-btn);font-size:.98rem;transition:transform .08s,background .15s,opacity .15s;text-align:center;}
      .btn:active{transform:scale(.97);}
      .btn.block{width:100%;}
      .btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);}
      .btn.soft{background:var(--accent-soft);color:var(--accent2);}
      [data-mode="dark"] .btn.soft{color:var(--accent2);}
      .btn.danger{background:var(--bad-soft);color:var(--bad);}
      .btn.sm{padding:.5rem .85rem;font-size:.9rem;border-radius:11px;}
      .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;}
      .iconbtn{width:2.5rem;height:2.5rem;border-radius:.8rem;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);flex:none;}
      .pill{display:inline-flex;align-items:center;gap:.3rem;padding:.18rem .6rem;border-radius:var(--radius-chip);font-size:.76rem;font-weight:700;}
      .pill.ok{background:var(--ok-soft);color:var(--ok);}
      .pill.warn{background:var(--warn-soft);color:var(--warn);}
      .pill.bad{background:var(--bad-soft);color:var(--bad);}
      .pill.neutral{background:var(--surface2);color:var(--ink2);}
      .pill.accent{background:var(--accent-soft);color:var(--accent2);}
      [data-mode="dark"] .pill.accent{color:var(--accent2);}

      .hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:1.3rem 1.25rem;box-shadow:var(--shadow-card);position:relative;overflow:hidden;}
      .hero h2{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:-.015em;line-height:1.15;}
      .hero p{margin:.45rem 0 0;opacity:.88;font-size:.95rem;max-width:34rem;}
      .hero .btn{background:var(--surface);color:var(--ink);margin-top:1rem;}
      .hero .deco{position:absolute;right:-1.6rem;top:-1.6rem;width:9rem;height:9rem;border-radius:50%;background:rgba(255,255,255,.10);}
      .hero .deco2{position:absolute;right:3.4rem;bottom:-3.2rem;width:7rem;height:7rem;border-radius:50%;background:rgba(255,255,255,.07);}

      /* ---------- Lists & rows ---------- */
      .rows{display:flex;flex-direction:column;gap:.7rem;}
      .row-card{display:flex;gap:.85rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:.8rem .9rem;text-align:left;width:100%;transition:transform .08s;}
      button.row-card:active{transform:scale(.985);}
      .thumb{width:4.1rem;height:4.1rem;border-radius:.9rem;object-fit:cover;flex:none;background:var(--surface2);}
      .thumb-ph{width:4.1rem;height:4.1rem;border-radius:.9rem;flex:none;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;}
      .thumb-ph .ic{width:1.7rem;height:1.7rem;}
      .row-main{flex:1;min-width:0;}
      .row-name{font-weight:800;font-size:1rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
      .row-sub{font-size:.86rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
      .chev{color:var(--ink3);flex:none;}

      .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
      @media(min-width:760px){.grid2{grid-template-columns:repeat(4,1fr);}}
      .tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:1rem;display:flex;flex-direction:column;gap:.35rem;text-align:left;transition:transform .08s;}
      button.tile:active{transform:scale(.97);}
      .tile .ic{width:1.55rem;height:1.55rem;color:var(--accent);}
      .tile b{font-size:.98rem;font-weight:800;letter-spacing:-.01em;}
      .tile span{font-size:.82rem;color:var(--ink2);line-height:1.35;}

      .attn{display:flex;gap:.8rem;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:14px;padding:.85rem .95rem;box-shadow:var(--shadow-card);text-align:left;width:100%;}
      .attn.overdue{border-left-color:var(--bad);}
      .attn .ic{color:var(--warn);margin-top:.1rem;}
      .attn.overdue .ic{color:var(--bad);}

      /* ---------- Forms ---------- */
      .field{margin-bottom:.95rem;}
      .field label{display:block;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:.38rem;}
      body.bold-off .field label{font-weight:600;}
      .field input,.field select,.field textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:.68rem .8rem;font-size:1rem;outline:none;transition:border-color .15s;}
      .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
      .field textarea{resize:vertical;min-height:4.2rem;}
      .f2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
      .seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:.28rem;gap:.28rem;flex-wrap:wrap;}
      .seg button{flex:1;padding:.55rem .4rem;border-radius:10px;font-weight:700;font-size:.92rem;color:var(--ink2);white-space:nowrap;transition:background .15s,color .15s;}
      .seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(10,15,12,.14);}
      .pickrow{display:flex;flex-wrap:wrap;gap:.45rem;}
      .pick{padding:.5rem .85rem;border-radius:var(--radius-chip);border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.9rem;}
      .pick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
      .photo-pick{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
      .photo-btn{border:1.5px dashed var(--line);background:var(--surface2);border-radius:14px;padding:1rem .6rem;display:flex;flex-direction:column;align-items:center;gap:.4rem;font-weight:700;font-size:.9rem;color:var(--ink2);text-align:center;}
      .photo-btn .ic{width:1.5rem;height:1.5rem;color:var(--accent);}
      .photo-preview{width:100%;max-height:13rem;object-fit:cover;border-radius:14px;border:1px solid var(--line);}
      .identifying{display:flex;align-items:center;gap:.7rem;background:var(--accent-soft);border-radius:12px;padding:.8rem .95rem;font-weight:600;}
      .photo-strip{display:flex;flex-wrap:wrap;gap:.55rem;margin-bottom:.25rem;}
      .pstrip{position:relative;width:4.4rem;height:4.4rem;flex:none;}
      .pstrip img{width:100%;height:100%;object-fit:cover;border-radius:12px;border:1px solid var(--line);}
      .pstrip-x{position:absolute;top:-.45rem;right:-.45rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--ink);color:var(--bg);font-size:1rem;line-height:1;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3);padding:0;}
      .ai-note{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:.75rem .9rem;font-weight:600;font-size:.92rem;}
      .ai-plan{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.85rem .95rem;margin:.6rem 0;}
      .btn:disabled{opacity:.55;pointer-events:none;}
      .spinner{width:1.15rem;height:1.15rem;border-radius:50%;border:3px solid var(--accent);border-top-color:transparent;animation:spin .8s linear infinite;flex:none;}
      @keyframes spin{to{transform:rotate(360deg);}}
      @media(prefers-reduced-motion:reduce){.spinner{animation:none;}.btn,.tile,.row-card{transition:none;}}

      /* ---------- Bottom nav ---------- */
      .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;pointer-events:none;}
      .bottomnav-in{pointer-events:auto;max-width:1060px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);box-shadow:var(--shadow-nav);display:grid;grid-template-columns:1fr 1fr 4.4rem 1fr 1fr;padding:.45rem .6rem calc(.45rem + env(safe-area-inset-bottom));position:relative;}
      @media(min-width:1100px){.bottomnav-in{border-left:1px solid var(--line);border-right:1px solid var(--line);}}
      .navbtn{display:flex;flex-direction:column;align-items:center;gap:.14rem;padding:.42rem .1rem;border-radius:12px;color:var(--ink3);}
      .navbtn .ic{width:1.4rem;height:1.4rem;}
      .nav-label{font-size:.72rem;font-weight:700;letter-spacing:.02em;}
      html[data-ts="2"] .nav-label,html[data-ts="3"] .nav-label{font-size:.64rem;}
      .navbtn.on{color:var(--accent);}
      .navbtn.on .nav-pill{background:var(--accent-soft);border-radius:var(--radius-chip);padding:.14rem .85rem;display:grid;place-items:center;}
      .nav-pill{display:grid;place-items:center;padding:.14rem .85rem;}
      .addbtn{position:absolute;left:50%;top:-1.35rem;transform:translateX(-50%);width:3.6rem;height:3.6rem;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(10,15,12,.5);border:4px solid var(--bg);}
      .addbtn .ic{width:1.7rem;height:1.7rem;}
      .addbtn:active{transform:translateX(-50%) scale(.94);}

      /* ---------- Modal / sheet ---------- */
      .scrim{position:fixed;inset:0;background:rgba(8,12,10,.52);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
      @media(min-width:760px){.scrim{align-items:center;padding:1.5rem;}}
      .sheet{background:var(--bg);width:100%;max-width:620px;max-height:92dvh;overflow-y:auto;border-radius:24px 24px 0 0;padding:1.3rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom));}
      @media(min-width:760px){.sheet{border-radius:24px;}}
      .sheet h3{margin:0 0 .2rem;font-size:1.3rem;font-weight:800;letter-spacing:-.015em;}
      .grab{width:2.6rem;height:.3rem;border-radius:99px;background:var(--line);margin:0 auto .9rem;}
      @media(min-width:760px){.grab{display:none;}}

      /* ---------- Detail bits ---------- */
      .detail-photo{width:100%;height:15rem;object-fit:cover;border-radius:20px;border:1px solid var(--line);}
      .kv{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line);}
      .kv:last-child{border-bottom:none;}
      .kv b{text-align:right;font-weight:700;}
      .task{display:flex;gap:.8rem;align-items:flex-start;padding:.85rem 0;border-bottom:1px solid var(--line);}
      .task:last-child{border-bottom:none;}
      .task-check{width:1.5rem;height:1.5rem;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent;margin-top:.1rem;background:var(--surface);}
      .task-check.done{background:var(--ok);border-color:var(--ok);color:#fff;}
      .steps{margin:.4rem 0 0;padding-left:1.25rem;}
      .steps li{margin-bottom:.35rem;}
      .swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;}
      .swatch{border:2px solid var(--line);border-radius:16px;padding:.8rem .7rem;display:flex;flex-direction:column;gap:.5rem;align-items:flex-start;font-weight:700;font-size:.92rem;background:var(--surface);text-align:left;}
      .swatch.on{border-color:var(--accent);}
      .swatch .dot{width:1.7rem;height:1.7rem;border-radius:50%;}
      .empty{border:1.5px dashed var(--line);border-radius:var(--radius-card);padding:1.6rem 1.2rem;text-align:center;color:var(--ink2);background:var(--surface2);}
      .empty b{color:var(--ink);display:block;font-size:1.02rem;margin-bottom:.25rem;}
      .toast{position:fixed;left:50%;bottom:6.4rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:12px;font-weight:600;font-size:.92rem;z-index:80;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);max-width:92vw;text-align:center;}
      .divider{height:1px;background:var(--line);margin:1.1rem 0;}
      .searchbar{display:flex;align-items:center;gap:.55rem;background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:.55rem .8rem;}
      .searchbar input{flex:1;border:none;background:none;outline:none;font-size:1rem;min-width:0;}
      .searchbar .ic{color:var(--ink3);}
      .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;}
      .stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.85rem .8rem;box-shadow:var(--shadow-card);}
      .stat b{display:block;font-size:1.25rem;font-weight:800;letter-spacing:-.02em;}
      .stat span{font-size:.78rem;color:var(--ink2);font-weight:600;}

      /* ---------- Onboarding ---------- */
      .onboard{max-width:640px;margin:0 auto;padding:2.2rem 1.2rem 3rem;width:100%;}
      .brandmark{width:4rem;height:4rem;border-radius:1.2rem;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900;font-size:1.5rem;letter-spacing:-.03em;}
      .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;}
      .role{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:1rem .9rem;text-align:left;font-weight:700;display:flex;flex-direction:column;gap:.25rem;}
      .role span{font-weight:500;font-size:.84rem;color:var(--ink2);}
      .role.on{border-color:var(--accent);background:var(--accent-soft);}

      /* ---------- Report / print ---------- */
      .report-sheet{background:#fff;color:#1a1a1a;border-radius:10px;padding:1.6rem;box-shadow:var(--shadow-card);}
      .report-sheet h1{font-size:1.5em;margin:0 0 .1em;letter-spacing:-.01em;}
      .report-sheet h2{font-size:1.12em;margin:1.3em 0 .45em;padding-bottom:.25em;border-bottom:2px solid #1a1a1a;}
      .report-sheet h3{font-size:1em;margin:.9em 0 .3em;}
      .report-sheet table{width:100%;border-collapse:collapse;font-size:.92em;}
      .report-sheet th{text-align:left;border-bottom:1.5px solid #999;padding:.3em .4em;font-weight:700;}
      .report-sheet td{border-bottom:1px solid #ddd;padding:.3em .4em;vertical-align:top;}
      .report-sheet .rmeta{color:#555;font-size:.9em;}
      @media print{
        body{background:#fff;}
        .no-print{display:none !important;}
        .frame{box-shadow:none;max-width:none;background:#fff;}
        .content{padding:0;}
        .report-sheet{box-shadow:none;border-radius:0;padding:0;}
      }

      /* ---------- Saved-data banner ---------- */
      .dbbanner{border:1.5px solid var(--warn);background:var(--warn-soft);border-radius:16px;padding:1rem 1.1rem;margin-bottom:1rem;}
      .dbbanner .card-title{margin-bottom:.25rem;}
      .dbbanner p{margin:0;}
      .dbbanner .btn{margin-top:.7rem;}
      .sqlbox{max-height:24rem;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:.8rem;font-size:.72rem;line-height:1.5;white-space:pre-wrap;word-break:break-word;margin-top:.8rem;}

      /* ---------- Organic theme: the paper worktable ----------
         Only while the Organic theme is selected — every other theme keeps
         the shared treatment above. Faint paper grain over the sand ground,
         serif headings at medium weight with compact leading, looser
         reading leading, and irregular hand-cut corners on cards, controls
         and photos (pills, chips and round controls stay round). Photos
         take a mild sepia cast, interaction timing is the design system's
         240ms, and focus shows as a moss outline outside the control edge. */
      :root[data-theme="organic"] .frame{
        background-image:radial-gradient(rgb(var(--grain-rgb,41 37 29)/.05) 1px,transparent 1.4px),radial-gradient(color-mix(in srgb,var(--field,#694737) 16%,transparent) 1px,transparent 1.4px);
        background-size:22px 22px,34px 34px;background-position:0 0,11px 17px;
      }
      :root[data-theme="organic"] h1.page-title,:root[data-theme="organic"] h2.sec-title,:root[data-theme="organic"] .card-title,:root[data-theme="organic"] .sheet h3,:root[data-theme="organic"] .hero h2{font-weight:600;letter-spacing:-.02em;line-height:1.15;}
      :root[data-theme="organic"] p{line-height:1.7;}
      :root[data-theme="organic"] .card,:root[data-theme="organic"] .row-card,:root[data-theme="organic"] .tile,:root[data-theme="organic"] .stat,:root[data-theme="organic"] .hero,:root[data-theme="organic"] .empty,:root[data-theme="organic"] .swatch,:root[data-theme="organic"] .role{border-radius:27px 19px 29px 16px/22px 26px 19px 29px;}
      :root[data-theme="organic"] .attn{border-radius:23px 17px 25px 15px/19px 23px 17px 25px;}
      :root[data-theme="organic"] .sheet{border-radius:27px 19px 0 0/22px 26px 0 0;}
      @media(min-width:760px){:root[data-theme="organic"] .sheet{border-radius:27px 19px 29px 16px/22px 26px 19px 29px;}}
      :root[data-theme="organic"] .btn,:root[data-theme="organic"] .iconbtn,:root[data-theme="organic"] .photo-btn,:root[data-theme="organic"] .seg button{border-radius:24px 17px 26px 15px/20px 24px 17px 26px;}
      :root[data-theme="organic"] .field input,:root[data-theme="organic"] .field select,:root[data-theme="organic"] .field textarea,:root[data-theme="organic"] .searchbar{border-radius:18px 13px 20px 12px/15px 18px 13px 20px;}
      :root[data-theme="organic"] .thumb,:root[data-theme="organic"] .detail-photo,:root[data-theme="organic"] .photo-preview{border-radius:21px 15px 23px 13px/17px 21px 15px 23px;}
      :root[data-theme="organic"] img{filter:sepia(.18) saturate(.85);}
      :root[data-theme="organic"] .thumb-ph,:root[data-theme="organic"] .place-emoji{border-radius:19px 14px 21px 13px/16px 19px 14px 21px;}
      :root[data-theme="organic"] .hero .deco{background:color-mix(in srgb,var(--art-accent) 38%,transparent);}
      :root[data-theme="organic"] .hero .deco2{background:color-mix(in srgb,var(--highlight) 30%,transparent);}
      :root[data-theme="organic"] .hero .label{color:var(--highlight);opacity:1;}
      :root[data-theme="organic"] button,:root[data-theme="organic"] a,:root[data-theme="organic"] input,:root[data-theme="organic"] select,:root[data-theme="organic"] textarea{transition-duration:240ms;}
      :root[data-theme="organic"] :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
      @media(prefers-reduced-motion:reduce){
        :root[data-theme="organic"] button,:root[data-theme="organic"] a,:root[data-theme="organic"] input,:root[data-theme="organic"] select,:root[data-theme="organic"] textarea{transition:none;}
        :root[data-theme="organic"] button:active{transform:none;}
      }
      @media print{ :root[data-theme="organic"] img{filter:none;} }

      /* ---------- Botanical theme: the garden room ----------
         Only while the Botanical theme is selected. Faint two-layer paper
         grain over the cream ground, soft shallow shadows, Garamond
         headings at regular weight with tight tracking, relaxed reading
         leading, italic text in the terracotta clay accent, broad rounded
         corners (34px panels, 27px buttons, 20px inputs), arched photo
         crops in natural color, 0.35s ease timing with a slight hover lift
         on buttons and a slight hover enlarge on images, and a visible
         forest focus outline. */
      :root[data-theme="botanical"] .frame{
        background-image:radial-gradient(rgb(var(--grain-rgb,30 56 44)/.045) 1px,transparent 1.4px),radial-gradient(color-mix(in srgb,var(--ornament-line,#B5BAA4) 22%,transparent) 1px,transparent 1.4px);
        background-size:24px 24px,38px 38px;background-position:0 0,13px 19px;
      }
      :root[data-theme="botanical"] h1.page-title,:root[data-theme="botanical"] h2.sec-title,:root[data-theme="botanical"] .card-title,:root[data-theme="botanical"] .sheet h3,:root[data-theme="botanical"] .place-name,:root[data-theme="botanical"] .hero h2{font-weight:400;letter-spacing:-.02em;line-height:1.12;}
      :root[data-theme="botanical"] p{line-height:1.65;}
      :root[data-theme="botanical"] em{color:var(--clay);}
      :root[data-theme="botanical"] .card,:root[data-theme="botanical"] .row-card,:root[data-theme="botanical"] .tile,:root[data-theme="botanical"] .hero,:root[data-theme="botanical"] .empty,:root[data-theme="botanical"] .swatch,:root[data-theme="botanical"] .role,:root[data-theme="botanical"] .dbbanner{border-radius:34px;}
      :root[data-theme="botanical"] .stat{border-radius:27px;}
      :root[data-theme="botanical"] .attn{border-radius:27px;}
      :root[data-theme="botanical"] .sheet{border-radius:34px 34px 0 0;}
      @media(min-width:760px){:root[data-theme="botanical"] .sheet{border-radius:34px;}}
      :root[data-theme="botanical"] .btn,:root[data-theme="botanical"] .iconbtn,:root[data-theme="botanical"] .photo-btn{border-radius:27px;}
      :root[data-theme="botanical"] .seg{border-radius:27px;}
      :root[data-theme="botanical"] .seg button{border-radius:22px;}
      :root[data-theme="botanical"] .field input,:root[data-theme="botanical"] .field select,:root[data-theme="botanical"] .field textarea,:root[data-theme="botanical"] .searchbar{border-radius:20px;}
      :root[data-theme="botanical"] .thumb{border-radius:2.05rem 2.05rem .8rem .8rem;}
      :root[data-theme="botanical"] .detail-photo{border-radius:10rem 10rem 20px 20px;}
      :root[data-theme="botanical"] .photo-preview{border-radius:6rem 6rem 20px 20px;}
      :root[data-theme="botanical"] .thumb-ph,:root[data-theme="botanical"] .place-emoji{border-radius:50% 50% 14px 14px;}
      :root[data-theme="botanical"] img{transition:transform .35s ease;}
      :root[data-theme="botanical"] button,:root[data-theme="botanical"] a,:root[data-theme="botanical"] input,:root[data-theme="botanical"] select,:root[data-theme="botanical"] textarea{transition-duration:.35s;transition-timing-function:ease;}
      :root[data-theme="botanical"] :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
      @media(hover:hover) and (pointer:fine){
        :root[data-theme="botanical"] .btn:hover{transform:translateY(-1px);}
        :root[data-theme="botanical"] .card:hover,:root[data-theme="botanical"] .row-card:hover,:root[data-theme="botanical"] .tile:hover{box-shadow:0 1px 0 rgb(30 56 44/.05),0 16px 28px -18px rgb(30 56 44/.34);}
        :root[data-theme="botanical"] img:hover{transform:scale(1.02);}
      }
      @media(prefers-reduced-motion:reduce){
        :root[data-theme="botanical"] button,:root[data-theme="botanical"] a,:root[data-theme="botanical"] input,:root[data-theme="botanical"] select,:root[data-theme="botanical"] textarea,:root[data-theme="botanical"] img{transition:none;}
        :root[data-theme="botanical"] button:active,:root[data-theme="botanical"] .btn:hover,:root[data-theme="botanical"] img:hover{transform:none;}
      }

      /* ---------- Luxury theme: the architectural page ----------
         Only while the Luxury theme is selected. Garamond headings at
         regular weight with tight tracking and oldstyle figures, reading
         text at 1.55 leading, square corners on cards, buttons, inputs
         and photos (pills stay round), a fine gold rule down the left
         edge of the reading column as the page spine, italic text and
         the focus outline in the gold tones, buttons with tracked
         uppercase labels that press straight down 1px, and 150ms
         interaction timing. No shadows, no gradients. */
      :root[data-theme="luxury"] .content{position:relative;line-height:1.55;}
      :root[data-theme="luxury"] .content::before{content:"";position:absolute;left:.5rem;top:0;bottom:0;width:1px;background:var(--gold);opacity:.75;pointer-events:none;}
      @media(min-width:760px){:root[data-theme="luxury"] .content::before{left:1.1rem;}}
      :root[data-theme="luxury"] h1.page-title,:root[data-theme="luxury"] h2.sec-title,:root[data-theme="luxury"] .card-title,:root[data-theme="luxury"] .sheet h3,:root[data-theme="luxury"] .place-name,:root[data-theme="luxury"] .hero h2,:root[data-theme="luxury"] .stat b{font-weight:400;letter-spacing:-.015em;line-height:1.1;font-variant-numeric:oldstyle-nums proportional-nums;}
      :root[data-theme="luxury"] p{line-height:1.55;}
      :root[data-theme="luxury"] em{color:var(--gold-text);}
      :root[data-theme="luxury"] .card,:root[data-theme="luxury"] .row-card,:root[data-theme="luxury"] .tile,:root[data-theme="luxury"] .stat,:root[data-theme="luxury"] .hero,:root[data-theme="luxury"] .empty,:root[data-theme="luxury"] .swatch,:root[data-theme="luxury"] .role,:root[data-theme="luxury"] .attn,:root[data-theme="luxury"] .dbbanner,:root[data-theme="luxury"] .btn,:root[data-theme="luxury"] .iconbtn,:root[data-theme="luxury"] .photo-btn,:root[data-theme="luxury"] .seg,:root[data-theme="luxury"] .seg button,:root[data-theme="luxury"] .field input,:root[data-theme="luxury"] .field select,:root[data-theme="luxury"] .field textarea,:root[data-theme="luxury"] .searchbar,:root[data-theme="luxury"] .thumb,:root[data-theme="luxury"] .thumb-ph,:root[data-theme="luxury"] .detail-photo,:root[data-theme="luxury"] .photo-preview,:root[data-theme="luxury"] .place-emoji,:root[data-theme="luxury"] .navbtn{border-radius:0;}
      :root[data-theme="luxury"] .sheet{border-radius:0;}
      @media(min-width:760px){:root[data-theme="luxury"] .sheet{border-radius:0;}}
      :root[data-theme="luxury"] .pill,:root[data-theme="luxury"] .chip,:root[data-theme="luxury"] .pick,:root[data-theme="luxury"] .task-check,:root[data-theme="luxury"] .addbtn{border-radius:999px;}
      :root[data-theme="luxury"] .btn{text-transform:uppercase;letter-spacing:.16em;font-size:.8rem;min-height:3rem;padding:.72rem 1.3rem;}
      :root[data-theme="luxury"] .btn.sm{text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;min-height:2.4rem;border-radius:0;}
      :root[data-theme="luxury"] .btn:active,:root[data-theme="luxury"] .iconbtn:active{transform:translateY(1px);}
      :root[data-theme="luxury"] button,:root[data-theme="luxury"] a,:root[data-theme="luxury"] input,:root[data-theme="luxury"] select,:root[data-theme="luxury"] textarea{transition-duration:150ms;}
      :root[data-theme="luxury"] :focus-visible{outline:2px solid var(--gold-focus);outline-offset:2px;}

const SUPABASE_SQL = "-- =====================================================================\n-- One Place \u2014 Supabase database setup\n-- =====================================================================\n-- HOW TO USE: In your Supabase project, open  SQL Editor \u2192 New query,\n-- paste this whole file, and click Run. It is safe to run more than\n-- once \u2014 every statement is \"if not exists\" / \"drop if exists\" style.\n--\n-- WHAT IT DOES\n-- \u2022 Creates all 12 One Place tables (places, rooms, items, history,\n--   quotes, parts, people, phone plans & lines, pets & their records,\n--   and settings).\n-- \u2022 Every row carries an `owner_id`. The app generates one owner id\n--   per browser/device and keeps it in that browser's local storage,\n--   so different testers never see each other's homes.\n-- \u2022 Row Level Security is switched ON for every table, with one policy\n--   per table: the anon (publishable-key) role may only read or write\n--   rows whose owner_id matches the `x-owner-id` header the app sends\n--   with every request. A request with no owner id sees nothing.\n-- \u2022 Because \"Automatically expose new tables\" is OFF on this project,\n--   the GRANT statements at the bottom give the anon role access to\n--   these tables (the RLS policies above still apply on top).\n--\n-- Photos are not stored here \u2014 the app keeps photo files in its own\n-- storage and only saves the photo's key on the item/pet row.\n-- =====================================================================\n\n-- ---------- Places (homes & businesses) ----------\ncreate table if not exists public.profiles (\n  id bigint generated by default as identity primary key,\n  owner_id text not null,\n  key text not null,\n  kind text not null default 'home',\n  name text not null default '',\n  account_type text not null default '',\n  city text not null default '',\n  zip text not null default '',\n  emoji text not null default '\ud83c\udfe0',\n  created_at timestamptz not null default now(),\n  unique (owner_id, key)\n);\n\n-- ---------- Rooms / areas ----------\ncreate table if not exists public.rooms (\n  id bigint generated by default as identity primary key,\n  owner_id text not null,\n  name text not null,\n  icon text not null default '\ud83c\udfe0',\n  profile_key text not null default 'home',\n  created_at timestamptz not null default now()\n);\n\n-- ---------- Items & vehicles (a vehicle is an item with item_kind = 'vehicle') ----------\ncreate table if not exists public.items (\n  id bigint generated by default as identity primary key,\n  owner_id text not null,\n  name text not null,\n  category text not null default 'General',\n  make text not null default '',\n  model text not null default '',\n  year_text text not null default '',\n  serial_text text not null default '',\n  description text not null default '',\n  profile_key text not null default 'home',\n  item_kind text not null default 'item',\n  vehicle_id bigint,\n  room_id bigint,\n  photo_blob_key text,\n  photo_mime text,\n  interval_days integer not null default 365,\n  last_serviced_date text,\n  next_due_date text,\n  difficulty text not null default 'Moderate',\n  diy_steps text not null default '[]',\n  tools_needed text not null default '[]',\n  safety_notes text not null default '',\n  estimated_cost text not null default '',\n  pro_recommended integer not null default 0,\n  project_plan text not null default '',\n  registration_state text not null default '',\n  registration_due_date text,\n  smog_due_date text,\n  smog_not_required integer not null default 0,\n  notes text not null default '',\n  created_at timestamptz not null default now(),\n  updated_at timestamptz not null default now()\n);\n\n-- ---------- Maintenance history ----------\ncreate table if not exists public.maintenance_logs (\n  id bigint generated by default as identity primary key,\n  owner_id text not null,\n  item_id bigint not null,\n  serviced_date text not async function sbFetch(path, init){
  const ctrl = (typeof AbortController!=="undefined") ? new AbortController() : null;
  const timer = ctrl ? setTimeout(()=>ctrl.abort(), 12000) : null;
  let res;
  try{
    res = await fetch(SUPABASE_URL+"/rest/v1/"+path, Object.assign({}, init||{}, {
      signal: ctrl ? ctrl.signal : undefined,
      headers: Object.assign({ apikey: SUPABASE_PUBLISHABLE_KEY, Authorization: "Bearer "+SUPABASE_PUBLISHABLE_KEY, "x-owner-id": OWNER, "Content-Type":"application/json" }, (init&&init.headers)||{})
    }));
  }catch(e){ if(timer) clearTimeout(timer); throw new Error(FRIENDLY_DB_ERROR); }
  if(timer) clearTimeout(timer);
  if(!res.ok) throw new Error(FRIENDLY_DB_ERROR);
  const text = await res.text();
  if(!text) return null;
  try{ return JSON.parse(text); }catch(e){ return null; }
}
async function sbGet(table, orderCol){
  const path = table+"?select=*&order="+(orderCol||"id")+".asc";
  try{ const d = await sbFetch(path, {method:"GET"}); return Array.isArray(d)? d : []; }
  catch(e){ /* one retry — a dropped connection shouldn't fail the load */
    const d = await sbFetch(path, {method:"GET"}); return Array.isArray(d)? d : []; }
}
/* PostgREST refuses a DELETE with no WHERE clause, so every delete is

function sbDel(table){ return sbFetch(table+"?owner_id=eq."+encodeURIComponent(OWNER), {method:"DELETE", headers:{Prefer:"return=minimal"}}); }
function sbPost(table, rows){ return sbFetch(table, {method:"POST", headers:{Prefer:"return=representation"}, body:JSON.stringify(rows)}).then(d=>Array.isArray(d)?d:[]); }

    last_serviced_date:dones.length? dones[dones.length-1] : null, next_due_date:dues.length? dues[0] : null,

  }

async function dbLoadAll(){

  const logsByItem={}; d.logs.forEach(l=>{ (logsByItem[l.item_id]=logsByItem[l.item_id]||[]).push({what:l.notes||"", by:l.serviced_by||"Me", date:l.serviced_date}); });

    p.id=pf.key; p.emoji=pf.emoji||p.emoji; p.tagline=tagMap[pf.key]||"";
    p.rooms = d.rooms.filter(r=>r.profile_key===pf.key).map(r=>({id:"rm"+r.id, name:r.name}));

    p.vehicles = d.items.filter(r=>r.profile_key===pf.key && r.item_kind==="vehicle").map(r=>({id:"veh"+r.id, name:r.name, year:r.year_text||"", make:r.make||"", model:r.model||"", miles:r.description||"", state:r.registration_state||"NV", photo:r.photo_blob_key||null, regNext:r.registration_due_date||null, smogNext:r.smog_due_date||null, tasks:parseTasks(r.diy_steps,true), logs:logsByItem[r.id]||[]}));
    const planRow=d.plans.find(x=>x.profile_key===pf.key);
    p.phonePlan = planRow ? {carrier:planRow.carrier||"", planName:planRow.plan_name||"", holder:planRow.account_holder||"", lines:d.lines.filter(l=>l.plan_id===planRow.id).map(l=>({person:l.person_name||"", number:l.phone_number||"", device:l.device_name||"", cost:(l.monthly_cost_cents||0)/100, balance:(l.device_balance_cents||0)/100, payoff:l.payoff_date||"", upgrade:l.upgrade_date||""}))} : null;
    p.pets = d.pets.filter(x=>x.profile_key===pf.key).map(pt=>({id:"pet"+pt.id, name:pt.name, species:pt.species||"", breed:pt.breed||"", birth:pt.birth_date||null, weight:pt.weight_text||"", photo:pt.photo_blob_key||null, records:d.records.filter(r=>r.pet_id===pt.id).map(r=>({name:r.title, date:r.record_date, nextDue:r.next_due_date||"", clinic:r.provider_name||"", location:r.provider_location||"", notes:r.notes||""}))}));
    return p;
  });
  S.quotes = d.quotes.map(q=>({placeKey:q.profile_key, company:q.company_name, job:q.task_description, status:q.status, notes:q.notes||""}));
  S.activePlaceId = (setMap.active_profile_key && S.places.some(p=>p.id===setMap.active_profile_key)) ? setMap.active_profile_key : (S.places[0]? S.places[0].id : null);
  S.onboarded = setMap.profile_completed==="1" || S.places.length>0;
}

/* ---------- save scheduling: debounced, serialized, honest on failure ---------- */
let saveTimer=null, saveChain=Promise.resolve();
function persist(){
  saveLocalSnapshot();
  if(saveTimer) return;
  saveTimer=setTimeout(()=>{ saveTimer=null; queueSave(); }, 450);
}
function queueSave(){
  saveChain = saveChain.then(async ()=>{
    if(bootPromise){ try{ await bootPromise; }catch(e){} }
    if(DB.status==="down"){
      try{ await sbProbe(); DB.status="ok"; }catch(e){ return; }
    }
    try{
      await dbSaveAll();
      if(DB.status!=="ok"){ DB.status="ok"; render(); }
    }catch(e){
      const wasOk = DB.status==="ok";
      DB.status="down"; render();
      if(wasOk) toast(FRIENDLY_DB_ERROR);
    }
  });
}

/* ---------- boot: local snapshot first (instant), then Supabase ----------
   If this browser's Supabase partition already has places, it is the
   source of truth. If it's empty and this browser holds local data, that
   data is copied up once — ids remapped as rows insert, so every link
   survives — and a marker setting records that it happened. */
const BOOT = { done:false };
let bootPromise = null;
async function boot(){
  loadLocalSnapshot();
  render();
  try{
    await sbProbe();
    const data = await dbLoadAll();
    if(data.profiles.length){
      applyLoadedData(data);
      DB.status="ok";
      saveLocalSnapshot();
    }else{
      if(S.places.length || S.onboarded) await dbSaveAll();
      DB.migrated=true;
      try{ await sbSetSetting("local_data_migrated","1"); }catch(e){}
      DB.status="ok";
    }
  }catch(e){
    DB.status="down";
  }
  BOOT.done=true;
  render();
}

    if(d<=60) ev.push({days:d,kind:"vehicle",icon:"car",title:v.name+" — "+label,sub:"Due "+fmtDate(ds)+" · registered in "+v.state,view:"vehicleDetail",id:v.id}); }); });

<script>
/* =====================================================================
   Modals, photo flow, actions
   ===================================================================== */
function openModal(html){ $("#modalRoot").innerHTML = '<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+html+'</div></div>'; const f=$(".sheet input, .sheet select, .sheet textarea"); }
function closeModal(){ $("#modalRoot").innerHTML=""; }
function modalHead(title,sub){ return '<h3>'+title+'</h3>'+(sub?'<p class="muted small" style="margin:0 0 1rem">'+sub+'</p>':'<div style="height:.6rem"></div>'); }

/* pending photo state per flow */
const PH = {item:null,vehicle:null,pet:null,diag:null,plan:null,diy:null};
/* Flows that accept up to 6 photos at once (the AI reads all of them;
   the first doubles as the saved cover photo). PHA holds every photo
   for those flows, PH[key] mirrors PHA[key][0]. */
const MULTI_KEYS = {item:1, plan:1, diag:1, diy:1};
const PHA = {item:[], plan:[], diag:[], diy:[]};
let photoTarget = null;
function photoSlotHtml(key){
  if(MULTI_KEYS[key]){
    const arr = PHA[key];
    if(!arr.length) return '';
    return '<div class="photo-strip">'+arr.map((src,i)=>'<span class="pstrip"><img src="'+src+'" alt="Photo '+(i+1)+'" /><button type="button" class="pstrip-x" data-act="photoRemove" data-key="'+key+'" data-idx="'+i+'" aria-label="Remove photo '+(i+1)+'">&times;</button></span>').join("")+'</div>'+
      '<p class="tiny muted" style="margin:.35rem 0 0">'+arr.length+' of 6 photos attached. More angles — or a close-up of the label — read better.</p>';
  }
  const src = PH[key];
  return src ? '<img class="photo-preview" src="'+src+'" alt="Selected photo" /><p class="tiny muted" style="margin:.35rem 0 0">Photo attached. Pick another to replace it.</p>' : '';
}
function wirePhoto(input, key){
  input.onchange = ()=>{ const f=input.files && input.files[0]; if(!f) return;
    if(PH[key]) URL.revokeObjectURL(PH[key]);
    PH[key]=URL.createObjectURL(f); input.value="";
    if(key==="diag"){ const slot=$("#diagPhotoSlot"); if(slot) slot.innerHTML=photoSlotHtml("diag"); }
    else { const slot=$("#photoSlot"); if(slot) slot.innerHTML=photoSlotHtml(key); const idn=$("#identifyNote"); if(idn){ idn.style.display="flex"; setTimeout(()=>{ idn.style.display="none"; const hint=$("#idHint"); if(hint) hint.style.display="block"; },1400); } }
  };
}
wirePhoto($("#fileCam"), null); wirePhoto($("#fileLib"), null);
/* re-wire with dynamic key via dataset */
/* Photos are read, downscaled to at most 1024px, and kept as JPEG data
   URLs — small enough to save with the record in the database, so a
   photo is still there when the tester comes back. */
function photoFileToDataUrl(f, cb){
  const url=URL.createObjectURL(f);
  const img=new Image();
  img.onload=()=>{ try{
      const scale=Math.min(1, 1024/Math.max(img.width,img.height));
      const w=Math.max(1,Math.round(img.width*scale)), hgt=Math.max(1,Math.round(img.height*scale));
      const c=document.createElement("canvas"); c.width=w; c.height=hgt;
      c.getContext("2d").drawImage(img,0,0,w,hgt);
      URL.revokeObjectURL(url);
      cb(c.toDataURL("image/jpeg",0.82));
    }catch(e){ URL.revokeObjectURL(url); cb(url); } };
  img.onerror=()=>{ cb(url); };
  img.src=url;
}
function photoFileToDataUrlP(f){ return new Promise(res=>photoFileToDataUrl(f, res)); }
function pickPhoto(key, mode){ photoTarget=key; const inp = mode==="cam" ? $("#fileCam") : $("#fileLib");
  inp.multiple = !!MULTI_KEYS[key];
  inp.onchange = ()=>{ const files=Array.from(inp.files||[]); if(!files.length) return;
    inp.value="";
    if(MULTI_KEYS[key]){
      const roomLeft = 6 - PHA[key].length;
      if(roomLeft<=0){ toast("That's the 6-photo limit — remove one to add another"); return; }
      const take = files.slice(0, roomLeft);
      (async()=>{ for(const f of take){ PHA[key].push(await photoFileToDataUrlP(f)); } PH[key]=PHA[key][0]||null; photosChanged(key); })();
      return;
    }
    photoFileToDataUrl(files[0], dataUrl=>{ PH[key]=dataUrl;
      const slot=$("#photoSlot"); if(slot) slot.innerHTML=photoSlotHtml(key);
    });
  };
  inp.click();
}
/* After a multi-photo set changes: refresh its preview strip, and for the
   item and phone-plan flows kick off the AI read right away (the result
   is a draft the user reviews in the form — never auto-saved). */
function photosChanged(key){
  if(key==="diag"){ const slot=$("#diagPhotoSlot"); if(slot) slot.innerHTML=photoSlotHtml("diag"); return; }
  const slot=$("#photoSlot"); if(slot) slot.innerHTML=photoSlotHtml(key);
  if(key==="item") aiIdentifyItem();
  else if(key==="plan") aiExtractPlan();
}

/* =====================================================================
   Photo AI — Google Gemini, reached through this site's own proxy
   ---------------------------------------------------------------------
   Every photo flow sends its photos (up to 6) plus a task-specific
   prompt and gets JSON back. The result ALWAYS lands as a draft the
   user reviews and edits in the form before saving — nothing is
   auto-saved as fact. Any failure (proxy, network, or quota)
   throws, and the caller shows a plain-language message and leaves
   the manual flow exactly as it was; details are never invented.

   Model note: the briefed model, gemini-2.0-flash, has been retired
   by Google — the API answers 404 "no longer available" and names
   gemini-3.8-flash as its replacement (both facts verified against
   the live API when this was wired in, as was every name in the
   chain below). So the client walks a short chain — the named
   replacement first, then other current flash models, then the
   briefed name — advancing only when a model is gone (404) or
   stays overloaded (503), and sticks with whichever model answered
   for the rest of the session.

   PROXY NOTE: no API key lives in this page, and the page never
   talks to Google directly. Every call below is a POST to
   /api/gemini on this same origin with a JSON body of
   { model, contents, generationConfig }. The server function
   there (api/gemini.js, deployed alongside this page) holds
   GEMINI_API_KEY as a server-side environment variable, forwards
   the call to Google's generateContent endpoint, and returns
   Gemini's response JSON unchanged — or { error } on failure.
   A proxy failure (non-OK status, timeout, or an { error } body)
   is treated exactly like a Gemini failure: the retry and
   model-chain rules below apply, and when the chain runs out the
   caller falls back to manual entry with a plain-language note —
   nothing fakes a read.
   ===================================================================== */
const GEMINI_MODELS = ["gemini-3.8-flash", "gemini-3.5-flash", "gemini-flash-latest", "gemini-2.0-flash"];
let geminiModelIdx = 0;
/* One POST to the same-origin proxy. Resolves to { status, ok, json }
   (json is null when the reply wasn't JSON); rejects only on a
   network error or the client timeout, as Error("network"). */
async function geminiProxyFetch(model, call){
  const ctrl = (typeof AbortController!=="undefined") ? new AbortController() : null;
  const timer = ctrl ? setTimeout(()=>ctrl.abort(), 45000) : null;
  try{
    const res = await fetch("/api/gemini",
      { method:"POST", signal: ctrl ? ctrl.signal : undefined, headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ model:model, contents:call.contents, generationConfig:call.generationConfig }) });
    let json = null;
    try{ json = await res.json(); }catch(e){ json = null; }
    return { status: res.status, ok: res.ok, json: json };
  }catch(e){ throw new Error("network"); }
  finally{ if(timer) clearTimeout(timer); }
}
async function geminiCall(call){
  let netRetried = false;
  while(geminiModelIdx < GEMINI_MODELS.length){
    const model = GEMINI_MODELS[geminiModelIdx];
    let r;
    try{
      r = await geminiProxyFetch(model, call);
      if(r.status===503){ await new Promise(s=>setTimeout(s, 3000)); r = await geminiProxyFetch(model, call); }
    }catch(e){
      /* Timeout or dropped connection to the proxy: one retry on the
         next model in the chain, then give up to the manual fallback. */
      if(!netRetried && geminiModelIdx < GEMINI_MODELS.length-1){ netRetried = true; geminiModelIdx++; continue; }
      throw e;
    }
    if(r.ok && r.json && !r.json.error) return r.json;
    /* Failure: a model that's gone (404) or overloaded (503), or any
       { error } reply from the proxy, advances to the next model.
       Anything else is a hard failure — the caller falls back. */
    if(r.status===404 || r.status===503 || (r.json && r.json.error) || !r.json){ geminiModelIdx++; continue; }
    throw new Error("http "+r.status);
  }
  throw new Error("no model available");
}
async function geminiJSON(prompt, dataUrls){
  const parts = [{text: prompt}];
  (dataUrls||[]).slice(0,6).forEach(u=>{ const m = /^data:([^;,]+);base64,(.+)$/.exec(u||""); if(m) parts.push({inline_data:{mime_type:m[1], data:m[2]}}); });
  const j = await geminiCall({ contents:[{parts:parts}], generationConfig:{ responseMimeType:"application/json", temperature:0.35, maxOutputTokens:8192 } });
  const cand = (j.candidates||[])[0];
  const raw = (((cand && cand.content && cand.content.parts) || []).map(p=>p.text||"").join("")).trim()
    .replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "");
  return JSON.parse(raw);
}
/* Sanitizers — AI output is untrusted text until it has been clamped. */
function aiStr(v, max){ const s = (v==null ? "" : String(v)).trim(); return max ? s.slice(0, max) : s; }
function aiStrArr(v, maxN, maxLen){ if(!Array.isArray(v)) return []; return v.slice(0, maxN||8).map(x=>aiStr(x, maxLen||300)).filter(Boolean); }
function aiMoney(v){ const n = Number(v); if(isNaN(n) || n<0) return 0; return Math.round(n*100)/100; }
function aiDate(v){ const s = aiStr(v, 10); return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : ""; }
function aiMsg(html){ const m = $("#aiMsg"); if(m) m.innerHTML = html || ""; }
function aiErr(msg){ aiMsg('<div class="ai-note" style="margin:.6rem 0">'+esc(msg)+'</div>'); }

let AI_ITEM = null, aiItemToken = 0;
function matchItemType(cat){
  const c = aiStr(cat, 60).toLowerCase(); if(!c) return "Other / not listed";
  const exact = ITEM_TYPES.find(t=>t.toLowerCase()===c); if(exact) return exact;
  const partial = ITEM_TYPES.find(t=>{ const tl = t.toLowerCase(); return tl.indexOf(c)>=0 || c.indexOf(tl.split(/[\s/&]+/)[0])>=0; });
  return partial || "Other / not listed";
}
function aiTasks(v){
  if(!Array.isArray(v)) return [];
  const diffs = ["Easy","Moderate","Advanced"];
  return v.slice(0,6).map(t=>{
    if(!t || typeof t!=="object") return null;
    const name = aiStr(t.name, 80); if(!name) return null;
    let every = parseInt(t.every_months, 10); if(isNaN(every)) every = 12; every = Math.min(60, Math.max(1, every));
    let mins = parseInt(t.minutes, 10); if(isNaN(mins)) mins = 20; mins = Math.min(600, Math.max(1, mins));
    const steps = aiStrArr(t.steps, 8, 300); if(!steps.length) return null;
    return { name, every, mins, diff: diffs.indexOf(t.difficulty)>=0 ? t.difficulty : "Moderate", steps };
  }).filter(Boolean);
}

/* ---------- Flow 3: “Something wrong?” diagnosis ---------- */
function keywordDiagnose(raw){
  const txt = raw.toLowerCase(); let best = null, score = 0;
  DIAGNOSE_RULES.forEach(r=>{ const s = r.keys.filter(k=>txt.includes(k)).length; if(s>score){ score = s; best = r; } });
  const r = best || DIAGNOSE_DEFAULT;
  return { ...r, conf: best ? (score>=2 ? "high" : "medium") : "low" };
}
async function aiDiagnose(raw, target){
  const ctx = target ? " with their "+target.name+([target.brand, target.model].filter(Boolean).length ? " ("+[target.brand, target.model].filter(Boolean).join(" ")+")" : "") : "";
  const prompt = "A homeowner has a problem"+ctx+". In their own words: \""+raw+"\". "+PHA.diag.length+" photo(s) of the problem are attached — look carefully at exactly where the problem shows (leak source, damage, wear, error lights or codes, corrosion) and factor it into the diagnosis.\n\n"+
    'Return ONLY a JSON object with this shape:\n{"title":"short diagnosis title","summary":"1–2 sentences: what is most likely going on","severity":"how urgent, in a few words","safety":["safety warning"],"causes":["most likely cause first"],"checks":["safe check to run, in order"],"steps":["DIY fix step"],"difficulty":"Easy, Moderate, Advanced, or Pro recommended","time":"e.g. 30–90 min","cost":"e.g. $5–$40 in parts","part":"the part most likely needed, or None until the checks are done","pro":"when to call a pro instead","confidence":"high, medium, or low"}\n\n'+
    "Think safety first: a gas smell, sparking, or active water damage means make it safe and call a pro. If the photos don't show the problem clearly, say so in the summary and set confidence to low.";
  const d = await geminiJSON(prompt, PHA.diag);
  const causes = aiStrArr(d.causes, 8, 300), checks = aiStrArr(d.checks, 8, 300), steps = aiStrArr(d.steps, 10, 300);
  if(!causes.length || !steps.length) throw new Error("empty diagnosis");
  return { title: aiStr(d.title, 90) || "Diagnosis", summary: aiStr(d.summary, 500), severity: aiStr(d.severity, 80) || "Worth checking soon",
    safety: aiStrArr(d.safety, 5, 300), causes, checks, steps,
    diff: aiStr(d.difficulty, 30) || "Moderate", time: aiStr(d.time, 40) || "30–60 min", cost: aiStr(d.cost, 60) || "Varies",
    part: aiStr(d.part, 160) || "Identify the failed part before buying",
    pro: aiStr(d.pro, 400) || "If the checks don’t reveal it, a pro diagnosis is usually cheaper than guessing with parts.",
    conf: ["high","medium","low"].indexOf(d.confidence)>=0 ? d.confidence : "medium" };
}
async function runDiagnose(p){
  const ta = $("#diagText"); const raw = ta ? ta.value : (S.diagText || "");
  if(!raw.trim()){ toast("Describe what’s happening first"); return; }
  S.diagText = raw;
  const target = S.diagFor ? p.items.find(i=>i.id===S.diagFor) : null;
  const finish = (r, noteText)=>{ S.diagResult = r; S.diagAiNote = noteText || null; S.diagBusy = false; if(target) target.problem = raw; render(); if(S.view==="diagnose") window.scrollTo(0, document.body.scrollHeight); persist(); };
  if(PHA.diag.length){
    S.diagBusy = true; S.diagResult = null; S.diagAiNote = null; render();
    try{ const d = await aiDiagnose(raw, target); finish({ ...d, photo:true, hadPhoto:true }); }
    catch(e){ const r = keywordDiagnose(raw); finish({ ...r, photo:true, hadPhoto:true }, "Photo reading isn’t available right now, so this diagnosis is based on your description alone — the photo wasn’t read."); }
    return;
  }
  const r = keywordDiagnose(raw);
  finish({ ...r, photo:true, hadPhoto:false });
}

/* =====================================================================
